LESSONS["teaser"] = {
why:"Le teaser est le seul document que verront la plupart des acquéreurs approchés. Il décide de la taille du marché atteint.",
obj:["Rédiger un teaser anonyme et attractif","Doser l'information sans permettre l'identification","Adapter le teaser à la cible d'acquéreurs"],
html:`
<h2 id="regle">La règle de l'anonymat</h2>
<p>Un teaser doit susciter l'intérêt sans permettre d'identifier la société. Le test est simple : un concurrent direct doit-il pouvoir nommer la cible en lisant le document ? Si oui, il faut élargir les fourchettes ou retirer un élément.</p>
<table class="tbl">
<tr><th>À écrire</th><th>À proscrire</th></tr>
<tr><td>Région, par exemple Grand Ouest</td><td>Ville ou département précis</td></tr>
<tr><td>Chiffre d'affaires en fourchette</td><td>Chiffre d'affaires exact</td></tr>
<tr><td>Secteur et positionnement</td><td>Liste de clients ou marques distribuées</td></tr>
<tr><td>Effectif approximatif</td><td>Organigramme, noms</td></tr>
<tr><td>Ancienneté par tranche</td><td>Année de création exacte</td></tr>
</table>

<h2 id="plan">Plan type, une à deux pages</h2>
<ol>
<li><strong>Accroche</strong> : une phrase qui dit ce que fait la société et pourquoi elle est intéressante.</li>
<li><strong>Activité</strong> : trois à cinq lignes, répartition du chiffre d'affaires par activité en pourcentage.</li>
<li><strong>Points forts</strong> : quatre à six puces, factuelles, dont au moins deux chiffrées.</li>
<li><strong>Chiffres clés</strong> : chiffre d'affaires et EBE en fourchette, effectif, ancienneté.</li>
<li><strong>Contexte de cession</strong> : départ à la retraite, recentrage, ouverture de capital.</li>
<li><strong>Prochaine étape</strong> : signature d'un NDA pour accéder au mémorandum, contact du conseil.</li>
</ol>
<div class="callout warn"><div class="ct">Erreur fréquente</div>Le teaser qui décrit le secteur pendant une page et la société en trois lignes. L'acquéreur connaît son secteur mieux que vous. Ce qu'il cherche, c'est ce qui distingue cette cible des dix autres qu'on lui a envoyées ce mois-ci.</div>

<h2 id="adaptation">Adapter selon la cible</h2>
<ul>
<li><strong>Consolidateur sectoriel</strong> : insister sur le maillage géographique, la taille du portefeuille, la compatibilité des systèmes.</li>
<li><strong>Fonds d'investissement</strong> : insister sur la récurrence, la croissance, la présence d'un management en place.</li>
<li><strong>Repreneur individuel</strong> : insister sur la taille accessible, la structure de financement possible, l'accompagnement du cédant.</li>
</ul>
`,
key:["Test de l'anonymat : un concurrent ne doit pas pouvoir nommer la cible","Une à deux pages, jamais plus","Au moins deux points forts chiffrés","Un teaser par type d'acquéreur, pas un teaser universel"],
quiz:[
 {q:"Quelle information est à proscrire dans un teaser ?",o:["La liste des principaux clients","La région d'implantation","Le chiffre d'affaires en fourchette","Le contexte de cession"],a:0,e:"Une liste de clients identifie immédiatement la société pour un concurrent, et rompt la confidentialité avant toute signature de NDA."},
 {q:"Quelle est la longueur cible d'un teaser ?",o:["Une à deux pages","Dix pages","Une ligne","Vingt pages"],a:0,e:"Le teaser sert au tri. Au-delà de deux pages, il ne sera pas lu, et il empiète sur le rôle du mémorandum d'information."}
],
src:["Pratique du cabinet, modèles internes","Mergers & Inquisitions, Deal Documents"]};

LESSONS["nda"] = {
why:"Le NDA est le premier engagement juridique du process. Ses clauses secondaires ont plus d'effet que la clause de confidentialité elle-même.",
obj:["Identifier les clauses qui comptent réellement","Adapter la durée et le périmètre","Reconnaître les demandes de modification à refuser"],
html:`
<h2 id="clauses">Les clauses</h2>
<table class="tbl">
<tr><th>Clause</th><th>Enjeu</th><th>Pratique usuelle</th></tr>
<tr><td>Définition des informations confidentielles</td><td>Périmètre de protection</td><td>Large, incluant l'existence même des discussions</td></tr>
<tr><td>Durée</td><td>Protection dans le temps</td><td>Deux à cinq ans après la fin des discussions</td></tr>
<tr><td>Non-sollicitation du personnel</td><td>Protection contre le débauchage</td><td>Douze à vingt-quatre mois, la clause la plus importante en pratique</td></tr>
<tr><td>Non-détournement de clientèle</td><td>Protection commerciale</td><td>Souvent refusée par les concurrents, à négocier</td></tr>
<tr><td>Restitution ou destruction</td><td>Fin des discussions</td><td>Sur demande écrite, avec attestation</td></tr>
<tr><td>Absence d'engagement</td><td>Aucune obligation de conclure</td><td>Systématique</td></tr>
<tr><td>Personnes autorisées</td><td>Diffusion interne et conseils</td><td>Liste nominative ou par catégorie, engagement en cascade</td></tr>
</table>
<div class="callout key"><div class="ct">La clause qui compte vraiment</div>Dans une approche d'un concurrent direct, la non-sollicitation du personnel protège davantage que la confidentialité. L'information stratégique circule difficilement, un salarié clé se débauche facilement.</div>

<h2 id="signaux">Demandes de modification révélatrices</h2>
<ul>
<li><strong>Réduction de la durée à six mois</strong> : signal d'un intérêt opportuniste plutôt que d'un projet.</li>
<li><strong>Suppression de la non-sollicitation</strong> : signal fort, à refuser dans une approche concurrent.</li>
<li><strong>Exclusion des informations « déjà connues »</strong> sans définition : formule qui vide la clause de son contenu.</li>
<li><strong>Demande d'exclusivité dès le NDA</strong> : prématuré, l'exclusivité se donne au stade de la LOI, contre un engagement de prix.</li>
</ul>

<h2 id="process">Le NDA dans le process</h2>
<p>Le NDA se signe entre le teaser et le mémorandum d'information. C'est le premier filtre : un acquéreur qui négocie trois semaines sur son NDA ne conclura pas en trois mois sur un protocole. La vitesse de signature est un indicateur de sérieux à consigner dans le suivi.</p>
`,
key:["La non-sollicitation du personnel est souvent la clause décisive","Durée usuelle de deux à cinq ans après la fin des discussions","L'exclusivité ne se donne pas au stade du NDA","La vitesse de signature est un indicateur de sérieux de l'acquéreur"],
quiz:[
 {q:"Un concurrent direct demande la suppression de la clause de non-sollicitation. Que faire ?",o:["Refuser, c'est la protection principale dans ce cas de figure","Accepter pour ne pas ralentir","Réduire la durée à un mois","Signer sans lire"],a:0,e:"L'approche d'un concurrent expose surtout au débauchage des équipes. Sans cette clause, le risque devient disproportionné par rapport à l'intérêt de la discussion."},
 {q:"À quel moment du process signe-t-on le NDA ?",o:["Entre le teaser et le mémorandum d'information","Avant le teaser","Au closing","Après la LOI"],a:0,e:"Le teaser est anonyme et ne nécessite pas de NDA. Celui-ci conditionne l'accès à l'information nominative du mémorandum."}
],
src:["Modèles de NDA du cabinet","Pratique des accords de confidentialité en M&A"]};

LESSONS["im"] = {
why:"Le mémorandum d'information est le document de vente. Ce qu'il contient engage, ce qu'il omet aussi.",
obj:["Structurer un mémorandum complet","Doser la transparence sans se saborder","Séparer ce qui relève du post-NDA de ce qui relève de l'audit"],
html:`
<h2 id="plan">Plan type</h2>
<ol>
<li><strong>Résumé exécutif</strong> : deux pages, lisibles seules, avec les chiffres clés et l'argument central.</li>
<li><strong>Société</strong> : histoire, actionnariat, gouvernance, implantations.</li>
<li><strong>Activité</strong> : offre, répartition du chiffre d'affaires, processus de production ou de prestation.</li>
<li><strong>Marché</strong> : taille, dynamique, concurrence, positionnement. Court, sourcé.</li>
<li><strong>Clients</strong> : répartition, ancienneté, récurrence, concentration présentée honnêtement.</li>
<li><strong>Organisation</strong> : effectifs, pyramide des âges, dépendance au dirigeant, conventions collectives.</li>
<li><strong>Éléments financiers</strong> : trois exercices, passage du résultat comptable à l'EBE retraité, BFR, dette, investissements.</li>
<li><strong>Plan d'affaires</strong> : hypothèses explicitées, trois ans, cohérent avec l'historique.</li>
<li><strong>Modalités</strong> : périmètre de cession, calendrier, accompagnement proposé.</li>
</ol>

<h2 id="dosage">Ce qui n'a pas sa place dans un mémorandum</h2>
<div class="callout warn"><div class="ct">Frontière post-NDA</div>Le mémorandum circule auprès de plusieurs acquéreurs, dont des concurrents. Certains sujets se traitent en entretien ou en audit, pas dans un document diffusé : litiges en cours, conflits entre associés, procédures prud'homales, difficultés avec un client majeur, passifs fiscaux identifiés.</div>
<p>La règle n'est pas de cacher, c'est de <strong>recontextualiser au bon moment</strong>. Un litige tu puis découvert en audit détruit la confiance et coûte plus cher que le litige lui-même. Un litige présenté oralement au bon interlocuteur, avec sa provision et son analyse, devient un point de négociation ordinaire.</p>

<h2 id="qualite">Marqueurs de qualité</h2>
<ul>
<li>Chaque chiffre du mémorandum est rattaché à une source nommée et se recoupe avec les comptes déposés.</li>
<li>La concentration client est présentée telle quelle. La dissimuler ne fait que retarder la découverte de trois mois.</li>
<li>Le plan d'affaires part de l'historique réel et explicite chaque écart de tendance.</li>
<li>Aucune projection ne repose sur une synergie propre à un acquéreur particulier.</li>
<li>Le document est daté et versionné, avec un tableau de diffusion tenu à jour.</li>
</ul>
`,
key:["Neuf sections, résumé exécutif lisible seul","Ne pas mettre dans un mémorandum ce qui relève du post-NDA","Recontextualiser plutôt que cacher","Chaque chiffre rattaché à une source, recoupé avec les comptes déposés"],
quiz:[
 {q:"Un litige prud'homal important est en cours. Que faire dans le mémorandum ?",o:["Ne pas le détailler dans le document diffusé, le présenter oralement au bon stade","L'omettre définitivement","Le détailler intégralement en première page","Le mentionner après le closing"],a:0,e:"Le mémorandum circule largement, y compris chez des concurrents. Le sujet se traite en entretien puis en audit, avec sa provision et son analyse. Le taire jusqu'au bout détruit la confiance."},
 {q:"Le premier client représente 32 % du chiffre d'affaires. Comment le présenter ?",o:["Tel quel, avec l'ancienneté et l'historique de la relation","Le diluer dans une catégorie « autres »","Ne pas parler de concentration","Le présenter à 15 %"],a:0,e:"La concentration apparaîtra en audit. La présenter avec son contexte permet de la valoriser comme une relation solide plutôt que de la subir comme une mauvaise surprise."}
],
src:["Modèles de mémorandum du cabinet","Pratique de la documentation sell side"]};

LESSONS["loi"] = {
why:"La LOI fixe le cadre économique de la transaction. Ce qui n'y figure pas ne se négociera plus jamais aussi bien.",
obj:["Rédiger une LOI complète","Distinguer clauses engageantes et non engageantes","Verrouiller les points qui deviendront coûteux plus tard"],
html:`
<h2 id="contenu">Contenu minimal</h2>
<table class="tbl">
<tr><th>Section</th><th>Contenu</th><th>Engageante</th></tr>
<tr><td>Périmètre</td><td>Titres, pourcentage, sociétés incluses, immobilier</td><td>Non</td></tr>
<tr><td>Prix et structure</td><td>Valeur d'entreprise, base de calcul, mécanisme d'ajustement</td><td>Non</td></tr>
<tr><td>Modalités de paiement</td><td>Comptant, différé, complément de prix, séquestre</td><td>Non</td></tr>
<tr><td>Financement</td><td>Fonds propres, dette, lettre de confort bancaire</td><td>Non</td></tr>
<tr><td>Conditions suspensives</td><td>Audits, financement, autorisations, agréments</td><td>Non</td></tr>
<tr><td>Calendrier</td><td>Dates d'audit, de protocole, de closing</td><td>Non</td></tr>
<tr><td>Exclusivité</td><td>Durée, périmètre, sanctions</td><td>Oui</td></tr>
<tr><td>Confidentialité</td><td>Rappel ou renvoi au NDA</td><td>Oui</td></tr>
<tr><td>Frais</td><td>Chacun supporte les siens</td><td>Oui</td></tr>
<tr><td>Droit et juridiction</td><td>Droit français, tribunal compétent</td><td>Oui</td></tr>
</table>
<div class="callout key"><div class="ct">Le double régime</div>Une LOI est majoritairement non engageante sur l'économie, et engageante sur la procédure. C'est ce qui la rend acceptable pour les deux parties. La rédaction doit rendre cette frontière explicite, faute de quoi un juge pourrait requalifier l'ensemble.</div>

<h2 id="verrous">Les points à verrouiller tôt</h2>
<ol>
<li><strong>Base de l'EBE retenu</strong> : exercice, retraitements admis, source. Sans cela, le prix affiché ne veut rien dire.</li>
<li><strong>Définition de la dette nette</strong> : au moins la liste des postes assimilés. Le détail viendra au protocole, le principe se fixe ici.</li>
<li><strong>BFR normatif</strong> : méthode de calcul et période de référence.</li>
<li><strong>Sort de l'immobilier</strong> : inclus, exclu, loué, avec quel loyer et quelle durée de bail.</li>
<li><strong>Accompagnement du cédant</strong> : durée, statut, rémunération.</li>
<li><strong>Garantie</strong> : plafond, franchise, durée, mode de sûreté. Une LOI muette sur ce point prépare une négociation difficile.</li>
</ol>

<h2 id="exclusivite">L'exclusivité</h2>
<p>L'exclusivité est ce que l'acquéreur achète en s'engageant sur un prix. Elle se donne pour une durée déterminée, généralement six à douze semaines, et se perd si l'acquéreur ne respecte pas le calendrier. Côté vendeur, on négocie une durée courte renouvelable plutôt qu'une durée longue : elle maintient la pression sans rompre la relation.</p>
`,
key:["Non engageante sur l'économie, engageante sur la procédure","Six verrous à poser dès la LOI, dont la base de l'EBE et la dette nette","L'exclusivité est la contrepartie de l'engagement de prix","Une durée courte renouvelable vaut mieux qu'une durée longue"],
quiz:[
 {q:"Quelles clauses d'une LOI sont généralement engageantes ?",o:["Exclusivité, confidentialité, frais, droit applicable","Le prix","Les conditions suspensives","Aucune"],a:0,e:"Le prix reste indicatif tant que les audits n'ont pas eu lieu. En revanche, les clauses de procédure engagent immédiatement les parties."},
 {q:"Pourquoi fixer la définition de la dette nette dès la LOI ?",o:["Parce qu'après l'exclusivité, le rapport de force se dégrade pour le vendeur","Parce que la loi l'impose","Pour raccourcir le protocole","Ce n'est pas nécessaire"],a:0,e:"Une fois l'exclusivité accordée, le vendeur n'a plus d'alternative crédible. Tout ce qui n'a pas été verrouillé se renégocie à son détriment."},
 {q:"Quelle durée d'exclusivité privilégier côté vendeur ?",o:["Courte et renouvelable","Douze mois fermes","Illimitée","Une semaine"],a:0,e:"Une durée courte renouvelable maintient la pression sur le calendrier tout en permettant de prolonger si l'acquéreur avance sérieusement."}
],
src:["Modèles de LOI du cabinet","Pratique des lettres d'intention en M&A français"]};

LESSONS["shoot"] = {
why:"La qualité de la liste d'acquéreurs détermine le prix davantage que la qualité du mémorandum. Un bon dossier mal adressé ne se vend pas.",
obj:["Construire une liste segmentée","Prioriser et séquencer les approches","Suivre le process de manière disciplinée"],
html:`
<h2 id="segments">Segmenter la liste</h2>
<table class="tbl">
<tr><th>Segment</th><th>Motivation</th><th>Prix</th><th>Risque</th></tr>
<tr><td>Consolidateur sectoriel</td><td>Parts de marché, synergies</td><td>Le plus élevé</td><td>Intégration, sort des équipes</td></tr>
<tr><td>Acteur adjacent</td><td>Diversification, accès à un métier</td><td>Élevé</td><td>Méconnaissance du métier</td></tr>
<tr><td>Fonds d'investissement</td><td>Rendement, plateforme de build-up</td><td>Moyen à élevé</td><td>Exigence de management en place</td></tr>
<tr><td>Repreneur individuel</td><td>Projet entrepreneurial</td><td>Le plus bas</td><td>Financement, délai</td></tr>
<tr><td>Management interne</td><td>Continuité</td><td>Bas</td><td>Capacité de financement</td></tr>
</table>
<div class="callout key"><div class="ct">Règle de séquencement</div>On approche d'abord les segments les plus susceptibles de payer cher, puis on élargit. Approcher trop tôt un segment bas de fourchette crée une référence de prix qui contamine la suite du process.</div>

<h2 id="conduite">Conduire le shoot</h2>
<ol>
<li><strong>Constitution</strong> : trente à quatre-vingts cibles selon le secteur, qualifiées par un critère de taille et d'appétence.</li>
<li><strong>Contact</strong> : appel puis envoi du teaser, jamais l'inverse. Un teaser envoyé à froid a un taux de réponse trois à cinq fois inférieur.</li>
<li><strong>Suivi</strong> : statut par cible, mis à jour dans l'outil de suivi, jamais dans un fichier personnel.</li>
<li><strong>NDA</strong> : relance à J+3 puis J+10. Un NDA non signé au bout de trois semaines est un refus déguisé.</li>
<li><strong>Mémorandum</strong> : envoi, puis appel de débriefing à J+7 pour recueillir un retour argumenté, même négatif.</li>
<li><strong>Questions</strong> : centralisation, réponse groupée, traçabilité. Aucune réponse orale non consignée.</li>
<li><strong>Offres</strong> : date limite unique communiquée à tous, grille de comparaison normalisée.</li>
</ol>

<h2 id="indicateurs">Indicateurs de pilotage</h2>
<div class="formula"><span class="fl">Taux de conversion type</span>Cibles contactées 60
→ Teasers envoyés 45 (75 %)
→ NDA signés 15 (33 % des teasers)
→ Mémorandums envoyés 15
→ Rendez-vous acquéreur-vendeur 6 (40 % des NDA)
→ LOI reçues 2 à 3</div>
<p>Un taux de signature de NDA inférieur à 20 % indique un teaser mal ciblé ou mal rédigé. Un taux de LOI nul après six rendez-vous indique un problème de prix affiché ou de qualité du dossier, pas un problème de marché.</p>
`,
key:["Segmenter avant d'approcher, séquencer du plus offrant vers le plus bas","Appel avant envoi du teaser, jamais l'inverse","Un NDA non signé à trois semaines est un refus","Les taux de conversion diagnostiquent le point faible du process"],
quiz:[
 {q:"Sur 40 teasers envoyés, 4 NDA signés. Quel diagnostic ?",o:["Teaser mal ciblé ou mal rédigé","Le marché est fermé","Le prix est trop bas","C'est un taux normal"],a:0,e:"Un taux de 10 % est très inférieur au repère de 30 %. Le problème se situe en amont : ciblage ou accroche du teaser."},
 {q:"Pourquoi approcher les consolidateurs avant les repreneurs individuels ?",o:["Pour éviter qu'une référence de prix basse ne contamine le process","Parce qu'ils répondent plus vite","Par courtoisie","Il n'y a pas d'ordre"],a:0,e:"Une offre basse arrivée tôt devient un point d'ancrage psychologique, pour le cédant comme pour les autres acquéreurs si l'information circule."}
],
src:["Pratique du cabinet, suivi de shoot","Mergers & Inquisitions, Sell Side Process"]};

LESSONS["ebitda-normatif"] = {
why:"L'EBITDA normatif est l'endroit où l'audit acquéreur reprend ce que la négociation avait accordé.",
obj:["Anticiper les positions de l'auditeur","Documenter en amont pour tenir en aval","Distinguer normalisation et ajustement de dette nette"],
html:`
<h2 id="logique">Ce que cherche l'auditeur</h2>
<p>Le rapport de qualité des résultats (QofE) poursuit un seul objectif : établir le niveau de résultat <strong>récurrent et soutenable</strong> qu'un acquéreur peut raisonnablement attendre. Il retire donc tout ce qui est exceptionnel, tout ce qui ne se reproduira pas, et ajoute ce qui manque.</p>
<table class="tbl">
<tr><th>Retraitement</th><th>Sens habituel</th><th>Position vendeur</th></tr>
<tr><td>Produits non récurrents</td><td>Retrait</td><td>Distinguer non récurrent et irrégulier</td></tr>
<tr><td>Charges non récurrentes</td><td>Ajout</td><td>Documenter le caractère exceptionnel</td></tr>
<tr><td>Coûts absents (poste à pourvoir, assurance, conformité)</td><td>Retrait</td><td>Contester si le coût n'est pas nécessaire</td></tr>
<tr><td>Effet année pleine d'un contrat</td><td>Ajout</td><td>Fournir le contrat signé</td></tr>
<tr><td>Cut-off et rattachement de charges</td><td>Variable</td><td>Vérifier la symétrie sur trois ans</td></tr>
<tr><td>Capitalisation de charges</td><td>Retrait</td><td>Justifier par la norme comptable</td></tr>
</table>
<div class="callout warn"><div class="ct">Le double compte</div>Erreur la plus coûteuse : un même élément retraité à la fois dans l'EBITDA normatif et dans la dette nette. Exemple, une prime exceptionnelle ajoutée à l'EBITDA et provisionnée en dette. Le vendeur paie deux fois. Une matrice croisée EBITDA contre dette nette contre BFR, avec une case par élément, empêche ce doublon.</div>

<h2 id="preparer">Se préparer en amont</h2>
<ol>
<li>Construire son propre EBITDA normatif <strong>avant</strong> le mémorandum, avec la même rigueur qu'un auditeur.</li>
<li>Constituer un dossier de pièces, une par retraitement, nommées et datées.</li>
<li>Appliquer le même traitement sur les trois exercices présentés, sans exception opportuniste.</li>
<li>Anticiper les trois retraitements que l'auditeur imposera et les intégrer soi-même : la crédibilité gagnée vaut plus que les euros concédés.</li>
<li>Tenir un tableau de passage du résultat comptable à l'EBITDA normatif, réconcilié à l'euro près.</li>
</ol>

<h2 id="cas">Cas chiffré, écart type de QofE</h2>
<table class="tbl">
<tr><th>Ligne</th><th class="n">Vendeur</th><th class="n">QofE</th><th class="n">Écart</th></tr>
<tr><td>EBITDA présenté</td><td class="n">1 250</td><td class="n">1 250</td><td class="n">0</td></tr>
<tr><td>Rémunération dirigeant</td><td class="n">+140</td><td class="n">+95</td><td class="n">-45</td></tr>
<tr><td>Charges non récurrentes</td><td class="n">+85</td><td class="n">+40</td><td class="n">-45</td></tr>
<tr><td>Postes à pourvoir</td><td class="n">0</td><td class="n">-60</td><td class="n">-60</td></tr>
<tr><td>Effet année pleine</td><td class="n">+70</td><td class="n">+70</td><td class="n">0</td></tr>
<tr><td><strong>EBITDA normatif</strong></td><td class="n"><strong>1 545</strong></td><td class="n"><strong>1 395</strong></td><td class="n"><strong>-150</strong></td></tr>
</table>
<p>À un multiple de 6, l'écart de 150 k€ représente <strong>900 k€ de valeur d'entreprise</strong>. Cet écart se négocie ligne par ligne, avec les pièces. Un vendeur préparé le réduit typiquement de moitié.</p>
`,
key:["Le QofE cherche le résultat récurrent et soutenable, rien d'autre","Ne jamais retraiter deux fois le même élément, EBITDA et dette nette","Construire son propre EBITDA normatif avant le mémorandum","Intégrer soi-même les retraitements évidents achète de la crédibilité"],
quiz:[
 {q:"Une prime exceptionnelle est ajoutée à l'EBITDA normatif et provisionnée en dette nette. Que se passe-t-il ?",o:["Le vendeur est pénalisé deux fois pour le même élément","Le calcul est correct","Le prix augmente","Aucun effet"],a:0,e:"Le double compte est l'erreur la plus coûteuse des ajustements de prix. Une matrice croisée par élément l'empêche."},
 {q:"L'auditeur retire 60 k€ pour un poste de directeur administratif non pourvu. Est-ce fondé ?",o:["Oui si le poste est nécessaire à l'exploitation sous un nouveau propriétaire","Non, c'est toujours abusif","Oui dans tous les cas","Seulement en IFRS"],a:0,e:"Le principe de l'EBITDA normatif est de refléter le coût réel d'exploitation par un tiers. Si le cédant assurait cette fonction gratuitement, le coût doit apparaître."},
 {q:"Multiple de 6, écart de QofE de 200 k€. Enjeu en valeur d'entreprise ?",o:["1 200 k€","200 k€","600 k€","33 k€"],a:0,e:"200 x 6 = 1 200 k€. C'est pourquoi la préparation du dossier de pièces est un investissement à très fort rendement."}
],
src:["Rapports de qualité des résultats, cabinets d'audit transactionnel","Pratique des négociations post-audit"]};

LESSONS["bfr-normatif"] = {
why:"Le BFR normatif est le second champ de bataille des ajustements, et le plus technique.",
obj:["Calculer un BFR normatif défendable","Traiter la saisonnalité","Rédiger la clause d'ajustement"],
html:`
<h2 id="methodes">Trois méthodes</h2>
<table class="tbl">
<tr><th>Méthode</th><th>Calcul</th><th>Quand l'utiliser</th></tr>
<tr><td>Moyenne des soldes mensuels</td><td>Moyenne des douze ou vingt-quatre derniers mois</td><td>Cas général, activité peu saisonnière</td></tr>
<tr><td>Moyenne des mêmes mois</td><td>Moyenne des trois derniers mois de closing sur trois exercices</td><td>Activité fortement saisonnière</td></tr>
<tr><td>BFR en jours appliqué au budget</td><td>Jours normatifs x activité prévue à la date de closing</td><td>Activité en forte croissance</td></tr>
</table>
<div class="callout key"><div class="ct">Principe directeur</div>Le BFR normatif doit répondre à une question : de combien de BFR l'entreprise a-t-elle besoin pour fonctionner normalement à cette date de l'année, à ce niveau d'activité ? Toute méthode qui répond honnêtement à cette question est défendable.</div>

<h2 id="cas">Cas chiffré, saisonnalité</h2>
<p>Soldes de BFR mensuels en k€ sur douze mois : 720, 690, 810, 950, 1 180, 1 340, 1 290, 1 010, 880, 800, 760, 730.</p>
<ul>
<li>Moyenne des douze mois : <strong>930 k€</strong></li>
<li>BFR au 31 décembre : <strong>730 k€</strong></li>
<li>Pic de juin : <strong>1 340 k€</strong></li>
</ul>
<p>Si le closing intervient au 31 décembre et que le normatif retenu est la moyenne annuelle de 930, le vendeur subit un ajustement défavorable de 200 k€ alors qu'il livre un BFR conforme à la saison. La méthode adaptée est ici la moyenne des BFR de fin décembre sur trois exercices, soit environ 735 k€. L'ajustement devient négligeable.</p>

<h2 id="clause">Rédiger la clause</h2>
<p>Une clause d'ajustement de BFR complète précise six éléments :</p>
<ol>
<li>Le périmètre exact des postes inclus, par référence à des comptes du plan comptable</li>
<li>La méthode de calcul du normatif, avec la période de référence</li>
<li>La date d'arrêté et le délai de production des comptes de closing</li>
<li>Les principes comptables applicables, identiques à ceux des comptes de référence</li>
<li>Le mécanisme de règlement des désaccords, généralement un expert indépendant</li>
<li>Une éventuelle franchise, pour éviter de se battre sur des montants faibles</li>
</ol>
<div class="callout warn"><div class="ct">Le point oublié</div>Préciser que les principes comptables des comptes de closing doivent être identiques à ceux ayant servi au calcul du normatif. Sans cette phrase, un changement de méthode de provisionnement des créances douteuses peut créer un écart artificiel de plusieurs dizaines de milliers d'euros.</div>
`,
key:["Trois méthodes, à choisir selon la saisonnalité et la croissance","La méthode doit répondre au besoin réel à la date de closing","Six éléments obligatoires dans la clause d'ajustement","Imposer la permanence des méthodes comptables entre référence et closing"],
quiz:[
 {q:"Activité saisonnière, closing en janvier, pic en juillet. Quelle méthode de normatif ?",o:["Moyenne des BFR de janvier sur trois exercices","Moyenne des douze mois","BFR du mois de juillet","BFR moyen du secteur"],a:0,e:"Comparer un BFR de janvier à une moyenne annuelle gonflée par l'été pénalise injustement le vendeur. On compare la même saison."},
 {q:"Quelle clause évite un écart artificiel dû à un changement de méthode comptable ?",o:["La permanence des principes comptables entre comptes de référence et de closing","Une franchise plus élevée","Un délai plus long","Le recours à un expert"],a:0,e:"Sans permanence des méthodes, l'acquéreur peut créer mécaniquement un écart en durcissant une politique de provision au closing."}
],
src:["Pratique des clauses d'ajustement","CMS, European M&A Study"]};

LESSONS["gap"] = {
why:"La garantie d'actif et de passif est l'assurance de l'acquéreur contre le passé. Ses paramètres se chiffrent.",
obj:["Comprendre les paramètres de la garantie","Calibrer plafond, franchise et durée","Choisir la sûreté adaptée"],
html:`
<h2 id="parametres">Les paramètres</h2>
<table class="tbl">
<tr><th>Paramètre</th><th>Définition</th><th>Pratique small cap française</th></tr>
<tr><td>Plafond global</td><td>Montant maximum de l'indemnisation</td><td>10 à 30 % du prix</td></tr>
<tr><td>Franchise</td><td>Seuil en dessous duquel rien n'est dû</td><td>0,5 à 1 % du prix</td></tr>
<tr><td>Seuil de minimis</td><td>Montant minimal par réclamation</td><td>0,05 à 0,1 % du prix</td></tr>
<tr><td>Durée générale</td><td>Délai de réclamation</td><td>12 à 24 mois</td></tr>
<tr><td>Durée fiscale et sociale</td><td>Alignée sur la prescription</td><td>Prescription plus trois mois</td></tr>
<tr><td>Sûreté</td><td>Garantie du paiement de la garantie</td><td>Séquestre, garantie bancaire à première demande, caution</td></tr>
</table>
<p>Une franchise peut être <strong>absolue</strong> (seul le dépassement est dû) ou <strong>déclencheur</strong> (tout est dû dès le franchissement). L'écart entre les deux se chiffre et se négocie : sur une franchise de 50 k€ et un sinistre de 60 k€, l'indemnisation est de 10 k€ dans le premier cas et de 60 k€ dans le second.</p>

<h2 id="calibrer">Calibrer</h2>
<div class="callout key"><div class="ct">Logique de calibrage</div>Le plafond se calibre sur l'exposition identifiée en audit, pas sur un pourcentage abstrait. Une société sans contentieux, sans immobilier, sans passif social identifié, justifie un plafond bas. Une société avec un contentieux fiscal en cours justifie une garantie spécifique dédiée, distincte de la garantie générale et à hauteur du risque chiffré.</div>

<h2 id="surete">Les sûretés</h2>
<table class="tbl">
<tr><th>Sûreté</th><th>Coût pour le vendeur</th><th>Confort pour l'acquéreur</th></tr>
<tr><td>Séquestre chez un tiers</td><td>Immobilisation du cash, intérêts perdus</td><td>Élevé</td></tr>
<tr><td>Garantie bancaire à première demande</td><td>Commission de 0,5 à 1,5 % par an</td><td>Très élevé</td></tr>
<tr><td>Caution personnelle du cédant</td><td>Nul en trésorerie, élevé en risque</td><td>Moyen, dépend de la solvabilité</td></tr>
<tr><td>Assurance de garantie</td><td>Prime de 1 à 3 % du plafond assuré</td><td>Élevé, sans immobilisation</td></tr>
<tr><td>Compensation sur complément de prix</td><td>Nul immédiatement</td><td>Faible à moyen</td></tr>
</table>
<p>L'assurance de garantie, longtemps réservée aux grandes opérations, descend progressivement vers le mid-market. Elle permet au cédant de percevoir l'intégralité du prix au closing, ce qui a une valeur en soi et se négocie contre une partie de la prime.</p>
`,
key:["Six paramètres à négocier, jamais seulement le plafond","Franchise absolue ou déclencheur : l'écart se chiffre","Le plafond se calibre sur l'exposition réelle identifiée en audit","L'assurance de garantie libère le prix au closing contre une prime"],
quiz:[
 {q:"Franchise absolue de 60 k€, sinistre de 90 k€. Indemnisation ?",o:["30 k€","90 k€","60 k€","0"],a:0,e:"En franchise absolue, seul le dépassement est dû. En franchise déclencheur, la totalité de 90 k€ serait due."},
 {q:"Un contentieux fiscal chiffré à 250 k€ est identifié en audit. Quelle réponse la plus adaptée ?",o:["Une garantie spécifique dédiée, distincte de la garantie générale","Augmenter le plafond général","Ignorer, c'est couvert","Réduire le prix de 250 k€ obligatoirement"],a:0,e:"Un risque identifié et chiffré se traite à part, avec sa propre durée et sa propre sûreté, sans consommer le plafond général."},
 {q:"Quel intérêt principal de l'assurance de garantie pour le cédant ?",o:["Percevoir l'intégralité du prix au closing sans immobilisation","Payer moins d'impôt","Supprimer la garantie","Raccourcir le process"],a:0,e:"Elle remplace le séquestre. Le cédant encaisse tout, l'acquéreur reste couvert, et la prime se partage dans la négociation."}
],
src:["CMS, European M&A Study","Pratique des garanties en small cap française"]};

LESSONS["earnout"] = {
why:"Le complément de prix résout un désaccord de valeur en le reportant. Il crée aussi la moitié des contentieux post-closing.",
obj:["Structurer un earn out qui ne finit pas en litige","Choisir le bon indicateur","Protéger le cédant pendant la période"],
html:`
<h2 id="quand">Quand l'utiliser</h2>
<ul>
<li>Désaccord portant sur une croissance future incertaine, pas sur le passé</li>
<li>Cédant qui reste opérationnellement impliqué pendant la période</li>
<li>Indicateur mesurable objectivement, sans dépendre des choix de l'acquéreur</li>
</ul>
<div class="callout warn"><div class="ct">Quand ne pas l'utiliser</div>Si le cédant part au closing, un earn out sur trois ans est une source de litige quasi certaine : il n'a plus la main sur l'indicateur mais en supporte le risque. Dans ce cas, mieux vaut négocier un prix ferme inférieur.</div>

<h2 id="indicateur">Choisir l'indicateur</h2>
<table class="tbl">
<tr><th>Indicateur</th><th>Manipulabilité</th><th>Lien avec la valeur</th><th>Recommandation</th></tr>
<tr><td>Chiffre d'affaires</td><td>Faible</td><td>Moyen</td><td>Bon compromis en small cap</td></tr>
<tr><td>Marge brute</td><td>Moyenne</td><td>Bon</td><td>Bon si la définition est verrouillée</td></tr>
<tr><td>EBITDA</td><td>Élevée</td><td>Excellent</td><td>Exige une définition contractuelle détaillée</td></tr>
<tr><td>Résultat net</td><td>Très élevée</td><td>Bon</td><td>À éviter</td></tr>
<tr><td>Indicateur opérationnel non financier</td><td>Faible</td><td>Variable</td><td>Utile en complément</td></tr>
</table>

<h2 id="protections">Protections du cédant</h2>
<ol>
<li><strong>Permanence des méthodes</strong> comptables et analytiques sur la période</li>
<li><strong>Engagement de moyens</strong> de l'acquéreur : maintien des ressources, non-transfert d'activité vers une autre entité du groupe</li>
<li><strong>Interdiction des refacturations</strong> de frais de siège non prévues</li>
<li><strong>Accès à l'information</strong> : reporting trimestriel, droit d'audit à ses frais</li>
<li><strong>Accélération</strong> en cas de revente, de licenciement du cédant sans cause réelle, ou de changement de contrôle</li>
<li><strong>Barème progressif</strong> plutôt que seuil binaire, pour éviter l'effet falaise</li>
</ol>

<h2 id="cas">Cas chiffré, effet falaise</h2>
<p>Earn out de 500 k€ si l'EBITDA de N+2 dépasse 1 200 k€, rien en dessous. Résultat réel : 1 185 k€. Le cédant perd 500 k€ pour 15 k€ d'écart, soit 1,3 %. Le litige est certain.</p>
<p>Version progressive : 0 en dessous de 1 000, puis linéairement jusqu'à 500 k€ à 1 300 k€ d'EBITDA. À 1 185 k€, l'earn out vaut 500 x (1 185 - 1 000) / 300 = <strong>308 k€</strong>. Personne n'est ruiné par un écart marginal, et le risque de contentieux s'effondre.</p>
`,
key:["Un earn out suppose que le cédant garde la main sur l'indicateur","Chiffre d'affaires ou marge brute en small cap, EBITDA seulement si bien défini","Six protections contractuelles minimum pour le cédant","Barème progressif obligatoire pour éviter l'effet falaise"],
quiz:[
 {q:"Pourquoi éviter un earn out fondé sur le résultat net ?",o:["Il dépend de choix de financement et de gestion propres à l'acquéreur","Il est trop simple à calculer","Il est interdit","Il ne reflète pas l'activité"],a:0,e:"Frais financiers, refacturations de siège, choix d'amortissement : l'acquéreur contrôle presque tous les postes entre l'EBITDA et le résultat net."},
 {q:"Earn out binaire de 400 k€ au-delà de 1 000 k€ d'EBITDA. Résultat : 998 k€. Que se passe-t-il ?",o:["Le cédant perd 400 k€ pour 2 k€ d'écart, litige quasi certain","Le cédant reçoit 400 k€","Le cédant reçoit 200 k€","Rien de particulier"],a:0,e:"L'effet falaise crée une disproportion qui pousse au contentieux. Un barème progressif est la seule structure raisonnable."},
 {q:"Le cédant part au closing. Un earn out sur trois ans est-il adapté ?",o:["Non, mieux vaut un prix ferme inférieur","Oui, c'est la meilleure solution","Oui si le montant est élevé","Oui avec un indicateur financier"],a:0,e:"Supporter le risque d'un indicateur sur lequel on n'a plus aucune influence est une structure injuste et instable."}
],
src:["Pratique des compléments de prix","Jurisprudence sur les clauses d'earn out"]};

LESSONS["dd-financiere"] = {
why:"L'audit financier transforme des chiffres en risques chiffrés. Il redéfinit souvent le prix, parfois la structure.",
obj:["Connaître le périmètre standard d'une DD financière","Préparer une data room qui limite les allers-retours","Traiter les conclusions dans la négociation"],
html:`
<h2 id="perimetre">Périmètre standard</h2>
<table class="tbl">
<tr><th>Volet</th><th>Objet</th><th>Sortie</th></tr>
<tr><td>Qualité des résultats</td><td>Normalisation de l'EBITDA sur trois ans</td><td>EBITDA normatif contradictoire</td></tr>
<tr><td>Qualité des actifs nets</td><td>Vérification des postes de bilan</td><td>Ajustements de dette nette</td></tr>
<tr><td>Dette nette</td><td>Recensement exhaustif, y compris assimilés</td><td>Liste chiffrée</td></tr>
<tr><td>BFR</td><td>Historique mensuel, saisonnalité, normatif</td><td>Niveau normatif proposé</td></tr>
<tr><td>Trésorerie</td><td>Disponibilité réelle, saisonnalité</td><td>Trésorerie déductible</td></tr>
<tr><td>Plan d'affaires</td><td>Cohérence avec l'historique, sensibilité</td><td>Réserves et scénarios</td></tr>
<tr><td>Fiscal</td><td>Conformité, risques, déficits</td><td>Provisions et garanties spécifiques</td></tr>
</table>

<h2 id="dataroom">Préparer la data room</h2>
<p>Une data room bien préparée réduit la durée de l'audit d'un tiers et le nombre de questions de moitié. Elle contient, au minimum :</p>
<ul>
<li>Liasses fiscales complètes sur trois exercices, plus le FEC de chaque exercice</li>
<li>Balances générales et auxiliaires, grand livre sur demande</li>
<li>Situations mensuelles ou trimestrielles sur vingt-quatre mois</li>
<li>Détail du chiffre d'affaires par client et par activité, anonymisé si nécessaire</li>
<li>Contrats significatifs : clients majeurs, baux, emprunts, crédit-bail, assurances</li>
<li>États du personnel, contrats de travail des cadres, conventions collectives</li>
<li>Tableau de passage du résultat comptable à l'EBITDA normatif préparé par le vendeur</li>
<li>Détail du BFR mensuel sur vingt-quatre mois</li>
</ul>
<div class="callout key"><div class="ct">Principe</div>Chaque document est nommé selon une convention unique, indexé, daté. Une data room désordonnée génère des questions, les questions génèrent des délais, et les délais coûtent des concessions.</div>

<h2 id="conclusions">Traiter les conclusions</h2>
<ol>
<li>Lire le rapport en séparant trois catégories : erreurs factuelles, désaccords d'appréciation, risques réels.</li>
<li>Corriger les erreurs factuelles avec les pièces, immédiatement et par écrit.</li>
<li>Discuter les désaccords d'appréciation en séance, jamais par courriel interposé.</li>
<li>Pour les risques réels, proposer soi-même le traitement : provision, garantie spécifique, condition suspensive. Proposer vaut mieux que subir.</li>
</ol>
`,
key:["Sept volets standards, dont QofE et dette nette","Une data room préparée réduit le calendrier et les concessions","Séparer erreurs factuelles, désaccords et risques réels","Pour un risque réel, proposer le traitement avant qu'on l'impose"],
quiz:[
 {q:"Le rapport d'audit contient une erreur factuelle. Que faire ?",o:["La corriger immédiatement par écrit, pièce à l'appui","Attendre la réunion de synthèse","L'ignorer si le montant est faible","Contester le rapport dans son ensemble"],a:0,e:"Une erreur non contestée devient une position acquise dans la négociation. La correction doit être rapide, écrite et documentée."},
 {q:"Quel document manque le plus souvent dans une data room de PME ?",o:["Le détail mensuel du BFR sur vingt-quatre mois","La liasse fiscale","Le Kbis","Les statuts"],a:0,e:"C'est pourtant la base du calcul du BFR normatif, donc d'un ajustement de prix. Son absence donne à l'acquéreur la main sur la méthode."}
],
src:["Pratique des rapports de due diligence","France Invest, guide de la due diligence"]};

LESSONS["sources-emplois"] = {
why:"Le tableau des sources et emplois est le point de départ de toute opération à effet de levier. Il ne peut pas être faux, il peut seulement être incomplet.",
obj:["Construire un tableau équilibré","Recenser tous les emplois, y compris les frais","Dimensionner les sources"],
html:`
<h2 id="structure">Structure</h2>
<table class="tbl">
<tr><th>Emplois</th><th class="n">k€</th><th>Sources</th><th class="n">k€</th></tr>
<tr><td>Prix des titres</td><td class="n">7 000</td><td>Apport en fonds propres</td><td class="n">3 200</td></tr>
<tr><td>Refinancement de la dette existante</td><td class="n">1 400</td><td>Dette senior amortissable</td><td class="n">4 200</td></tr>
<tr><td>Frais de transaction (conseils, audits)</td><td class="n">320</td><td>Dette vendeur</td><td class="n">800</td></tr>
<tr><td>Frais de mise en place du financement</td><td class="n">120</td><td>Trésorerie disponible de la cible</td><td class="n">400</td></tr>
<tr><td>Trésorerie de démarrage</td><td class="n">200</td><td>Revolver tiré au closing</td><td class="n">0</td></tr>
<tr><td>Complément de prix provisionné</td><td class="n">400</td><td>Réinvestissement du cédant</td><td class="n">840</td></tr>
<tr><td><strong>Total emplois</strong></td><td class="n"><strong>9 440</strong></td><td><strong>Total sources</strong></td><td class="n"><strong>9 440</strong></td></tr>
</table>
<div class="callout warn"><div class="ct">Les oubliés</div>Frais de conseil, frais bancaires de mise en place, droits d'enregistrement, trésorerie de démarrage, refinancement de la dette existante rendue exigible par le changement de contrôle. Chacun de ces postes est régulièrement oublié dans un premier jet et représente 3 à 8 % du total.</div>

<h2 id="ratios">Ratios de contrôle</h2>
<div class="formula"><span class="fl">Contrôles immédiats</span>Levier d'entrée = Dette totale / EBITDA normatif
Part de fonds propres = Apport / Total des sources
Couverture des intérêts = EBITDA / Charges d'intérêts année 1</div>
<p>Sur l'exemple : levier = 5 000 / 1 200 = <strong>4,2x</strong>, part de fonds propres = 4 040 / 9 440 = <strong>43 %</strong>. Un levier de 4,2x sur une PME de 1,2 M€ d'EBITDA est élevé pour le marché français small cap, où 3 à 3,5x est plus courant. Le montage suppose donc soit une visibilité exceptionnelle, soit un partenaire bancaire particulièrement confiant.</p>

<h2 id="reinvestissement">Le réinvestissement du cédant</h2>
<p>Le réinvestissement du cédant apparaît en source. Il aligne les intérêts et rassure les banques, mais il réduit le cash perçu au closing. Sur l'exemple, le cédant perçoit 7 000 - 840 = 6 160 k€ et conserve une participation minoritaire dans le nouvel ensemble. Cette part doit être valorisée à la même valeur d'entreprise que la transaction, sans décote pour le cédant, faute de quoi il paie deux fois.</p>
`,
key:["Emplois et sources s'équilibrent par construction","Les frais et le refinancement de la dette existante sont les oubliés classiques","Levier de 3 à 3,5x usuel en small cap française","Le réinvestissement du cédant se valorise sans décote"],
quiz:[
 {q:"Dette totale 5 400 k€, EBITDA normatif 1 500 k€. Levier d'entrée ?",o:["3,6x","2,8x","4,5x","5,4x"],a:0,e:"5 400 / 1 500 = 3,6x, ce qui reste dans les standards du small cap français."},
 {q:"Quel emploi est le plus souvent oublié dans un premier tableau ?",o:["Le refinancement de la dette existante rendue exigible","Le prix des titres","La dette senior","L'apport en fonds propres"],a:0,e:"La plupart des contrats de prêt contiennent une clause de changement de contrôle. La dette devient exigible et doit être refinancée au closing."}
],
src:["BIWS, Sources and Uses","Term sheets bancaires, pratique LBO"]};

LESSONS["relution-dilution"] = {
why:"Pour un acquéreur coté ou consolidé, la question n'est pas seulement combien ça vaut, mais quel effet sur mon résultat par action.",
obj:["Calculer une relution ou dilution","Identifier le point mort de financement","Interpréter le résultat"],
html:`
<h2 id="principe">Le principe</h2>
<p>Une acquisition est relutive si le bénéfice par action de l'acquéreur augmente après l'opération. Le calcul confronte le rendement du résultat acquis au coût du financement.</p>
<div class="formula"><span class="fl">Règle simple, financement 100 % dette</span>Relutif si : Rendement du résultat de la cible > Coût de la dette après impôt
Rendement = Résultat net de la cible / Prix payé</div>
<div class="formula"><span class="fl">Règle simple, financement 100 % actions</span>Relutif si : PER de l'acquéreur > PER payé pour la cible</div>

<h2 id="cas">Cas chiffré</h2>
<p>Acquéreur : résultat net 4 000 k€, 2 000 000 d'actions, BPA de 2,00 €, cours de 30 €, donc PER de 15. Cible : résultat net 900 k€, prix payé 9 000 k€, donc PER payé de 10.</p>
<p><strong>Hypothèse A, financement intégral en dette à 5 %, IS 25 %.</strong></p>
<ul>
<li>Coût de la dette après impôt : 9 000 x 5 % x 0,75 = <strong>337,5 k€</strong></li>
<li>Résultat net combiné : 4 000 + 900 - 337,5 = <strong>4 562,5 k€</strong></li>
<li>Nombre d'actions inchangé : 2 000 000</li>
<li>BPA après : 2,28 €, soit une <strong>relution de 14,1 %</strong></li>
</ul>
<p><strong>Hypothèse B, financement intégral en actions nouvelles émises à 30 €.</strong></p>
<ul>
<li>Actions émises : 9 000 / 30 = 300 000, total 2 300 000</li>
<li>Résultat net combiné : 4 900 k€</li>
<li>BPA après : 2,13 €, soit une <strong>relution de 6,5 %</strong></li>
</ul>
<p>Cohérent avec la règle simple : PER acquéreur de 15 supérieur au PER payé de 10, donc relutif en actions. Et le financement par dette est plus relutif que par actions tant que le coût de la dette après impôt reste inférieur au rendement du résultat acquis, ici 10 %.</p>

<h2 id="limites">Limites</h2>
<div class="callout warn"><div class="ct">La relution n'est pas la création de valeur</div>Une acquisition peut être relutive et destructrice de valeur : il suffit d'acheter une société à faible PER parce qu'elle décline. La relution mesure un effet comptable immédiat, pas la valeur actuelle nette de l'opération. Les deux analyses se mènent en parallèle, jamais l'une à la place de l'autre.</div>
`,
key:["Relutif en actions si le PER de l'acquéreur dépasse le PER payé","Relutif en dette si le rendement du résultat acquis dépasse le coût de la dette après impôt","Le financement par dette est généralement plus relutif","Relution et création de valeur sont deux questions distinctes"],
quiz:[
 {q:"Acquéreur au PER 20, cible payée au PER 12, financement 100 % actions. Résultat ?",o:["Relutif","Dilutif","Neutre","Impossible à dire"],a:0,e:"Payer moins cher en multiple que ce que l'on vaut soi-même augmente mécaniquement le bénéfice par action."},
 {q:"Prix 10 000, résultat net acquis 700, dette à 6 %, IS 25 %. Relutif ?",o:["Oui, rendement de 7 % contre un coût de dette après impôt de 4,5 %","Non","Neutre","Il manque le PER"],a:0,e:"Rendement de 700 / 10 000 = 7 %. Coût après impôt de 6 x 0,75 = 4,5 %. L'écart de 2,5 points crée la relution."},
 {q:"Une opération relutive est-elle nécessairement créatrice de valeur ?",o:["Non, la relution est un effet comptable immédiat","Oui, toujours","Oui, si le financement est en dette","Seulement pour les cotées"],a:0,e:"Acheter une société en déclin à bas multiple relute le BPA la première année et détruit de la valeur ensuite. Les deux analyses sont complémentaires."}
],
src:["Rosenbaum & Pearl, Merger Consequences Analysis","BIWS, Accretion Dilution"]};

LESSONS["ppa"] = {
why:"L'allocation du prix détermine les amortissements futurs, donc le résultat publié pendant dix ans.",
obj:["Décomposer un prix d'acquisition","Identifier les actifs incorporels à reconnaître","Mesurer l'impact sur le résultat futur"],
html:`
<h2 id="mecanique">Mécanique</h2>
<div class="formula"><span class="fl">Cascade d'allocation</span>Prix payé
- Juste valeur des actifs identifiables (dont incorporels reconnus)
+ Juste valeur des passifs repris
- Impôt différé passif sur les réévaluations
= Goodwill résiduel</div>

<h2 id="incorporels">Incorporels typiquement reconnus</h2>
<table class="tbl">
<tr><th>Actif</th><th>Méthode d'évaluation</th><th>Durée d'amortissement usuelle</th></tr>
<tr><td>Relations clients</td><td>Excess earnings ou MEEM</td><td>5 à 15 ans</td></tr>
<tr><td>Portefeuille de contrats</td><td>Actualisation des marges résiduelles</td><td>Durée des contrats</td></tr>
<tr><td>Marque</td><td>Relief from royalty</td><td>10 ans ou durée indéfinie</td></tr>
<tr><td>Technologie ou logiciel</td><td>Coût de remplacement ou relief from royalty</td><td>3 à 8 ans</td></tr>
<tr><td>Accord de non-concurrence</td><td>Différentiel de flux avec et sans</td><td>Durée de l'accord</td></tr>
</table>

<h2 id="cas">Cas chiffré</h2>
<p>Prix payé 9 000 k€. Actif net comptable 2 400 k€. Réévaluation de l'immobilier + 600 k€. Relations clients évaluées à 1 800 k€. Impôt différé passif à 25 % sur les réévaluations : (600 + 1 800) x 25 % = 600 k€.</p>
<ul>
<li>Actif net réévalué = 2 400 + 600 + 1 800 - 600 = <strong>4 200 k€</strong></li>
<li>Goodwill = 9 000 - 4 200 = <strong>4 800 k€</strong></li>
</ul>
<p>Impact sur le résultat : les relations clients s'amortissent sur dix ans, soit 180 k€ par an de charge supplémentaire, compensée partiellement par la reprise d'impôt différé de 45 k€. Effet net sur le résultat : <strong>- 135 k€ par an pendant dix ans</strong>. Le goodwill, lui, ne s'amortit pas en IFRS mais fait l'objet d'un test de dépréciation annuel.</p>
<div class="callout key"><div class="ct">Conséquence pratique</div>Plus on reconnaît d'incorporels amortissables, plus le résultat publié futur est pénalisé, mais plus le goodwill exposé au risque de dépréciation brutale est faible. C'est un arbitrage entre lissage et risque de choc.</div>
`,
key:["Prix moins actif net réévalué après impôt différé égale goodwill","Les relations clients sont l'incorporel le plus fréquemment reconnu","Chaque incorporel amortissable pèse sur le résultat publié","Le goodwill n'est pas amorti en IFRS mais testé annuellement"],
quiz:[
 {q:"Prix 12 000, actif net comptable 3 000, réévaluations 2 000, impôt différé 500. Goodwill ?",o:["7 500","9 000","7 000","5 000"],a:0,e:"Actif net réévalué = 3 000 + 2 000 - 500 = 4 500. Goodwill = 12 000 - 4 500 = 7 500."},
 {q:"Reconnaître davantage d'incorporels amortissables a pour effet :",o:["De réduire le goodwill et de peser sur le résultat futur","D'augmenter le résultat futur","De réduire le prix payé","De supprimer l'impôt différé"],a:0,e:"C'est l'arbitrage central du PPA : lisser la charge dans le temps ou conserver un goodwill exposé à un test de dépréciation."}
],
src:["IFRS 3, regroupements d'entreprises","Pratique des évaluations PPA"]};

LESSONS["synergies"] = {
why:"Les synergies justifient le prix payé au-dessus de la valeur intrinsèque. Mal chiffrées, elles justifient une destruction de valeur.",
obj:["Distinguer les types de synergies","Chiffrer avec un coût et un calendrier","Décider de la part à partager avec le vendeur"],
html:`
<h2 id="types">Typologie</h2>
<table class="tbl">
<tr><th>Type</th><th>Exemple</th><th>Fiabilité</th><th>Délai</th></tr>
<tr><td>Coûts, doublons de structure</td><td>Direction, comptabilité, siège</td><td>Élevée</td><td>6 à 18 mois</td></tr>
<tr><td>Coûts, achats</td><td>Renégociation fournisseurs sur volume</td><td>Moyenne</td><td>12 à 24 mois</td></tr>
<tr><td>Revenus, ventes croisées</td><td>Offre de l'un vendue aux clients de l'autre</td><td>Faible</td><td>24 à 48 mois</td></tr>
<tr><td>Revenus, pouvoir de prix</td><td>Réduction de la pression concurrentielle</td><td>Très faible</td><td>Incertain</td></tr>
<tr><td>Fiscales</td><td>Intégration fiscale, déficits</td><td>Élevée si validée</td><td>Immédiat</td></tr>
</table>
<div class="callout warn"><div class="ct">Le biais systématique</div>Les études empiriques convergent : les synergies de coûts se réalisent à environ 80 % du montant annoncé, les synergies de revenus à moins de 40 %. Un plan qui repose majoritairement sur des synergies de revenus doit être traité avec une prudence particulière.</div>

<h2 id="chiffrage">Chiffrer proprement</h2>
<p>Une synergie se présente sur une ligne comportant six colonnes : nature, montant annuel en régime de croisière, montée en charge par année, coût de mise en œuvre, responsable identifié, niveau de confiance. Sans les six, la ligne n'est pas exploitable.</p>
<div class="formula"><span class="fl">Valeur nette d'une synergie</span>Valeur = Somme actualisée des gains annuels nets
       - Coûts de mise en œuvre actualisés
       - Part cédée au vendeur dans le prix</div>

<h2 id="partage">Partager ou non</h2>
<p>Question stratégique : faut-il intégrer les synergies dans le prix offert ? Trois positions.</p>
<ul>
<li><strong>Aucun partage</strong> : position de principe, tenable en négociation bilatérale sans concurrence.</li>
<li><strong>Partage partiel</strong> : usuel en processus compétitif. On cède la part nécessaire pour l'emporter, en gardant la marge de sécurité.</li>
<li><strong>Partage total</strong> : erreur classique du surenchérisseur. On paie l'intégralité de la valeur que l'on crée soi-même, et on ne conserve que le risque.</li>
</ul>
<p>Côté conseil vendeur, on cherche à faire émerger les synergies dans la discussion sans jamais les intégrer au plan d'affaires présenté : elles appartiennent à l'acquéreur, mais elles peuvent justifier son prix.</p>
`,
key:["Synergies de coûts fiables à environ 80 %, de revenus à moins de 40 %","Six colonnes obligatoires par ligne de synergie","La valeur nette déduit les coûts de mise en œuvre","Ne jamais intégrer de synergies dans le plan d'affaires du vendeur"],
quiz:[
 {q:"Un plan repose à 70 % sur des synergies de ventes croisées. Quelle position adopter ?",o:["Forte prudence, taux de réalisation historiquement inférieur à 40 %","Accepter, les revenus sont plus durables","Doubler l'estimation","Aucune remarque"],a:0,e:"Les synergies de revenus supposent un changement de comportement client, plus lent et plus incertain qu'une suppression de doublon."},
 {q:"Pourquoi ne pas intégrer les synergies dans le plan d'affaires présenté par le vendeur ?",o:["Elles appartiennent à l'acquéreur et varient selon lui","Elles sont interdites","Elles réduisent le prix","Elles compliquent le modèle"],a:0,e:"Chaque acquéreur a ses propres synergies. Les intégrer au plan revient à présenter un plan faux pour tous sauf un, et à faire payer au vendeur la valeur créée par l'acheteur."}
],
src:["McKinsey, Merger Integration","Études empiriques sur la réalisation des synergies"]};

LESSONS["lbo-complet"] = {
why:"Le LBO combine tout ce qui précède. Le construire de bout en bout est le test final de la maîtrise technique.",
obj:["Enchaîner les blocs d'un LBO","Calculer les retours","Tester la robustesse du montage"],
html:`
<h2 id="sequence">Séquence de construction</h2>
<ol>
<li><strong>Hypothèses d'entrée</strong> : EBITDA normatif, multiple d'entrée, structure de financement, frais.</li>
<li><strong>Sources et emplois</strong> : équilibrage, calcul de l'apport en fonds propres.</li>
<li><strong>Bilan d'ouverture retraité</strong> : PPA simplifié, dette d'acquisition, écritures de closing.</li>
<li><strong>Plan d'exploitation</strong> : chiffre d'affaires, marges, capex, BFR sur cinq à sept ans.</li>
<li><strong>Échéancier de dette</strong> : tranches, amortissement, cash sweep, revolver.</li>
<li><strong>États projetés</strong> : compte de résultat, bilan, flux, avec contrôles.</li>
<li><strong>Sortie</strong> : EBITDA de sortie, multiple de sortie, dette résiduelle.</li>
<li><strong>Retours</strong> : TRI, MoIC, pont de création de valeur.</li>
<li><strong>Sensibilités</strong> : matrices multiple d'entrée contre multiple de sortie, croissance contre levier.</li>
<li><strong>Covenants</strong> : levier maximum, couverture des intérêts, marge de sécurité par année.</li>
</ol>

<h2 id="covenants">Covenants</h2>
<table class="tbl">
<tr><th>Covenant</th><th>Formule</th><th>Niveau usuel small cap</th></tr>
<tr><td>Levier</td><td>Dette nette / EBITDA</td><td>Décroissant, de 3,5x à 2,0x</td></tr>
<tr><td>Couverture des frais financiers</td><td>EBITDA / Charges d'intérêts</td><td>Supérieur à 3,0x</td></tr>
<tr><td>Couverture du service de la dette</td><td>Cash flow libre / Service de la dette</td><td>Supérieur à 1,1x</td></tr>
<tr><td>Capex maximum</td><td>Capex annuel plafonné</td><td>Défini au contrat</td></tr>
</table>
<div class="callout key"><div class="ct">Test de rupture</div>Un modèle LBO se teste par la question : de combien l'EBITDA peut-il baisser avant rupture du covenant le plus serré ? Si la réponse est inférieure à 15 %, le montage est fragile. Ce chiffre unique résume mieux la robustesse qu'une page de sensibilités.</div>

<h2 id="pont">Pont de création de valeur</h2>
<div class="formula"><span class="fl">Décomposition du gain</span>Gain total = Croissance de l'EBITDA
           + Expansion du multiple
           + Désendettement (remboursement de dette par le cash)
           +/- Effets divers (frais, dividendes, dilution)</div>
<p>Un bon montage tire sa performance de la croissance de l'EBITDA et du désendettement. Un montage qui dépend de l'expansion du multiple parie sur le marché, ce que les comités d'investissement acceptent rarement comme thèse principale.</p>
`,
key:["Dix blocs, dans un ordre fixe","Le test de rupture des covenants résume la robustesse","Le pont de création de valeur sépare performance et effet de marché","Une baisse d'EBITDA supportable inférieure à 15 % signale un montage fragile"],
quiz:[
 {q:"Quel élément d'un pont de création de valeur est le moins maîtrisable par le sponsor ?",o:["L'expansion du multiple","La croissance de l'EBITDA","Le désendettement","Les frais"],a:0,e:"Le multiple de sortie dépend du marché au moment de la cession. Baser une thèse dessus revient à parier plutôt qu'à créer."},
 {q:"Le covenant de levier est fixé à 3,5x et le levier projeté est de 3,4x en année 1. Que conclure ?",o:["Marge de sécurité très faible, montage fragile","Situation confortable","Le covenant est trop souple","Aucune conclusion possible"],a:0,e:"Une marge de 0,1x signifie qu'une baisse d'EBITDA de moins de 3 % déclenche un bris de covenant. Le montage ne supporte aucun aléa."}
],
src:["BIWS, LBO Modeling","France Invest, structuration des opérations"]};

LESSONS["irr-moic"] = {
why:"Deux indicateurs, deux messages différents. Les confondre conduit à comparer des opérations incomparables.",
obj:["Calculer TRI et MoIC","Comprendre leur divergence","Choisir l'indicateur pertinent selon la question"],
html:`
<h2 id="definitions">Définitions</h2>
<div class="formula"><span class="fl">Multiple sur capital investi</span>MoIC = Somme des flux reçus / Somme des flux investis

<span class="fl">Taux de rendement interne</span>Taux qui annule la valeur actuelle nette de la série de flux
Approximation sans flux intermédiaire : TRI = MoIC ^ (1 / n) - 1</div>

<h2 id="table">Table de correspondance</h2>
<table class="tbl">
<tr><th>MoIC \\ Durée</th><th class="n">3 ans</th><th class="n">4 ans</th><th class="n">5 ans</th><th class="n">7 ans</th></tr>
<tr><td>1,5x</td><td class="n">14,5 %</td><td class="n">10,7 %</td><td class="n">8,4 %</td><td class="n">5,9 %</td></tr>
<tr><td>2,0x</td><td class="n">26,0 %</td><td class="n">18,9 %</td><td class="n">14,9 %</td><td class="n">10,4 %</td></tr>
<tr><td>2,5x</td><td class="n">35,7 %</td><td class="n">25,7 %</td><td class="n">20,1 %</td><td class="n">14,0 %</td></tr>
<tr><td>3,0x</td><td class="n">44,2 %</td><td class="n">31,6 %</td><td class="n">24,6 %</td><td class="n">17,0 %</td></tr>
</table>
<p>Lecture : un MoIC de 2,5x en cinq ans donne 20 % de TRI. Le même MoIC en sept ans ne donne plus que 14 %. Le temps est un ennemi du TRI et neutre pour le MoIC.</p>

<h2 id="divergence">Quand les deux divergent</h2>
<ul>
<li><strong>Sortie rapide</strong> : TRI très élevé, MoIC modeste. Un doublement en 18 mois donne un TRI de 59 % mais seulement 2,0x. Excellent pour la statistique du fonds, faible en valeur absolue créée.</li>
<li><strong>Détention longue</strong> : MoIC élevé, TRI moyen. Un 3,5x en dix ans donne 13 %.</li>
<li><strong>Dividende de recapitalisation</strong> : améliore fortement le TRI en avançant les flux, sans changer beaucoup le MoIC.</li>
</ul>
<div class="callout key"><div class="ct">Quel indicateur pour quelle question</div>Le TRI répond à : quelle efficacité par unité de temps ? Le MoIC répond à : combien d'euros de valeur créée ? Un investisseur institutionnel regarde les deux, et se méfie d'un TRI élevé associé à un MoIC faible, signe d'une sortie précipitée plus que d'une création de valeur.</div>

<h2 id="cas">Cas chiffré</h2>
<p>Apport de 3 000 k€ en année 0. Dividende de recapitalisation de 800 k€ en année 3. Sortie à 6 400 k€ en année 5.</p>
<ul>
<li>MoIC = (800 + 6 400) / 3 000 = <strong>2,40x</strong></li>
<li>TRI : la série - 3 000, 0, 0, 800, 0, 6 400 donne environ <strong>21,4 %</strong></li>
<li>Sans le dividende intermédiaire, à MoIC identique (sortie à 7 200 en année 5), le TRI tombe à <strong>19,1 %</strong></li>
</ul>
<p>Le dividende avance 800 k€ de deux ans et améliore le TRI de 2,3 points sans créer un euro de valeur supplémentaire.</p>
`,
key:["MoIC mesure l'ampleur, TRI mesure l'efficacité temporelle","TRI = MoIC puissance 1 sur n, moins 1, sans flux intermédiaire","Un dividende de recapitalisation améliore le TRI sans créer de valeur","Se méfier d'un TRI élevé associé à un MoIC faible"],
quiz:[
 {q:"MoIC de 2,0x sur 4 ans, sans flux intermédiaire. TRI approximatif ?",o:["18,9 %","25 %","50 %","14,9 %"],a:0,e:"2 puissance 0,25 moins 1 = 1,189 - 1 = 18,9 %."},
 {q:"Un fonds affiche un TRI de 45 % et un MoIC de 1,4x. Comment l'interpréter ?",o:["Sortie très rapide, peu de valeur absolue créée","Performance exceptionnelle sur tous les plans","Erreur de calcul","Détention longue"],a:0,e:"Un MoIC de 1,4x associé à un TRI de 45 % implique une détention d'environ neuf mois. Le rendement annualisé est brillant, la valeur créée reste modeste."},
 {q:"Un dividende de recapitalisation en année 2 a quel effet principal ?",o:["Améliorer le TRI en avançant les flux","Augmenter le MoIC","Réduire le risque opérationnel","Augmenter l'EBITDA"],a:0,e:"Le TRI est sensible au calendrier des flux. Avancer un encaissement l'améliore mécaniquement, sans création de valeur opérationnelle."}
],
src:["France Invest, mesure de la performance","BIWS, Returns Analysis"]};

BRIEFS["compte-resultat"]={why:"Le compte de résultat raconte la formation du résultat sur une période. C'est la base de tout multiple.",
pts:["Trois blocs : exploitation, financier, exceptionnel. Le M&A ne s'intéresse presque qu'au premier.","Charges par nature en PCG français, par fonction en présentation anglo-saxonne. Les deux ne se comparent pas directement.","Le chiffre d'affaires se ventile toujours par activité et par client avant toute analyse.","Le résultat exceptionnel se retraite systématiquement : par définition il ne se reproduira pas.","La marge d'EBE est le premier ratio à calculer, avant toute autre chose."],
q:{q:"Pourquoi retraiter le résultat exceptionnel avant de calculer un multiple ?",o:["Parce qu'il ne se reproduira pas et fausse la récurrence","Parce qu'il est non déductible","Parce qu'il est toujours négatif","Il ne se retraite jamais"],a:0,e:"Un multiple capitalise un résultat récurrent. Y inclure un élément non récurrent revient à le payer à l'infini."}};

BRIEFS["immos-amortissements"]={why:"L'âge de l'outil de production conditionne le capex que l'acquéreur devra engager.",
pts:["Valeur brute, amortissements cumulés, valeur nette comptable : les trois se lisent ensemble.","Ratio d'usure = amortissements cumulés / valeur brute. Au-delà de 70 %, l'outil est en fin de vie.","Amortissement linéaire, dégressif ou par composants : le choix affecte le résultat, pas la trésorerie.","Une immobilisation totalement amortie mais toujours utilisée signale un actif sous-évalué au bilan.","Le tableau 2055 de la liasse donne acquisitions et cessions de l'exercice."],
q:{q:"Amortissements cumulés de 820 sur une valeur brute de 1 000. Que conclure ?",o:["Ratio d'usure de 82 %, un rattrapage d'investissement est probable","L'outil est neuf","La société est rentable","Le BFR est élevé"],a:0,e:"Un ratio d'usure élevé annonce des remplacements à financer, donc des flux futurs réduits pour l'acquéreur."}};

BRIEFS["provisions"]={why:"Une provision insuffisante est un passif caché. Une provision excessive est une réserve latente.",

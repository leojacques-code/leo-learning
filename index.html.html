LESSONS["conventions-modele"] = {
why:"Un modèle est un document qui circule. S'il n'est pas lisible par un tiers en dix minutes, il ne vaut rien, quelle que soit la qualité des calculs.",
obj:["Appliquer la convention de couleurs universelle","Structurer un classeur en feuilles à rôle unique","Rendre un modèle auditable sans son auteur"],
html:`
<h2 id="couleurs">Convention de couleurs</h2>
<p>Universelle dans les banques d'affaires et les fonds. Elle permet de savoir en un coup d'œil ce que l'on peut modifier.</p>
<table class="tbl">
<tr><th>Couleur de police</th><th>Signification</th></tr>
<tr><td>Bleu</td><td>Saisie en dur, hypothèse modifiable</td></tr>
<tr><td>Noir</td><td>Formule calculée dans la feuille</td></tr>
<tr><td>Vert</td><td>Lien vers une autre feuille du même classeur</td></tr>
<tr><td>Rouge</td><td>Lien vers un autre classeur, à éliminer avant diffusion</td></tr>
</table>

<h2 id="structure">Structure du classeur</h2>
<p>Une feuille, un rôle. Le sens de lecture va de gauche à droite : sommaire, hypothèses, calculs, sorties.</p>
<ol>
<li><strong>Sommaire</strong> : liste des feuilles, date de version, auteur, sources des données</li>
<li><strong>Hypothèses</strong> : toutes les cellules bleues du modèle, regroupées</li>
<li><strong>Données historiques</strong> : reprise fidèle des comptes, sans retraitement</li>
<li><strong>Retraitements</strong> : une ligne par retraitement, avec commentaire et source</li>
<li><strong>Modèle</strong> : compte de résultat, bilan, flux, échéanciers</li>
<li><strong>Sorties</strong> : synthèse, sensibilités, graphiques</li>
<li><strong>Contrôles</strong> : toutes les vérifications regroupées avec un indicateur unique</li>
</ol>
<div class="callout key"><div class="ct">Règle d'or</div>Une seule formule par ligne, tirée horizontalement sans exception. Si une année déroge, on crée une ligne de correction séparée plutôt que de casser l'uniformité. Une ligne uniforme s'audite en lisant une seule cellule.</div>

<h2 id="interdits">Interdits</h2>
<ul>
<li>Constantes cachées dans une formule, du type <code>=B12*1,03</code>. Le 1,03 doit vivre dans une cellule d'hypothèse.</li>
<li>Cellules fusionnées dans une zone de calcul : elles cassent le tirage et les tableaux croisés.</li>
<li>Colonnes masquées contenant des calculs actifs.</li>
<li>Liens externes vers un fichier posé sur un bureau, qui casseront à l'ouverture chez le destinataire.</li>
<li>Feuilles nommées Feuil1, Feuil2, test, essai, final, final_v2.</li>
</ul>
`,
key:["Bleu pour les saisies, noir pour les formules, vert pour les liens internes","Une feuille, un rôle, dans un sens de lecture constant","Une seule formule par ligne, tirée sans rupture","Aucune constante en dur dans une formule de calcul"],
quiz:[
 {q:"Vous ouvrez un modèle reçu et voyez du texte rouge. Que faut-il en déduire ?",o:["Il existe des liens vers un autre classeur, à traiter avant diffusion","Il y a une erreur de calcul","Les cellules sont protégées","C'est une hypothèse à modifier"],a:0,e:"Le rouge signale un lien externe. À la diffusion, ce lien casse ou, pire, remonte une valeur périmée sans alerte visible."},
 {q:"Pourquoi proscrire =B12*1,03 dans une ligne de projection ?",o:["L'hypothèse de croissance devient invisible et non modifiable centralement","La formule est trop lente","Excel refuse les décimales","Cela crée une référence circulaire"],a:0,e:"Une hypothèse enfouie dans une formule échappe à l'auditeur et aux analyses de sensibilité. Toute hypothèse vit dans une cellule bleue identifiée."}
],
src:["FAST Standard","Macabacus, Modeling Best Practices"]};

LESSONS["tables-sensibilite"] = {
why:"Une valeur unique n'existe pas. Ce qui se défend en négociation, c'est une fourchette et la compréhension de ce qui la fait bouger.",
obj:["Construire une table de données à deux entrées","Choisir les deux variables qui comptent","Lire une matrice sans se tromper de sens"],
html:`
<h2 id="construction">Construire la table</h2>
<p>Une table de données à deux entrées se construit en trois gestes : la formule de sortie est placée dans la <strong>cellule d'angle</strong> en haut à gauche, les valeurs de la première variable en <strong>colonne</strong>, celles de la seconde en <strong>ligne</strong>. On sélectionne l'ensemble, puis Données, Analyse de scénarios, Table de données. La cellule d'entrée en ligne correspond aux valeurs du haut, celle en colonne aux valeurs de gauche.</p>
<div class="callout warn"><div class="ct">Contrainte</div>La table de données ne fonctionne que si les cellules d'entrée se trouvent sur la même feuille que la table. On duplique donc les deux hypothèses pilotes sur la feuille de sortie, avec un lien clair vers l'original.</div>

<h2 id="variables">Choisir les bonnes variables</h2>
<p>Une matrice n'a de valeur que si les deux axes sont ceux qui font réellement bouger le résultat. On teste au préalable l'élasticité de chaque hypothèse en la faisant varier de plus ou moins dix pour cent et en mesurant l'effet sur la valeur.</p>
<table class="tbl">
<tr><th>Sortie analysée</th><th>Axe 1</th><th>Axe 2</th></tr>
<tr><td>Valeur d'entreprise DCF</td><td>WACC</td><td>Croissance à l'infini ou multiple de sortie</td></tr>
<tr><td>Prix maximum LBO</td><td>Multiple de sortie</td><td>TRI cible</td></tr>
<tr><td>Relution du BPA</td><td>Prix payé</td><td>Part financée en dette</td></tr>
<tr><td>Trésorerie minimale</td><td>Croissance du CA</td><td>Délai clients</td></tr>
</table>

<h2 id="cas">Cas chiffré</h2>
<p>DCF donnant 12,4 M€ au WACC de 9,5 % et à une croissance perpétuelle de 1,5 %. Matrice de sensibilité, valeurs en M€.</p>
<table class="tbl">
<tr><th>WACC \\ g</th><th class="n">1,0 %</th><th class="n">1,5 %</th><th class="n">2,0 %</th></tr>
<tr><td>8,5 %</td><td class="n">13,4</td><td class="n">14,2</td><td class="n">15,1</td></tr>
<tr><td>9,5 %</td><td class="n">11,7</td><td class="n">12,4</td><td class="n">13,1</td></tr>
<tr><td>10,5 %</td><td class="n">10,4</td><td class="n">10,9</td><td class="n">11,5</td></tr>
</table>
<p>Lecture : un point de WACC vaut environ 1,5 M€, soit 12 % de la valeur. Un demi-point de croissance perpétuelle vaut 0,7 M€. Conclusion pour la négociation : le débat sur le taux d'actualisation pèse deux fois plus lourd que celui sur la croissance à l'infini, il faut donc y consacrer deux fois plus de préparation.</p>
`,
key:["Formule en cellule d'angle, variables en ligne et en colonne","Les cellules d'entrée doivent être sur la même feuille","On sensibilise les variables les plus élastiques, pas les plus faciles","Une matrice se lit en euros par point de variation"],
quiz:[
 {q:"Dans une table de données à deux entrées, où se place la formule de sortie ?",o:["Dans la cellule d'angle en haut à gauche","Au centre de la table","Dans la première cellule de résultat","Sur une autre feuille"],a:0,e:"Excel lit la formule dans la cellule d'angle, puis recalcule le modèle pour chaque combinaison ligne-colonne."},
 {q:"Un DCF passe de 12,4 à 10,9 M€ quand le WACC passe de 9,5 à 10,5 %. Que retenir pour la négociation ?",o:["Un point de WACC vaut environ 1,5 M€, il faut préparer sa justification","Le modèle est faux","La croissance perpétuelle est trop élevée","Le DCF n'est pas utilisable"],a:0,e:"Mesurer la sensibilité en euros par point de variation permet de hiérarchiser les sujets de négociation. Le WACC est ici le premier enjeu."}
],
src:["Microsoft, documentation Table de données","Wall Street Prep, Sensitivity Analysis"]};

LESSONS["audit-formules"] = {
why:"On reçoit plus de modèles qu'on n'en construit. Savoir auditer un classeur inconnu en une heure évite de reprendre à son compte l'erreur d'un autre.",
obj:["Cartographier un classeur reçu","Détecter les zones de risque en priorité","Formuler des questions précises au constructeur"],
html:`
<h2 id="protocole">Protocole en six étapes</h2>
<ol>
<li><strong>Cartographier</strong> : lister les feuilles, leur rôle, leur date. Repérer les feuilles masquées avec un clic droit sur un onglet.</li>
<li><strong>Recenser les valeurs en dur</strong> dans les zones de formules. Sélectionner la plage, F5, Cellules, Constantes, Nombres. Chaque constante dans une zone de calcul est une anomalie potentielle.</li>
<li><strong>Chercher les liens externes</strong> : Données, Modifier les liens d'accès. Un lien mort renvoie une valeur figée qui ne se met plus à jour.</li>
<li><strong>Vérifier les contrôles</strong> : le modèle a-t-il des lignes de vérification ? S'il n'en a aucune, c'est en soi une conclusion d'audit.</li>
<li><strong>Tester la robustesse</strong> : passer la croissance à zéro, puis à - 20 %. Un modèle sain doit rester cohérent, sans erreur ni valeur absurde.</li>
<li><strong>Recouper avec la source</strong> : rapprocher trois chiffres clés des comptes déposés ou de la liasse. Un écart non expliqué remonte immédiatement.</li>
</ol>

<h2 id="pieges">Les cinq erreurs les plus fréquentes</h2>
<table class="tbl">
<tr><th>Erreur</th><th>Symptôme</th><th>Détection</th></tr>
<tr><td>Plage décalée d'une ligne</td><td>Somme qui exclut la première ou dernière valeur</td><td>Ctrl + accent grave pour afficher les formules</td></tr>
<tr><td>Recherche approximative</td><td>RECHERCHEV sans le dernier argument FAUX</td><td>Recherche du texte RECHERCHEV dans le classeur</td></tr>
<tr><td>Signe inversé</td><td>Une charge ajoutée au lieu d'être soustraite</td><td>Test de cohérence : marge supérieure au chiffre d'affaires</td></tr>
<tr><td>Copie sans ancrage</td><td>Références qui glissent au tirage</td><td>Inspection de la première et de la dernière colonne</td></tr>
<tr><td>Itération activée en silence</td><td>Circularité masquée, valeurs instables</td><td>Options, Formules, Calcul itératif</td></tr>
</table>
<div class="callout key"><div class="ct">Sortie d'audit</div>Un audit se conclut par une note d'une page : trois anomalies bloquantes, cinq points de vigilance, l'impact chiffré de chacune sur la valeur. Sans chiffrage d'impact, la note ne sert à rien.</div>
`,
key:["Six étapes, dans l'ordre, sans exception","Toute constante dans une zone de formule est suspecte","Un modèle sans ligne de contrôle est un modèle non fiable","Un audit se conclut par un chiffrage d'impact, pas par une liste"],
quiz:[
 {q:"Quel raccourci affiche toutes les formules d'une feuille ?",o:["Ctrl + accent grave","Ctrl + F","F9","Alt + F11"],a:0,e:"Ctrl + accent grave bascule l'affichage entre valeurs et formules. C'est le premier geste d'un audit visuel."},
 {q:"Vous trouvez une constante 1,25 au milieu d'une formule de projection. Que faire ?",o:["L'extraire vers une cellule d'hypothèse et interroger le constructeur sur son origine","La supprimer","La remplacer par 1","Ignorer, c'est une pratique courante"],a:0,e:"Une hypothèse enfouie échappe à toute sensibilité et à tout audit. Il faut connaître sa source avant de la déplacer."}
],
src:["ICAEW, Twenty Principles for Good Spreadsheet Practice","EuSpRIG, spreadsheet risk"]};

LESSONS["architecture-modele"] = {
why:"L'architecture décidée en dix minutes détermine si le modèle sera maintenable pendant six mois de transaction ou jeté au bout de trois semaines.",
obj:["Poser une architecture standard reproductible","Dimensionner le modèle au besoin réel","Prévoir l'évolution en cours de deal"],
html:`
<h2 id="plan">Plan type</h2>
<table class="tbl">
<tr><th>Feuille</th><th>Rôle</th><th>Cellules bleues</th></tr>
<tr><td>00_Sommaire</td><td>Version, auteur, sources, journal des modifications</td><td>Oui</td></tr>
<tr><td>01_Hypotheses</td><td>Tous les inducteurs, un scénario actif</td><td>Oui, exclusivement</td></tr>
<tr><td>02_Historique</td><td>Comptes tels que déposés, sans retraitement</td><td>Oui, saisie fidèle</td></tr>
<tr><td>03_Retraitements</td><td>Passage des comptes à la base économique</td><td>Oui</td></tr>
<tr><td>04_CR</td><td>Compte de résultat historique et projeté</td><td>Non</td></tr>
<tr><td>05_Bilan</td><td>Bilan historique et projeté</td><td>Non</td></tr>
<tr><td>06_Flux</td><td>Tableau de flux</td><td>Non</td></tr>
<tr><td>07_Dette</td><td>Échéancier par tranche, revolver, cash sweep</td><td>Non</td></tr>
<tr><td>08_Immos</td><td>Échéancier d'immobilisations et d'amortissements</td><td>Non</td></tr>
<tr><td>09_Valo</td><td>DCF, multiples, synthèse</td><td>Non</td></tr>
<tr><td>10_Sorties</td><td>Synthèse une page, sensibilités, graphiques</td><td>Non</td></tr>
<tr><td>99_Controles</td><td>Toutes les vérifications, un indicateur global</td><td>Non</td></tr>
</table>

<h2 id="calendrier">Colonne de calendrier</h2>
<p>Une ligne de dates en haut de chaque feuille, identique partout, avec un drapeau <code>1</code> ou <code>0</code> indiquant si la colonne est historique ou projetée. Toutes les formules testent ce drapeau. Cela permet d'allonger la période projetée en tirant une colonne, sans réécrire une seule formule.</p>
<div class="formula"><span class="fl">Motif de bascule historique / projeté</span>=SI(drapeau_projete=1 ; formule_de_projection ; valeur_historique)</div>

<h2 id="dimensionner">Dimensionner</h2>
<ul>
<li><strong>Première approche de valeur</strong> : trois exercices historiques, trois projetés, pas de bilan détaillé. Une heure de travail.</li>
<li><strong>Mémorandum d'information</strong> : trois historiques, cinq projetés, modèle intégré complet, trois scénarios.</li>
<li><strong>LBO et négociation finale</strong> : ajout de l'échéancier par tranche, des covenants, du management package et de la mécanique de prix.</li>
</ul>
<div class="callout warn"><div class="ct">Erreur de dimensionnement</div>Construire un modèle mensuel sur cinq ans pour une première approche. Le temps passé est perdu et la précision affichée est trompeuse : personne ne connaît le mois 47.</div>
`,
key:["Douze feuilles, un rôle chacune, numérotées","Une ligne de calendrier unique avec drapeau historique ou projeté","Toutes les cellules bleues sur trois feuilles maximum","On dimensionne selon la phase de la transaction"],
quiz:[
 {q:"À quoi sert le drapeau historique ou projeté sur la ligne de calendrier ?",o:["Permettre d'allonger la période en tirant une colonne, sans réécrire de formule","Colorer les cellules","Calculer le WACC","Contrôler l'équilibre du bilan"],a:0,e:"Toutes les formules testent le drapeau. La bascule est automatique, ce qui rend le modèle extensible sans reconstruction."},
 {q:"Pour une première approche de valeur en phase de qualification, quelle granularité ?",o:["Trois exercices historiques, trois projetés, sans bilan détaillé","Modèle mensuel sur cinq ans","Modèle intégré complet avec covenants","Aucun modèle"],a:0,e:"La précision doit être proportionnée à l'information disponible et à l'enjeu. Le raffinement vient avec l'avancement du deal."}
],
src:["FAST Standard","Modèle financier Triactis (interne)"]};

LESSONS["schema-dette"] = {
why:"L'échéancier de dette est le cœur d'un LBO et la partie du modèle où les erreurs coûtent le plus cher.",
obj:["Construire un échéancier par tranche","Modéliser un revolver et un cash sweep","Calculer les intérêts sans circularité incontrôlée"],
html:`
<h2 id="structure">Structure de l'échéancier</h2>
<p>Une tranche par bloc, toujours dans le même ordre de lignes, ce qui permet de dupliquer le bloc pour ajouter une tranche.</p>
<div class="formula"><span class="fl">Bloc type par tranche</span>Solde d'ouverture
+ Tirages
- Remboursement contractuel (amortissement)
- Remboursement anticipé (cash sweep)
= Solde de clôture
Solde moyen = (ouverture + clôture) / 2
Intérêts = solde moyen x taux</div>

<h2 id="ordre">Ordre de priorité</h2>
<p>Le cash disponible sert les tranches dans un ordre contractuel strict, dit cascade. Cet ordre se modélise en cascade de <code>MIN</code>.</p>
<ol>
<li>Intérêts de toutes les tranches, par rang</li>
<li>Amortissement contractuel de la dette senior</li>
<li>Remboursement du revolver si tiré</li>
<li>Cash sweep sur la senior, à hauteur du pourcentage contractuel du cash excédentaire</li>
<li>Mezzanine et dette vendeur, généralement in fine</li>
</ol>
<div class="formula"><span class="fl">Cash sweep</span>Remboursement anticipé = MIN(
   cash disponible après service de la dette x pourcentage de sweep ;
   solde de la tranche après amortissement contractuel )</div>

<h2 id="revolver">Le revolver</h2>
<p>Le revolver absorbe les besoins de trésorerie et se rembourse dès qu'un excédent apparaît. Il est le régulateur du modèle et la raison pour laquelle un bilan boucle.</p>
<div class="formula"><span class="fl">Mécanique</span>Tirage = MAX(0 ; trésorerie minimale - trésorerie avant revolver)
Remboursement = MIN(solde du revolver ; trésorerie avant revolver - trésorerie minimale)</div>
<div class="callout warn"><div class="ct">Circularité</div>Les intérêts dépendent du solde moyen, qui dépend du remboursement, qui dépend du cash disponible, qui dépend des intérêts. Deux solutions : activer le calcul itératif d'Excel, ou calculer les intérêts sur le solde d'ouverture seul. La seconde est moins exacte mais élimine la circularité, elle est préférable dans un modèle destiné à circuler.</div>

<h2 id="cas">Cas chiffré</h2>
<p>Dette senior 4 000 k€ à 5 %, amortissement linéaire sur 7 ans, sweep de 50 %. Cash disponible après service de la dette en année 1 : 900 k€.</p>
<table class="tbl">
<tr><th>Ligne</th><th class="n">Année 1</th></tr>
<tr><td>Solde d'ouverture</td><td class="n">4 000</td></tr>
<tr><td>Amortissement contractuel (4 000 / 7)</td><td class="n">-571</td></tr>
<tr><td>Solde après amortissement</td><td class="n">3 429</td></tr>
<tr><td>Cash sweep : MIN(900 x 50 % ; 3 429)</td><td class="n">-450</td></tr>
<tr><td>Solde de clôture</td><td class="n">2 979</td></tr>
<tr><td>Solde moyen</td><td class="n">3 490</td></tr>
<tr><td>Intérêts à 5 %</td><td class="n">174</td></tr>
</table>
`,
key:["Un bloc de lignes identique par tranche, dupliquable","Le cash sweep se plafonne toujours par un MIN sur le solde restant","Le revolver est le régulateur qui fait boucler le modèle","Intérêts sur solde d'ouverture pour éviter la circularité dans un modèle diffusé"],
quiz:[
 {q:"Cash disponible 600, sweep 75 %, solde de dette après amortissement 380. Quel remboursement anticipé ?",o:["380","450","600","285"],a:0,e:"MIN(600 x 75 % ; 380) = MIN(450 ; 380) = 380. On ne rembourse jamais plus que le solde restant dû."},
 {q:"Quel est le rôle du revolver dans un modèle intégré ?",o:["Absorber les besoins de trésorerie et permettre le bouclage du bilan","Financer le capex de croissance","Rémunérer les actionnaires","Calculer le WACC"],a:0,e:"Le revolver est la variable d'ajustement : il se tire quand la trésorerie descend sous le plancher et se rembourse dès qu'il y a un excédent."},
 {q:"Pourquoi calculer les intérêts sur le solde d'ouverture dans un modèle destiné à circuler ?",o:["Pour éliminer la référence circulaire","Pour augmenter la précision","Parce que les banques l'exigent","Pour réduire la dette"],a:0,e:"Le calcul itératif fonctionne mais rend le classeur fragile chez un tiers, notamment si l'option est désactivée sur son poste. Le solde d'ouverture est un compromis robuste."}
],
src:["BIWS, LBO Modeling","Documentation de crédit, term sheets bancaires"]};

LESSONS["bouclage-tresorerie"] = {
why:"Le bouclage est le moment où le modèle devient un système. Mal fait, il produit des trésoreries négatives que personne ne voit.",
obj:["Poser une trésorerie minimale d'exploitation","Enchaîner revolver et placement de l'excédent","Vérifier que le bouclage est sain"],
html:`
<h2 id="cascade">La cascade de bouclage</h2>
<ol>
<li>Trésorerie d'ouverture</li>
<li>+ Flux d'exploitation</li>
<li>- Capex</li>
<li>- Service de la dette contractuel</li>
<li>= <strong>Trésorerie avant financement d'ajustement</strong></li>
<li>Si inférieure au plancher, tirage du revolver</li>
<li>Si supérieure au plancher, remboursement du revolver, puis cash sweep, puis excédent conservé</li>
<li>= Trésorerie de clôture, reportée au bilan</li>
</ol>
<div class="callout key"><div class="ct">Plancher de trésorerie</div>Le plancher n'est pas zéro. Une société a besoin de trésorerie pour fonctionner : généralement quinze à trente jours de charges décaissables, ou un pourcentage du chiffre d'affaires. Cette hypothèse est bleue et se discute.</div>

<h2 id="controles">Trois contrôles obligatoires</h2>
<table class="tbl">
<tr><th>Contrôle</th><th>Test</th><th>Si faux</th></tr>
<tr><td>Trésorerie jamais négative</td><td>MIN de la ligne trésorerie sur la période</td><td>Le plancher ou le revolver ne fonctionnent pas</td></tr>
<tr><td>Bilan équilibré</td><td>Actif - Passif = 0 sur chaque colonne</td><td>Une liaison manque</td></tr>
<tr><td>Trésorerie de clôture cohérente</td><td>Bilan = dernière ligne du tableau de flux</td><td>Un flux n'est pas reporté</td></tr>
</table>
<p>Ces trois contrôles se regroupent sur la feuille dédiée et alimentent un indicateur unique affiché sur chaque feuille, du type <code>=SI(NB.SI(controles;FAUX)=0;"OK";"ERREUR")</code>.</p>

<h2 id="erreurs">Erreurs typiques</h2>
<ul>
<li><strong>Double emploi</strong> : le remboursement de dette apparaît dans le flux de financement et à nouveau dans la cascade de bouclage.</li>
<li><strong>Sweep sans plancher</strong> : tout l'excédent rembourse la dette et la société tombe à zéro de trésorerie.</li>
<li><strong>Revolver sans limite</strong> : le modèle tire un revolver de 12 M€ sur une ligne autorisée à 1 M€, personne ne le voit.</li>
<li><strong>Intérêts sur le revolver oubliés</strong> : la ligne coûte pourtant plus cher que la dette senior.</li>
</ul>
`,
key:["Le plancher de trésorerie est une hypothèse, jamais zéro","Ordre strict : revolver, puis sweep, puis excédent conservé","Trois contrôles obligatoires regroupés sur une feuille","Plafonner le revolver au montant contractuel de la ligne"],
quiz:[
 {q:"Trésorerie avant financement de - 250, plancher de 150. Quel tirage de revolver ?",o:["400","250","150","0"],a:0,e:"Il faut combler le déficit de 250 et atteindre le plancher de 150, soit 400 de tirage."},
 {q:"Quel contrôle détecte un cash sweep mal plafonné ?",o:["Trésorerie minimale de la période inférieure au plancher","Bilan déséquilibré","Marge d'EBE anormale","Croissance négative"],a:0,e:"Un sweep trop agressif vide la trésorerie sous le plancher. Le contrôle sur le minimum de la ligne le révèle immédiatement."}
],
src:["BIWS, Debt Schedule and Circularity","Pratique de modélisation LBO"]};

LESSONS["bfr-previsionnel"] = {
why:"Projeter le BFR en pourcentage du chiffre d'affaires est la source d'erreur la plus répandue dans les modèles de small cap.",
obj:["Projeter le BFR par les jours de rotation","Rattacher chaque poste à son inducteur","Traiter la saisonnalité"],
html:`
<h2 id="methode">La bonne méthode</h2>
<p>Chaque poste du BFR se rattache à un inducteur différent. Les projeter tous en pourcentage du chiffre d'affaires revient à supposer que les achats évoluent exactement comme les ventes, ce qui est presque toujours faux.</p>
<table class="tbl">
<tr><th>Poste</th><th>Inducteur</th><th>Formule de projection</th></tr>
<tr><td>Clients</td><td>Chiffre d'affaires TTC</td><td class="mono">DSO / 365 x CA TTC</td></tr>
<tr><td>Stocks</td><td>Coût des ventes</td><td class="mono">DIO / 365 x coût des ventes</td></tr>
<tr><td>Fournisseurs</td><td>Achats TTC</td><td class="mono">DPO / 365 x achats TTC</td></tr>
<tr><td>Dettes sociales</td><td>Charges de personnel</td><td class="mono">Jours / 365 x charges de personnel</td></tr>
<tr><td>TVA</td><td>Chiffre d'affaires et achats</td><td class="mono">Solde du mois de décalage</td></tr>
</table>
<div class="callout"><div class="ct">Point de départ</div>On calcule les jours historiques réels sur trois exercices, on les affiche, puis on décide de la trajectoire projetée. Si l'on retient un DSO qui s'améliore de 72 à 60 jours, cette amélioration est une hypothèse à justifier, pas un automatisme.</div>

<h2 id="cas">Cas chiffré</h2>
<p>CA projeté 10 M€ HT, TVA à 20 %, coût des ventes 6 M€, achats HT 5,5 M€, DSO 60 jours, DIO 45 jours, DPO 55 jours.</p>
<ul>
<li>Clients = 60 / 365 x 12,0 M€ = <strong>1 973 k€</strong></li>
<li>Stocks = 45 / 365 x 6,0 M€ = <strong>740 k€</strong></li>
<li>Fournisseurs = 55 / 365 x 6,6 M€ = <strong>994 k€</strong></li>
<li>BFR = 1 973 + 740 - 994 = <strong>1 719 k€</strong>, soit 17,2 % du CA HT</li>
</ul>
<p>Si le CA passe à 12 M€ à jours constants, le BFR passe à 2 063 k€. La variation de 344 k€ est une <strong>sortie de trésorerie</strong> qui doit apparaître dans le tableau de flux et être financée.</p>

<h2 id="saisonnalite">Saisonnalité</h2>
<p>Un modèle annuel donne le BFR au 31 décembre, souvent le point bas de l'année. Pour une activité saisonnière, le pic de BFR peut dépasser de 40 % le niveau de clôture. Deux réponses : passer en modèle trimestriel sur la première année, ou ajouter une ligne de BFR de pointe destinée au dimensionnement du besoin de financement court terme.</p>
`,
key:["Un inducteur par poste, jamais un pourcentage du CA global","Clients en TTC, stocks sur coût des ventes","Toute amélioration de jours projetée est une hypothèse à défendre","Le BFR de clôture n'est pas le BFR de pointe"],
quiz:[
 {q:"Pourquoi projeter les fournisseurs sur les achats plutôt que sur le chiffre d'affaires ?",o:["Parce que le DPO mesure un délai de paiement sur des achats, pas sur des ventes","Parce que c'est plus simple","Parce que la TVA l'impose","Il n'y a pas de différence"],a:0,e:"Si la marge évolue, achats et ventes ne progressent pas au même rythme. Rattacher chaque poste à son inducteur évite une erreur qui s'accumule sur cinq ans."},
 {q:"CA passe de 10 à 13 M€ HT, BFR à 17 % du CA HT. Quel impact trésorerie ?",o:["Sortie de 510 k€","Entrée de 510 k€","Aucun impact","Sortie de 2 210 k€"],a:0,e:"Le BFR passe de 1 700 à 2 210 k€. La variation de 510 k€ est une immobilisation de trésorerie : la croissance se finance."},
 {q:"Une activité saisonnière avec pic en juin. Que révèle le BFR au 31 décembre ?",o:["Un niveau plancher qui sous-estime le besoin de financement réel","Le besoin maximum","La moyenne annuelle","Rien d'exploitable"],a:0,e:"La clôture capture un instant. Pour dimensionner une ligne de financement court terme, il faut le point haut, obtenu par un modèle trimestriel ou mensuel."}
],
src:["Pratique de modélisation BFR","Banque de France, délais de paiement sectoriels"]};

LESSONS["pont-ve-vfp"] = {
why:"Le cédant entend un chiffre, il en encaisse un autre. Le pont est la conversation la plus importante de toute la transaction.",
obj:["Passer de la valeur d'entreprise au prix des titres","Lister les ajustements dans l'ordre","Présenter le pont à un cédant sans jargon"],
html:`
<h2 id="formule">Le pont</h2>
<div class="formula"><span class="fl">Du multiple au chèque</span>EBE retraité x Multiple
= Valeur d'entreprise (VE)
- Dette financière brute
+ Trésorerie disponible
- Dettes assimilées (comptes courants, IFC, crédit-bail, passifs identifiés)
+ Actifs hors exploitation cessibles
+/- Ajustement de BFR par rapport au normatif
= Valeur des titres (prix payé au cédant)
- Séquestre - Complément de prix différé
= <strong>Cash reçu au closing</strong></div>

<h2 id="cas">Cas chiffré complet</h2>
<table class="tbl">
<tr><th>Étape</th><th class="n">k€</th><th>Commentaire</th></tr>
<tr><td>EBE retraité</td><td class="n">794</td><td>Après six retraitements documentés</td></tr>
<tr><td>Multiple retenu</td><td class="n">x 6,0</td><td>Comparables transactionnels du secteur</td></tr>
<tr><td><strong>Valeur d'entreprise</strong></td><td class="n"><strong>4 764</strong></td><td></td></tr>
<tr><td>Dette bancaire</td><td class="n">-1 400</td><td></td></tr>
<tr><td>Compte courant d'associé</td><td class="n">-300</td><td></td></tr>
<tr><td>Crédit-bail, capital restant dû</td><td class="n">-220</td><td></td></tr>
<tr><td>Indemnités de fin de carrière</td><td class="n">-180</td><td>Non provisionnées</td></tr>
<tr><td>Trésorerie disponible</td><td class="n">+650</td><td>Hors dépôts bloqués</td></tr>
<tr><td>Écart au BFR normatif</td><td class="n">-90</td><td>BFR au closing inférieur au normatif</td></tr>
<tr><td><strong>Valeur des titres</strong></td><td class="n"><strong>3 224</strong></td><td></td></tr>
<tr><td>Séquestre 10 % sur 18 mois</td><td class="n">-322</td><td>Garantie d'actif et de passif</td></tr>
<tr><td>Complément de prix conditionnel</td><td class="n">-400</td><td>Payable en N+2 si objectif atteint</td></tr>
<tr><td><strong>Cash au closing</strong></td><td class="n"><strong>2 502</strong></td><td></td></tr>
</table>
<div class="callout warn"><div class="ct">Le choc du cédant</div>Le cédant a entendu « six fois l'EBE », soit 4 764 k€. Il encaissera 2 502 k€ à la signature, soit 53 %. Cette conversation se prépare et se tient tôt, idéalement dès la valorisation initiale. Un cédant surpris en fin de process fait échouer la transaction.</div>

<h2 id="presentation">Présenter le pont</h2>
<ul>
<li>Un graphique en cascade, une barre par ajustement, chaque barre annotée en euros.</li>
<li>Chaque poste renvoie à une pièce : contrat de prêt, tableau d'amortissement du crédit-bail, calcul actuariel des IFC.</li>
<li>On donne un ordre de grandeur du différé et de sa probabilité de récupération, pas seulement son montant nominal.</li>
<li>On ne présente jamais une valeur d'entreprise sans le pont qui la suit, même à un stade précoce.</li>
</ul>
`,
key:["VE moins dette nette au sens large égale valeur des titres","Séquestre et complément de prix décalent le cash, ils ne le réduisent pas toujours","Le pont se présente en cascade, avec une pièce par ligne","La conversation sur le pont se tient tôt, jamais au closing"],
quiz:[
 {q:"VE de 8 M€, dette bancaire 2 M€, trésorerie 0,5 M€, comptes courants 0,4 M€. Valeur des titres ?",o:["6,1 M€","6,5 M€","5,1 M€","8 M€"],a:0,e:"8 - 2 + 0,5 - 0,4 = 6,1 M€. Le compte courant est une dette qui se déduit."},
 {q:"Un séquestre de 12 % sur 24 mois réduit-il le prix ?",o:["Non, il en décale le paiement, sous réserve d'appel en garantie","Oui, définitivement","Il augmente le prix","Il ne change rien au cash au closing"],a:0,e:"Le séquestre reste dû au cédant s'il n'y a pas d'appel en garantie. Il affecte la trésorerie immédiate et le risque, pas le prix nominal."},
 {q:"Quand présenter le pont au cédant ?",o:["Dès la valorisation initiale","Au closing","Après la due diligence","Jamais, c'est technique"],a:0,e:"Un cédant qui découvre l'écart entre la valeur d'entreprise et son chèque en fin de process se sent trompé. La transparence précoce protège la transaction."}
],
src:["Pratique des protocoles de cession","France Invest, mécanismes de prix"]};

LESSONS["multiples-ebitda"] = {
why:"Le multiple d'EBE est le langage commun de la small cap. Le mal comprendre, c'est se tromper de conversation.",
obj:["Savoir ce que capture réellement un multiple","Comparer deux multiples sur une base homogène","Identifier les facteurs qui font bouger le multiple"],
html:`
<h2 id="quoi">Ce que le multiple contient</h2>
<p>Un multiple n'est pas une convention arbitraire. C'est la forme réduite d'un DCF. En régime permanent :</p>
<div class="formula"><span class="fl">Équivalence multiple et DCF</span>VE / EBE ≈ (1 - t) x (1 - taux de réinvestissement) / (WACC - g)</div>
<p>Autrement dit, un multiple élevé traduit trois choses et trois seulement : une croissance attendue élevée, un risque faible, ou une intensité de réinvestissement faible. Toute discussion de multiple se ramène à ces trois variables.</p>

<h2 id="homogene">Comparer sur une base homogène</h2>
<table class="tbl">
<tr><th>Point de vigilance</th><th>Question à poser</th></tr>
<tr><td>Base de l'agrégat</td><td>EBE au sens PCG, EBITDA, ou EBITDA retraité ?</td></tr>
<tr><td>Période</td><td>Dernier exercice clos, douze mois glissants, ou prévisionnel ?</td></tr>
<tr><td>Retraitements</td><td>Le comparable est-il retraité de la rémunération dirigeant ?</td></tr>
<tr><td>Périmètre</td><td>L'immobilier est-il dans la cible ou logé dans une SCI ?</td></tr>
<tr><td>Normes</td><td>IFRS 16 gonfle l'EBITDA en sortant les loyers, écart de 10 à 20 % sur un commerce</td></tr>
</table>
<div class="callout warn"><div class="ct">Le piège IFRS 16</div>Comparer un multiple d'EBITDA IFRS d'une société cotée à un EBE PCG d'une PME est une erreur fréquente. La cotée affiche un EBITDA plus élevé parce que les loyers sont retraités en amortissement et intérêts. Le multiple apparent est donc plus bas, à valeur identique.</div>

<h2 id="facteurs">Facteurs de prime et de décote</h2>
<table class="tbl">
<tr><th>Facteur</th><th>Sens</th><th>Ordre de grandeur</th></tr>
<tr><td>Récurrence contractuelle du chiffre d'affaires</td><td>Prime</td><td>+ 1 à + 3 tours</td></tr>
<tr><td>Croissance supérieure au secteur</td><td>Prime</td><td>+ 0,5 à + 2 tours</td></tr>
<tr><td>Dépendance forte au dirigeant</td><td>Décote</td><td>- 1 à - 2 tours</td></tr>
<tr><td>Concentration client au-delà de 30 %</td><td>Décote</td><td>- 0,5 à - 1,5 tour</td></tr>
<tr><td>Taille inférieure à 1 M€ d'EBE</td><td>Décote</td><td>- 1 à - 2 tours</td></tr>
<tr><td>Processus compétitif avec plusieurs offres</td><td>Prime</td><td>+ 0,5 à + 1,5 tour</td></tr>
</table>
<p>Ces ordres de grandeur sont des repères de marché, pas des règles. Ils servent à structurer une discussion, jamais à remplacer une analyse.</p>
`,

LESSONS["trading-comps"] = {
why:"Les comparables boursiers donnent une référence de marché instantanée, à condition de savoir ce qu'on compare et ce qu'on doit décoter.",
obj:["Construire un échantillon de cotées pertinent","Calculer une capitalisation et une valeur d'entreprise correctes","Appliquer les décotes de passage au non coté"],
html:`
<h2 id="etapes">Méthode</h2>
<ol>
<li><strong>Définir les critères</strong> : secteur, taille, géographie, modèle économique, profil de croissance et de marge. Cinq à dix sociétés suffisent, au-delà l'échantillon perd sa cohérence.</li>
<li><strong>Calculer la valeur d'entreprise</strong> de chaque comparable, sur la base du dernier cours et des comptes les plus récents.</li>
<li><strong>Normaliser les agrégats</strong> : même base, même période, retraitement des éléments exceptionnels.</li>
<li><strong>Calculer les multiples</strong> : VE / CA, VE / EBITDA, VE / EBIT, PER.</li>
<li><strong>Statistiques</strong> : minimum, premier quartile, médiane, troisième quartile, maximum. On retient la médiane, jamais la moyenne, trop sensible aux extrêmes.</li>
<li><strong>Appliquer les décotes</strong> de taille et d'illiquidité pour passer au non coté.</li>
</ol>
<div class="formula"><span class="fl">Valeur d'entreprise d'une cotée</span>Capitalisation boursière (cours x nombre d'actions diluées)
+ Dette financière + Intérêts minoritaires + Préférentielles
- Trésorerie et équivalents
= Valeur d'entreprise</div>

<h2 id="cas">Cas chiffré</h2>
<table class="tbl">
<tr><th>Comparable</th><th class="n">VE (M€)</th><th class="n">EBITDA</th><th class="n">VE / EBITDA</th></tr>
<tr><td>Société A</td><td class="n">480</td><td class="n">62</td><td class="n">7,7x</td></tr>
<tr><td>Société B</td><td class="n">310</td><td class="n">48</td><td class="n">6,5x</td></tr>
<tr><td>Société C</td><td class="n">1 240</td><td class="n">131</td><td class="n">9,5x</td></tr>
<tr><td>Société D</td><td class="n">205</td><td class="n">36</td><td class="n">5,7x</td></tr>
<tr><td>Société E</td><td class="n">690</td><td class="n">84</td><td class="n">8,2x</td></tr>
<tr><td><strong>Médiane</strong></td><td class="n"></td><td class="n"></td><td class="n"><strong>7,7x</strong></td></tr>
</table>
<p>La cible réalise 1,1 M€ d'EBE retraité, soit une taille très inférieure. On applique une décote de taille de 30 % et une décote d'illiquidité de 15 %, en séquence : 7,7 x 0,70 x 0,85 = <strong>4,6x</strong>. Valeur d'entreprise indicative : 1,1 x 4,6 = <strong>5,0 M€</strong>.</p>
<div class="callout warn"><div class="ct">Ordre de grandeur des décotes</div>Les décotes de taille et d'illiquidité citées ici sont des ordres de grandeur usuels en small cap française. Elles se justifient au cas par cas et se documentent. Une décote appliquée sans justification est le premier point qu'un contradicteur attaquera.</div>

<h2 id="limites">Limites</h2>
<ul>
<li>Le cours reflète une minorité échangée, pas le contrôle. Il manque donc une prime de contrôle dans l'autre sens.</li>
<li>Les cotées disponibles sont souvent dix à cent fois plus grandes que la cible, avec un profil de risque incomparable.</li>
<li>Le marché boursier connaît des phases d'excès qui contaminent l'échantillon.</li>
</ul>
`,
key:["Cinq à dix comparables suffisent, choisis sur le modèle économique","On retient la médiane, jamais la moyenne","Les décotes s'appliquent en séquence multiplicative, et se documentent","Un cours de bourse est un prix de minoritaire, pas un prix de contrôle"],
quiz:[
 {q:"Multiple médian 8,0x, décote de taille 25 %, décote d'illiquidité 20 %. Multiple retenu ?",o:["4,8x","5,6x","6,4x","4,4x"],a:0,e:"8,0 x 0,75 x 0,80 = 4,8x. Les décotes se cumulent multiplicativement, pas additivement."},
 {q:"Pourquoi préférer la médiane à la moyenne ?",o:["Elle résiste aux valeurs extrêmes de l'échantillon","Elle est plus élevée","Elle est plus rapide à calculer","Les régulateurs l'imposent"],a:0,e:"Un seul comparable à 25x déforme la moyenne d'un échantillon de cinq. La médiane décrit mieux le centre de l'échantillon."},
 {q:"Un cours de bourse reflète :",o:["La valeur d'une participation minoritaire liquide","La valeur de contrôle","La valeur liquidative","La valeur comptable"],a:0,e:"Le marché échange des blocs minoritaires. Une prise de contrôle se paie avec une prime, généralement de 20 à 40 %."}
],
src:["Damodaran, Relative Valuation","Bases Capital IQ et Infinancials","Études sur les décotes de taille"]};

LESSONS["transaction-comps"] = {
why:"En small cap non cotée, les comparables transactionnels sont la référence la plus proche du prix réellement payé.",
obj:["Trouver des transactions comparables en France","Corriger l'information disponible, souvent partielle","Pondérer selon la qualité de la source"],
html:`
<h2 id="sources">Où chercher</h2>
<table class="tbl">
<tr><th>Source</th><th>Contenu</th><th>Fiabilité</th></tr>
<tr><td>Communiqués et presse spécialisée</td><td>Opération annoncée, parfois le prix</td><td>Moyenne, prix souvent absent</td></tr>
<tr><td>Bases de données transactionnelles</td><td>Multiples estimés, secteur, taille</td><td>Bonne, mais couverture partielle sous 10 M€</td></tr>
<tr><td>Argos Index mid-market</td><td>Multiple médian trimestriel du mid-market européen</td><td>Bonne pour la tendance, pas pour un cas</td></tr>
<tr><td>Comptes déposés post-opération</td><td>Goodwill reconnu, prix d'acquisition en annexe</td><td>Élevée quand disponible</td></tr>
<tr><td>Connaissance directe du marché</td><td>Opérations traitées ou approchées par le cabinet</td><td>La meilleure, à anonymiser</td></tr>
</table>
<div class="callout key"><div class="ct">Reconstruction par le bas</div>Quand le prix n'est pas publié, on le reconstruit : goodwill inscrit au bilan de l'acquéreur en annexe des comptes consolidés, plus la valeur comptable des actifs nets acquis. La reconstruction est imparfaite mais traçable, ce qui vaut mieux qu'un chiffre de presse invérifiable.</div>

<h2 id="grille">Grille de comparaison</h2>
<p>Chaque transaction retenue se documente sur une ligne unique : date, cible, acquéreur, secteur, chiffre d'affaires, EBE, valeur d'entreprise, multiple, source, degré de confiance. Une transaction sans source nommée ne figure pas dans le tableau.</p>

<h2 id="lecture">Lecture</h2>
<ul>
<li>Un multiple de transaction inclut la <strong>prime de contrôle</strong>, contrairement à un multiple boursier.</li>
<li>Il inclut aussi les <strong>synergies</strong> que l'acquéreur a accepté de partager, ce qui explique qu'un acquéreur industriel paie plus qu'un financier.</li>
<li>Une transaction de plus de trois ans a peu de valeur dans un marché où les taux ont bougé.</li>
<li>L'identité de l'acquéreur change tout : consolidateur sectoriel, fonds, repreneur individuel n'ont ni les mêmes moyens ni les mêmes objectifs.</li>
</ul>

<h2 id="cas">Cas chiffré</h2>
<table class="tbl">
<tr><th>Date</th><th>Cible</th><th>Acquéreur</th><th class="n">EBE</th><th class="n">Multiple</th><th>Confiance</th></tr>
<tr><td>2025 T4</td><td>Cabinet A</td><td>Consolidateur</td><td class="n">1,4</td><td class="n">7,2x</td><td>Élevée</td></tr>
<tr><td>2025 T2</td><td>Cabinet B</td><td>Fonds</td><td class="n">2,1</td><td class="n">6,8x</td><td>Moyenne</td></tr>
<tr><td>2024 T4</td><td>Cabinet C</td><td>Individuel</td><td class="n">0,6</td><td class="n">4,5x</td><td>Élevée</td></tr>
<tr><td>2024 T3</td><td>Cabinet D</td><td>Consolidateur</td><td class="n">1,1</td><td class="n">6,1x</td><td>Faible</td></tr>
</table>
<p>Lecture : le type d'acquéreur explique davantage l'écart que la taille. Un cédant qui vise 7x doit accepter de vendre à un consolidateur, avec ce que cela implique en termes d'intégration et de sort des équipes. C'est une décision de projet autant que de prix.</p>
`,
key:["Le multiple de transaction inclut prime de contrôle et partage de synergies","Sans prix publié, on reconstruit par le goodwill des comptes de l'acquéreur","Une transaction sans source nommée ne figure pas dans le tableau","Le type d'acquéreur explique souvent plus l'écart que la taille"],
quiz:[
 {q:"Pourquoi un multiple de transaction est-il en général supérieur à un multiple boursier du même secteur ?",o:["Il intègre la prime de contrôle et une part des synergies","Les transactions sont plus récentes","Les sociétés cédées sont plus grandes","Les bases de données sont fausses"],a:0,e:"Acheter le contrôle et capter des synergies justifie de payer plus cher que le cours d'une participation minoritaire."},
 {q:"Le prix d'une opération n'est pas publié. Quelle reconstruction est la plus fiable ?",o:["Goodwill en annexe des comptes consolidés de l'acquéreur, plus actif net acquis","Une estimation de la presse","Le multiple moyen du secteur","Le chiffre d'affaires multiplié par un"],a:0,e:"L'annexe des comptes consolidés est une source nommée et opposable. La reconstruction est traçable, même si elle reste approchée."}
],
src:["Argos Index mid-market","Comptes consolidés déposés, annexes de regroupement","Base de transactions du cabinet"]};

LESSONS["wacc"] = {
why:"Un point de WACC déplace souvent plus de 10 % de la valeur. C'est l'hypothèse la plus attaquée d'un DCF.",
obj:["Calculer un coût des fonds propres par le MEDAF","Pondérer par une structure cible et non comptable","Défendre chaque composante"],
html:`
<h2 id="formule">Formule</h2>
<div class="formula"><span class="fl">Coût moyen pondéré du capital</span>WACC = Kcp x CP / (CP + D) + Kd x (1 - t) x D / (CP + D)

Kcp = Rf + bêta x prime de risque de marché + primes spécifiques
Kd = taux d'intérêt effectif de la dette
t   = taux d'impôt sur les sociétés</div>

<h2 id="composantes">Composante par composante</h2>
<table class="tbl">
<tr><th>Paramètre</th><th>Source usuelle</th><th>Point de débat</th></tr>
<tr><td>Taux sans risque</td><td>OAT 10 ans, moyenne sur trois à six mois</td><td>Spot ou moyenne longue selon la volatilité</td></tr>
<tr><td>Prime de risque de marché</td><td>Études académiques et praticiens, ordre de 5 à 7 % en zone euro</td><td>Source retenue et date</td></tr>
<tr><td>Bêta</td><td>Bêta désendetté sectoriel, réendetté à la structure cible</td><td>Échantillon de référence</td></tr>
<tr><td>Prime de taille</td><td>Études sur small caps, souvent 2 à 5 % en très petite taille</td><td>Toujours contestée, à documenter</td></tr>
<tr><td>Prime spécifique</td><td>Dépendance dirigeant, concentration client, cyclicité</td><td>La plus subjective, la mieux à justifier</td></tr>
<tr><td>Structure de capital</td><td>Cible sectorielle, pas la structure comptable actuelle</td><td>Cible d'un acquéreur type</td></tr>
</table>

<h2 id="cas">Cas chiffré</h2>
<p>OAT 10 ans 3,0 %, prime de marché 6,0 %, bêta réendetté 1,15, prime de taille 3,0 %, prime spécifique 1,5 %, coût de la dette 4,5 %, IS 25 %, structure cible 70 % fonds propres et 30 % dette.</p>
<ul>
<li>Kcp = 3,0 + 1,15 x 6,0 + 3,0 + 1,5 = <strong>14,4 %</strong></li>
<li>Kd après impôt = 4,5 x (1 - 0,25) = <strong>3,4 %</strong></li>
<li>WACC = 14,4 x 0,70 + 3,4 x 0,30 = <strong>11,1 %</strong></li>
</ul>
<div class="callout warn"><div class="ct">Cohérence obligatoire</div>Un WACC se combine avec des flux disponibles pour la firme (FCFF), avant charges financières. Actualiser des flux nets d'intérêts par un WACC compte deux fois l'effet de la dette et surévalue la société. L'erreur est fréquente et grossière.</div>

<h2 id="defendre">Défendre son WACC</h2>
<p>Un WACC se présente comme un tableau à une colonne par paramètre, avec la source et la date de chaque valeur. Face à un contradicteur, on ne discute jamais le résultat, on discute paramètre par paramètre. La prime spécifique est le point faible : elle se justifie par des faits observables, par exemple 60 % du chiffre d'affaires sur trois clients, et non par une impression.</p>
`,
key:["WACC = Kcp pondéré fonds propres + Kd après impôt pondéré dette","Structure cible, jamais la structure comptable du moment","FCFF avec WACC, FCFE avec coût des fonds propres, jamais de mélange","Chaque paramètre a une source nommée et datée"],
quiz:[
 {q:"Kcp 12 %, Kd 5 %, IS 25 %, structure 60 % fonds propres et 40 % dette. WACC ?",o:["8,7 %","9,2 %","10,2 %","7,2 %"],a:0,e:"12 x 0,6 + 5 x 0,75 x 0,4 = 7,2 + 1,5 = 8,7 %."},
 {q:"Vous actualisez des flux nets de charges financières par le WACC. Conséquence ?",o:["Double comptage de l'effet dette, valeur surestimée","Aucune, c'est équivalent","Valeur sous-estimée","Le bilan ne boucle plus"],a:0,e:"Le WACC intègre déjà le coût de la dette. Retirer les intérêts des flux revient à en tenir compte deux fois."},
 {q:"Quelle structure de capital retenir dans le WACC ?",o:["Une structure cible de long terme, cohérente avec le secteur","La structure comptable au dernier bilan","Zéro dette systématiquement","Celle de l'acquéreur pressenti"],a:0,e:"Le WACC sert à actualiser des flux perpétuels. Il doit refléter un financement soutenable dans la durée, pas une situation ponctuelle."}
],
src:["Damodaran, Cost of Capital","Agence France Trésor, OAT","Fairness opinions publiées"]};

LESSONS["dcf"] = {
why:"Le DCF est la seule méthode qui oblige à formuler explicitement ce que l'on croit de l'avenir de l'entreprise.",
obj:["Construire un DCF de bout en bout","Articuler horizon explicite et valeur terminale","Interpréter le résultat sans naïveté"],
html:`
<h2 id="etapes">Les six étapes</h2>
<ol>
<li>Projeter les flux disponibles pour la firme sur cinq à sept ans</li>
<li>Calculer le WACC</li>
<li>Actualiser les flux de l'horizon explicite</li>
<li>Calculer la valeur terminale et l'actualiser</li>
<li>Sommer pour obtenir la valeur d'entreprise</li>
<li>Passer à la valeur des titres par le pont</li>
</ol>
<div class="formula"><span class="fl">Flux disponible pour la firme</span>EBIT x (1 - t)
+ Dotations aux amortissements
- Capex
- Variation du BFR
= FCFF</div>

<h2 id="cas">Cas chiffré complet</h2>
<p>WACC 11,1 %, croissance perpétuelle 1,5 %, flux en k€.</p>
<table class="tbl">
<tr><th>Année</th><th class="n">1</th><th class="n">2</th><th class="n">3</th><th class="n">4</th><th class="n">5</th></tr>
<tr><td>EBIT</td><td class="n">820</td><td class="n">890</td><td class="n">960</td><td class="n">1 020</td><td class="n">1 070</td></tr>
<tr><td>EBIT après impôt (25 %)</td><td class="n">615</td><td class="n">668</td><td class="n">720</td><td class="n">765</td><td class="n">803</td></tr>
<tr><td>+ Dotations</td><td class="n">210</td><td class="n">220</td><td class="n">230</td><td class="n">240</td><td class="n">245</td></tr>
<tr><td>- Capex</td><td class="n">-230</td><td class="n">-240</td><td class="n">-245</td><td class="n">-250</td><td class="n">-250</td></tr>
<tr><td>- Variation de BFR</td><td class="n">-60</td><td class="n">-55</td><td class="n">-50</td><td class="n">-45</td><td class="n">-40</td></tr>
<tr><td><strong>FCFF</strong></td><td class="n"><strong>535</strong></td><td class="n"><strong>593</strong></td><td class="n"><strong>655</strong></td><td class="n"><strong>710</strong></td><td class="n"><strong>758</strong></td></tr>
<tr><td>Facteur d'actualisation</td><td class="n">0,900</td><td class="n">0,810</td><td class="n">0,729</td><td class="n">0,656</td><td class="n">0,591</td></tr>
<tr><td><strong>FCFF actualisé</strong></td><td class="n"><strong>482</strong></td><td class="n"><strong>480</strong></td><td class="n"><strong>478</strong></td><td class="n"><strong>466</strong></td><td class="n"><strong>448</strong></td></tr>
</table>
<p>Somme des flux actualisés : <strong>2 354 k€</strong>.</p>
<div class="formula"><span class="fl">Valeur terminale, Gordon Shapiro</span>VT = FCFF année 5 x (1 + g) / (WACC - g)
   = 758 x 1,015 / (0,111 - 0,015) = 8 014 k€
VT actualisée = 8 014 x 0,591 = 4 736 k€</div>
<p>Valeur d'entreprise = 2 354 + 4 736 = <strong>7 090 k€</strong>. La valeur terminale pèse <strong>67 %</strong> du total.</p>

<h2 id="lecture">Lire le résultat</h2>
<div class="callout warn"><div class="ct">Le poids de la valeur terminale</div>Quand la valeur terminale dépasse 70 % du total, le DCF cesse d'être une projection pour devenir une hypothèse de perpétuité déguisée. Deux réponses : allonger l'horizon explicite jusqu'à ce que la société atteigne son régime permanent, ou croiser la valeur terminale avec un multiple de sortie.</div>
<ul>
<li>Toujours produire la <strong>matrice de sensibilité</strong> WACC contre croissance perpétuelle.</li>
<li>Vérifier que le <strong>multiple implicite</strong> de valeur terminale reste plausible. Ici 8 014 / EBE année 5 : si l'EBE vaut 1 315 k€, le multiple implicite est de 6,1x, ce qui est cohérent avec le marché.</li>
<li>Vérifier que la <strong>croissance perpétuelle</strong> ne dépasse pas la croissance de long terme de l'économie, soit 1,5 à 2 % en zone euro.</li>
<li>Vérifier que <strong>capex et dotations convergent</strong> en fin d'horizon : en régime permanent, on renouvelle ce que l'on amortit.</li>
</ul>
`,
key:["FCFF = EBIT après impôt + dotations - capex - variation de BFR","La valeur terminale pèse souvent 60 à 75 % de la valeur","Croissance perpétuelle plafonnée à la croissance de l'économie","Toujours contrôler le multiple implicite de la valeur terminale"],
quiz:[
 {q:"FCFF année 5 de 758, g de 1,5 %, WACC de 11,1 %. Valeur terminale non actualisée ?",o:["8 014","7 896","5 013","9 620"],a:0,e:"758 x 1,015 / (0,111 - 0,015) = 769,4 / 0,096 = 8 014."},
 {q:"La valeur terminale représente 82 % de la valeur d'entreprise. Que faire ?",o:["Allonger l'horizon explicite ou croiser avec un multiple de sortie","Accepter, c'est normal","Baisser le WACC","Supprimer la valeur terminale"],a:0,e:"Un poids aussi élevé signifie que la période projetée n'a pas atteint le régime permanent. Le DCF repose alors presque entièrement sur une hypothèse de perpétuité."},

 {q:"Quelle croissance perpétuelle retenir pour une PME française mature ?",o:["1 à 2 %","5 %","0 % obligatoirement","Le taux de croissance des trois dernières années"],a:0,e:"Une société ne peut pas croître éternellement plus vite que l'économie dans laquelle elle opère, sous peine de devenir cette économie."}
],

LESSONS["valeur-terminale"] = {
why:"Deux tiers de la valeur d'un DCF viennent d'une formule tenant sur une ligne. Elle mérite plus d'attention que le reste du modèle.",
obj:["Appliquer Gordon Shapiro correctement","Utiliser un multiple de sortie en croisement","Contrôler la cohérence des deux approches"],
html:`
<h2 id="deux">Deux méthodes</h2>
<div class="formula"><span class="fl">Gordon Shapiro</span>VT = Flux normatif x (1 + g) / (WACC - g)</div>
<div class="formula"><span class="fl">Multiple de sortie</span>VT = Agrégat de l'année terminale x Multiple de sortie</div>
<p>La bonne pratique consiste à calculer les deux et à vérifier leur convergence. Un écart supérieur à 20 % signale une incohérence entre les hypothèses de flux et les hypothèses de marché.</p>

<h2 id="flux-normatif">Le flux normatif</h2>
<p>La dernière année projetée n'est presque jamais utilisable telle quelle. On la normalise :</p>
<ul>
<li>Capex ramené au niveau des dotations, la croissance s'étant stabilisée</li>
<li>Variation de BFR limitée à la croissance perpétuelle appliquée au BFR de fin de période</li>
<li>Marge ramenée à un niveau soutenable de long terme, ni pic ni creux de cycle</li>
<li>Taux d'impôt normatif, hors déficits reportables épuisés</li>
</ul>

<h2 id="controle">Contrôle croisé</h2>
<p>Une fois la valeur terminale calculée par Gordon Shapiro, on en déduit le multiple implicite et on le compare aux comparables.</p>
<div class="formula"><span class="fl">Multiple implicite</span>Multiple implicite = VT / EBE de l'année terminale</div>
<div class="callout key"><div class="ct">Test de plausibilité</div>Si le multiple implicite ressort à 12x sur un secteur qui se traite à 6x, le couple WACC et croissance perpétuelle est trop généreux. On ne corrige pas la valeur terminale directement, on corrige les hypothèses qui la produisent, sinon le modèle devient incohérent.</div>

<h2 id="sensibilite">Sensibilité extrême</h2>
<table class="tbl">
<tr><th>WACC \\ g</th><th class="n">1,0 %</th><th class="n">1,5 %</th><th class="n">2,0 %</th><th class="n">2,5 %</th></tr>
<tr><td>9 %</td><td class="n">9 578</td><td class="n">10 258</td><td class="n">11 044</td><td class="n">11 963</td></tr>
<tr><td>10 %</td><td class="n">8 511</td><td class="n">9 052</td><td class="n">9 664</td><td class="n">10 361</td></tr>
<tr><td>11 %</td><td class="n">7 660</td><td class="n">8 098</td><td class="n">8 588</td><td class="n">9 139</td></tr>
<tr><td>12 %</td><td class="n">6 964</td><td class="n">7 325</td><td class="n">7 724</td><td class="n">8 167</td></tr>
</table>
<p>Entre les deux coins extrêmes du tableau, la valeur terminale varie de 6 964 à 11 963, soit un facteur de 1,7. La fourchette n'est pas un artefact : elle traduit l'incertitude réelle et doit être présentée comme telle.</p>
`,
key:["Toujours calculer les deux méthodes et vérifier leur convergence","Normaliser le flux terminal : capex égal aux dotations","Le multiple implicite est le contrôle de plausibilité principal","On corrige les hypothèses, jamais la valeur terminale directement"],

LESSONS["prix-max-lbo"] = {
why:"Face à un fonds, connaître son prix maximum permet d'anticiper sa dernière offre au lieu de la subir.",
obj:["Renverser le raisonnement de valorisation","Calculer un prix d'entrée par un TRI cible","Identifier les leviers sur lesquels le sponsor peut céder"],
html:`
<h2 id="logique">Le raisonnement inversé</h2>
<p>Un industriel valorise ce que vaut la société. Un sponsor calcule ce qu'il peut payer pour atteindre son rendement. La différence de logique explique la différence de comportement en négociation.</p>
<div class="formula"><span class="fl">Chaîne de raisonnement du sponsor</span>1. Valeur de sortie = EBE de sortie x Multiple de sortie
2. Dette résiduelle à la sortie = dette d'entrée - remboursements cumulés
3. Valeur des fonds propres à la sortie = valeur de sortie - dette résiduelle
4. Apport maximum = valeur des fonds propres de sortie / (1 + TRI cible) ^ durée
5. Prix d'entrée maximum = apport maximum + dette levée à l'entrée</div>

<h2 id="cas">Cas chiffré</h2>
<p>EBE d'entrée 1 200 k€, croissance de 6 % par an sur cinq ans, multiple d'entrée 6,0x, multiple de sortie 6,0x, dette levée 3,5x EBE, remboursement cumulé de 2 800 k€ sur cinq ans, TRI cible 22 %.</p>
<ul>
<li>EBE de sortie = 1 200 x 1,06^5 = <strong>1 606 k€</strong></li>
<li>Valeur de sortie = 1 606 x 6,0 = <strong>9 636 k€</strong></li>
<li>Dette d'entrée = 1 200 x 3,5 = 4 200 k€, dette résiduelle = 4 200 - 2 800 = <strong>1 400 k€</strong></li>
<li>Fonds propres de sortie = 9 636 - 1 400 = <strong>8 236 k€</strong></li>
<li>Apport maximum = 8 236 / 1,22^5 = 8 236 / 2,703 = <strong>3 047 k€</strong></li>
<li>Prix d'entrée maximum = 3 047 + 4 200 = <strong>7 247 k€</strong>, soit <strong>6,0x</strong> l'EBE d'entrée</li>
</ul>

<h2 id="leviers">Où le sponsor peut céder</h2>
<table class="tbl">
<tr><th>Levier</th><th>Effet sur le prix maximum</th><th>Probabilité de concession</th></tr>
<tr><td>Baisser le TRI cible de 22 à 20 %</td><td>+ 570 k€ environ</td><td>Faible, contrainte du fonds</td></tr>
<tr><td>Augmenter le levier de 3,5 à 4,0x</td><td>+ 600 k€</td><td>Moyenne, dépend des banques</td></tr>
<tr><td>Allonger la détention de 5 à 6 ans</td><td>Effet ambigu, dépend de la croissance</td><td>Faible</td></tr>
<tr><td>Croire à une croissance de 8 % au lieu de 6 %</td><td>+ 900 k€ environ</td><td>Élevée si le plan est crédible</td></tr>
<tr><td>Accepter un multiple de sortie supérieur</td><td>Fort effet</td><td>Faible, hypothèse prudente par principe</td></tr>
</table>
<div class="callout key"><div class="ct">Conséquence pour le conseil vendeur</div>Le levier le plus accessible est le plan d'affaires. Un business plan documenté et crédible qui fait passer la croissance de 6 à 8 % vaut davantage qu'une négociation frontale sur le prix. C'est pourquoi la préparation du plan est un travail de valorisation, pas un exercice de présentation.</div>
`,
key:["Le sponsor part du TRI cible et remonte vers le prix","Prix maximum = apport actualisé + dette levée à l'entrée","Le levier de négociation le plus accessible est la crédibilité du plan","Le TRI cible est rarement négociable, la structure de dette parfois"],
quiz:[
 {q:"Fonds propres de sortie de 10 M€, TRI cible 25 %, horizon 5 ans. Apport maximum ?",o:["3,28 M€","4,00 M€","2,50 M€","8,00 M€"],a:0,e:"10 / 1,25^5 = 10 / 3,052 = 3,28 M€. C'est le maximum que le sponsor peut injecter pour tenir son rendement."},
 {q:"Quel levier de négociation est le plus accessible face à un sponsor ?",o:["La crédibilité du plan d'affaires","Le TRI cible du fonds","Le multiple de sortie","La durée de détention"],a:0,e:"Le TRI cible est imposé par les investisseurs du fonds. En revanche, un plan documenté modifie les flux projetés, donc la valeur de sortie et le prix payable."},
 {q:"Pourquoi un sponsor retient-il souvent un multiple de sortie égal au multiple d'entrée ?",o:["Par prudence, pour ne pas faire reposer le rendement sur une expansion de multiple","Parce que la loi l'impose","Parce que les multiples ne varient jamais","Pour payer plus cher"],a:0,e:"Faire reposer le rendement sur une hausse de multiple revient à parier sur le marché plutôt que sur la performance. Les comités d'investissement l'acceptent mal."}
],
src:["BIWS, LBO Modeling","France Invest, performance du capital investissement"]};

LESSONS["ajustements-prix"] = {
why:"Entre la LOI et le closing, le prix bouge. Le mécanisme d'ajustement décide de qui supporte cette variation.",
obj:["Distinguer locked box et closing accounts","Calculer un ajustement","Choisir le mécanisme adapté au dossier"],
html:`
<h2 id="mecanismes">Deux mécanismes</h2>
<table class="tbl">
<tr><th></th><th>Closing accounts</th><th>Locked box</th></tr>
<tr><td>Date de référence</td><td>Date du closing</td><td>Date d'un bilan antérieur audité</td></tr>
<tr><td>Prix</td><td>Provisoire puis ajusté</td><td>Fixe dès la signature</td></tr>
<tr><td>Risque économique</td><td>Vendeur jusqu'au closing</td><td>Acquéreur depuis la date de référence</td></tr>
<tr><td>Protection de l'acquéreur</td><td>Ajustement dette nette et BFR</td><td>Clauses anti-fuite (leakage)</td></tr>
<tr><td>Compensation du vendeur</td><td>Aucune</td><td>Intérêts sur le prix entre la date de référence et le closing</td></tr>
<tr><td>Délai post-closing</td><td>60 à 120 jours de travaux comptables</td><td>Aucun</td></tr>
<tr><td>Risque de litige</td><td>Élevé</td><td>Faible</td></tr>
</table>
<div class="callout key"><div class="ct">Quand choisir quoi</div>La locked box convient quand les comptes de référence sont fiables et récents, et quand le délai jusqu'au closing est court. Les closing accounts s'imposent quand la cible est volatile, quand le closing est éloigné, ou quand les comptes de référence ne sont pas audités.</div>

<h2 id="cas">Cas chiffré, closing accounts</h2>
<p>Prix provisoire fondé sur une dette nette estimée de 1 200 k€ et un BFR normatif de 800 k€. Aux comptes de closing, la dette nette ressort à 1 350 k€ et le BFR à 720 k€.</p>
<table class="tbl">
<tr><th>Élément</th><th class="n">Estimé</th><th class="n">Réel</th><th class="n">Ajustement</th></tr>
<tr><td>Dette nette</td><td class="n">1 200</td><td class="n">1 350</td><td class="n">-150</td></tr>
<tr><td>BFR</td><td class="n">800</td><td class="n">720</td><td class="n">-80</td></tr>
<tr><td><strong>Total</strong></td><td class="n"></td><td class="n"></td><td class="n"><strong>-230</strong></td></tr>
</table>
<p>Le prix est réduit de 230 k€. Chaque euro de dette nette supplémentaire réduit le prix d'un euro. Chaque euro de BFR manquant par rapport au normatif fait de même, car l'acquéreur devra le financer.</p>

<h2 id="leakage">Fuites en locked box</h2>
<p>Entre la date de référence et le closing, le vendeur ne doit prélever aucune valeur. Sont interdits sauf accord exprès :</p>
<ul>
<li>Dividendes et acomptes sur dividendes</li>
<li>Remboursement de comptes courants</li>
<li>Primes exceptionnelles au cédant ou à ses proches</li>
<li>Cession d'actifs à des parties liées à des conditions préférentielles</li>
<li>Prise en charge par la société de frais personnels ou de frais de la transaction</li>
</ul>
<p>Les <strong>fuites autorisées</strong> (permitted leakage) sont listées limitativement au contrat : rémunération courante, loyers de marché, distributions prévues. Toute fuite non autorisée est remboursée euro pour euro, souvent sans plafond ni franchise.</p>
`,
key:["Locked box fige le prix, closing accounts l'ajuste après coup","La dette nette réduit le prix euro pour euro","Un BFR inférieur au normatif réduit également le prix","En locked box, la liste des fuites autorisées se négocie ligne par ligne"],
quiz:[
 {q:"En locked box, qui supporte le risque économique entre la date de référence et le closing ?",o:["L'acquéreur","Le vendeur","Les banques","Il est partagé par moitié"],a:0,e:"Le prix étant figé à la date de référence, l'acquéreur bénéficie des profits et supporte les pertes de la période intercalaire, en échange d'intérêts versés au vendeur."},
 {q:"BFR normatif 900, BFR au closing 1 050, dette nette conforme. Effet sur le prix ?",o:["+ 150","- 150","Aucun","- 900"],a:0,e:"Le vendeur laisse plus de BFR que le niveau normal : il a financé un actif d'exploitation supplémentaire, le prix augmente d'autant."},
 {q:"Quel mécanisme privilégier pour une cible saisonnière avec closing dans six mois ?",o:["Closing accounts","Locked box","Aucun des deux","Le choix est indifférent"],a:0,e:"Six mois de volatilité saisonnière rendent un prix figé sur des comptes anciens très risqué pour l'une des parties. L'ajustement à la date réelle est plus juste."}
],
src:["Pratique des protocoles de cession","CMS, European M&A Study"]};

LESSONS["recurrence-revenus"] = {
why:"En small cap, la récurrence des revenus explique davantage l'écart de multiple entre deux sociétés que leur taille ou leur croissance.",
obj:["Classer les revenus par degré de récurrence","Mesurer la rétention et l'attrition","Traduire la récurrence en tours de multiple"],
html:`
<h2 id="echelle">L'échelle de récurrence</h2>
<table class="tbl">
<tr><th>Niveau</th><th>Nature</th><th>Exemple</th><th>Effet multiple</th></tr>
<tr><td>1</td><td>Ponctuel non répété</td><td>Projet unique, travaux</td><td>Référence basse</td></tr>
<tr><td>2</td><td>Répété sans engagement</td><td>Client fidèle sans contrat</td><td>Léger</td></tr>
<tr><td>3</td><td>Contractuel reconductible tacitement</td><td>Maintenance, mission comptable annuelle</td><td>Significatif</td></tr>
<tr><td>4</td><td>Contractuel pluriannuel ferme</td><td>Contrat cadre trois ans</td><td>Fort</td></tr>
<tr><td>5</td><td>Encours ou commissions récurrentes</td><td>Portefeuille d'assurance, encours sous gestion</td><td>Maximal</td></tr>
</table>

<h2 id="mesures">Les indicateurs</h2>
<div class="formula"><span class="fl">Taux de rétention en valeur</span>Chiffre d'affaires N réalisé avec les clients présents en N-1 / Chiffre d'affaires N-1

<span class="fl">Attrition en nombre</span>Clients perdus dans l'année / Clients au 1er janvier

<span class="fl">Rétention nette</span>Rétention en valeur + expansion sur base existante</div>
<p>Un taux de rétention nette supérieur à 100 % signifie que la base existante croît sans nouvelle acquisition client. C'est la signature d'un modèle très valorisé.</p>

<h2 id="cas">Cas chiffré</h2>
<p>Cabinet de courtage, commissions annuelles de 1 400 k€. Répartition : 1 050 k€ de commissions sur encours renouvelées tacitement, 220 k€ de commissions de courtage sur affaires nouvelles, 130 k€ de missions ponctuelles de conseil.</p>
<ul>
<li>Part récurrente de niveau 5 : 1 050 / 1 400 = <strong>75 %</strong></li>
<li>Attrition observée sur trois ans : 4 % par an</li>
<li>Durée de vie moyenne implicite d'un client : 1 / 0,04 = <strong>25 ans</strong></li>
</ul>
<p>Face à un cabinet comparable dont seulement 30 % du chiffre d'affaires est récurrent, l'écart de multiple observé sur le marché se situe couramment entre 1,5 et 3 tours d'EBE. Sur un EBE de 400 k€, cela représente 600 à 1 200 k€ de valeur.</p>
<div class="callout key"><div class="ct">Ce qu'il faut documenter</div>Un taux de récurrence affirmé ne vaut rien. Ce qui se défend, c'est un tableau client par client sur trois exercices, anonymisé, montrant la persistance du chiffre d'affaires. C'est un livrable qui se prépare avant le mémorandum d'information, pas pendant l'audit.</div>
`,

quiz:[
 {q:"Attrition annuelle de 5 %. Durée de vie moyenne implicite d'un client ?",o:["20 ans","5 ans","10 ans","50 ans"],a:0,e:"1 / 0,05 = 20 ans. Cette durée alimente directement les modèles de valeur de portefeuille."},
 {q:"Une rétention nette de 108 % signifie :",o:["La base existante croît seule, sans nouveaux clients","8 % des clients partent","Le chiffre d'affaires baisse","Un calcul erroné"],a:0,e:"L'expansion sur les clients existants compense largement l'attrition. C'est le profil le plus valorisé du marché."},
 {q:"Comment prouver un taux de récurrence à un acquéreur ?",o:["Un tableau anonymisé client par client sur trois exercices","Une déclaration du dirigeant","Le total du chiffre d'affaires","Les contrats types"],a:0,e:"Seule la persistance observée, ligne à ligne, résiste à un audit. L'affirmation sans preuve sera écartée et le multiple avec."}

LESSONS["moat"] = {
why:"Ce qui protège une rentabilité anormale explique pourquoi elle durera. C'est le fondement de toute valeur terminale.",
obj:["Identifier les sources d'avantage durable","Tester leur solidité par les faits","Relier l'avantage au multiple retenu"],
html:`
<h2 id="sources">Les sources d'avantage</h2>
<table class="tbl">
<tr><th>Source</th><th>Test empirique</th><th>Fréquence en small cap</th></tr>
<tr><td>Coûts de changement</td><td>Attrition faible malgré une hausse de prix</td><td>Fréquente</td></tr>
<tr><td>Actif incorporel réglementaire</td><td>Agrément, licence, autorisation limitée</td><td>Fréquente</td></tr>
<tr><td>Avantage de coût</td><td>Marge structurellement supérieure au secteur</td><td>Rare</td></tr>
<tr><td>Effet de réseau</td><td>Valeur croissante avec le nombre d'utilisateurs</td><td>Très rare</td></tr>
<tr><td>Densité locale</td><td>Part de marché élevée sur une zone restreinte</td><td>Fréquente</td></tr>
<tr><td>Marque</td><td>Prime de prix mesurable et durable</td><td>Rare</td></tr>
</table>

<h2 id="test">Le test décisif</h2>
<p>Un avantage se prouve par la persistance de la rentabilité, pas par un discours. Trois tests simples :</p>
<ol>
<li><strong>Persistance de la marge</strong> : la marge d'EBE est-elle restée supérieure à la médiane du secteur sur cinq ans ?</li>
<li><strong>Pouvoir de prix</strong> : la société a-t-elle passé une hausse de tarifs sans perte de volume significative ?</li>
<li><strong>Entrées de concurrents</strong> : combien de nouveaux entrants sur cinq ans, et que sont-ils devenus ?</li>
</ol>
<div class="callout warn"><div class="ct">Le faux avantage le plus courant</div>« La relation client » n'est pas un avantage de l'entreprise si elle repose sur le dirigeant. C'est un actif personnel qui part avec lui. Le test : quelle part du chiffre d'affaires est apportée par des collaborateurs qui restent après la cession ?</div>

<h2 id="valeur">Traduction en valeur</h2>
<p>Un avantage durable justifie deux choses dans le modèle : une <strong>période de convergence plus longue</strong> avant que la marge ne rejoigne la moyenne sectorielle, et une <strong>prime spécifique plus faible</strong> dans le WACC. Les deux effets se cumulent et peuvent représenter 15 à 25 % de la valeur.</p>
`,
key:["Six sources d'avantage, trois tests empiriques","La persistance de la marge est la seule preuve solide","Une relation portée par le dirigeant n'est pas un avantage de l'entreprise","L'avantage se traduit par une convergence plus lente et une prime de risque plus faible"],
quiz:[
 {q:"Quel test prouve le mieux un avantage concurrentiel ?",o:["Marge supérieure à la médiane sectorielle maintenue sur cinq ans","Un discours convaincant du dirigeant","Un site internet de qualité","Une croissance forte sur un an"],a:0,e:"Un avantage réel se manifeste par une rentabilité anormale qui résiste à la concurrence dans la durée. Le reste est une intention."},
 {q:"Le chiffre d'affaires est apporté à 80 % par le dirigeant lui-même. Comment le traiter ?",o:["Comme un risque de dépendance, pas comme un avantage concurrentiel","Comme une marque forte","Comme un effet de réseau","Comme un coût de changement"],a:0,e:"Cet actif part avec le cédant. Il appelle une décote et une période d'accompagnement, pas une prime."}
],
src:["Mauboussin, Measuring the Moat","Porter, Competitive Advantage"]};

LESSONS["these-investissement"] = {
why:"Une thèse d'investissement claire est ce qui fait passer un dossier d'un comité. Sans elle, le meilleur modèle ne sert à rien.",
obj:["Structurer une thèse en cinq blocs","Chiffrer chaque affirmation","Anticiper les objections"],
html:`
<h2 id="structure">Les cinq blocs</h2>
<ol>
<li><strong>Ce que fait la société</strong> : en trois phrases, sans jargon, avec la répartition du chiffre d'affaires.</li>
<li><strong>Pourquoi elle gagne</strong> : la source d'avantage, prouvée par un indicateur.</li>
<li><strong>Ce qui se passe si rien ne change</strong> : la trajectoire naturelle, base du plan central.</li>
<li><strong>Les leviers de l'acquéreur</strong> : trois leviers maximum, chiffrés, avec un délai et un coût.</li>
<li><strong>Ce qui peut mal tourner</strong> : les trois risques principaux et leur mitigation.</li>
</ol>
<div class="callout key"><div class="ct">Test de la page unique</div>Si la thèse ne tient pas sur une page, elle n'est pas mûre. La contrainte de format force la hiérarchisation, qui est le vrai travail.</div>

<h2 id="chiffrer">Chiffrer les leviers</h2>
<table class="tbl">
<tr><th>Levier</th><th>Effet EBE</th><th>Délai</th><th>Coût</th><th>Confiance</th></tr>
<tr><td>Hausse tarifaire de 3 % sur la base récurrente</td><td class="n">+ 42 k€</td><td>12 mois</td><td class="n">0</td><td>Élevée</td></tr>
<tr><td>Internalisation d'une prestation sous-traitée</td><td class="n">+ 55 k€</td><td>18 mois</td><td class="n">80 k€</td><td>Moyenne</td></tr>
<tr><td>Rachat d'un concurrent local</td><td class="n">+ 120 k€</td><td>24 mois</td><td class="n">700 k€</td><td>Faible</td></tr>
</table>
<p>Le tableau se lit en effet net actualisé. Un levier sans délai ni coût n'est pas un levier, c'est un vœu. La colonne confiance sert au comité à pondérer.</p>

<h2 id="objections">Anticiper les objections</h2>
<p>Pour chaque risque, on écrit la question exacte que posera le contradicteur, et la réponse en une ligne appuyée sur une pièce.</p>
<ul>
<li>« Le dirigeant part, que reste-t-il ? » Réponse : part du chiffre d'affaires suivie par les collaborateurs qui restent, engagement d'accompagnement de X mois.</li>
<li>« Le premier client fait 28 % du chiffre d'affaires. » Réponse : ancienneté de la relation, contrat en cours, historique de renouvellement.</li>
<li>« La marge est supérieure au secteur, est-elle soutenable ? » Réponse : décomposition de l'écart, part expliquée par le mix et par les coûts.</li>
</ul>
`,
key:["Cinq blocs, une page, jamais plus","Trois leviers maximum, chiffrés avec délai et coût","Un levier sans coût ni délai est un vœu","Chaque risque a une question écrite et une réponse en une ligne"],
quiz:[
 {q:"Combien de leviers de création de valeur présenter dans une thèse ?",o:["Trois au maximum, chiffrés","Le plus possible","Un seul","Dix, pour montrer le potentiel"],a:0,e:"Au-delà de trois, aucun n'est crédible ni suivi. La discipline de la hiérarchisation est le signal de sérieux."},

function route(){
  const raw=(location.hash||"#/").slice(1);
  const parts=raw.split("?");
  const params=new URLSearchParams(parts[1]||"");
  const seg=parts[0].split("/").filter(Boolean);
  document.body.classList.remove("nav-open");
  stopTimer();
  if(mtcTimer){ clearInterval(mtcTimer); mtcTimer=null; }
  if(seg[0]!=="revision") rv.started=false;

  switch(seg[0]){
    case undefined:     viewDashboard(); break;
    case "parcours":    viewParcours(params); break;
    case "phase":       viewPhase(seg[1]); break;
    case "module":      viewModule(seg[1]); break;
    case "cartes":      viewCartes(params); break;
    case "revision":    viewRevision(); break;
    case "referentiel": viewReferentiel(params); break;
    case "ressources":  viewRessources(params); break;
    case "process":     viewProcess(params); break;
    case "verticale":   params.get("pick") ? viewVertPicker() : viewVerticale(params); break;
    case "stats":       viewStats(); break;
    case "reglages":    viewReglages(); break;
    case "admin":       viewAdmin(); break;
    case "equipe":      viewTeam(); break;
    default:            view404();
  }
  S.prefs.lastRoute=location.hash||"#/"; save();
  paintNav(); paintHeader();
}

/* ── Clics ────────────────────────────────────────────────── */
document.addEventListener("click", e=>{
  const t=e.target;
  const hit = s => t.closest(s);
  const val = s => { const el=t.closest(s); return el?el.getAttribute(s.replace(/[\[\]]/g,"")):null; };

  if(hit("[data-close]")){ closeModal(); closeCmd(); return; }

  /* ── Connexion serveur ── */
  const cm=hit("[data-cmode]"); if(cm){ cg.mode=cm.dataset.cmode; cg.err=""; cg.info=""; renderCloudGate(); return; }
  if(hit("[data-csignin]")){ doSignIn(); return; }
  if(hit("[data-csignup]")){ doSignUp(); return; }
  if(hit("[data-crecover]")){ doRecover(); return; }
  if(hit("[data-syncinfo]")){ syncModal(); return; }
  if(hit("[data-forcesync]")){ syncDirty=true; cloudFlush().then(()=>{ closeModal(); toast("Synchronisation effectuée.","ok"); }); return; }

  /* ── Écran d'entrée et profils ── */
  const gp=hit("[data-gpick]");
  if(gp){
    const id=gp.dataset.gpick, p=profileOf(id);
    gate.err="";
    if(p && p.pin){ gate.mode="pin"; gate.sel=id; renderGate(); }
    else if(openSession(id)){ hideGate(); startApp(); }
    return;
  }
  const gfo=hit("[data-gforgot]"); if(gfo){ gate.mode="forgot"; gate.sel=gfo.dataset.gforgot; gate.err=""; renderGate(); return; }
  const gdl=hit("[data-gdelete]");
  if(gdl){
    const id=gdl.dataset.gdelete, pr=profileOf(id);
    if(gdl.dataset.armed==="1"){ deleteProfile(id); gate={mode:"list",sel:null,err:""}; renderGate(); return; }
    gdl.dataset.armed="1"; gdl.textContent="Confirmer la suppression de "+(pr?pr.nom:"ce profil");
    return;
  }
  const gm=hit("[data-gmode]"); if(gm){ gate.mode=gm.dataset.gmode; gate.err=""; renderGate(); return; }
  if(hit("[data-gcreate]")){
    const n=$("#gName"), v=$("#gVert"), pin=$("#gPin");
    createProfile(n?n.value:"", v?v.value:"tous", pin?pin.value:"").then(r=>{
      if(!r.ok){ gate.err=r.err; renderGate(); return; }
      gate.err=""; hideGate(); startApp();
    });
    return;
  }
  if(hit("[data-gunlock]")){
    const inp=$("#gPinIn"), code=inp?inp.value:"";
    checkPin(gate.sel,code).then(ok=>{
      if(!ok){ gate.err="Code incorrect."; renderGate(); return; }
      if(openSession(gate.sel)){ gate.err=""; hideGate(); startApp(); }
    });
    return;
  }
  if(hit("[data-profmenu]")){ profileMenu(); return; }
  if(hit("[data-logout]")){ if(cloudReady()&&SB.user) doSignOut(); else { closeModal(); closeSession(); } return; }
  const sw=hit("[data-switch]"); if(sw){ if(cloudReady()&&SB.user){ doSignOut(); return; }
    closeModal(); STORE.del(SKEY); ME=null; gate={mode:"list",sel:null,err:""}; renderGate(); return; }

  /* ── Astuces ── */
  const tc=hit("[data-tipclose]"); if(tc){ closeTip(tc.dataset.tipclose); return; }

  /* ── Administration ── */
  const adm=hit("[data-adm]");
  if(adm){ admAction(adm.dataset.adm); return; }
  const up=hit("[data-unplan]"); if(up){ delete PLAN.modules[up.dataset.unplan]; savePlan(); route(); return; }
  const pr=hit("[data-promote]"); if(pr){ const p=profileOf(pr.dataset.promote); if(p){ p.role="admin"; saveProfiles(); toast("Rôle administrateur accordé à "+p.nom+".","ok"); route(); } return; }
  const dm=hit("[data-demote]");  if(dm){ const p=profileOf(dm.dataset.demote);
    if(p){ if(PROFILES.filter(x=>x.role==="admin").length<=1){ toast("Il doit rester au moins un administrateur.","err"); return; }
      p.role="membre"; saveProfiles(); if(ME&&ME.id===p.id) ME=p; toast("Rôle retiré à "+p.nom+"."); route(); } return; }
  const dp=hit("[data-delprof]"); if(dp){ confirmDeleteProfile(dp.dataset.delprof); return; }
  if(hit("[data-rvnext]")){ startRev(false); return; }
  if(hit("[data-confirm]")){ runConfirm(); return; }
  if(hit("[data-pinsave]")){ savePinFromModal(); return; }

  /* barre latérale et en-tête */
  const tog=hit("[data-toggle]");
  if(tog){
    const id=tog.dataset.toggle, o=S.prefs.openPhases||(S.prefs.openPhases=[]);
    const i=o.indexOf(id); if(i>=0) o.splice(i,1); else o.push(id);
    save(); paintNav(); return;
  }
  if(hit("#burger")){ document.body.classList.toggle("nav-open"); return; }
  if(hit("#openCmd")||hit("[data-act=cmd]")){ openCmd(); return; }
  if(hit("#toggleTheme")){ toggleTheme(); if(location.hash==="#/reglages") route(); return; }
  if(hit("#openHelp")){ helpModal(); return; }
  const ci=hit(".cmd-it"); if(ci){ runCmd(+ci.dataset.n); return; }

  /* statuts, favoris, maîtrise */
  const cy=hit("[data-cycle]"); if(cy){ cycleStatus(cy.dataset.cycle); route(); return; }
  const dn=hit("[data-done]");  if(dn){ setStatus(dn.dataset.done, meta(dn.dataset.done).st==="done"?"todo":"done"); route(); return; }
  const fv=hit("[data-fav]");   if(fv){ toggleFav(fv.dataset.fav);
    fv.classList.toggle("on"); fv.textContent=meta(fv.dataset.fav).fav?"★":"☆";
    fv.classList.add("pop"); setTimeout(()=>fv.classList.remove("pop"),400); return; }
  const ms=hit("[data-mast]");  if(ms){ const p=ms.dataset.mast.split("|");
    meta(p[0]).mastery=+p[1]; save(); checkBadges(); route(); return; }

  /* onglets de module */
  const tb=hit("[data-tab]");
  if(tb){ modTab=tb.dataset.tab;
    const id=(location.hash.split("/")[2]||"").split("?")[0];
    $$(".tab").forEach(x=>x.classList.toggle("on", x.dataset.tab===modTab));
    paintTab(id); return; }

  /* quiz de module */
  const qo=hit("[data-opt]"); if(qo && !qo.classList.contains("lock")){ answerQuiz(+qo.dataset.opt); return; }
  if(hit("[data-qznext]")){ nextQuiz(); return; }
  if(hit("[data-qzretry]")){ startQuiz(qz.id); return; }
  if(hit("#timerBtn")){ toggleTimer((location.hash.split("/")[2]||"").split("?")[0]); return; }

  /* parcours */
  const pf=hit("[data-pcf]"); if(pf){ pcFilter.f=pf.dataset.pcf;
    $$("[data-pcf]").forEach(b=>b.classList.toggle("on",b.dataset.pcf===pcFilter.f)); paintParcours(); return; }

  /* fiches et modes de jeu */
  const md=hit("[data-mode]"); if(md){ deck.mode=md.dataset.mode; location.hash="#/cartes?m="+deck.mode; route(); return; }
  if(hit("[data-shuffle]")){ deck.shuf=!deck.shuf; buildDeck(); startMode();
    $$("[data-shuffle]").forEach(b=>b.classList.toggle("on",deck.shuf)); toast(deck.shuf?"Paquet mélangé.":"Ordre d'origine rétabli."); return; }
  if(hit("[data-fcflip]")||(hit("#fcCard")&&!hit("a"))){
    if(rv.started){ rv.flip=!rv.flip; paintRev(); } else { fc.flip=!fc.flip; paintCard(); } return; }
  if(hit("[data-fcnext]")){ fc.i=(fc.i+1)%deck.list.length; fc.flip=false; paintCard(); return; }
  if(hit("[data-fcprev]")){ fc.i=(fc.i-1+deck.list.length)%deck.list.length; fc.flip=false; paintCard(); return; }
  const qk2=hit("[data-quick]"); if(qk2){ quickGrade(+qk2.dataset.quick); return; }

  const lr=hit("[data-lrn]"); if(lr && !lr.classList.contains("lock")){ answerLearn(+lr.dataset.lrn); return; }
  if(hit("[data-lrnnext]")){ nextLearn(); return; }

  if(hit("[data-wrtok]")){ submitWrite(false); return; }
  if(hit("[data-wrtskip]")){ submitWrite(true); return; }
  if(hit("[data-wrtnext]")){ nextWrite(); return; }
  if(hit("[data-wrtoverride]")){ overrideWrite(); return; }

  const tl=hit("[data-tile]"); if(tl && !tl.disabled){ pickTile(+tl.dataset.tile); return; }

  const ts=hit("[data-tst]"); if(ts){ answerTest(+ts.dataset.tst); return; }
  if(hit("[data-tstwrite]")){ const el=$("#tstIn"); answerTest(el?el.value:""); return; }

  /* révision espacée */
  if(hit("[data-rvstart]")){ startRev(false); return; }
  if(hit("[data-rvforce]")){ startRev(true); return; }
  const gr=hit("[data-grade]"); if(gr){ gradeRev(+gr.dataset.grade); return; }

  /* référentiel */
  const glc=hit("[data-glc]"); if(glc){ gl.c=glc.dataset.glc; gl.fav=false; route(); return; }
  if(hit("[data-glfavfilter]")){ gl.fav=!gl.fav; gl.c="all"; route(); return; }
  const glv=hit("[data-glview]"); if(glv){ S.prefs.glView=glv.dataset.glview; save(); route(); return; }
  const gt=hit("[data-glterm]"); if(gt){ glossaryModal(gt.dataset.glterm); return; }
  const gf=hit("[data-glfav]"); if(gf){ toggleGlFav(gf.dataset.glfav);
    if($("#modalOvl").classList.contains("on")) glossaryModal(gf.dataset.glfav); else paintGlossary();
    paintNav(); return; }
  const gv=hit("[data-glrev]"); if(gv){ pushToReview(gv.dataset.glrev); return; }
  const az=hit("[data-az]"); if(az && !az.disabled){
    const el=$("#az-"+az.dataset.az); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }

  /* bibliothèque */
  const rst=hit("[data-rst]"); if(rst){ rs.t=rst.dataset.rst; rs.ess=false; route(); return; }
  if(hit("[data-rsess]")){ rs.ess=!rs.ess; rs.t="all"; route(); return; }
  const rv2=hit("[data-resview]"); if(rv2){ S.prefs.resView=rv2.dataset.resview; save(); route(); return; }
  const rd=hit("[data-read]"); if(rd){ toggleRead(rd.dataset.read); paintResources(); return; }
  if(hit("[data-readpath]")){ readPathModal(); return; }

  /* verticale */
  const vp=hit("[data-vert]"); if(vp){ setVertical(vp.dataset.vert); location.hash="#/verticale"; route(); return; }
  const vob=hit("[data-vertob]"); if(vob){ setVertical(vob.dataset.vertob,true); showOnboarding(); return; }
  if(hit("[data-vertchange]")){ viewVertPicker(); return; }

  /* process et accordéons */
  const st2=hit("[data-step]"); if(st2){ prSel=+st2.dataset.step;
    $$("[data-step]").forEach(b=>b.classList.toggle("on", +b.dataset.step===prSel));
    paintStep();
    const sb=$("#stepBody"); if(sb) sb.scrollIntoView({behavior:"smooth",block:"nearest"});
    return; }
  const ac=hit(".acc-h"); if(ac){ const box=ac.closest(".acc"); if(box) box.classList.toggle("open"); return; }

  /* réglages */
  const th=hit("[data-theme]"); if(th){ S.prefs.theme=th.dataset.theme; save(); applyTheme(); route(); return; }
  const act=hit("[data-act]");
  if(act){
    const a=act.dataset.act;
    if(a==="export") exportData();
    if(a==="tour"){ resetTips(); }
    if(a==="help") helpModal();
    if(a==="pin") pinModal();
    if(a==="askadmin") location.hash="#/admin";
    if(a==="reset")  resetData();
    if(a==="replay-ob"){ obStep=0; showOnboarding(); }
    if(a==="reset-confirm"){ STORE.del(KEY); S=load(); closeModal();
      applyTheme(); paintHeader(); paintNav(); route(); toast("Progression réinitialisée.","ok"); }
    return;
  }

  /* présentation initiale */
  if(hit("[data-ob]")){ if(!t.closest("[data-ob]").disabled) obNext(); return; }
  if(hit("[data-ob-skip]")){ S.prefs.onboarded=true;
    if(!S.prefs.vertical) S.prefs.vertical="tous";
    save(); closeModal(); paintNav(); route(); return; }
});

/* ── Saisies ──────────────────────────────────────────────── */
document.addEventListener("input", e=>{
  const id=e.target.id;
  if(id==="cmdInput") renderCmd(e.target.value);
  if(id==="pcq"){ pcFilter.q=e.target.value; paintParcours(); }
  if(id==="glq"){ gl.q=e.target.value; paintGlossary(); }
  if(id==="rsq"){ rs.q=e.target.value; paintResources(); }
});
document.addEventListener("change", e=>{
  const id=e.target.id;
  if(id==="pcp"){ pcFilter.p=e.target.value; paintParcours(); }
  if(id==="pcc"){ pcFilter.c=e.target.value; paintParcours(); }
  if(id==="rsp"){ rs.p=e.target.value; paintResources(); }
  if(id==="rsniv"){ rs.niv=e.target.value; paintResources(); }
  if(id==="glsort"){ gl.sort=e.target.value; paintGlossary(); }
  if(id==="deckCat"){ deck.cat=e.target.value; buildDeck(); startMode(); }
  if(id==="impFile" && e.target.files[0]) importData(e.target.files[0]);
});

/* ── Clavier ──────────────────────────────────────────────── */
let gPending=false, gTimer=null;
document.addEventListener("keydown", e=>{
  /* écran d'entrée : seule la touche Entrée agit, les raccourcis sont neutralisés */
  const g=$("#gate");
  if(g && g.classList.contains("on")){
    if(e.key==="Enter"){
      e.preventDefault();
      const seq=["[data-csignin]","[data-csignup]","[data-crecover]","[data-gunlock]","[data-gcreate]"];
      for(const sel of seq){ const b=document.querySelector(sel); if(b){ b.click(); break; } }
    }
    return;
  }
  const tag=(document.activeElement&&document.activeElement.tagName)||"";
  const typing = tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT";
  const cmdOpen = $("#cmdOvl").classList.contains("on");

  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); cmdOpen?closeCmd():openCmd(); return; }
  if(cmdOpen){
    if(e.key==="Escape") closeCmd();
    else if(e.key==="ArrowDown"){ e.preventDefault(); moveCmd(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moveCmd(-1); }
    else if(e.key==="Enter"){ e.preventDefault(); runCmd(cmdSel); }
    return;
  }
  if(e.key==="Escape"){
    /* fermer la présentation vaut l'avoir vue : elle ne doit pas revenir à chaque ouverture */
    const inTour=$("#modalOvl").classList.contains("on") && !S.prefs.onboarded && obStep>=0 && document.querySelector("[data-ob]");
    if(inTour){ S.prefs.onboarded=true; if(!S.prefs.vertical) S.prefs.vertical="tous"; save(); }
    closeModal(); document.body.classList.remove("nav-open"); return;
  }

  if(typing){
    if(e.key==="Enter" && document.activeElement.id==="admCode"){ e.preventDefault(); admAction("elevate"); }
    if(e.key==="Enter"){
      if(document.activeElement.id==="wrtIn"){ e.preventDefault(); submitWrite(false); }
      if(document.activeElement.id==="tstIn"){ e.preventDefault(); answerTest(document.activeElement.value); }
    }
    if(e.key==="Enter" && (e.metaKey||e.ctrlKey) && tag==="TEXTAREA"){ const b=$("#noteSave"); if(b) b.click(); }
    return;
  }

  /* navigation g + lettre */
  if(gPending){
    gPending=false; clearTimeout(gTimer);
    const map={d:"#/",r:"#/revision",c:"#/cartes",t:"#/referentiel",p:"#/process",v:"#/verticale",s:"#/stats",b:"#/ressources",m:"#/parcours"};
    const k=e.key.toLowerCase();
    if(map[k]){ e.preventDefault(); location.hash=map[k]; return; }
  }
  if(e.key.toLowerCase()==="g"){ gPending=true; gTimer=setTimeout(()=>gPending=false,900); return; }

  if(e.key==="/"){ e.preventDefault();
    const f=$("#pcq")||$("#glq")||$("#rsq"); if(f){ f.focus(); f.select(); } else openCmd(); return; }
  if(e.key==="?"){ e.preventDefault(); helpModal(); return; }

  /* fiches */
  if(e.key===" " && $("#fcCard")){ e.preventDefault();
    if(rv.started){ rv.flip=!rv.flip; paintRev(); } else { fc.flip=!fc.flip; paintCard(); } return; }
  if(rv.started && rv.flip && ["1","2","3","4"].indexOf(e.key)>=0){ e.preventDefault(); gradeRev(+e.key-1); return; }
  if(!rv.started && $("#fcCard") && deck.mode==="cartes"){
    if(e.key==="ArrowRight"){ fc.i=(fc.i+1)%deck.list.length; fc.flip=false; paintCard(); return; }
    if(e.key==="ArrowLeft"){ fc.i=(fc.i-1+deck.list.length)%deck.list.length; fc.flip=false; paintCard(); return; }
  }
  /* choix de réponse au clavier en mode Apprendre et Test */
  if(["1","2","3","4"].indexOf(e.key)>=0){
    const n=+e.key-1;
    const l=$$("[data-lrn]"); if(l.length && !l[0].classList.contains("lock") && l[n]){ answerLearn(n); return; }
    const q=$$("[data-tst]"); if(q.length && q[n]){ answerTest(n); return; }
    const o=$$("[data-opt]"); if(o.length && !o[0].classList.contains("lock") && o[n]){ answerQuiz(n); return; }
  }
  if(e.key==="Enter"){
    const nx=$("[data-lrnnext]")||$("[data-qznext]")||$("[data-wrtnext]");
    if(nx){ e.preventDefault(); nx.click(); return; }
  }

  /* modules */
  const seg=(location.hash||"").split("/");
  if(seg[1]==="module"){
    const id=(seg[2]||"").split("?")[0], t2=anyMod(id);
    if(!t2) return;
    const ctx=ctxOf(id);
    const sibs = ctx.vert ? vmodsFor(vmodOf(id).v) : byPhase(t2.phase);
    const i=sibs.map(x=>x.id).indexOf(id);
    if(e.key.toLowerCase()==="j" && sibs[i-1]) location.hash="#/module/"+sibs[i-1].id;
    if(e.key.toLowerCase()==="k" && sibs[i+1]) location.hash="#/module/"+sibs[i+1].id;
    if(e.key.toLowerCase()==="m"){ setStatus(id, meta(id).st==="done"?"todo":"done"); route(); }
  }
});

/* ── Initialisation ───────────────────────────────────────── */
function startApp(){
  loadPlan();
  paintHeader(); paintNav();
  if(!location.hash) location.hash="#/";
  route();
  if(!S.prefs.onboarded){ obStep=0; setTimeout(showOnboarding,380); }
  const cut=addDays(todayISO(),-400);
  Object.keys(S.days).forEach(d=>{ if(d<cut) delete S.days[d]; });
  save();
}
function init(){
  applyTheme();
  if(navigator.platform && navigator.platform.indexOf("Mac")<0){ const k=$("#kbdHint"); if(k) k.textContent="Ctrl K"; }
  window.addEventListener("hashchange", ()=>{ if(ME) route(); });
  window.addEventListener("beforeunload", ()=>{ flushSave(); if(syncDirty) cloudFlush(); });
  window.addEventListener("online",  ()=>{ if(syncDirty) cloudFlush(); else setStatus_("ok"); });
  window.addEventListener("offline", ()=>setStatus_("hors-ligne"));

  if(!cloudReady()){                       /* aucune configuration serveur : mode local */
    SB.status="local";
    if(bootAuth()) startApp();
    return;
  }
  cloudBoot().then(ok=>{
    if(ok){ hideGate(); startApp(); }
    else { cg={mode:"signin",err:SB.err||"",info:"",busy:false}; renderCloudGate(); }
  }).catch(()=>{
    cg={mode:"signin",err:"Serveur injoignable. Vérifiez votre connexion.",info:"",busy:false};
    renderCloudGate();
  });
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
else init();

</script>

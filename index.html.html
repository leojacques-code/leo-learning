q:{q:"Une reprise de provision de 120 k€ sans justification apparente. Quel effet sur l'analyse ?",o:["Le résultat est gonflé artificiellement, à retraiter","Le résultat est sous-estimé","Aucun effet","La trésorerie augmente de 120 k€"],a:0,e:"Une reprise est un produit calculé sans encaissement. Sans justification, elle relève de l'habillage de résultat."}};

BRIEFS["impots-differes"]={why:"Les impôts différés créent des actifs et des passifs que l'acquéreur reprend souvent sans les voir.",
pts:["Décalage entre base comptable et base fiscale d'un actif ou d'un passif.","Actif d'impôt différé : déficits reportables, provisions non déductibles temporairement.","Passif d'impôt différé : réévaluations, amortissements dérogatoires.","Un actif d'impôt différé ne vaut que si des bénéfices futurs permettent de l'utiliser.","Les déficits reportables se perdent souvent en cas de changement d'activité, pas de simple changement de contrôle."],
q:{q:"Une société a 900 k€ de déficits reportables. Quelle est leur valeur pour un acquéreur ?",o:["L'économie d'impôt actualisée, sous réserve de bénéfices futurs suffisants","900 k€","225 k€ certains","Nulle en toutes circonstances"],a:0,e:"Un déficit ne vaut que par l'impôt qu'il évitera. Sans perspective de bénéfice, il ne vaut rien."}};

BRIEFS["goodwill"]={why:"Le goodwill inscrit au bilan raconte les acquisitions passées et le risque de dépréciation futur.",
pts:["Écart entre le prix payé et la juste valeur des actifs nets identifiables acquis.","En PCG, le fonds commercial n'est pas amorti si sa durée d'utilisation est indéterminée ; en IFRS, jamais amorti mais testé.","Un test de dépréciation compare valeur recouvrable et valeur comptable de l'unité génératrice de trésorerie.","Une dépréciation de goodwill est non cash mais signale une acquisition passée ratée.","Le goodwill se neutralise dans les analyses de rentabilité des capitaux employés."],
q:{q:"Une dépréciation de goodwill de 500 k€ a quel effet sur la trésorerie ?",o:["Aucun, c'est une charge calculée","- 500 k€","+ 500 k€","Impossible à dire"],a:0,e:"La dépréciation constate une perte de valeur. Le décaissement a eu lieu lors de l'acquisition, des années plus tôt."}};

BRIEFS["capitaux-propres"]={why:"Le tableau de variation des capitaux propres révèle la politique de distribution et les opérations sur capital.",
pts:["Capital, primes, réserves, report à nouveau, résultat de l'exercice, subventions, provisions réglementées.","Capitaux propres d'ouverture + résultat - dividendes + apports = capitaux propres de clôture.","Des capitaux propres inférieurs à la moitié du capital social déclenchent une obligation légale de régularisation.","Une distribution supérieure au résultat traduit une décapitalisation, souvent en préparation de cession.","Les comptes courants d'associés ne sont pas des capitaux propres, sauf convention de blocage."],
q:{q:"Distribution de 400 k€ pour un résultat de 250 k€. Que faut-il en déduire ?",o:["Une décapitalisation, à examiner avant la cession","Une forte rentabilité","Une erreur comptable","Une augmentation de capital"],a:0,e:"On distribue des réserves accumulées. Le mouvement est légitime mais réduit les fonds propres livrés à l'acquéreur."}};

BRIEFS["leases-ifrs16"]={why:"IFRS 16 déplace les loyers de l'EBITDA vers l'amortissement et les intérêts, ce qui rend les multiples incomparables.",
pts:["Tout contrat de location entre au bilan : droit d'utilisation à l'actif, dette de loyer au passif.","L'EBITDA augmente du montant des loyers annuels, la dette nette augmente de la valeur actualisée des loyers restants.","Le PCG français n'impose pas ce traitement : une PME reste en charge de loyer classique.","Comparer un multiple IFRS et un multiple PCG sans retraitement est une erreur méthodologique.","Retraitement rapide : dette de loyer estimée à cinq à huit fois le loyer annuel."],
q:{q:"Une cotée en IFRS 16 affiche 6,5x EBITDA. Une PME locataire en PCG serait comparable à quel niveau ?",o:["Un multiple plus élevé, après retraitement des loyers","Le même multiple","Un multiple plus bas","La comparaison est directe"],a:0,e:"L'EBITDA IFRS est gonflé par la sortie des loyers, ce qui écrase le multiple. À valeur égale, l'équivalent PCG se lit à un multiple supérieur."}};

BRIEFS["pcg-ifrs"]={why:"Les écarts entre référentiels changent l'EBITDA, la dette et donc le prix.",
pts:["Locations : IFRS 16 capitalise, le PCG maintient en charge.","Goodwill : jamais amorti en IFRS, amortissable en PCG si durée déterminable.","Frais de développement : activation obligatoire sous conditions en IFRS, option en PCG.","Provisions : critères de comptabilisation plus stricts en IFRS.","Instruments financiers et couvertures : traitement à la juste valeur en IFRS."],
q:{q:"Quel écart entre PCG et IFRS affecte le plus l'EBITDA d'une société locataire ?",o:["Le traitement des contrats de location","Le goodwill","Les provisions","Les frais de développement"],a:0,e:"IFRS 16 sort l'intégralité des loyers de l'EBITDA, ce qui peut représenter 10 à 20 % de l'agrégat pour un commerce ou un réseau d'agences."}};

BRIEFS["consolidation"]={why:"Un groupe se valorise sur ses comptes consolidés, jamais sur la somme des comptes sociaux.",
pts:["Intégration globale au-delà du contrôle exclusif, mise en équivalence en influence notable.","Élimination des opérations intragroupe : ventes, créances, dettes, marges en stock.","Les intérêts minoritaires se déduisent pour passer à la valeur des titres du groupe.","Un périmètre qui change d'un exercice à l'autre rend les comparaisons inutilisables sans pro forma.","En small cap, l'absence de comptes consolidés impose une consolidation manuelle simplifiée."],
q:{q:"Deux sociétés du même groupe se facturent 400 k€ par an. Effet sur le chiffre d'affaires consolidé ?",o:["Élimination intégrale des 400 k€","Aucun","Ajout de 400 k€","Réduction de 200 k€"],a:0,e:"Le chiffre d'affaires consolidé ne retient que les ventes vers l'extérieur du périmètre. Les flux internes s'éliminent en totalité."}};

BRIEFS["qualite-resultat"]={why:"La qualité du résultat mesure à quel point le bénéfice affiché est converti en trésorerie durable.",
pts:["Ratio de conversion = flux d'exploitation / EBITDA. En dessous de 70 % durablement, alerte.","Croissance du chiffre d'affaires portée par l'allongement des délais clients : signal négatif.","Marge qui progresse alors que le secteur se dégrade : chercher l'explication comptable avant l'explication opérationnelle.","Charges capitalisées en hausse, provisions en baisse, produits exceptionnels récurrents : trois marqueurs classiques.","Un changement de méthode comptable non signalé est le signal le plus fort."],
q:{q:"Flux d'exploitation de 380 pour un EBITDA de 900 sur trois exercices consécutifs. Quelle lecture ?",o:["Conversion faible et persistante, la qualité du résultat est en cause","Excellente performance","Situation normale","Le BFR se réduit"],a:0,e:"Une conversion durablement inférieure à 50 % signale que le résultat ne devient pas de la trésorerie : BFR qui dérive, produits non encaissés, ou habillage."}};

/* ── Phase 2, Excel et outils ── */
BRIEFS["raccourcis"]={why:"Le temps gagné au clavier se réinvestit en réflexion. C'est la différence entre subir un modèle et le piloter.",
pts:["Navigation : Ctrl + flèches, Ctrl + Maj + flèches pour sélectionner jusqu'au bord d'une plage.","Édition : F2 modifier, F4 basculer les ancrages, Alt + = somme automatique.","Collage spécial : Alt puis E, S, V pour les valeurs, Alt E S T pour les formats.","Audit : Ctrl + accent grave pour afficher les formules, Ctrl + crochet pour suivre un antécédent.","Feuilles : Ctrl + Page suivante et précédente, Maj + F11 nouvelle feuille."],
q:{q:"Quel raccourci bascule les ancrages d'une référence entre relatif et absolu ?",o:["F4","F2","F9","Ctrl + F"],a:0,e:"F4 fait défiler A1, dollar A dollar 1, A dollar 1, dollar A 1. C'est le raccourci le plus utilisé en modélisation."}};

BRIEFS["recherche-index"]={why:"Une recherche mal construite est la première cause d'erreur silencieuse dans un modèle.",
pts:["RECHERCHEX remplace avantageusement RECHERCHEV : recherche à gauche, valeur si absent, correspondance exacte par défaut.","INDEX combiné à EQUIV reste la solution la plus robuste sur les versions anciennes.","RECHERCHEV sans le quatrième argument FAUX effectue une recherche approximative et renvoie silencieusement une valeur fausse.","Toujours prévoir la gestion du cas non trouvé, jamais laisser un code d'erreur circuler.","Une recherche sur une clé texte impose de normaliser la casse et les espaces au préalable."],
q:{q:"Une RECHERCHEV renvoie une valeur plausible mais fausse. Cause la plus probable ?",o:["Recherche approximative, quatrième argument omis","La plage est trop grande","La colonne est masquée","Le fichier est corrompu"],a:0,e:"Sans FAUX, Excel renvoie la valeur immédiatement inférieure trouvée dans une liste supposée triée. L'erreur est invisible car le résultat semble cohérent."}};

BRIEFS["fonctions-logiques"]={why:"La gestion des erreurs distingue un modèle qui circule d'un modèle qui embarrasse.",
pts:["SI imbriqués au-delà de trois niveaux : passer à SI.CONDITIONS ou à une table de correspondance.","SIERREUR masque l'erreur, il ne la corrige pas. À n'utiliser qu'après avoir compris sa cause.","ET et OU se combinent dans le test logique d'un SI, jamais séparément.","SOMME.SI.ENS et NB.SI.ENS remplacent la plupart des formules matricielles complexes.","Un drapeau 1 ou 0 multiplié vaut souvent mieux qu'un SI : plus lisible, plus rapide, plus auditable."],
q:{q:"Pourquoi préférer un drapeau 1 ou 0 multiplié à un SI dans une ligne de projection ?",o:["Plus lisible, plus rapide et plus facile à auditer","Le SI est interdit","Le drapeau est plus précis","Aucune différence"],a:0,e:"Une multiplication par un drapeau rend la condition visible dans la ligne d'hypothèses, plutôt que cachée dans une formule."}};

BRIEFS["dates-decalages"]={why:"Un calendrier de modèle mal construit condamne à réécrire toutes les formules à chaque changement d'horizon.",
pts:["Une seule ligne de dates, en haut, reprise par toutes les feuilles par référence.","FIN.MOIS et MOIS.DECALER génèrent les périodes sans saisie manuelle.","Un drapeau historique ou projeté par colonne pilote la bascule des formules.","Les décalages de paiement se modélisent par DECALER ou par des colonnes de retard explicites.","Pour un modèle mensuel, prévoir dès l'origine l'agrégation trimestrielle et annuelle par SOMME.SI.ENS."],
q:{q:"Quel avantage principal d'une ligne de calendrier unique référencée partout ?",o:["Allonger l'horizon sans réécrire de formule","Réduire la taille du fichier","Améliorer les graphiques","Éviter les références circulaires"],a:0,e:"L'extension devient une opération de tirage de colonne. Sans cela, chaque changement d'horizon impose une réécriture manuelle."}};

BRIEFS["tcd"]={why:"Le FEC contient tout. Un tableau croisé le rend exploitable en quelques minutes.",
pts:["Le fichier des écritures comptables est obligatoire et normalisé : il se demande systématiquement.","Un tableau croisé sur le FEC donne le chiffre d'affaires par client, par mois, par compte, sans intervention du cédant.","Les champs calculés évitent de polluer la source avec des colonnes intermédiaires.","Grouper par date permet de reconstituer une saisonnalité mensuelle en trois clics.","Toujours conserver la source brute intacte sur une feuille séparée."],
q:{q:"Quel fichier permet de reconstituer le chiffre d'affaires par client sans passer par le cédant ?",o:["Le FEC","La liasse fiscale","Le Kbis","Les statuts"],a:0,e:"Le fichier des écritures comptables contient chaque écriture avec son libellé et son compte auxiliaire. C'est la source la plus riche disponible."}};

BRIEFS["mfc"]={why:"Un contrôle qui ne se voit pas n'existe pas. La mise en forme conditionnelle rend l'erreur visible.",
pts:["Un jeu de règles standard : erreur en rouge, alerte en orange, contrôle validé en vert.","Les barres de données visualisent une distribution sans créer de graphique.","Les règles se posent sur des plages nommées pour survivre à l'insertion de lignes.","Une seule règle par contrôle, jamais de superposition de règles contradictoires.","Un indicateur global unique en haut de chaque feuille, alimenté par la feuille de contrôles."],
q:{q:"Où placer l'indicateur global de contrôle d'un modèle ?",o:["En haut de chaque feuille, alimenté par la feuille de contrôles","Uniquement sur la feuille de contrôles","Dans un commentaire","Nulle part, c'est superflu"],a:0,e:"Un contrôle visible uniquement sur une feuille que personne n'ouvre ne protège de rien."}};

BRIEFS["circulaires"]={why:"Une circularité non maîtrisée transforme un modèle en boîte noire instable.",
pts:["Cause la plus fréquente : intérêts calculés sur un solde moyen qui dépend du résultat, qui dépend des intérêts.","Solution 1 : calcul itératif activé, précision réglée, avec un interrupteur pour couper la boucle.","Solution 2 : intérêts calculés sur le solde d'ouverture, sans circularité, moins exact mais robuste.","Un interrupteur de coupure permet de repartir d'un état sain après une erreur en chaîne.","Ne jamais diffuser un modèle itératif sans avertir le destinataire, l'option est désactivée par défaut."],
q:{q:"Quelle est la cause classique de circularité dans un modèle intégré ?",o:["Intérêts sur solde moyen dépendant du résultat","Le calcul du BFR","La projection du chiffre d'affaires","L'échéancier d'immobilisations"],a:0,e:"La boucle intérêts, résultat, trésorerie, dette moyenne, intérêts est la circularité canonique de la modélisation financière."}};

BRIEFS["scenarios-valeur-cible"]={why:"Répondre à combien faut-il pour atteindre tel résultat est une question de négociation, pas de calcul.",
pts:["Valeur cible résout une équation à une inconnue : quel prix pour un TRI de 20 pour cent.","CHOISIR piloté par un numéro de scénario est la méthode la plus simple pour basculer entre trois cas.","Le gestionnaire de scénarios d'Excel est peu utilisé en pratique : trop opaque, préférer une table de scénarios visible.","Un seul interrupteur de scénario dans tout le modèle, jamais un par feuille.","Toujours documenter le scénario actif en évidence sur la feuille de sortie."],
q:{q:"Quelle fonction permet de basculer entre trois jeux d'hypothèses avec un seul interrupteur ?",o:["CHOISIR piloté par un numéro de scénario","SOMME.SI","RECHERCHEV","INDEX seul"],a:0,e:"CHOISIR lit le numéro de scénario actif et renvoie la valeur correspondante. La table reste visible et auditable."}};

BRIEFS["power-query"]={why:"Nettoyer 200 000 lignes de grand livre à la main est impossible. Power Query le fait de façon reproductible.",
pts:["Import du FEC ou d'un export comptable, transformation en étapes visibles et réversibles.","Chaque étape est enregistrée : la transformation se rejoue automatiquement sur un nouveau fichier.","Opérations les plus utiles : dépivoter, fusionner des requêtes, grouper, extraire des colonnes de texte.","Le résultat se charge dans un tableau structuré, directement exploitable en tableau croisé.","Un traitement Power Query documenté est auditable, contrairement à un nettoyage manuel."],
q:{q:"Quel avantage principal de Power Query sur un nettoyage manuel ?",o:["La transformation est enregistrée et se rejoue sur un nouveau fichier","Il est plus rapide à apprendre","Il ne nécessite pas Excel","Il corrige les erreurs comptables"],a:0,e:"La reproductibilité est décisive : à chaque nouvel export du client, le traitement se relance en un clic, sans risque d'erreur humaine."}};

BRIEFS["graphiques-banking"]={why:"Un graphique de banque doit se comprendre en trois secondes, sans légende à déchiffrer.",
pts:["Waterfall pour un pont : évolution d'un agrégat décomposée en contributions positives et négatives.","Football field pour une synthèse de valorisation : une barre horizontale par méthode, avec la fourchette.","Bridge d'EBITDA pour expliquer un écart entre deux exercices ou entre présenté et normatif.","Étiquettes de données directement sur le graphique, jamais de légende séparée quand on peut l'éviter.","Deux couleurs maximum plus une couleur d'accentuation. La couleur porte une information, jamais une décoration."],
q:{q:"Quel graphique présente une synthèse de valorisation par méthode ?",o:["Le football field","Le waterfall","Le camembert","La courbe cumulée"],a:0,e:"Le football field superpose les fourchettes de chaque méthode sur un axe de valeur commun, ce qui rend la zone de recoupement immédiatement visible."}};

BRIEFS["restitution-slides"]={why:"Un livrable mal présenté fait douter des calculs qu'il contient.",
pts:["Un message par page, écrit dans le titre. Le titre affirme, le corps prouve.","Tableaux plats et filtrables, jamais de bandeaux fusionnés qui empêchent le tri.","Chiffres au format français : virgule décimale, espace insécable pour les milliers, unité rappelée en en-tête.","Une source nommée sous chaque tableau et chaque graphique, sans exception.","La densité vient du fond, pas de la mise en forme. Pas de gras à outrance."],
q:{q:"Que doit contenir le titre d'une page de livrable ?",o:["Le message à retenir, sous forme d'affirmation","Le nom de la section","Un titre neutre","La date"],a:0,e:"Un titre affirmatif permet de lire la conclusion d'un document en parcourant seulement les titres. C'est la règle la plus efficace de la présentation professionnelle."}};

/* ── Phase 3, modélisation ── */
BRIEFS["hypotheses-drivers"]={why:"Un modèle vaut ce que valent ses inducteurs. Le reste n'est que de l'arithmétique.",
pts:["Un inducteur est une variable qui explique un agrégat et sur laquelle on a une observation historique.","Chiffre d'affaires par volume et prix vaut mieux qu'un taux de croissance global.","Chaque hypothèse porte trois informations : valeur, source, plage de variation raisonnable.","Une hypothèse sans historique de référence est une conviction, à identifier comme telle.","Le nombre d'hypothèses se limite : au-delà de trente inducteurs, plus personne ne les pilote."],
q:{q:"Quelle projection de chiffre d'affaires est la plus défendable ?",o:["Volume multiplié par prix, chacun projeté séparément","Un taux de croissance global de 5 pour cent","La moyenne des trois dernières années","Le budget du dirigeant"],a:0,e:"Décomposer permet de discuter séparément l'effet volume et l'effet prix, et de confronter chacun à une réalité observable."}};

BRIEFS["projection-ca"]={why:"Le chiffre d'affaires est la première ligne du modèle et la source de toutes les autres erreurs.",
pts:["Décomposer par activité, par segment client ou par zone selon ce qui pilote réellement l'activité.","Distinguer la base récurrente du nouveau : leurs taux de croissance n'ont rien à voir.","Pour une base contractuelle : chiffre d'affaires récurrent = base précédente x (1 - attrition) x (1 + indexation) + affaires nouvelles.","Le carnet de commandes ou le portefeuille en cours donne la visibilité sur les douze premiers mois.","Toute projection supérieure à la croissance historique doit s'appuyer sur un fait, pas sur un espoir."],
q:{q:"Base récurrente de 1 000, attrition de 6 %, indexation de 2 %, affaires nouvelles de 80. Chiffre d'affaires projeté ?",o:["1 038","1 080","1 040","960"],a:0,e:"1 000 x 0,94 x 1,02 = 958,8, plus 80 d'affaires nouvelles = 1 038,8."}};

BRIEFS["projection-couts"]={why:"Modéliser tous les coûts en pourcentage du chiffre d'affaires fait disparaître le levier opérationnel.",
pts:["Classer chaque poste : variable, fixe, semi-variable. Le classement se fait sur l'historique, par régression simple.","Les coûts variables se projettent en pourcentage du chiffre d'affaires ou du volume.","Les coûts fixes se projettent en valeur, indexés sur l'inflation.","Les coûts semi-variables se projettent par paliers : un palier par tranche d'activité.","Le levier opérationnel est ce qui rend la marge sensible à la croissance. L'écraser rend le modèle inutile."],
q:{q:"Pourquoi ne pas projeter les loyers en pourcentage du chiffre d'affaires ?",o:["Ce sont des coûts fixes : le pourcentage efface le levier opérationnel","Parce que la TVA s'applique","Parce qu'ils sont déductibles","Aucune raison particulière"],a:0,e:"Un coût fixe modélisé en pourcentage augmente automatiquement avec l'activité, ce qui supprime l'effet d'échelle qui fait la valeur de la croissance."}};

BRIEFS["masse-salariale"]={why:"En société de services, la masse salariale représente 50 à 70 % des charges. Elle mérite sa propre feuille.",
pts:["Modéliser par effectif et par coût moyen chargé, jamais par un montant global indexé.","Distinguer les catégories : production, commercial, support. Leurs évolutions diffèrent.","Prévoir l'augmentation générale, l'augmentation individuelle et l'effet de noria séparément.","Le taux de charges patronales se calcule sur l'historique réel, pas sur un barème théorique.","Les recrutements se positionnent au mois près la première année, l'effet année pleine se voit la seconde."],
q:{q:"Un recrutement en juillet à 60 k€ chargés annuels. Coût de l'année en cours et de la suivante ?",o:["30 k€ puis 60 k€","60 k€ puis 60 k€","60 k€ puis 30 k€","30 k€ puis 30 k€"],a:0,e:"L'effet année pleine se manifeste la seconde année. Oublier ce décalage sous-estime les charges du plan d'affaires."}};

BRIEFS["schema-amortissement"]={why:"L'échéancier d'immobilisations relie capex, dotations et valeur nette comptable de façon cohérente.",
pts:["Un bloc par catégorie d'immobilisation, avec sa durée d'amortissement propre.","Amortir l'existant selon sa durée résiduelle, le nouveau capex selon sa durée normale.","Valeur nette de clôture = valeur nette d'ouverture + capex - dotations - valeur nette des cessions.","La dotation projetée alimente le compte de résultat et se neutralise dans le tableau de flux.","En régime permanent, capex et dotations convergent. Un écart durable signale une erreur d'hypothèse."],
q:{q:"VNC d'ouverture 1 200, capex 300, dotations 250, aucune cession. VNC de clôture ?",o:["1 250","1 750","1 150","900"],a:0,e:"1 200 + 300 - 250 = 1 250. L'actif progresse car l'investissement dépasse la dépréciation."}};

BRIEFS["capex"]={why:"Confondre capex de maintenance et capex de croissance conduit à surévaluer les flux disponibles.",
pts:["Capex de maintenance : ce qu'il faut dépenser pour maintenir la capacité actuelle. Proche des dotations en régime permanent.","Capex de croissance : ce qui augmente la capacité. Doit s'accompagner d'une hausse d'activité modélisée.","Le flux disponible normatif retient le capex de maintenance, jamais le capex de croissance seul.","Historique du ratio capex sur chiffre d'affaires sur cinq ans : première référence de calibrage.","Un capex de croissance sans effet chiffré sur le chiffre d'affaires est une incohérence de modèle."],
q:{q:"Un plan prévoit 500 k€ de capex de croissance sans hausse d'activité associée. Que conclure ?",o:["Le modèle est incohérent, l'investissement doit produire un effet","Le plan est prudent","C'est du capex de maintenance","Le capex est trop faible"],a:0,e:"Investir pour croître sans croissance projetée détruit de la valeur dans le modèle. Soit l'investissement est de maintenance, soit l'effet manque."}};

BRIEFS["controles-equilibre"]={why:"Un modèle sans contrôles est un modèle dont personne ne peut garantir les résultats, à commencer par son auteur.",
pts:["Contrôle 1 : actif moins passif égale zéro, sur chaque colonne.","Contrôle 2 : trésorerie du bilan égale trésorerie du tableau de flux.","Contrôle 3 : trésorerie jamais inférieure au plancher défini.","Contrôle 4 : soldes de dette jamais négatifs, jamais supérieurs aux montants autorisés.","Contrôle 5 : somme des pourcentages de répartition égale cent, partout où c'est applicable."],
q:{q:"Quel contrôle détecte une liaison manquante entre le tableau de flux et le bilan ?",o:["Trésorerie du bilan comparée à celle du tableau de flux","Le contrôle des pourcentages","Le plancher de trésorerie","Le solde de dette"],a:0,e:"Si les deux trésoreries divergent, un flux n'est pas reporté ou une variation de bilan n'a pas de contrepartie."}};

BRIEFS["scenarios-cas"]={why:"Un seul cas est une prévision. Trois cas sont une analyse.",
pts:["Cas bas, central, haut. Le cas central n'est pas la moyenne des deux autres, c'est le plus probable.","Faire varier deux à quatre inducteurs seulement, cohérents entre eux.","Le cas bas doit rester réaliste : un scénario de faillite n'apporte rien à une discussion de prix.","Documenter en une ligne l'histoire de chaque cas, en langage courant.","Le cas bas sert au banquier, le cas central à la valorisation, le cas haut à la discussion d'earn out."],
q:{q:"Dans un cas bas, faut-il faire varier tous les inducteurs simultanément ?",o:["Non, seulement deux à quatre, cohérents entre eux","Oui, tous","Un seul","Aucun"],a:0,e:"Dégrader toutes les hypothèses en même temps produit un scénario d'une probabilité infime, sans utilité pour la décision."}};

BRIEFS["sensibilites-modele"]={why:"Sensibiliser un modèle mal construit le casse. La robustesse se prépare avant.",
pts:["Toute hypothèse à sensibiliser doit vivre dans une cellule unique, référencée partout.","Vérifier que le modèle tient à zéro de croissance et à moins vingt pour cent d'activité.","Une sensibilité qui produit une erreur ou une trésorerie absurde révèle une faiblesse structurelle, pas un cas extrême.","Afficher systématiquement la valeur de référence au centre de la matrice.","Une matrice de plus de cinq par cinq n'est pas lue : réduire plutôt que multiplier les points."],
q:{q:"Le modèle renvoie une erreur quand on met la croissance à zéro. Que faut-il en conclure ?",o:["Une faiblesse structurelle du modèle, à corriger","Le cas est irréaliste","Le modèle est correct","Il faut éviter cette valeur"],a:0,e:"Une croissance nulle est un scénario parfaitement plausible. Si le modèle ne le supporte pas, c'est une division par zéro ou une formule mal conçue."}};

BRIEFS["modele-express"]={why:"En qualification, on a une heure et une liasse. Il faut produire une fourchette défendable.",
pts:["Trois exercices historiques saisis depuis la liasse, EBE calculé, retraitements évidents identifiés.","Projection sur trois ans avec deux inducteurs seulement : croissance et marge.","Dette nette approchée depuis le bilan, sans recherche exhaustive des assimilés.","Valorisation par multiple uniquement, fourchette large assumée.","Le livrable est une page : fourchette, hypothèses, points à vérifier. Jamais un modèle complet."],
q:{q:"Quel est le livrable d'un modèle express de qualification ?",o:["Une page : fourchette, hypothèses, points à vérifier","Un modèle intégré complet","Un mémorandum","Une LOI"],a:0,e:"La précision doit rester proportionnée à l'information disponible. Afficher trois décimales sur une liasse seule est trompeur."}};

BRIEFS["revue-modele"]={why:"Relire son propre modèle avec les yeux d'un tiers est la dernière étape avant diffusion.",
pts:["Les vingt points : équilibre du bilan, trésorerie positive, cohérence capex et dotations, convergence en fin d'horizon.","Vérifier que chaque hypothèse bleue est utilisée au moins une fois, et qu'aucune cellule noire n'est saisie en dur.","Tester deux valeurs extrêmes sur les trois inducteurs principaux.","Recouper trois chiffres clés avec la source externe : liasse, contrat, relevé bancaire.","Faire relire par quelqu'un qui n'a pas construit le modèle. C'est le seul contrôle qui trouve les erreurs de raisonnement."],
q:{q:"Quel contrôle détecte le mieux une erreur de raisonnement, par opposition à une erreur de formule ?",o:["Une relecture par une personne qui n'a pas construit le modèle","Le contrôle d'équilibre du bilan","Le test de croissance nulle","La vérification des ancrages"],a:0,e:"Les contrôles automatiques détectent les incohérences internes. Une hypothèse fausse mais cohérente ne se voit qu'avec un regard extérieur."}};

/* ── Phase 4, valorisation ── */
BRIEFS["multiples-ca-per"]={why:"Quand l'EBE n'est pas significatif, d'autres multiples prennent le relais, avec leurs limites propres.",
pts:["Multiple de chiffre d'affaires : utile en forte croissance ou en perte, mais ignore totalement la rentabilité.","PER : rapporte le prix au résultat net, donc sensible à la structure financière et à la fiscalité.","Multiples sectoriels : par encours en gestion de patrimoine, par commission en courtage, par mandat en administration de biens.","Un multiple sectoriel est une convention de marché : il faut connaître la base exacte utilisée par les praticiens.","Croiser au moins deux multiples : un écart important entre eux est une information en soi."],
q:{q:"Pourquoi le PER est-il peu utilisé en small cap non cotée ?",o:["Il dépend de la structure financière et de la politique de rémunération du dirigeant","Il est trop complexe","Il n'existe pas de comparables","Il est interdit"],a:0,e:"Le résultat net d'une PME reflète des choix personnels du dirigeant. L'EBE retraité neutralise ces effets et se compare mieux."}};

BRIEFS["echantillon-comps"]={why:"Un échantillon choisi pour arriver au bon chiffre se voit immédiatement et discrédite tout le travail.",
pts:["Écrire les critères de sélection avant de regarder les multiples obtenus.","Documenter les exclusions autant que les inclusions : pourquoi telle société n'est pas retenue.","Cinq à dix comparables. En dessous, l'échantillon est fragile ; au-dessus, il perd sa cohérence.","Afficher toujours minimum, quartiles, médiane et maximum, jamais la seule médiane.","Tester la robustesse : retirer le plus haut et le plus bas et vérifier que la conclusion tient."],
q:{q:"Quand faut-il fixer les critères de sélection d'un échantillon ?",o:["Avant de consulter les multiples obtenus","Après avoir calculé les multiples","Pendant la négociation","À la fin du process"],a:0,e:"Fixer les critères après coup revient à choisir le résultat. La méthode devient indéfendable dès qu'un contradicteur la teste."}};

BRIEFS["primes-decotes"]={why:"Les primes et décotes font l'essentiel de l'écart entre un multiple coté et un prix de PME.",
pts:["Prime de contrôle : ce qu'un acquéreur paie pour diriger. Observée entre 20 et 40 % sur les opérations publiques.","Décote de taille : les petites structures sont plus risquées et moins liquides.","Décote d'illiquidité : absence de marché organisé pour revendre les titres.","Décote de minorité : symétrique de la prime de contrôle, appliquée aux participations non majoritaires.","Les décotes se cumulent multiplicativement et doivent chacune être justifiées par écrit."],
q:{q:"Prime de contrôle et décote de minorité sont :",o:["Deux formulations symétriques du même phénomène","Deux effets indépendants qui se cumulent","Sans rapport","Toujours égales à 30 %"],a:0,e:"Si le contrôle vaut une prime, l'absence de contrôle vaut une décote. Appliquer les deux au même calcul serait un double compte."}};

BRIEFS["fcff"]={why:"Le flux disponible pour la firme est ce qui revient à l'ensemble des apporteurs de capitaux.",
pts:["FCFF = EBIT après impôt + dotations - capex - variation de BFR.","Avant charges financières : le coût de la dette est pris en compte par le WACC, pas dans les flux.","L'impôt se calcule sur l'EBIT, pas sur le résultat net, pour rester cohérent avec l'absence de charges financières.","Une variation de BFR positive est une sortie de trésorerie, donc un flux négatif.","Le FCFF sert avec le WACC et donne une valeur d'entreprise, jamais directement une valeur des titres."],
q:{q:"Pourquoi calculer l'impôt sur l'EBIT et non sur le résultat courant dans un FCFF ?",o:["Pour rester cohérent avec l'exclusion des charges financières","Parce que c'est la règle fiscale","Pour réduire l'impôt","Aucune raison technique"],a:0,e:"Le FCFF ignore la structure financière. Utiliser un impôt calculé après charges financières y réintroduirait l'économie d'impôt liée à la dette, déjà prise en compte dans le WACC."}};

BRIEFS["fcfe"]={why:"Le flux disponible pour l'actionnaire donne directement la valeur des titres, sans passer par le pont.",
pts:["FCFE = Résultat net + dotations - capex - variation de BFR + variation nette de dette.","S'actualise au coût des fonds propres, jamais au WACC.","Utile pour les établissements financiers, où la dette fait partie de l'exploitation.","Plus volatil que le FCFF, car sensible au calendrier de remboursement de la dette.","Donne directement la valeur des titres : ne pas y retrancher la dette une seconde fois."],
q:{q:"À quel taux actualiser un FCFE ?",o:["Le coût des fonds propres","Le WACC","Le coût de la dette","Le taux sans risque"],a:0,e:"Le FCFE est déjà net du service de la dette. L'actualiser au WACC reviendrait à déduire deux fois l'effet du financement."}};

BRIEFS["cout-fonds-propres"]={why:"Le coût des fonds propres est le rendement exigé par un actionnaire pour supporter le risque de l'entreprise.",
pts:["MEDAF : taux sans risque + bêta x prime de risque de marché.","En non coté, on ajoute une prime de taille et une prime spécifique documentée.","Le taux sans risque se prend sur une maturité longue, cohérente avec l'horizon d'investissement.","La prime de risque de marché se cite avec sa source et sa date, elle varie dans le temps.","Un coût des fonds propres inférieur à 10 % pour une PME française est difficile à défendre."],
q:{q:"Rf 3 %, bêta 1,2, prime de marché 6 %, prime de taille 3 %. Coût des fonds propres ?",o:["13,2 %","10,2 %","9,0 %","12,0 %"],a:0,e:"3 + 1,2 x 6 + 3 = 3 + 7,2 + 3 = 13,2 %."}};

BRIEFS["beta"]={why:"Le bêta mesure la sensibilité au risque de marché. Il se retraite avant d'être utilisé.",
pts:["Bêta observé d'une cotée intègre son propre endettement : c'est un bêta endetté.","Désendetter : bêta désendetté = bêta endetté / (1 + (1 - t) x D / CP).","Réendetter à la structure cible de la société valorisée avec la formule inverse.","Prendre la médiane des bêtas désendettés de l'échantillon, jamais un bêta individuel.","Un bêta n'existe pas pour une société non cotée : il s'emprunte au secteur, ce qui est une approximation assumée."],
q:{q:"Bêta endetté 1,5, D/CP de 0,5, IS 25 %. Bêta désendetté ?",o:["1,09","1,00","2,06","1,50"],a:0,e:"1,5 / (1 + 0,75 x 0,5) = 1,5 / 1,375 = 1,09."}};

BRIEFS["sensibilite-dcf"]={why:"Un DCF sans sensibilité est une opinion déguisée en calcul.",
pts:["Matrice principale : WACC contre croissance perpétuelle ou multiple de sortie.","Matrice secondaire : croissance du chiffre d'affaires contre marge d'EBE.","Exprimer la sensibilité en euros par point de variation, pas seulement en tableau.","Le pont de valeur décompose l'écart entre deux versions du DCF, hypothèse par hypothèse.","Présenter une fourchette et une valeur centrale, jamais une valeur unique."],
q:{q:"Comment présenter le résultat d'un DCF à un cédant ?",o:["Une fourchette avec une valeur centrale et les hypothèses qui la portent","Une valeur unique à l'euro près","Uniquement la matrice de sensibilité","Le multiple implicite seul"],a:0,e:"Une valeur unique donne une fausse impression de précision et se fait démolir au premier contradicteur. La fourchette est plus honnête et plus solide."}};

BRIEFS["football-field"]={why:"La synthèse de valorisation est souvent la seule page que lira le décideur.",
pts:["Une barre horizontale par méthode : DCF, comparables boursiers, comparables transactionnels, approche patrimoniale, prix maximum LBO.","Chaque barre porte sa fourchette basse et haute, avec les hypothèses en note.","La zone de recoupement des méthodes constitue la fourchette de valeur retenue.","Une méthode isolée très éloignée des autres doit être expliquée ou retirée, jamais laissée sans commentaire.","Ajouter une barre indicative des attentes du cédant permet de situer l'écart à combler."],
q:{q:"Que représente la zone de recoupement d'un football field ?",o:["La fourchette de valeur retenue, corroborée par plusieurs méthodes","La valeur maximale","La moyenne des méthodes","Le prix final"],a:0,e:"Une valeur confirmée par plusieurs approches indépendantes est plus robuste qu'un chiffre issu d'une seule méthode."}};

/* ── Phase 5, analyse stratégique ── */
BRIEFS["business-model"]={why:"Si on ne sait pas expliquer comment la société gagne de l'argent en trois phrases, on ne peut pas la valoriser.",
pts:["Qui paie, pour quoi, à quelle fréquence, à quelle marge.","Décrire la chaîne de valeur : ce qui est fait en interne, ce qui est acheté, ce qui est sous-traité.","Identifier le goulot d'étranglement : capacité de production, force commerciale, ressource rare.","Comprendre le cycle de trésorerie : encaisse-t-on avant ou après avoir payé ?","Le modèle économique explique le BFR et le besoin de capital. Les deux sont liés."],
q:{q:"Quel élément du modèle économique explique directement le BFR ?",o:["Le cycle de trésorerie : encaissement avant ou après décaissement","La marge brute","Le nombre de salariés","La localisation"],a:0,e:"Un modèle qui encaisse d'avance dégage un BFR négatif et s'autofinance. L'inverse consomme du capital à chaque euro de croissance."}};

BRIEFS["porter"]={why:"Les cinq forces expliquent pourquoi une rentabilité est élevée et si elle le restera.",
pts:["Intensité concurrentielle, menace des entrants, pouvoir des clients, pouvoir des fournisseurs, produits de substitution.","Chaque force se qualifie par un fait observable, jamais par une appréciation générale.","Le pouvoir de négociation client se mesure par la concentration et par le coût de changement.","La menace des entrants se mesure par le nombre de créations et de disparitions dans le secteur.","Conclure : quelle force est la plus contraignante et comment la société s'en protège."],
q:{q:"Comment mesurer objectivement le pouvoir de négociation des clients ?",o:["Par la concentration du chiffre d'affaires et le coût de changement pour eux","Par l'avis du dirigeant","Par la taille du marché","Par le nombre de concurrents"],a:0,e:"Un client qui représente 30 % du chiffre d'affaires et peut changer de fournisseur sans coût détient un pouvoir de négociation considérable."}};

BRIEFS["swot-utile"]={why:"Un SWOT générique ne sert à rien. Un SWOT hiérarchisé et chiffré oriente la négociation.",
pts:["Maximum trois éléments par case. Au-delà, rien n'est prioritaire.","Chaque force se relie à un chiffre : marge supérieure, attrition inférieure, part de marché locale.","Chaque faiblesse se relie à un coût de correction estimé.","Les opportunités se traduisent en leviers du plan d'affaires, sinon elles n'existent pas.","Les menaces se traduisent en scénario bas, sinon elles ne sont pas prises au sérieux."],
q:{q:"Que doit accompagner chaque faiblesse identifiée dans un SWOT exploitable ?",o:["Un coût de correction estimé","Une description détaillée","Un responsable","Une date"],a:0,e:"Sans chiffrage, une faiblesse reste une opinion. Chiffrée, elle devient un argument de négociation ou une ligne du plan d'intégration."}};

BRIEFS["marche-tam"]={why:"Une taille de marché sert à situer le potentiel, pas à justifier une projection.",
pts:["Marché total, marché adressable, marché accessible : trois cercles concentriques à distinguer.","Deux méthodes : descendante à partir de statistiques sectorielles, ascendante à partir du nombre de clients potentiels.","Croiser les deux méthodes : un écart supérieur à un facteur deux signale une erreur d'hypothèse.","Une part de marché de 0,1 pour cent qui doit passer à 1 pour cent n'est pas une projection, c'est un pari.","Sources françaises utiles : INSEE, études sectorielles spécialisées, fédérations professionnelles."],
q:{q:"Descendante et ascendante donnent des tailles de marché dans un rapport de un à trois. Que faire ?",o:["Chercher l'erreur d'hypothèse avant d'utiliser l'une ou l'autre","Prendre la moyenne","Retenir la plus élevée","Retenir la plus faible"],a:0,e:"Un tel écart révèle une erreur de périmètre ou d'hypothèse unitaire. Utiliser l'un des deux chiffres sans comprendre l'écart propage l'erreur."}};

BRIEFS["unit-economics"]={why:"La rentabilité par unité dit si la croissance crée ou détruit de la valeur.",
pts:["Marge par client ou par contrat, coût d'acquisition, durée de vie moyenne.","Valeur vie client = marge annuelle x durée de vie, actualisée si la durée est longue.","Ratio valeur vie sur coût d'acquisition : en dessous de trois, le modèle de croissance est fragile.","Délai de récupération du coût d'acquisition : au-delà de vingt-quatre mois, la croissance consomme beaucoup de trésorerie.","Si la marge unitaire est négative, croître aggrave la situation. Le constat est fréquent et souvent nié."],
q:{q:"Marge annuelle par client 800 €, durée de vie 6 ans, coût d'acquisition 1 500 €. Ratio valeur vie sur coût ?",o:["3,2","4,8","0,3","1,9"],a:0,e:"Valeur vie = 800 x 6 = 4 800 €. Ratio = 4 800 / 1 500 = 3,2, ce qui est acceptable."}};

BRIEFS["concentration"]={why:"La concentration est le premier risque identifié par tout acquéreur et la première cause de décote.",
pts:["Calculer la part des trois, cinq et dix premiers clients dans le chiffre d'affaires et dans la marge.","La concentration en marge est souvent plus forte que la concentration en chiffre d'affaires : c'est elle qui compte.","Concentration fournisseur : un fournisseur unique sur un composant critique est un risque équivalent.","Dépendance aux hommes clés : quelle part du chiffre d'affaires disparaît si telle personne part ?","Chaque concentration se présente avec son ancienneté, son contrat et son historique de renouvellement."],
q:{q:"Le premier client fait 22 % du chiffre d'affaires mais 38 % de la marge. Quelle lecture ?",o:["La dépendance réelle est bien supérieure à ce que suggère le chiffre d'affaires","La situation est confortable","Le client est peu rentable","Aucune conclusion"],a:0,e:"Perdre ce client ferait disparaître plus du tiers de la marge, donc une part encore plus grande de l'EBE compte tenu des coûts fixes."}};

BRIEFS["saisonnalite"]={why:"La saisonnalité change le BFR, le besoin de financement et la date optimale de closing.",
pts:["Reconstituer le chiffre d'affaires mensuel sur vingt-quatre mois minimum.","Distinguer saisonnalité, qui se répète, et cyclicité, qui suit l'économie sur plusieurs années.","Le BFR de pointe peut dépasser de 40 % le BFR de clôture. C'est lui qui dimensionne les lignes court terme.","La date de closing se choisit en connaissance de la saisonnalité, elle affecte le calcul du BFR normatif.","Une activité cyclique se valorise sur une moyenne de cycle, pas sur le point haut."],
q:{q:"Comment valoriser une activité cyclique en haut de cycle ?",o:["Sur un résultat moyen de cycle, pas sur le point haut","Sur le résultat de l'année en cours","Sur le point bas","Le cycle n'a pas d'importance"],a:0,e:"Capitaliser un résultat de pic revient à supposer que le pic est permanent. L'acquéreur ne l'acceptera pas et l'histoire lui donnera raison."}};

BRIEFS["kpi-sectoriels"]={why:"Comparer une société à son secteur révèle en une page ce qu'une analyse détaillée mettrait des jours à établir.",
pts:["Choisir cinq à huit indicateurs pertinents pour le secteur, pas une liste générique.","Sources françaises : Banque de France pour les ratios sectoriels, fédérations professionnelles, études spécialisées.","Comparer sur trois ans pour distinguer un écart structurel d'un accident conjoncturel.","Un écart favorable inexpliqué mérite autant d'attention qu'un écart défavorable.","Présenter en écart à la médiane, pas en valeur absolue : c'est l'écart qui porte l'information."],
q:{q:"La marge d'EBE dépasse la médiane sectorielle de 8 points depuis quatre ans. Quelle attitude ?",o:["Chercher l'explication : avantage réel ou artefact comptable","Accepter comme une bonne nouvelle","Réduire le multiple","Ignorer l'écart"],a:0,e:"Un écart favorable durable est soit un avantage concurrentiel qui justifie une prime, soit un problème de périmètre ou de comptabilisation. Les deux méritent d'être établis."}};

BRIEFS["equipe-dirigeante"]={why:"En small cap, la dépendance au dirigeant est souvent le premier facteur de décote.",
pts:["Cartographier qui détient la relation client, le savoir-faire technique, les relations fournisseurs.","Mesurer la part du chiffre d'affaires directement apportée ou suivie par le cédant.","Évaluer la profondeur du second rang : existe-t-il un successeur interne identifié ?","La durée et le format de l'accompagnement se négocient en fonction de cette cartographie.","Un management de second rang solide vaut une prime, une dépendance totale vaut une décote et un earn out."],
q:{q:"Le cédant suit personnellement 70 % du chiffre d'affaires. Quelle conséquence sur la transaction ?",o:["Décote, accompagnement long et probable complément de prix","Prime de qualité","Aucun impact","Le prix augmente"],a:0,e:"L'acquéreur achète un risque de transfert. Il le traite par le prix, par la durée d'accompagnement et par un mécanisme conditionnel."}};

/* ── Phase 6, process ── */
BRIEFS["typologie-operations"]={why:"Ce qui est cédé détermine la fiscalité, les garanties et le prix. C'est la première question du dossier.",
pts:["Cession de titres : l'acquéreur reprend la société avec son passé, d'où la garantie d'actif et de passif.","Cession de fonds de commerce : reprise des actifs sans le passé, mais formalisme lourd et solidarité fiscale temporaire.","Cession de portefeuille ou de clientèle : usuel en courtage et en expertise comptable, prix exprimé en multiple de commissions ou d'honoraires.","Apport ou fusion : opérations à effet de levier fiscal, plus complexes, souvent entre professionnels.","Le choix a un effet fiscal majeur pour le cédant : plus-value sur titres contre plus-value professionnelle."],
q:{q:"Quelle différence majeure entre cession de titres et cession de fonds de commerce ?",o:["La reprise ou non du passif antérieur","Le prix","Le délai","La confidentialité"],a:0,e:"En cession de titres, la société conserve tout son passé, y compris ses passifs inconnus. C'est la raison d'être de la garantie d'actif et de passif."}};

BRIEFS["sell-buy-side"]={why:"Les deux mandats n'ont ni le même rythme, ni les mêmes livrables, ni les mêmes critères de succès.",
pts:["Sell side : maximiser le prix et la sécurité d'exécution, créer de la concurrence entre acquéreurs.","Buy side : trouver la cible, éviter le processus compétitif, sécuriser une exclusivité tôt.","Le sell side produit teaser, mémorandum, data room. Le buy side produit une liste de cibles et une thèse.","Le rythme du sell side est imposé par le calendrier du process, celui du buy side par la disponibilité des cibles.","Le taux de succès d'un mandat vendeur bien préparé est nettement supérieur à celui d'un mandat acquéreur."],
q:{q:"Quel est l'objectif principal d'un acquéreur conseillé en buy side ?",o:["Éviter le processus compétitif et sécuriser une exclusivité tôt","Faire monter les enchères","Publier un teaser","Créer une data room"],a:0,e:"La concurrence fait monter le prix. Un acquéreur cherche à traiter en bilatéral, un vendeur cherche l'inverse."}};

BRIEFS["mandat"]={why:"Le mandat encadre la relation, la rémunération et le périmètre. Ce qui n'y figure pas se discute mal ensuite.",
pts:["Exclusivité, durée, périmètre géographique et sectoriel des acquéreurs approchés.","Rémunération : forfait de préparation, honoraires de succès, barème dégressif ou progressif.","Clause de survie : commission due si l'opération se réalise dans les mois suivant la fin du mandat, avec un acquéreur présenté.","Liste des acquéreurs exclus, généralement ceux déjà en contact avec le cédant.","Obligations réciproques : le cédant s'engage à fournir l'information et à ne pas négocier en direct."],
q:{q:"À quoi sert la clause de survie d'un mandat ?",o:["Protéger le conseil si l'opération se conclut peu après la fin du mandat avec un acquéreur qu'il a présenté","Prolonger l'exclusivité","Fixer les honoraires","Limiter la responsabilité"],a:0,e:"Sans cette clause, il suffirait d'attendre l'expiration du mandat pour conclure sans payer les honoraires de succès."}};

BRIEFS["origination"]={why:"Sans dossier, pas de métier. La qualification évite de travailler six mois sur une opération qui ne se fera pas.",
pts:["Trois questions de qualification : le cédant est-il décidé, l'entreprise est-elle cessible, les attentes de prix sont-elles réalistes ?","Un cédant qui ne peut pas dire pourquoi il vend maintenant n'est pas prêt.","Vérifier l'actionnariat réel : un associé minoritaire opposé bloque toute opération.","Établir une fourchette de valeur avant de signer le mandat, et la partager.","Consigner immédiatement la qualification dans l'outil de suivi, avec la date et le verbatim des attentes de prix."],
q:{q:"Quel signal indique qu'un cédant n'est pas prêt ?",o:["Il ne peut pas expliquer pourquoi il vend maintenant","Il demande un prix élevé","Il veut réfléchir une semaine","Il consulte plusieurs conseils"],a:0,e:"L'absence de déclencheur clair signale une réflexion inaboutie. Le process s'arrêtera au premier obstacle, souvent après plusieurs mois de travail."}};

BRIEFS["dataroom"]={why:"La data room est le lieu de la transparence organisée. Sa qualité conditionne le rythme de la transaction.",
pts:["Arborescence standard : juridique, financier, fiscal, social, commercial, opérationnel, immobilier, assurances.","Nommage uniforme des fichiers, avec date et version. Aucun document sans date.","Journal des accès et des téléchargements, utile en cas de contentieux ultérieur.","Les questions se centralisent dans un tableau unique : question, date, auteur, réponse, pièce jointe, statut.","Aucune réponse orale sans consignation écrite dans le tableau."],
q:{q:"Pourquoi centraliser les questions dans un tableau unique ?",o:["Traçabilité, cohérence des réponses et preuve de l'information communiquée","Pour gagner du temps","Parce que la loi l'impose","Pour limiter le nombre de questions"],a:0,e:"En cas de litige sur une garantie, la question est de savoir ce qui a été communiqué et quand. Le tableau en est la preuve."}};

BRIEFS["dd-juridique"]={why:"Les risques juridiques, fiscaux et sociaux se transforment en garanties spécifiques ou en réduction de prix.",
pts:["Juridique : statuts, pactes, titres, contrats significatifs, contentieux, propriété intellectuelle, baux.","Fiscal : conformité des déclarations, contrôles passés, positions agressives, prix de transfert le cas échéant.","Social : contrats de travail, conventions collectives, heures supplémentaires, requalifications, représentation du personnel.","Le risque social est souvent le plus sous-estimé en PME française : temps de travail, forfaits jours, statut des cadres.","Chaque risque identifié se chiffre en probabilité fois impact, puis se traite en prix, garantie ou condition suspensive."],
q:{q:"Quel risque est le plus fréquemment sous-estimé dans une PME française ?",o:["Le risque social : temps de travail, forfaits jours, requalifications","Le risque environnemental","Le risque de change","Le risque informatique"],a:0,e:"Les irrégularités sur le temps de travail sont fréquentes, difficiles à régulariser rétroactivement et peuvent représenter plusieurs années de rappels."}};

BRIEFS["dette-nette-closing"]={why:"La définition contractuelle de la dette nette prime sur toute logique comptable. Elle se rédige mot à mot.",
pts:["Le protocole liste limitativement les postes inclus, avec référence aux comptes du plan comptable.","Prévoir le sort des éléments non listés : exclusion par défaut ou inclusion par principe général.","Fixer les principes comptables applicables et leur permanence par rapport aux comptes de référence.","Prévoir le mécanisme de résolution des désaccords : expert indépendant, délai, répartition des frais.","Annexer un exemple de calcul chiffré sur les derniers comptes disponibles : c'est la meilleure protection contre l'interprétation."],
q:{q:"Quelle annexe protège le mieux contre les divergences d'interprétation de la dette nette ?",o:["Un exemple de calcul chiffré sur les derniers comptes disponibles","La liste des comptes bancaires","Le tableau d'amortissement","Les statuts"],a:0,e:"Un exemple chiffré rend la méthode incontestable. Une définition littéraire seule laisse toujours place à l'interprétation."}};

BRIEFS["spa"]={why:"Le protocole traduit en droit ce qui a été négocié en économie. Un décalage entre les deux coûte cher.",
pts:["Objet, prix et modalités, conditions suspensives, période intercalaire, déclarations et garanties, indemnisation.","La période intercalaire encadre la gestion entre signature et closing : actes courants autorisés, décisions importantes soumises à accord.","Les conditions suspensives doivent être objectives et vérifiables, avec une date butoir.","Les déclarations du vendeur sont la base de la garantie : chaque déclaration fausse ouvre droit à indemnisation.","La divulgation organisée (disclosure) neutralise une déclaration : ce qui est révélé n'est plus garanti."],
q:{q:"Quel est l'effet d'une divulgation organisée dans un protocole ?",o:["Ce qui est révélé n'est plus couvert par la garantie","Cela augmente le prix","Cela annule le protocole","Cela prolonge la garantie"],a:0,e:"C'est le mécanisme central : le vendeur révèle, donc l'acquéreur achète en connaissance de cause. D'où l'importance de la qualité des annexes de divulgation."}};

/* ── Phase 7, modèles avancés ── */
BRIEFS["merger-structure"]={why:"Un merger model combine deux sociétés et un financement. Sa structure est plus lourde qu'un LBO.",
pts:["Trois blocs : acquéreur seul, cible seule, entité combinée après ajustements.","Ajustements de consolidation : élimination des flux intragroupe, amortissements du PPA, coût du financement.","Le calendrier compte : une acquisition en cours d'année n'apporte que la fraction de résultat correspondante.","Prévoir une bascule entre financement en dette, en actions et mixte, pilotée par une seule cellule.","Sortie principale : relution ou dilution du bénéfice par action et effet sur le levier de l'acquéreur."],
q:{q:"Quels ajustements distinguent l'entité combinée de la simple somme des deux sociétés ?",o:["Élimination des flux intragroupe, amortissements du PPA et coût du financement","Aucun, c'est une addition","Uniquement le chiffre d'affaires","Seulement les impôts"],a:0,e:"Une addition brute ignore les effets de l'acquisition elle-même, qui sont précisément ce que le modèle cherche à mesurer."}};

BRIEFS["financement-acquisition"]={why:"La structure de financement décide autant du succès de l'opération que le prix payé.",
pts:["Capacité d'endettement estimée par le levier soutenable et par la couverture du service de la dette.","Les banques françaises small cap raisonnent en levier de 2,5 à 3,5x l'EBITDA normatif et en apport minimum de 30 à 40 %.","La dette vendeur comble l'écart entre le prix demandé et la capacité de financement, avec un rang subordonné.","Prévoir une ligne de trésorerie court terme distincte de la dette d'acquisition, dimensionnée sur le BFR de pointe.","Le calendrier bancaire est le premier facteur de retard d'un closing : anticiper de huit à douze semaines."],
q:{q:"À quoi sert principalement une dette vendeur ?",o:["Combler l'écart entre le prix demandé et la capacité de financement de l'acquéreur","Réduire le prix","Éviter la garantie d'actif et de passif","Accélérer le closing"],a:0,e:"Elle permet de conclure une opération que le financement bancaire seul ne couvre pas, en échange d'un rang subordonné et souvent d'un taux supérieur."}};

BRIEFS["tranches-dette"]={why:"Chaque tranche a son rang, son coût et ses contraintes. La combinaison détermine la flexibilité du montage.",
pts:["Senior amortissable : la moins chère, la plus contraignante en covenants et en amortissement.","Senior in fine : remboursement au terme, préserve la trésorerie mais coûte plus cher.","Unitranche : une seule ligne, plus chère que la senior, plus souple, fournie par des fonds de dette.","Mezzanine : subordonnée, taux élevé partiellement capitalisé, parfois assortie de bons de souscription.","Dette vendeur : la plus subordonnée, souvent la moins chère, mais dépend de l'accord du cédant."],
q:{q:"Quelle tranche offre la plus grande souplesse opérationnelle en contrepartie d'un coût supérieur ?",o:["L'unitranche","La senior amortissable","La dette vendeur","Le revolver"],a:0,e:"L'unitranche allège les covenants et l'amortissement contractuel, ce que les fonds de dette facturent par un taux plus élevé."}};

BRIEFS["management-package"]={why:"Le management package aligne les intérêts des dirigeants et du sponsor. Sa mécanique est un sujet à part entière.",
pts:["Actions ordinaires souscrites au même prix que le sponsor, plus instruments donnant droit à une rétrocession.","La courbe de rétrocession attribue une part croissante de la plus-value au management au-delà de seuils de TRI ou de multiple.","Clauses de bonne et de mauvaise sortie : le départ volontaire ou fautif réduit ou annule les droits.","Le traitement fiscal et social des gains est un sujet sensible en France : structuration à valider par un conseil spécialisé.","Le package se dimensionne pour représenter typiquement 5 à 15 % de la plus-value en cas de succès."],
q:{q:"Que déclenche généralement la courbe de rétrocession d'un management package ?",o:["Le franchissement de seuils de TRI ou de multiple par le sponsor","La signature du protocole","Le remboursement de la dette","Le départ du dirigeant"],a:0,e:"Le management n'est rétrocédé qu'après que le sponsor a atteint son rendement plancher. Au-delà, sa part augmente par paliers."}};

BRIEFS["structure-capital"]={why:"Trop de dette fragilise, trop peu détruit du rendement. L'arbitrage se chiffre.",
pts:["Capacité d'endettement = niveau de dette que les flux futurs peuvent servir dans un scénario dégradé.","Le levier optimal maximise la valeur en équilibrant économie d'impôt et coût de la détresse financière.","En pratique, la contrainte vient des banques et des covenants, pas de la théorie.","Tester la capacité par le scénario bas : quel niveau de dette reste soutenable si l'EBITDA baisse de 20 % ?","Une structure trop tendue supprime toute capacité d'investissement pendant la période, ce qui coûte en croissance."],
q:{q:"Comment déterminer en pratique la capacité d'endettement d'une PME ?",o:["Par le service de la dette soutenable dans un scénario dégradé","Par la théorie du levier optimal","Par le levier moyen du secteur","Par la volonté du cédant"],a:0,e:"Les banques raisonnent en capacité de remboursement sous stress. C'est cette contrainte, et non l'optimum théorique, qui fixe le montant levé."}};

BRIEFS["analyser-deal"]={why:"Analyser une opération réelle de bout en bout est le meilleur exercice de synthèse.",
pts:["Reconstituer le contexte : pourquoi cette cible, pourquoi cet acquéreur, pourquoi maintenant.","Retrouver le prix et le multiple : communiqués, comptes consolidés de l'acquéreur, annexes de regroupement.","Reconstruire le financement à partir du bilan de l'acquéreur avant et après.","Identifier les synergies annoncées et vérifier leur réalisation deux ans plus tard.","Conclure par un jugement argumenté : opération créatrice ou destructrice de valeur, et pourquoi."],
q:{q:"Où retrouver le prix d'une acquisition non publié dans les communiqués ?",o:["Dans l'annexe de regroupement d'entreprises des comptes consolidés de l'acquéreur","Dans le Kbis","Dans le registre du commerce","Nulle part"],a:0,e:"IFRS 3 impose de détailler la contrepartie transférée et l'allocation du prix. C'est la source la plus fiable et la plus accessible."}};

BRIEFS["circularite-interets"]={why:"Les intérêts dépendent du solde de dette, qui dépend du cash, qui dépend des intérêts. Cette boucle doit être maîtrisée, pas subie.",
pts:["Trois options : solde d'ouverture, solde moyen avec calcul itératif, ou résolution algébrique.","Solde d'ouverture : aucune circularité, écart d'intérêts de 2 à 5 % sur l'année, acceptable dans un modèle diffusé.","Solde moyen avec itération : plus exact, mais le classeur devient fragile chez un destinataire dont l'option est désactivée.","Prévoir systématiquement un interrupteur de coupure permettant de forcer les intérêts à zéro pour repartir d'un état sain.","Documenter le choix retenu sur la feuille d'hypothèses : c'est la première question d'un auditeur."],
q:{q:"Quelle méthode de calcul des intérêts éviter dans un modèle destiné à circuler chez un tiers ?",o:["Le solde moyen avec calcul itératif activé","Le solde d'ouverture","Un taux fixe","Le solde de clôture seul"],a:0,e:"L'option de calcul itératif est désactivée par défaut dans Excel. Chez le destinataire, le modèle affiche alors des erreurs de référence circulaire en cascade."}};

      "Un cabinet dont les annexes dépassent 35 % des honoraires de gestion doit être examiné : la pratique tarifaire est-elle soutenable ?"],
 q:[{q:"Les prestations annexes représentent 45 % des honoraires de gestion. Quelle lecture ?",o:["Examiner la soutenabilité de la pratique tarifaire et le risque de contestation","Excellente rentabilité, prime de valeur","Aucune importance","Le cabinet est sous-tarifé"],a:0,e:"Une facturation annexe très élevée peut traduire une politique commerciale agressive, contestable par les clients et difficile à maintenir sous un nouvel actionnaire."},
    {q:"Quel élément est le socle récurrent d'un cabinet de gérance ?",o:["Le pourcentage prélevé sur les loyers encaissés","Les honoraires de relocation","Les honoraires de transaction","Les honoraires de travaux"],a:0,e:"La gestion courante est assise sur un flux de loyers stable et se reconduit tacitement. C'est elle qui porte le multiple."}]},

{id:"v-immo-risques",v:"immo",nom:"Risques spécifiques : fonds mandants, garantie, contentieux",min:40,
 why:"Les risques du secteur ne sont pas financiers, ils sont réglementaires et contentieux. Ils se découvrent en audit et coûtent cher.",
 pts:["Fonds mandants : les sommes détenues pour le compte des clients doivent être strictement séparées. Toute confusion est un signal grave.",
      "Garantie financière : son montant doit couvrir en permanence les fonds détenus. Un dépassement expose à un retrait de carte.",
      "Carte professionnelle : validité, renouvellement, aptitude professionnelle du titulaire.",
      "Contentieux de copropriété : mises en cause de responsabilité du syndic, souvent longues et mal provisionnées.",
      "Impayés locataires et recouvrement : un taux dégradé annonce des contentieux et une perte de mandats."],
 q:[{q:"Les fonds mandants ne sont pas strictement séparés des fonds du cabinet. Quelle gravité ?",o:["Très élevée : manquement réglementaire pouvant entraîner un retrait de carte professionnelle","Faible, c'est une pratique courante","Aucune si les comptes sont justes","Uniquement un sujet comptable"],a:0,e:"La séparation des fonds est une obligation fondamentale de la loi Hoguet. Sa méconnaissance met en cause l'existence même de l'activité."},
    {q:"Que doit couvrir en permanence la garantie financière ?",o:["Le montant maximal des fonds détenus pour le compte des mandants","Le chiffre d'affaires","Les honoraires annuels","Les dettes du cabinet"],a:0,e:"La garantie protège les clients contre la défaillance du professionnel détenteur de leurs fonds. Un dépassement doit être corrigé immédiatement."}]},

{id:"v-immo-transmission",v:"immo",nom:"Transmission : agrément, carte et transfert des mandats",min:35,
 why:"Techniquement, tout tient. Opérationnellement, un mandat mal transféré est un mandat perdu.",
 pts:["En cession de titres, les mandats et contrats de syndic ne sont pas transférés : la société reste cocontractante.",
      "En cession de fonds, chaque mandat doit être repris, ce qui suppose l'accord du mandant ou un vote d'assemblée pour le syndic.",
      "La carte professionnelle est attachée à la personne morale et à son représentant : vérifier l'aptitude du repreneur.",
      "Informer les copropriétés au bon moment : trop tôt, on ouvre la porte à la concurrence, trop tard, on abîme la confiance.",
      "Prévoir une période d'accompagnement avec présence physique du cédant aux assemblées les plus sensibles."],
 q:[{q:"En cession de titres, faut-il faire revoter chaque copropriété pour le contrat de syndic ?",o:["Non, la société cocontractante reste la même","Oui, systématiquement","Oui, mais seulement les grandes","Cela dépend du prix"],a:0,e:"Le contrat lie la copropriété à la société. Un changement d'actionnaire n'emporte pas changement de cocontractant, sauf clause particulière."},
    {q:"Quel est le principal risque d'une information trop précoce des copropriétés ?",o:["Ouvrir la porte à la mise en concurrence par des cabinets concurrents","Un coût administratif","Une sanction de l'Ordre","Aucun"],a:0,e:"Un changement de contrôle annoncé avant d'être maîtrisé donne un argument commercial aux concurrents lors des assemblées suivantes."}]},

/* ═══ Expertise comptable ═══ */
{id:"v-ec-modele",v:"ec",nom:"Le modèle économique d'un cabinet d'expertise comptable",min:35,
 why:"Un cabinet vend des heures assemblées en missions récurrentes. Comprendre où se crée la marge conditionne toute la valorisation.",
 pts:["Le revenu est presque entièrement récurrent : missions annuelles de tenue, révision, paie, juridique.",
      "La marge se fait sur l'écart entre le taux horaire facturé et le coût horaire chargé du collaborateur qui produit.",
      "Le taux de production, part des heures facturables réellement facturées, est le premier levier de rentabilité.",
      "La numérisation déplace la valeur de la saisie vers le conseil : un cabinet en retard technologique a un rattrapage à financer.",
      "La structure de la pyramide, ratio collaborateurs sur associés, détermine la capacité à dégager de la marge."],
 q:[{q:"Quel est le premier levier de rentabilité d'un cabinet d'expertise comptable ?",o:["Le taux de production, c'est-à-dire les heures facturées sur heures travaillées","Le nombre de clients","La taille des locaux","Le chiffre d'affaires total"],a:0,e:"Un cabinet à 60 % de taux de production et un cabinet à 78 % ont, à structure identique, des rentabilités sans commune mesure."},
    {q:"Un cabinet utilise encore une saisie manuelle intégrale. Impact sur la valeur ?",o:["Décote : un rattrapage technologique est à financer par l'acquéreur","Prime pour la maîtrise des dossiers","Aucun effet","Le multiple augmente"],a:0,e:"La modernisation coûte, prend un an, et pendant ce temps la productivité baisse. C'est un retraitement d'EBE négatif ou une réduction de prix."}]},

{id:"v-ec-portefeuille",v:"ec",nom:"Analyser un portefeuille de clients et d'honoraires",min:40,
 why:"La moyenne ment. Ce qui compte, c'est la distribution des honoraires et de la rentabilité par dossier.",
 pts:["Extraire la liste : client, nature de mission, honoraires annuels, ancienneté, temps passé, associé référent.",
      "Trier par honoraires décroissants et mesurer la concentration : part des vingt premiers clients.",
      "Croiser honoraires et temps passé pour identifier les dossiers déficitaires, en général 15 à 25 % du portefeuille.",
      "Repérer les dossiers portés personnellement par le cédant : ce sont eux qui partent en premier.",
      "Vérifier l'existence et la mise à jour des lettres de mission, condition de l'opposabilité des honoraires."],
 cas:"Portefeuille de 320 dossiers pour 1 150 k€ d'honoraires. Les 20 premiers clients pèsent 31 %. Le croisement honoraires et temps révèle que 62 dossiers, soit 19 % du portefeuille et 7 % des honoraires, sont produits à perte. Leur arrêt ou leur retarification libère environ 55 k€ de capacité, ce qui constitue un levier chiffré et documenté pour l'acquéreur.",
 q:[{q:"Quel croisement révèle les dossiers déficitaires ?",o:["Honoraires facturés rapportés au temps réellement passé","Honoraires rapportés au chiffre d'affaires du client","Ancienneté rapportée aux honoraires","Nombre de dossiers par associé"],a:0,e:"C'est le coût de production réel qui détermine la rentabilité. Sans suivi des temps, cette analyse est impossible, ce qui est en soi un constat d'audit."},
    {q:"Pourquoi vérifier les lettres de mission ?",o:["Elles conditionnent l'opposabilité des honoraires et la définition du périmètre","Elles fixent le prix de cession","Elles sont exigées par les banques","Elles n'ont aucune importance"],a:0,e:"Une mission sans lettre signée expose à une contestation d'honoraires et à une incertitude sur l'étendue de la responsabilité."}]},

{id:"v-ec-valorisation",v:"ec",nom:"Valoriser un cabinet : pourcentage d'honoraires et EBE",min:45,
 why:"La convention du pourcentage d'honoraires est simple et universellement comprise. Elle est aussi trompeuse dès que la rentabilité s'écarte de la moyenne.",
 pts:["Pourcentage des honoraires annuels : 0,8x à 1,3x selon la rentabilité, la structure et la qualité du portefeuille.",
      "Le pourcentage suppose implicitement un taux de marge standard, souvent autour de 20 à 25 % d'EBE retraité.",
      "Dès que la marge s'écarte de ce standard, le multiple d'EBE retraité devient la seule méthode juste.",
      "Correctifs usuels : concentration, dépendance au cédant, âge du portefeuille, retard technologique, pyramide des âges.",
      "Le prix se paie rarement comptant : étalement sur deux à trois ans et clause de rétention des clients sont la norme."],
 cas:"Cabinet à 1 150 k€ d'honoraires, EBE retraité 310 k€, soit 27 % de marge. À 1,0x les honoraires, la valeur ressort à 1 150 k€, soit 3,7x l'EBE. À 5,5x l'EBE, elle ressort à 1 705 k€, soit 1,48x les honoraires. L'écart de 555 k€ s'explique entièrement par la rentabilité supérieure au standard implicite de la convention. C'est cet écart qu'il faut documenter et défendre.",
 q:[{q:"Un cabinet dégage 30 % de marge d'EBE contre 22 % pour le marché. Quelle méthode le sert le mieux ?",o:["Le multiple d'EBE retraité","Le pourcentage des honoraires","Le prix par dossier","La valeur comptable"],a:0,e:"Le pourcentage d'honoraires suppose une rentabilité standard. Il transfère gratuitement à l'acquéreur la surperformance du cabinet."},
    {q:"Quelle est la forme de paiement la plus courante dans ce secteur ?",o:["Un étalement sur deux à trois ans avec clause de rétention des clients","Comptant intégral au closing","Paiement à cinq ans","Échange de titres"],a:0,e:"La valeur dépend de la rétention post-cession, qui ne se constate qu'après. Le paiement suit donc la constatation."}]},

{id:"v-ec-production",v:"ec",nom:"Taux de production, rentabilité et outils",min:35,
 why:"Trois indicateurs suffisent à juger l'organisation d'un cabinet et à chiffrer le potentiel d'amélioration.",
 pts:["Taux de production : heures facturées sur heures travaillées. Repère de 70 à 80 % chez les collaborateurs.",
      "Taux horaire moyen réalisé : honoraires divisés par les heures passées. À comparer au taux affiché.",
      "Écart de réalisation : différence entre le budget de la mission et le temps réellement consommé.",
      "Un écart de réalisation systématiquement négatif signale une sous-tarification, pas une inefficacité.",
      "Le levier d'amélioration se chiffre : deux points de taux de production sur dix collaborateurs valent environ 35 à 50 k€ d'EBE."],
 q:[{q:"Le taux horaire réalisé est très inférieur au taux affiché sur la majorité des dossiers. Quelle conclusion ?",o:["Sous-tarification structurelle ou dépassements systématiques, à chiffrer comme levier","Les collaborateurs sont trop lents","Le cabinet est très rentable","Aucune conclusion possible"],a:0,e:"L'écart entre affiché et réalisé mesure la valeur perdue. Il constitue un levier de création de valeur chiffrable pour l'acquéreur."},
    {q:"Combien vaut environ un gain de deux points de taux de production sur dix collaborateurs ?",o:["Entre 35 et 50 k€ d'EBE","Moins de 5 k€","Environ 200 k€","Rien de mesurable"],a:0,e:"Deux points de production sur dix collaborateurs représentent environ 300 heures facturables supplémentaires. Au taux horaire net, le gain se situe dans cet ordre."}]},

{id:"v-ec-deontologie",v:"ec",nom:"Contraintes ordinales et déontologiques de la cession",min:35,
 why:"L'Ordre encadre la profession, y compris la transmission. Ignorer ce cadre fait perdre des semaines et parfois l'opération.",
 pts:["Seul un professionnel inscrit peut détenir le contrôle d'une société d'expertise comptable : le vivier d'acquéreurs est restreint.",
      "Les règles de détention du capital et des droits de vote encadrent strictement l'entrée d'investisseurs non professionnels.",
      "Le commissariat aux comptes obéit à des règles d'incompatibilité et de rotation propres, distinctes de l'expertise comptable.",
      "Une clause de non-concurrence doit rester proportionnée en durée, en périmètre et en zone géographique.",
      "L'information des clients et le transfert des dossiers obéissent au secret professionnel : la data room doit être anonymisée."],
 q:[{q:"Un fonds d'investissement généraliste peut-il prendre le contrôle d'un cabinet d'expertise comptable ?",o:["Non, les règles de détention réservent le contrôle aux professionnels inscrits","Oui, sans condition","Oui, jusqu'à 90 %","Uniquement s'il est étranger"],a:0,e:"C'est une contrainte structurante du secteur : elle restreint fortement la liste des acquéreurs et pèse sur les multiples observés."},
    {q:"Quelle précaution s'impose dans la data room d'un cabinet comptable ?",o:["Anonymiser les données clients au titre du secret professionnel","Ne rien communiquer","Ne fournir que le bilan","Publier la liste complète des clients"],a:0,e:"Le secret professionnel interdit de révéler l'identité et les données des clients avant que la cession ne soit acquise. On travaille sur des listes anonymisées."}]},

{id:"v-ec-integration",v:"ec",nom:"Intégration post-cession et rétention des clients",min:40,
 why:"Le prix se paie sur la rétention. L'intégration n'est pas un sujet d'après, c'est un sujet de négociation.",
 pts:["Objectif de rétention à douze mois : 85 à 95 % des honoraires avec un accompagnement structuré.",
      "Séquencer l'annonce : associés, puis collaborateurs, puis clients, en quelques jours, jamais en quelques semaines.",
      "Visiter personnellement les vingt premiers clients avec le cédant dans les soixante jours suivant le closing.",
      "Ne pas changer d'outil de production et d'interlocuteur la même année : un seul changement à la fois.",
      "Sécuriser les chefs de mission avant les clients : un collaborateur qui part emmène souvent son portefeuille."],
 cas:"Portefeuille de 1 150 k€. Une rétention de 92 % laisse 1 058 k€, une rétention de 78 % laisse 897 k€. L'écart de 161 k€ par an représente, au multiple de 5,5x, près de 890 k€ de valeur. Aucun levier de rentabilité n'a cet effet. C'est pourquoi le complément de prix se calibre presque toujours sur la rétention.",
 q:[{q:"Quel est l'ordre d'annonce recommandé lors d'une cession de cabinet ?",o:["Associés, puis collaborateurs, puis clients, en quelques jours","Clients, puis collaborateurs","Tout le monde en même temps par courriel","Collaborateurs seulement"],a:0,e:"Un collaborateur qui apprend la cession par un client se sent trahi. La séquence protège la confiance interne, qui protège ensuite la relation client."},
    {q:"Pourquoi sécuriser les chefs de mission avant les clients ?",o:["Un collaborateur qui part emmène souvent son portefeuille de dossiers","Ils coûtent moins cher","La loi l'impose","Ce n'est pas prioritaire"],a:0,e:"Dans un cabinet, la relation opérationnelle quotidienne est portée par le chef de mission, pas par l'associé. Son départ entraîne des résiliations en cascade."}]}
];

/** Échappe le HTML. */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}
/** Typographie française : espace insécable avant : ; ! ? et après «. */
function typo(s){
  return String(s==null?"":s)
    .replace(/ ([:;!?»])/g,"\u202f$1")
    .replace(/« /g,"«\u202f");
}
/** Texte échappé et typographié, pour insertion HTML. */
function T(s){ return typo(esc(s)); }
/** HTML de confiance, seulement typographié. */
function H(s){ return typo(String(s==null?"":s)); }

const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
const todayISO = () => new Date().toISOString().slice(0,10);
const addDays = (iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const dayDiff = (a,b)=> Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));
const dur = m => m>=60 ? (Math.floor(m/60)+" h "+(m%60?String(m%60).padStart(2,"0"):"")).trim() : m+" min";
const mmss = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

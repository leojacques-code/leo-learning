<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hub M&amp;A Triactis : plateforme d'apprentissage de la finance de transaction. 7 phases, 108 modules, fiches de révision espacée, référentiel de 130 termes.">
<meta name="theme-color" content="#0e100f">
<title>Hub M&amp;A · Triactis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e100f'/><text y='68' x='50' text-anchor='middle' font-size='54' font-family='sans-serif' font-weight='700' fill='%230ae448'>M</text></svg>">
<style>
/* ═══════════════════════════════════════════════════════════
   HUB M&A · TRIACTIS
   Feuille de style unique. Aucune dépendance externe hors polices.
   1. Tokens · 2. Reset · 3. Layout · 4. Composants · 5. Vues
   6. Animations · 7. Responsive · 8. Impression / a11y
   ═══════════════════════════════════════════════════════════ */

/* ── 1. TOKENS ─────────────────────────────────────────────── */
:root{
  /* palette de marque */
  --just-black:#0e100f; --cream:#fffce1; --s50:#7c7c6f; --s25:#42433d;
  --green:#0ae448; --lgreen:#abff84; --orange:#ff8709; --pink:#fec5fb;
  --lilac:#9d95ff; --blue:#00bae2; --magenta:#f100cb; --red:#ff4d4d;

  /* sémantique (thème sombre par défaut) */
  --bg:#0e100f; --bg-elev:#151714; --bg-elev-2:#1c1e1a; --bg-hover:#22241f;
  --fg:#fffce1; --fg-muted:#8f9083; --fg-dim:#63645a;
  --line:#2b2d28; --line-strong:#42433d;
  --accent:var(--green); --accent-fg:#0e100f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 32px rgba(0,0,0,.35);
  --shadow-sm:0 1px 3px rgba(0,0,0,.35);
  --glass:rgba(14,16,15,.78);

  /* typographie */
  --font:"Inter Tight",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --t-xs:12px; --t-sm:13.5px; --t-base:15px; --t-md:17px; --t-lg:20px;
  --t-xl:26px; --t-2xl:34px; --t-3xl:46px; --t-4xl:62px;

  /* espacements et rayons */
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:26px; --r-full:999px;
  --sidebar-w:268px; --header-h:58px; --wrap:1180px;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="light"]{
  --bg:#faf9f0; --bg-elev:#ffffff; --bg-elev-2:#f3f1e2; --bg-hover:#eceada;
  --fg:#14170f; --fg-muted:#5f6154; --fg-dim:#8a8b7d;
  --line:#e2dfcc; --line-strong:#cdcab4;
  --accent:#07a836; --accent-fg:#ffffff;
  --shadow:0 1px 2px rgba(20,23,15,.06),0 10px 30px rgba(20,23,15,.08);
  --shadow-sm:0 1px 3px rgba(20,23,15,.07);
  --glass:rgba(250,249,240,.82);
  --orange:#c96200; --pink:#c2379b; --lilac:#6659e0; --blue:#0074a6; --green:#07a836;
}

/* couleurs de phase, exposées comme variables pour l'accentuation contextuelle */
[data-phase="comptabilite"]{--ph:var(--blue)}
[data-phase="excel-outils"]{--ph:var(--orange)}
[data-phase="modelisation-financiere"]{--ph:var(--green)}
[data-phase="valorisation"]{--ph:var(--lilac)}
[data-phase="analyse-strategique"]{--ph:var(--pink)}
[data-phase="process-ma-dd"]{--ph:var(--blue)}
[data-phase="modeles-avances"]{--ph:var(--green)}

/* ── 2. RESET ──────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
*{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);font-size:var(--t-base);line-height:1.55;
  background:var(--bg);color:var(--fg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
  transition:background .25s var(--ease),color .25s var(--ease);
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
::selection{background:var(--accent);color:var(--accent-fg)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--fg-dim)}

/* ── 3. LAYOUT ─────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100dvh}

/* Barre latérale */
.sb{
  grid-column:1;position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  background:var(--bg-elev);border-right:1px solid var(--line);z-index:60;
}
.sb-brand{display:flex;align-items:center;gap:10px;height:var(--header-h);padding:0 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.sb-logo{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
.sb-name{font-weight:600;letter-spacing:-.02em;font-size:var(--t-base)}
.sb-name small{display:block;font-weight:400;font-size:11px;color:var(--fg-dim);letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.sb-scroll{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:12px 10px 20px}
.sb-sect{margin-top:16px}
.sb-sect:first-child{margin-top:0}
.sb-label{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-dim);padding:0 10px 7px;font-weight:600}
.sb-link{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--fg-muted);font-size:var(--t-sm);font-weight:500;
  transition:background .14s,color .14s;position:relative;
}
.sb-link:hover{background:var(--bg-hover);color:var(--fg)}
.sb-link.on{background:var(--bg-elev-2);color:var(--fg)}
.sb-link.on::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.sb-ico{width:18px;text-align:center;flex:0 0 auto;font-size:14px}
.sb-badge{margin-left:auto;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:var(--r-full);background:var(--bg-hover);color:var(--fg-dim)}
.sb-badge.hot{background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange)}

/* arbre des phases */
.tree-item{margin-bottom:2px}
.tree-head{
  display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:var(--r-sm);
  color:var(--fg-muted);font-size:var(--t-sm);font-weight:500;text-align:left;transition:background .14s,color .14s;
}
.tree-head:hover{background:var(--bg-hover);color:var(--fg)}
.tree-head.on{color:var(--fg)}
.tree-dot{width:7px;height:7px;border-radius:50%;background:var(--ph,var(--fg-dim));flex:0 0 auto;box-shadow:0 0 0 3px color-mix(in srgb,var(--ph,var(--fg-dim)) 18%,transparent)}
.tree-txt{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-pct{font-size:10.5px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
.tree-caret{width:12px;color:var(--fg-dim);font-size:9px;transition:transform .2s var(--ease)}
.tree-item.open .tree-caret{transform:rotate(90deg)}
.tree-kids{display:none;padding:2px 0 6px 26px;border-left:1px solid var(--line);margin-left:14px}
.tree-item.open .tree-kids{display:block;animation:slideDown .22s var(--ease)}
.tree-kid{
  display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;
  font-size:12.5px;color:var(--fg-dim);transition:background .14s,color .14s;
}
.tree-kid:hover{background:var(--bg-hover);color:var(--fg)}
.tree-kid.on{color:var(--fg);background:var(--bg-elev-2)}
.tree-kid .tk-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-state{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-strong);flex:0 0 auto;display:grid;place-items:center;font-size:8px}
.tk-state.done{background:var(--green);border-color:var(--green);color:#0e100f}
.tk-state.doing{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 30%,transparent)}

.sb-foot{flex:0 0 auto;border-top:1px solid var(--line);padding:10px}

/* En-tête */
.hd{
  position:sticky;top:0;z-index:50;height:var(--header-h);display:flex;align-items:center;gap:12px;
  padding:0 20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.hd-burger{display:none;width:34px;height:34px;border-radius:var(--r-sm);align-items:center;justify-content:center;color:var(--fg-muted)}
.hd-burger:hover{background:var(--bg-hover);color:var(--fg)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:var(--t-sm);color:var(--fg-dim);min-width:0;overflow:hidden}
.crumbs a{color:var(--fg-muted);white-space:nowrap;transition:color .14s}
.crumbs a:hover{color:var(--fg)}
.crumbs .sep{opacity:.45}
.crumbs .cur{color:var(--fg);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.searchbtn{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 11px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--bg-elev);color:var(--fg-dim);font-size:var(--t-sm);
  min-width:200px;transition:border-color .14s,color .14s;
}
.searchbtn:hover{border-color:var(--line-strong);color:var(--fg-muted)}
.searchbtn kbd{margin-left:auto}
kbd{
  font-family:var(--mono);font-size:10.5px;padding:2px 5px;border-radius:5px;
  background:var(--bg-elev-2);border:1px solid var(--line);color:var(--fg-dim);line-height:1;
}
.iconbtn{width:34px;height:34px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--fg-muted);transition:background .14s,color .14s}
.iconbtn:hover{background:var(--bg-hover);color:var(--fg)}
.hd-stat{display:flex;align-items:center;gap:5px;font-size:var(--t-sm);font-weight:600;color:var(--fg-muted);padding:0 8px;height:34px;border-radius:var(--r-sm)}
.hd-stat b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Zone principale */
.main{grid-column:2;display:flex;flex-direction:column;min-width:0}
.view{flex:1 1 auto;padding:32px 28px 96px;max-width:var(--wrap);width:100%;margin:0 auto;animation:pageIn .32s var(--ease)}
.view.wide{max-width:1420px}
.botnav{display:none}

/* ── 4. COMPOSANTS ─────────────────────────────────────────── */
.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
h1,h2,h3,h4{letter-spacing:-.022em;font-weight:600;line-height:1.18}
.h1{font-size:var(--t-3xl)}
.h2{font-size:var(--t-2xl)}
.h3{font-size:var(--t-xl)}
.h4{font-size:var(--t-lg)}
.lead{font-size:var(--t-md);color:var(--fg-muted);line-height:1.6}
.muted{color:var(--fg-muted)}
.dim{color:var(--fg-dim)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}

.card{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;transition:border-color .18s,transform .18s var(--ease),box-shadow .18s}
a.card:hover,button.card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
.card.flat{background:transparent}
.card.tight{padding:14px 16px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 17px;
  border-radius:var(--r-full);font-size:var(--t-sm);font-weight:600;border:1px solid var(--line-strong);
  color:var(--fg);transition:all .16s var(--ease);white-space:nowrap;
}
.btn:hover{border-color:var(--fg);background:var(--bg-hover)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;color:var(--fg-muted)}
.btn.ghost:hover{background:var(--bg-hover);color:var(--fg)}
.btn.sm{height:31px;padding:0 13px;font-size:var(--t-xs)}
.btn.lg{height:46px;padding:0 24px;font-size:var(--t-base)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.danger{border-color:color-mix(in srgb,var(--red) 45%,transparent);color:var(--red)}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 12%,transparent);border-color:var(--red)}

.pill{
  display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 13px;border-radius:var(--r-full);
  font-size:var(--t-xs);font-weight:600;border:1px solid var(--line);color:var(--fg-muted);
  transition:all .15s;white-space:nowrap;
}
.pill:hover{border-color:var(--line-strong);color:var(--fg)}
.pill.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pillrow.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:5px;scrollbar-width:none}
.pillrow.scroll::-webkit-scrollbar{display:none}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2.5px 9px;border-radius:var(--r-full);border:1px solid currentColor;line-height:1.4}
.tag.soft{border-color:transparent;background:color-mix(in srgb,currentColor 14%,transparent)}
.c-green{color:var(--green)} .c-orange{color:var(--orange)} .c-lilac{color:var(--lilac)}
.c-blue{color:var(--blue)} .c-pink{color:var(--pink)} .c-red{color:var(--red)} .c-ph{color:var(--ph,var(--fg))}

.field{
  width:100%;height:38px;padding:0 13px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--bg-elev);color:var(--fg);font-size:var(--t-sm);transition:border-color .15s;
}
.field::placeholder{color:var(--fg-dim)}
.field:focus{outline:none;border-color:var(--accent)}
textarea.field{height:auto;min-height:130px;padding:11px 13px;line-height:1.6;resize:vertical}
select.field{cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.searchwrap{position:relative}
.searchwrap .field{padding-left:36px}
.searchwrap .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-dim);pointer-events:none;font-size:13px}

.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .8s var(--ease)}
.bar.thin{height:3px}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;align-items:center;gap:12px}
.row.wrap{flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:14px}
.stack{display:flex;flex-direction:column}
.sp4{gap:4px}.sp8{gap:8px}.sp12{gap:12px}.sp16{gap:16px}.sp24{gap:24px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}.mt40{margin-top:40px}
.sec{margin-top:38px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px}

.empty{text-align:center;padding:44px 20px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);color:var(--fg-dim)}
.empty .ei{font-size:30px;margin-bottom:10px;opacity:.65}

/* Anneau de progression */
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s var(--ease)}
.ring-lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring-lbl b{font-size:var(--t-lg);font-weight:700;letter-spacing:-.03em}
.ring-lbl span{display:block;font-size:9.5px;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.08em}

/* Modale */
.ovl{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.ovl.on{display:flex}
.ovl-bg{position:absolute;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);animation:fadeIn .18s}
.modal{position:relative;width:100%;max-width:640px;background:var(--bg-elev);border:1px solid var(--line-strong);border-radius:var(--r-xl);box-shadow:var(--shadow);animation:modalIn .26s var(--ease);max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
.modal-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.modal-bd{padding:20px;overflow-y:auto}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto}

/* Palette de commandes */
.cmd{max-width:620px;padding:0}
.cmd-in{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line)}
.cmd-in input{flex:1;background:none;border:none;outline:none;font-size:var(--t-md);color:var(--fg)}
.cmd-in input::placeholder{color:var(--fg-dim)}
.cmd-list{max-height:58vh;overflow-y:auto;padding:7px}
.cmd-grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim);padding:10px 11px 5px;font-weight:600}
.cmd-it{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--r-sm);cursor:pointer;font-size:var(--t-sm)}
.cmd-it .ci{width:19px;text-align:center;flex:0 0 auto;opacity:.85}
.cmd-it .ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-it .cs{font-size:11px;color:var(--fg-dim);flex:0 0 auto}
.cmd-it.sel{background:var(--bg-hover)}
.cmd-it.sel .cs{color:var(--fg-muted)}
.cmd-ft{display:flex;gap:16px;padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--fg-dim)}

/* Notifications */
.toasts{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:var(--r);background:var(--bg-elev-2);
  border:1px solid var(--line-strong);box-shadow:var(--shadow);font-size:var(--t-sm);font-weight:500;
  animation:toastIn .3s var(--ease);max-width:340px;
}
.toast.out{animation:toastOut .25s var(--ease) forwards}
.toast.ok{border-color:color-mix(in srgb,var(--green) 55%,transparent)}
.toast.err{border-color:color-mix(in srgb,var(--red) 55%,transparent)}

/* ── 5. VUES ───────────────────────────────────────────────── */
/* Tableau de bord */
.hero{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.hero-txt{flex:1 1 300px;min-width:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:11px}
.stat{background:var(--bg-elev);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;transition:border-color .16s,transform .16s var(--ease);text-align:left}
button.stat:hover,a.stat:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.stat b{display:block;font-size:var(--t-2xl);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.stat span{display:block;font-size:var(--t-xs);color:var(--fg-dim);margin-top:3px}

.phasecard{position:relative;overflow:hidden;display:block;padding:18px}
.phasecard::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--ph) 11%,transparent),transparent 62%);opacity:.75;transition:opacity .25s;pointer-events:none}
.phasecard:hover::after{opacity:1}
.phasecard > *{position:relative;z-index:1}
.phasecard .pnum{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ph)}
.phasecard .pname{font-size:var(--t-md);font-weight:600;margin-top:3px;letter-spacing:-.02em}
.phasecard .pdesc{font-size:var(--t-xs);color:var(--fg-muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
.phasecard .bar > i{background:var(--ph)}

/* Liste de modules */
.tasklist{display:flex;flex-direction:column;gap:7px}
.taskrow{
  display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg-elev);transition:border-color .15s,transform .15s var(--ease);
}
.taskrow:hover{border-color:var(--line-strong);transform:translateX(2px)}
.chk{
  width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line-strong);flex:0 0 auto;
  display:grid;place-items:center;font-size:11px;color:transparent;transition:all .16s var(--ease);
}
.chk:hover{border-color:var(--fg-muted)}
.chk.done{background:var(--green);border-color:var(--green);color:#0e100f}
.chk.doing{border-color:var(--orange);color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,transparent)}
.taskrow .tname{flex:1;min-width:0;font-size:var(--t-sm);font-weight:500}
.taskrow.is-done .tname{color:var(--fg-muted)}
.taskrow .tmeta{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.starbtn{color:var(--fg-dim);font-size:14px;transition:color .15s,transform .15s}
.starbtn:hover{transform:scale(1.18)}
.starbtn.on{color:var(--orange)}
.mastery{display:flex;gap:2.5px}
.mastery i{width:5px;height:5px;border-radius:50%;background:var(--line-strong)}
.mastery i.f{background:var(--green)}

/* Leçon */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:38px;align-items:start}
.toc{position:sticky;top:calc(var(--header-h) + 24px);font-size:var(--t-xs)}
.toc a{display:block;padding:5px 0 5px 12px;color:var(--fg-dim);border-left:2px solid var(--line);transition:all .15s;line-height:1.4}
.toc a:hover{color:var(--fg-muted)}
.toc a.on{color:var(--fg);border-color:var(--accent);font-weight:600}
.prose{font-size:var(--t-base);line-height:1.72;color:var(--fg-muted);max-width:74ch}
.prose h2{font-size:var(--t-xl);color:var(--fg);margin:34px 0 12px;scroll-margin-top:calc(var(--header-h) + 20px)}
.prose h3{font-size:var(--t-md);color:var(--fg);margin:22px 0 8px}
.prose p{margin:11px 0}
.prose strong,.prose b{color:var(--fg);font-weight:600}
.prose ul{margin:11px 0;padding-left:2px}
.prose ul li{position:relative;padding-left:20px;margin:7px 0}
.prose ul li::before{content:"";position:absolute;left:5px;top:11px;width:5px;height:5px;border-radius:50%;background:var(--ph,var(--accent))}
.prose ol{counter-reset:s;margin:11px 0}
.prose ol li{position:relative;padding-left:33px;margin:11px 0;counter-increment:s}
.prose ol li::before{
  content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  background:color-mix(in srgb,var(--ph,var(--accent)) 16%,transparent);color:var(--ph,var(--accent));
  font-size:11px;font-weight:700;display:grid;place-items:center;
}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--bg-elev-2);padding:1.5px 6px;border-radius:5px;color:var(--fg);border:1px solid var(--line)}
.callout{border:1px solid var(--line);border-left:3px solid var(--ph,var(--accent));border-radius:var(--r);padding:14px 17px;margin:18px 0;background:var(--bg-elev);font-size:var(--t-sm)}
.callout .ct{font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ph,var(--accent));margin-bottom:6px}
.callout.warn{border-left-color:var(--orange)} .callout.warn .ct{color:var(--orange)}
.callout.key{border-left-color:var(--green)} .callout.key .ct{color:var(--green)}
.formula{
  font-family:var(--mono);font-size:var(--t-sm);background:var(--bg-elev-2);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 17px;margin:16px 0;color:var(--fg);overflow-x:auto;line-height:1.9;
}
.formula .fl{color:var(--fg-dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px}
table.tbl{width:100%;border-collapse:collapse;font-size:var(--t-sm);margin:16px 0}
table.tbl th{text-align:left;font-weight:600;color:var(--fg);padding:9px 11px;border-bottom:1.5px solid var(--line-strong);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.05em}
table.tbl td{padding:9px 11px;border-bottom:1px solid var(--line);color:var(--fg-muted)}
table.tbl tr:hover td{background:var(--bg-elev)}
table.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);color:var(--fg)}
table.tbl th.n{text-align:right}
.term{border-bottom:1px dashed var(--lilac);color:var(--fg);cursor:help;font-weight:500}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 15px;font-size:var(--t-sm);font-weight:600;color:var(--fg-dim);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--fg-muted)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab .tb{font-size:10px;padding:1px 6px;border-radius:99px;background:var(--bg-elev-2);margin-left:5px}

/* Quiz */
.qz{max-width:640px}
.qopt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg-elev);font-size:var(--t-sm);transition:all .16s var(--ease);margin-bottom:9px;
}
.qopt:hover:not(.lock){border-color:var(--fg-muted);transform:translateX(3px)}
.qopt .qk{
  width:23px;height:23px;border-radius:7px;border:1px solid var(--line-strong);flex:0 0 auto;display:grid;place-items:center;
  font-size:11px;font-weight:700;font-family:var(--mono);color:var(--fg-dim);
}
.qopt.good{border-color:var(--green);background:color-mix(in srgb,var(--green) 11%,transparent)}
.qopt.good .qk{background:var(--green);border-color:var(--green);color:#0e100f}
.qopt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 11%,transparent)}
.qopt.bad .qk{background:var(--red);border-color:var(--red);color:#fff}
.qopt.lock{cursor:default}
.hearts{display:flex;gap:4px;font-size:15px}
.hearts i{opacity:.22;transition:opacity .3s,transform .3s}
.hearts i.on{opacity:1}

/* Fiches de révision */
.fcstage{max-width:660px;margin:0 auto}
.fc{perspective:1600px;height:330px;cursor:pointer;user-select:none}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s var(--ease);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateX(180deg)}
.fc-f,.fc-b{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--line-strong);border-radius:var(--r-xl);background:var(--bg-elev);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;text-align:center;box-shadow:var(--shadow);
}
.fc-b{transform:rotateX(180deg);background:var(--bg-elev-2)}
.fc-q{font-size:var(--t-xl);font-weight:600;letter-spacing:-.025em;line-height:1.28}
.fc-a{font-size:var(--t-md);color:var(--fg-muted);line-height:1.62;max-width:52ch}
.fc-hint{position:absolute;bottom:16px;font-size:11px;color:var(--fg-dim);letter-spacing:.05em}
.fc-cat{position:absolute;top:16px;left:18px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
.srsrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.srsbtn{padding:12px 6px;border-radius:var(--r);border:1px solid var(--line);text-align:center;transition:all .15s var(--ease)}
.srsbtn:hover{transform:translateY(-2px)}
.srsbtn b{display:block;font-size:var(--t-sm);font-weight:600}
.srsbtn span{display:block;font-size:10.5px;color:var(--fg-dim);margin-top:2px}
.srsbtn.s1{border-color:color-mix(in srgb,var(--red) 42%,transparent)} .srsbtn.s1 b{color:var(--red)}
.srsbtn.s2{border-color:color-mix(in srgb,var(--orange) 42%,transparent)} .srsbtn.s2 b{color:var(--orange)}
.srsbtn.s3{border-color:color-mix(in srgb,var(--blue) 42%,transparent)} .srsbtn.s3 b{color:var(--blue)}
.srsbtn.s4{border-color:color-mix(in srgb,var(--green) 42%,transparent)} .srsbtn.s4 b{color:var(--green)}

/* Référentiel */
.azbar{display:flex;flex-wrap:wrap;gap:3px}
.azbar button{width:27px;height:27px;border-radius:7px;font-size:var(--t-xs);font-weight:600;color:var(--fg-dim);transition:all .13s}
.azbar button:hover:not([disabled]){background:var(--bg-hover);color:var(--fg)}
.azbar button.on{background:var(--fg);color:var(--bg)}
.azbar button[disabled]{opacity:.24;cursor:default}
.gitem{padding:15px 17px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg-elev);transition:border-color .15s}
.gitem:hover{border-color:var(--line-strong)}
.gitem .gt{font-size:var(--t-md);font-weight:600;letter-spacing:-.02em}
.gitem .gd{font-size:var(--t-sm);color:var(--fg-muted);margin-top:5px;line-height:1.6}
.gitem mark{background:color-mix(in srgb,var(--orange) 30%,transparent);color:var(--fg);border-radius:3px;padding:0 2px}
.azgroup{font-size:var(--t-2xl);font-weight:700;color:var(--line-strong);letter-spacing:-.04em;margin:26px 0 10px;scroll-margin-top:calc(var(--header-h) + 74px)}

/* Statistiques */
.heat{display:grid;grid-template-columns:repeat(27,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:2.5px;background:var(--line);transition:transform .12s}
.heat i:hover{transform:scale(1.35)}
.heat i.l1{background:color-mix(in srgb,var(--green) 26%,var(--line))}
.heat i.l2{background:color-mix(in srgb,var(--green) 50%,var(--line))}
.heat i.l3{background:color-mix(in srgb,var(--green) 74%,var(--line))}
.heat i.l4{background:var(--green)}
.barchart{display:flex;align-items:flex-end;gap:8px;height:150px}
.barchart .bc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.barchart .bcb{width:100%;border-radius:5px 5px 0 0;background:var(--ph,var(--accent));min-height:3px;transition:height .8s var(--ease)}
.barchart .bcl{font-size:10px;color:var(--fg-dim);text-align:center}

/* Onboarding */
.ob{max-width:470px;text-align:center;padding:38px 32px}
.ob-ico{font-size:42px;margin-bottom:14px}
.dots{display:flex;gap:6px;justify-content:center;margin:22px 0}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line-strong);transition:all .25s var(--ease)}
.dots i.on{width:22px;background:var(--fg)}

/* Confettis */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:130;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;animation:cfall linear forwards}

/* ── 5bis. ÉCRAN D'ENTRÉE, PROFILS, ASTUCES ────────────────── */
body.gated{overflow:hidden}
body.gated .app,body.gated .botnav{filter:blur(3px);pointer-events:none;user-select:none}
#gate{position:fixed;inset:0;z-index:150;display:none;overflow-y:auto;background:var(--bg)}
#gate.on{display:block}
.gate-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.gate-card{
  width:100%;max-width:452px;background:var(--bg-elev);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:32px;box-shadow:var(--shadow);animation:modalIn .34s var(--ease);
}
.gate-brand{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.gate-lbl{display:block;font-size:12px;font-weight:600;color:var(--fg-muted);margin-bottom:6px}
.gate-lbl .dim{font-weight:400}
.gate-err{
  font-size:13px;color:var(--red);background:color-mix(in srgb,var(--red) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--red) 34%,transparent);border-radius:var(--r-sm);padding:9px 12px;
}
.gate-note{font-size:11.5px;line-height:1.55;color:var(--fg-dim);margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.gate-av{
  width:62px;height:62px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:22px;letter-spacing:-.02em;
}
.gate-av.sm{width:38px;height:38px;font-size:14px;margin:0;flex:0 0 auto}
.gate-prof{
  display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--bg-elev);transition:all .16s var(--ease);
}
.gate-prof:hover{border-color:var(--accent);transform:translateX(3px)}
.sb-me{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:var(--r-sm);width:100%;transition:background .14s}
.sb-me:hover{background:var(--bg-hover)}
.sb-me .gate-av{margin:0}
.tip{
  border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);
  background:color-mix(in srgb,var(--accent) 8%,transparent);
  border-radius:var(--r);padding:13px 15px;display:flex;gap:11px;align-items:flex-start;
  font-size:13px;line-height:1.55;margin-bottom:18px;animation:slideDown .3s var(--ease);
}
.tip .ti{font-size:15px;flex:0 0 auto;line-height:1.3}
.tip b{display:block;margin-bottom:2px;font-size:13px}
.tip .tclose{margin-left:auto;flex:0 0 auto;color:var(--fg-dim);font-size:15px;line-height:1}
.tip .tclose:hover{color:var(--fg)}

/* ── 6. ANIMATIONS ─────────────────────────────────────────── */
@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(28px)}}
@keyframes cfall{to{transform:translateY(102vh) rotate(760deg);opacity:0}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.24)}100%{transform:scale(1)}}
.pop{animation:pop .38s var(--ease)}
@keyframes shimmer{to{background-position:200% 0}}
.skel{background:linear-gradient(90deg,var(--bg-elev) 0%,var(--bg-hover) 50%,var(--bg-elev) 100%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--r-sm)}

/* ── 7. RESPONSIVE ─────────────────────────────────────────── */
@media (max-width:1120px){
  .lesson{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .sb{position:fixed;left:0;top:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .3s var(--ease);box-shadow:none}
  body.nav-open .sb{transform:none;box-shadow:var(--shadow)}
  body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;animation:fadeIn .2s}
  .main{grid-column:1}
  .hd-burger{display:flex}
  .searchbtn{min-width:0;width:34px;padding:0;justify-content:center}
  .searchbtn span,.searchbtn kbd{display:none}
  .view{padding:22px 16px 108px}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .hd-stat.hide-sm{display:none}
  .botnav{
    display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:70;
    background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  }
  .botnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:10px;color:var(--fg-dim);font-weight:500}
  .botnav a.on{color:var(--fg)}
  .botnav a i{font-size:17px;font-style:normal}
  .fc{height:280px}
  .h1{font-size:var(--t-2xl)}
  .srsrow{grid-template-columns:repeat(2,1fr)}
  .heat{grid-template-columns:repeat(14,1fr)}
}
@media (max-width:520px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{gap:16px}
  .modal{max-height:88vh}
  .ovl{padding:5vh 10px 10px}
}

/* ── 8. ACCESSIBILITÉ ET IMPRESSION ────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:-60px;left:12px;z-index:200;background:var(--accent);color:var(--accent-fg);padding:9px 15px;border-radius:var(--r-sm);font-weight:600;transition:top .2s}
.skip:focus{top:12px}
@media print{
  .sb,.hd,.botnav,.toasts,.toc{display:none!important}
  .app{grid-template-columns:1fr}
  body{background:#fff;color:#000}
  .view{padding:0;max-width:none}
}

/* ── 9. COMPOSANTS V2 ──────────────────────────────────────── */
/* Cartes de mode de jeu */
.modecard{cursor:pointer;border-color:var(--line)}
.modecard.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--bg-elev))}
.modecard.on b{color:var(--accent)}

/* Jeu d'association */
.matchgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;max-width:940px;margin:0 auto}
.tile{
  min-height:104px;padding:12px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--bg-elev);text-align:left;display:flex;flex-direction:column;gap:7px;
  transition:all .16s var(--ease);position:relative;overflow:hidden;
}
.tile:hover:not(.gone){border-color:var(--fg-muted);transform:translateY(-2px)}
.tile .tside{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-dim);font-weight:600}
.tile .ttxt{font-size:12.5px;line-height:1.4;color:var(--fg)}
.tile.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg-elev));transform:translateY(-2px)}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.9)}
.tile.wrong{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* Succès */
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px}
.badge{
  padding:14px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-elev);
  text-align:center;opacity:.42;filter:grayscale(1);transition:all .2s var(--ease);
}
.badge.on{opacity:1;filter:none;border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.badge .bico{display:block;font-size:22px;line-height:1.1}
.badge b{display:block;font-size:12.5px;margin-top:7px}
.badge .bd{display:block;font-size:10.5px;color:var(--fg-dim);margin-top:4px;line-height:1.35}
.badgestrip{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.badgestrip::-webkit-scrollbar{display:none}
.badgestrip .bmini{
  flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;
  border:1px solid var(--line);background:var(--bg-elev);opacity:.35;filter:grayscale(1);
}
.badgestrip .bmini.on{opacity:1;filter:none;border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* Accordéon */
.acc{border:1px solid var(--line);border-radius:var(--r);background:var(--bg-elev);overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;text-align:left;transition:background .14s}
.acc-h:hover{background:var(--bg-hover)}
.acc-t{flex:1;font-size:14px;font-weight:600}
.acc-c{color:var(--fg-dim);font-size:11px;transition:transform .22s var(--ease);flex:0 0 auto}
.acc.open .acc-c{transform:rotate(180deg)}
.acc-b{display:none;padding:0 16px 16px}
.acc.open .acc-b{display:block;animation:slideDown .22s var(--ease)}

/* Frise du process */
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.step{
  padding:11px 9px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg-elev);
  text-align:left;transition:all .16s var(--ease);position:relative;
}
.step:hover{border-color:var(--fg-muted);transform:translateY(-2px)}
.step.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--bg-elev))}
.step .snum{font-family:var(--mono);font-size:10px;color:var(--fg-dim);font-weight:600}
.step.on .snum{color:var(--accent)}
.step .sico{display:block;font-size:15px;margin:3px 0 4px}
.step .stxt{display:block;font-size:11.5px;font-weight:600;line-height:1.3}
.step .sph{display:block;font-size:9.5px;color:var(--fg-dim);margin-top:4px;letter-spacing:.05em;text-transform:uppercase}

/* Rangs de dette */
.rangrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.rangrow:last-child{border-bottom:none}
.rangrow .rn{
  width:24px;height:24px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:700;background:var(--bg-elev-2);color:var(--fg-muted);
}

/* Choix de verticale */
.vertpick{cursor:pointer;position:relative;overflow:hidden}
.vertpick::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--vc) 12%,transparent),transparent 65%);opacity:0;transition:opacity .2s;pointer-events:none}
.vertpick:hover::after{opacity:1}
.vertpick.on{border-color:var(--vc)}
.vertpick.on::after{opacity:1}
.vertpick > *{position:relative;z-index:1}

/* Référentiel : vue compacte, ressource lue */
.gitem.compact{padding:9px 14px}
.gitem .gt{font-size:var(--t-md);font-weight:600;letter-spacing:-.02em;transition:color .14s}
.gitem .gt:hover{color:var(--accent)}
.card.isread{opacity:.62}
.card.isread:hover{opacity:1}

/* Carte de verticale sur le tableau de bord */
.vertcard{position:relative;overflow:hidden;display:block}
.vertcard::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,color-mix(in srgb,var(--ph) 13%,transparent),transparent 60%);pointer-events:none}
.vertcard > *{position:relative;z-index:1}

@media (max-width:960px){
  .stepper{grid-template-columns:repeat(3,minmax(0,1fr))}
  .matchgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{min-height:92px}
  .badgegrid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
}
@media (max-width:520px){
  .stepper{grid-template-columns:repeat(2,minmax(0,1fr))}
}

<h2 id="lecture">Lire le bilan comme un acquéreur</h2>
<p>Le bilan répond à deux questions posées en même temps. À gauche, <strong>où l'argent est allé</strong> (les emplois). À droite, <strong>d'où il vient</strong> (les ressources). L'égalité n'est pas une découverte comptable, c'est une identité : tout euro employé a été financé par quelqu'un.</p>

<h2 id="fr-bfr">Fonds de roulement, BFR, trésorerie</h2>
<p>Les trois grandeurs sont liées par une équation que l'on doit pouvoir écrire de mémoire.</p>
<div class="formula"><span class="fl">Équilibre financier</span>Fonds de roulement net - Besoin en fonds de roulement = Trésorerie nette</div>
<p>Le fonds de roulement mesure ce que les ressources stables laissent disponible après avoir financé l'actif immobilisé. Le BFR mesure ce que le cycle d'exploitation immobilise. La différence est la trésorerie. Une société peut être profitable et manquer de trésorerie simplement parce que son BFR croît plus vite que son résultat.</p>

<h2 id="cas">Cas chiffré</h2>
<p>Une société de distribution présente le bilan simplifié suivant, en milliers d'euros.</p>
<table class="tbl">
<tr><th>Actif</th><th class="n">N</th><th>Passif</th><th class="n">N</th></tr>
<tr><td>Immobilisations nettes</td><td class="n">1 800</td><td>Capitaux propres</td><td class="n">2 100</td></tr>
<tr><td>Stocks</td><td class="n">1 250</td><td>Dette financière long terme</td><td class="n">1 400</td></tr>
<tr><td>Clients</td><td class="n">2 400</td><td>Fournisseurs</td><td class="n">1 900</td></tr>
<tr><td>Trésorerie</td><td class="n">350</td><td>Autres dettes exploitation</td><td class="n">400</td></tr>
<tr><td><strong>Total</strong></td><td class="n"><strong>5 800</strong></td><td><strong>Total</strong></td><td class="n"><strong>5 800</strong></td></tr>
</table>
<p>Fonds de roulement net = (2 100 + 1 400) - 1 800 = <strong>1 700</strong>. BFR = (1 250 + 2 400) - (1 900 + 400) = <strong>1 350</strong>. Trésorerie nette = 1 700 - 1 350 = <strong>350</strong>, ce qui recoupe le poste trésorerie. Le recoupement doit toujours tomber juste, sinon un poste a été mal classé.</p>

<h2 id="pieges">Ce qui change le prix</h2>
<ul>
<li><strong>Comptes courants d'associés</strong> : dette envers le cédant, souvent remboursée au closing. À traiter en dette, pas en quasi-fonds propres, sauf convention de blocage.</li>
<li><strong>Immobilier détenu en direct</strong> : dans les cessions de cabinets, sa présence au bilan brouille le multiple. On isole l'actif et son financement.</li>
<li><strong>Provisions insuffisantes</strong> : litige prud'homal non provisionné, créance client irrécouvrable maintenue à l'actif. Chaque euro manquant sort du prix.</li>
<li><strong>Actifs hors exploitation</strong> : véhicules, œuvres d'art, participations dormantes. Soit ils sortent avant cession, soit ils s'ajoutent au prix.</li>
</ul>
<div class="callout warn"><div class="ct">Piège classique</div>La trésorerie n'est pas toujours disponible. Dépôts de garantie, comptes séquestres, trésorerie saisonnière au point haut de l'année : une partie est nécessaire à l'exploitation et ne viendra pas en déduction du prix.</div>
`,
key:["Actif = Passif + Capitaux propres, sans exception","FRN - BFR = Trésorerie nette, à recouper systématiquement","Les comptes courants d'associés sont de la dette","Une trésorerie affichée n'est pas une trésorerie disponible"],
quiz:[
 {q:"Une société double son chiffre d'affaires et reste bénéficiaire, mais sa trésorerie chute. Quelle explication est la plus probable ?",o:["Le BFR a augmenté plus vite que le résultat","Les capitaux propres ont diminué","Le fonds de roulement a été remboursé","Les amortissements ont baissé"],a:0,e:"La croissance consomme du cash : stocks et créances clients augmentent avec l'activité, souvent avant que les encaissements ne suivent. C'est le scénario de la croissance qui tue."},
 {q:"Un compte courant d'associé de 300 k€ figure au passif. Comment le traiter dans le pont valeur d'entreprise vers prix ?",o:["En dette financière, sauf convention de blocage","En capitaux propres","En BFR d'exploitation","Il est neutre pour le prix"],a:0,e:"Sauf engagement écrit de non-remboursement, l'acquéreur devra le rembourser. C'est de la dette et cela diminue le prix des titres à valeur d'entreprise constante."},
 {q:"FRN = 900, BFR = 1 200. Quelle est la trésorerie nette ?",o:["- 300","+ 300","+ 2 100","Impossible à dire"],a:0,e:"900 - 1 200 = - 300. La société finance son cycle d'exploitation par du découvert ou du crédit court terme."},
 {q:"Quel poste n'appartient pas au BFR d'exploitation ?",o:["Emprunt bancaire à 5 ans","Stocks","Créances clients","Dettes fournisseurs"],a:0,e:"L'emprunt est une ressource de financement, pas un élément du cycle d'exploitation. Il entre dans la dette nette."}
],
src:["IAS 1, présentation des états financiers","Mémento comptable, structure du bilan"]};

LESSONS["tableau-flux"] = {
why:"Le résultat est une opinion, la trésorerie est un fait. Le tableau de flux est le seul état que l'on ne peut pas habiller facilement.",
obj:["Reconstruire un tableau de flux par la méthode indirecte","Séparer flux d'exploitation, d'investissement et de financement","Détecter les manipulations de présentation"],
html:`
<h2 id="principe">Trois sections, une seule question</h2>
<p>Le tableau de flux répond à : <strong>d'où vient et où va le cash</strong>. Il se construit à partir du résultat net auquel on retire tout ce qui n'a pas donné lieu à un mouvement de trésorerie.</p>
<div class="formula"><span class="fl">Méthode indirecte, flux d'exploitation</span>Résultat net
+ Dotations aux amortissements et provisions
+/- Éléments non cash (plus-values de cession, impôts différés)
- Variation du BFR
= Flux net de trésorerie d'exploitation</div>
<table class="tbl">
<tr><th>Section</th><th>Contenu</th><th>Lecture</th></tr>
<tr><td>Exploitation</td><td>Cash généré par l'activité courante</td><td>Doit être positif et proche de l'EBE hors variation de BFR</td></tr>
<tr><td>Investissement</td><td>Capex, acquisitions, cessions d'actifs</td><td>Structurellement négatif dans une société qui investit</td></tr>
<tr><td>Financement</td><td>Emprunts, remboursements, dividendes, apports</td><td>Révèle la politique de distribution et l'appétit pour la dette</td></tr>
</table>

<h2 id="cas">Cas chiffré</h2>
<p>Données en milliers d'euros : résultat net 420, dotations 260, variation de BFR + 180 (le BFR augmente), capex 300, remboursement d'emprunt 150, dividendes 100.</p>
<table class="tbl">
<tr><th>Ligne</th><th class="n">Montant</th></tr>
<tr><td>Résultat net</td><td class="n">420</td></tr>
<tr><td>+ Dotations</td><td class="n">260</td></tr>
<tr><td>- Variation de BFR</td><td class="n">-180</td></tr>
<tr><td><strong>= Flux d'exploitation</strong></td><td class="n"><strong>500</strong></td></tr>
<tr><td>- Capex</td><td class="n">-300</td></tr>
<tr><td><strong>= Flux libre avant financement</strong></td><td class="n"><strong>200</strong></td></tr>
<tr><td>- Remboursement d'emprunt</td><td class="n">-150</td></tr>
<tr><td>- Dividendes</td><td class="n">-100</td></tr>
<tr><td><strong>= Variation de trésorerie</strong></td><td class="n"><strong>-50</strong></td></tr>
</table>
<p>Lecture M&A : la société génère 500 de cash d'exploitation mais ne dégage que 200 après investissement. Sa politique de distribution la met en trésorerie négative. Un acquéreur en déduira que le dividende n'est pas soutenable si le capex reste à ce niveau.</p>

<h2 id="signaux">Signaux à surveiller</h2>
<ul>
<li><strong>Résultat en hausse, flux d'exploitation en baisse</strong> sur deux exercices consécutifs : premier indicateur de dégradation de la qualité du résultat.</li>
<li><strong>Capex systématiquement inférieur aux dotations</strong> : l'outil vieillit, un rattrapage attend l'acquéreur.</li>
<li><strong>Affacturage non déconsolidant</strong> présenté en exploitation : le cash arrive plus tôt mais la dette existe.</li>
<li><strong>Reclassements opportunistes</strong> : intérêts payés placés en financement plutôt qu'en exploitation gonflent le flux opérationnel.</li>
</ul>
<div class="callout key"><div class="ct">Règle de contrôle</div>Sur trois à cinq ans, le cumul des flux d'exploitation doit être cohérent avec le cumul des EBE diminué des impôts et de la variation de BFR. Un écart important sans explication mérite une question en due diligence.</div>
`,
key:["Le flux d'exploitation part du résultat net et neutralise le non cash","Une augmentation de BFR est une sortie de trésorerie","Capex durablement inférieur aux dotations annonce un rattrapage","Le tableau de flux valide ou invalide la qualité du résultat"],
quiz:[
 {q:"Le BFR passe de 800 à 1 000. Quel est l'impact sur le flux d'exploitation ?",o:["- 200","+ 200","+ 1 000","Aucun"],a:0,e:"Une augmentation du BFR immobilise du cash. C'est une sortie de 200 dans le tableau de flux."},
 {q:"Pourquoi ajoute-t-on les dotations aux amortissements au résultat net ?",o:["Parce qu'elles n'ont donné lieu à aucun décaissement","Parce qu'elles sont déductibles fiscalement","Parce qu'elles augmentent l'actif","Pour lisser le résultat"],a:0,e:"L'amortissement est une charge calculée. Le décaissement a eu lieu lors de l'investissement, pas à chaque exercice."},
 {q:"Une société affiche un capex de 120 pour des dotations de 320 pendant quatre ans. Que faut-il en conclure ?",o:["Un besoin de rattrapage d'investissement pèse sur l'acquéreur","La société est très rentable","Les amortissements sont mal calculés","Le BFR est maîtrisé"],a:0,e:"L'outil de production se déprécie plus vite qu'il n'est renouvelé. Le futur propriétaire devra investir, ce qui réduit les flux disponibles et donc la valeur."}
],
src:["IAS 7, tableau des flux de trésorerie","Damodaran, Cash Flow Estimation"]};

LESSONS["liaison-3-etats"] = {
why:"Un modèle qui ne boucle pas est un modèle faux. Comprendre les liaisons est ce qui sépare celui qui saisit des chiffres de celui qui construit un modèle.",
obj:["Tracer chaque liaison entre les trois états","Expliquer pourquoi le bilan s'équilibre mécaniquement","Diagnostiquer un modèle déséquilibré"],
html:`
<h2 id="chaine">La chaîne des liaisons</h2>
<p>Il n'existe que quatre liaisons structurantes. Toutes les autres en découlent.</p>
<ol>
<li><strong>Résultat net</strong> du compte de résultat vers les <strong>capitaux propres</strong> du bilan, diminué des dividendes.</li>
<li><strong>Résultat net</strong> comme point de départ du <strong>flux d'exploitation</strong>.</li>
<li><strong>Variations des postes de bilan</strong> (BFR, immobilisations, dettes) vers les <strong>trois sections du tableau de flux</strong>.</li>
<li><strong>Variation de trésorerie</strong> du tableau de flux vers la <strong>ligne trésorerie</strong> du bilan de clôture.</li>
</ol>
<div class="callout"><div class="ct">Le test</div>Si les quatre liaisons sont correctes, le bilan s'équilibre sans forçage. Un bilan qui ne s'équilibre pas signale toujours une liaison manquante, jamais une erreur d'addition.</div>

<h2 id="diagnostic">Diagnostiquer un déséquilibre</h2>
<p>La méthode est déterministe. On isole l'écart, puis on remonte.</p>
<table class="tbl">
<tr><th>Écart observé</th><th>Cause la plus fréquente</th></tr>
<tr><td>Écart constant sur toutes les années</td><td>Erreur dans le bilan d'ouverture</td></tr>
<tr><td>Écart qui apparaît en année 1 et se propage</td><td>Un poste de bilan varie sans contrepartie dans le flux</td></tr>
<tr><td>Écart égal au résultat net</td><td>Le résultat n'est pas reporté en capitaux propres</td></tr>
<tr><td>Écart égal aux dividendes</td><td>Dividende déduit des capitaux propres mais pas du flux de financement</td></tr>
<tr><td>Écart égal au capex</td><td>Immobilisation augmentée sans sortie de cash</td></tr>
</table>
<p>Le réflexe consiste à afficher l'écart en haut de chaque colonne, en rouge conditionnel. On ne construit jamais un modèle sans cette ligne de contrôle.</p>

<h2 id="ordre">Ordre de construction</h2>
<p>L'ordre importe. On construit dans cette séquence, faute de quoi on crée des références circulaires évitables : hypothèses, compte de résultat jusqu'à l'EBE, échéancier d'immobilisations, BFR, compte de résultat jusqu'au résultat net hors intérêts, tableau de flux partiel, échéancier de dette, intérêts, bouclage.</p>
`,
key:["Quatre liaisons structurantes suffisent à faire boucler un modèle","Un bilan déséquilibré indique une liaison manquante, jamais une addition fausse","L'écart de bilan est diagnostique : sa valeur désigne la cause","La ligne de contrôle s'affiche dès la première cellule construite"],
quiz:[
 {q:"Le bilan présente un écart exactement égal au résultat net de l'année. Quelle est la cause ?",o:["Le résultat n'est pas reporté dans les capitaux propres","Le BFR est mal calculé","Les intérêts sont comptés deux fois","La trésorerie d'ouverture est fausse"],a:0,e:"La valeur de l'écart désigne la liaison manquante. Ici, la liaison compte de résultat vers capitaux propres."},
 {q:"Dans quel ordre construire un modèle intégré ?",o:["Hypothèses, exploitation, immobilisations, BFR, dette, bouclage","Bilan, compte de résultat, flux","Dette, exploitation, hypothèses","Flux, bilan, compte de résultat"],a:0,e:"Cet ordre limite les références circulaires : les intérêts, qui dépendent de la dette moyenne, ne sont calculés qu'après le reste."},
 {q:"Un écart de bilan constant sur les cinq années projetées provient le plus souvent de :",o:["Le bilan d'ouverture","La projection du chiffre d'affaires","Le taux d'impôt","La valeur terminale"],a:0,e:"Un écart qui n'évolue pas ne peut pas venir des flux de la période. Il est présent dès l'origine."}
],
src:["BIWS, 3-Statement Modeling","FAST Standard, principes de construction"]};

LESSONS["bfr"] = {
why:"Le BFR est le poste que les cédants comprennent le moins et qui coûte le plus cher au closing. C'est aussi le premier levier de trésorerie post-acquisition.",
obj:["Décomposer le BFR par les jours de rotation","Distinguer BFR d'exploitation et hors exploitation","Anticiper le mécanisme d'ajustement de prix"],
html:`
<h2 id="composantes">Décomposition</h2>
<div class="formula"><span class="fl">BFR d'exploitation</span>Stocks + Créances clients + Autres créances d'exploitation
- Dettes fournisseurs - Dettes sociales et fiscales - Produits constatés d'avance</div>
<p>On raisonne rarement en valeur absolue, presque toujours en <strong>jours de rotation</strong>, seule façon de comparer deux exercices ou deux sociétés de taille différente.</p>
<table class="tbl">
<tr><th>Ratio</th><th>Formule</th><th>Repère</th></tr>
<tr><td>Délai clients (DSO)</td><td class="mono">Clients TTC / CA TTC x 365</td><td>30 à 60 jours en B2B français</td></tr>
<tr><td>Délai fournisseurs (DPO)</td><td class="mono">Fournisseurs TTC / Achats TTC x 365</td><td>Plafond légal de 60 jours</td></tr>
<tr><td>Rotation des stocks (DIO)</td><td class="mono">Stocks / Coût des ventes x 365</td><td>Très variable selon le secteur</td></tr>
</table>
<div class="formula"><span class="fl">Cycle de conversion du cash</span>DSO + DIO - DPO = nombre de jours de chiffre d'affaires immobilisés</div>

<h2 id="cas">Cas chiffré</h2>
<p>Société de services, CA 8 M€, clients 1,9 M€ TTC, pas de stock, fournisseurs 0,6 M€ TTC sur 2,4 M€ d'achats TTC.</p>
<p>DSO = 1,9 / 9,6 x 365 = <strong>72 jours</strong>. DPO = 0,6 / 2,4 x 365 = <strong>91 jours</strong>. Le cycle est de 72 - 91 = <strong>-19 jours</strong> : la société est financée par ses fournisseurs. Attention, un DPO de 91 jours dépasse le plafond légal français et signale soit une tension de trésorerie, soit un risque de pénalités.</p>
<p>Si l'acquéreur ramène le DPO à 60 jours pour se conformer à la loi, le besoin de trésorerie immédiat est de (91 - 60) / 365 x 2,4 M€ = <strong>204 k€</strong>. Cette somme se négocie dans le prix.</p>

<h2 id="normatif">Vers le BFR normatif</h2>
<p>Au closing, l'acquéreur veut recevoir une société dotée d'un BFR normal, ni vidé ni gonflé. On calcule donc un <strong>BFR normatif</strong>, généralement la moyenne des douze ou vingt-quatre derniers mois, corrigée de la saisonnalité. L'écart entre le BFR réel à la date de closing et ce niveau normatif ajuste le prix euro pour euro.</p>
<div class="callout warn"><div class="ct">Vigilance</div>Un cédant averti optimise son BFR dans les trois mois qui précèdent la cession : relance clients agressive, étalement des fournisseurs, déstockage. Le BFR normatif construit sur une moyenne longue neutralise cette manœuvre.</div>
`,
key:["Le BFR se pilote en jours, pas en euros","Cycle de conversion = DSO + DIO - DPO","Un DPO au-delà de 60 jours est une anomalie légale en France","L'écart au BFR normatif ajuste le prix euro pour euro"],
quiz:[
 {q:"Le DSO passe de 45 à 70 jours sur un CA de 12 M€ TTC. Quel cash est immobilisé en plus ?",o:["Environ 822 k€","Environ 300 k€","Environ 2 M€","Aucun impact cash"],a:0,e:"25 jours supplémentaires sur 12 M€ : 25 / 365 x 12 000 000 = 821 918 €. Le retard de paiement client se paie en trésorerie."},
 {q:"Quel élément n'entre pas dans le BFR d'exploitation ?",o:["Dividende à payer","Créances clients","Dettes fournisseurs","Stocks"],a:0,e:"Le dividende à payer est une dette hors exploitation, liée à la distribution et non au cycle d'activité."},
 {q:"Pourquoi calcule-t-on un BFR normatif sur douze à vingt-quatre mois ?",o:["Pour neutraliser la saisonnalité et les optimisations de dernière minute","Parce que la loi l'impose","Pour simplifier le calcul","Pour valoriser les stocks"],a:0,e:"Une photographie ponctuelle est manipulable et dépend du mois de closing. La moyenne longue reflète le besoin réel de l'exploitation."}
],
src:["Loi LME, délais de paiement","Pratique des ajustements de prix, protocoles de cession"]};

LESSONS["dette-nette"] = {
why:"La dette nette est la variable qui transforme une valeur d'entreprise en prix reçu par le cédant. Chaque élément oublié se paie au closing.",
obj:["Définir le périmètre de la dette nette","Identifier les dettes assimilées, souvent invisibles au bilan","Anticiper la négociation de la définition dans le protocole"],
html:`
<h2 id="definition">Une définition qui se négocie</h2>
<div class="formula"><span class="fl">Dette nette</span>Dettes financières brutes - Trésorerie et équivalents disponibles</div>
<p>La formule est simple, son application ne l'est pas. La quasi-totalité de la valeur ajoutée d'un conseil se joue sur le contenu des deux termes. Dans un protocole, la définition de la dette nette occupe souvent une page entière.</p>

<h2 id="assimiles">Les dettes assimilées</h2>
<p>Éléments qui ne portent pas le nom de dette mais que l'acquéreur exigera de déduire.</p>
<ul>
<li>Comptes courants d'associés et dividendes votés non versés</li>
<li>Engagements de retraite non provisionnés (indemnités de fin de carrière)</li>
<li>Crédit-bail et locations financières, retraités en dette au capital restant dû</li>
<li>Affacturage déconsolidant sur créances cédées avec recours</li>
<li>Congés payés et primes non provisionnés, participation des salariés</li>
<li>Passifs fiscaux ou sociaux identifiés en audit, redressement probable</li>
<li>Capex engagé non décaissé, factures fournisseurs en retard significatif</li>
<li>Earn out dû sur une acquisition antérieure</li>
</ul>
<div class="callout warn"><div class="ct">Symétrie</div>Le cédant défendra à l'inverse les créances hors exploitation : crédit d'impôt recherche à recevoir, remboursement fiscal, dépôt de garantie récupérable. La négociation est symétrique et se prépare avec la liste des deux côtés.</div>

<h2 id="cas">Cas chiffré</h2>
<table class="tbl">
<tr><th>Élément</th><th class="n">k€</th><th>Traitement</th></tr>
<tr><td>Emprunts bancaires</td><td class="n">1 400</td><td>Dette</td></tr>
<tr><td>Compte courant d'associé</td><td class="n">300</td><td>Dette</td></tr>
<tr><td>Crédit-bail, capital restant dû</td><td class="n">220</td><td>Dette</td></tr>
<tr><td>Indemnités de fin de carrière non provisionnées</td><td class="n">180</td><td>Dette assimilée</td></tr>
<tr><td>Trésorerie au bilan</td><td class="n">-650</td><td>Déduction</td></tr>
<tr><td>Dépôt de garantie bail, non récupérable avant 3 ans</td><td class="n">0</td><td>Non déduit, illiquide</td></tr>
<tr><td><strong>Dette nette retenue</strong></td><td class="n"><strong>1 450</strong></td><td></td></tr>
</table>
<p>Sur une valeur d'entreprise de 6 000 k€, le prix des titres ressort à 6 000 - 1 450 = <strong>4 550 k€</strong>. Si le conseil de l'acquéreur avait aussi fait passer les 180 k€ d'IFC et les 220 k€ de crédit-bail sans discussion, l'écart pour le cédant aurait été de 400 k€, soit près de 9 % du prix.</p>
`,
key:["La dette nette est une définition contractuelle, pas un chiffre comptable","Les dettes assimilées font souvent plus de 20 % du total","La négociation est symétrique : préparer aussi la liste côté cédant","Chaque élément se chiffre et se documente avant la LOI, pas après"],
quiz:[
 {q:"Une société a 200 k€ d'indemnités de fin de carrière non provisionnées. Quel est l'impact probable sur le prix des titres ?",o:["Baisse d'environ 200 k€","Aucun, ce n'est pas une dette bancaire","Hausse de 200 k€","Baisse de 200 k€ multipliée par le multiple"],a:0,e:"C'est une dette assimilée : l'acquéreur devra la payer. Elle se déduit une fois de la valeur d'entreprise, sans effet multiplicateur."},
 {q:"Un dépôt de garantie de bail de 80 k€ récupérable dans cinq ans doit être :",o:["Écarté ou fortement décoté de la trésorerie disponible","Ajouté intégralement à la trésorerie","Traité comme une dette","Ignoré dans tous les cas"],a:0,e:"La trésorerie déduite doit être disponible. Un actif bloqué cinq ans n'est pas de la trésorerie au sens du pont de valeur."},
 {q:"Où se règle définitivement la définition de la dette nette ?",o:["Dans le protocole de cession","Dans le teaser","Dans le mémorandum d'information","Dans le NDA"],a:0,e:"La LOI en fixe le principe, le protocole en fige la définition exacte, poste par poste. C'est là que la rédaction vaut de l'argent."}
],
src:["Pratique des protocoles de cession","France Invest, guide des mécanismes de prix"]};

LESSONS["ebe-retraite"] = {
why:"Le prix se calcule presque toujours comme un multiple d'un EBE retraité. Chaque retraitement discuté vaut le multiple fois son montant.",
obj:["Distinguer retraitements de normalisation et retraitements pro forma","Documenter un retraitement de façon opposable","Mesurer l'effet de levier d'un retraitement sur le prix"],
html:`
<h2 id="pourquoi">Pourquoi retraiter</h2>
<p>L'EBE comptable reflète la gestion du cédant, pas la rentabilité économique de l'entreprise sous un nouveau propriétaire. On cherche l'<strong>EBE que dégagerait la société en régime normal, exploitée par un tiers</strong>.</p>
<div class="callout key"><div class="ct">Effet de levier</div>À un multiple de 6, un retraitement de 50 k€ vaut 300 k€ de prix. C'est pourquoi chaque ligne se documente avec une pièce justificative, pas avec une affirmation.</div>

<h2 id="typologie">Typologie des retraitements</h2>
<table class="tbl">
<tr><th>Nature</th><th>Exemples</th><th>Sens</th></tr>
<tr><td>Rémunération du dirigeant</td><td>Écart entre rémunération réelle et rémunération de marché d'un salarié de remplacement</td><td>Les deux sens</td></tr>
<tr><td>Charges personnelles</td><td>Véhicule non professionnel, frais de représentation excessifs, membres de la famille non actifs</td><td>Positif</td></tr>
<tr><td>Immobilier</td><td>Loyer au-dessus ou en dessous du marché versé à une SCI du cédant</td><td>Les deux sens</td></tr>
<tr><td>Éléments non récurrents</td><td>Litige exceptionnel, subvention ponctuelle, produit de cession</td><td>Les deux sens</td></tr>
<tr><td>Sous-investissement</td><td>Poste non pourvu que l'acquéreur devra recruter</td><td>Négatif</td></tr>
<tr><td>Pro forma</td><td>Effet année pleine d'un contrat signé en cours d'exercice</td><td>Positif</td></tr>
</table>

<h2 id="cas">Cas chiffré</h2>
<table class="tbl">
<tr><th>Ligne</th><th class="n">k€</th></tr>
<tr><td>EBE comptable N</td><td class="n">640</td></tr>
<tr><td>Rémunération dirigeant 190, marché 110</td><td class="n">+80</td></tr>
<tr><td>Véhicule et frais personnels</td><td class="n">+22</td></tr>
<tr><td>Loyer SCI 96, valeur locative 72</td><td class="n">+24</td></tr>
<tr><td>Litige prud'homal non récurrent</td><td class="n">+35</td></tr>
<tr><td>Poste de responsable administratif à recruter</td><td class="n">-55</td></tr>
<tr><td>Contrat signé en juillet, effet année pleine</td><td class="n">+48</td></tr>
<tr><td><strong>EBE retraité</strong></td><td class="n"><strong>794</strong></td></tr>
</table>
<p>À un multiple de 6, l'écart entre 640 et 794 représente <strong>924 k€ de valeur d'entreprise</strong>. Aucun de ces six retraitements n'est acquis : chacun se défend en audit avec la pièce correspondante (bulletins de paie, bail commercial, avis de valeur locative, jugement, offre d'emploi, contrat signé).</p>

<h2 id="opposable">Rendre un retraitement opposable</h2>
<ol>
<li>Une ligne, un montant, une pièce nommée et datée</li>
<li>Une justification en une phrase, compréhensible par un auditeur externe</li>
<li>Un traitement identique sur les trois exercices présentés</li>
<li>Aucun double compte entre retraitements et ajustements de dette nette</li>
</ol>
<div class="callout warn"><div class="ct">Erreur fréquente</div>Retraiter la rémunération du dirigeant au-delà du raisonnable en oubliant qu'il faudra bien payer quelqu'un pour faire le travail. Le retraitement se limite à l'écart avec le coût de remplacement réel, charges comprises.</div>
`,
key:["On retraite vers l'EBE d'un exploitant tiers en régime normal","Un retraitement vaut le multiple fois son montant","Une ligne sans pièce justificative ne survivra pas à l'audit","Le retraitement de rémunération se limite à l'écart avec le coût de remplacement"],
quiz:[
 {q:"Multiple de 5,5. Un retraitement de 40 k€ est accepté. Quel gain de valeur d'entreprise ?",o:["220 k€","40 k€","5,5 k€","Impossible à dire"],a:0,e:"40 x 5,5 = 220 k€. C'est l'effet de levier du multiple qui rend chaque ligne de retraitement stratégique."},
 {q:"Le dirigeant se rémunère 40 k€, très en dessous du marché estimé à 100 k€. Quel retraitement ?",o:["- 60 k€ sur l'EBE","+ 60 k€ sur l'EBE","Aucun retraitement","+ 100 k€"],a:0,e:"L'acquéreur devra payer un dirigeant au prix du marché. La sous-rémunération gonfle artificiellement l'EBE et se corrige à la baisse."},
 {q:"Quel retraitement est le plus contestable en audit ?",o:["Synergies attendues avec l'acquéreur","Véhicule personnel du dirigeant","Litige exceptionnel documenté","Loyer supérieur à la valeur locative"],a:0,e:"Les synergies appartiennent à l'acquéreur, pas à la cible. Les intégrer dans l'EBE retraité revient à faire payer au vendeur la valeur que crée l'acheteur."}

LESSONS["liasse-fiscale"] = {
why:"En small cap française, la liasse est souvent la seule source fiable disponible en amont. Savoir la lire vite est un avantage décisif.",
obj:["Naviguer dans les tableaux 2050 à 2059","Extraire l'information utile en moins de vingt minutes","Repérer les incohérences entre tableaux"],
html:`
<h2 id="carte">Carte des tableaux</h2>
<table class="tbl">
<tr><th>Tableau</th><th>Contenu</th><th>Utilité M&A</th></tr>
<tr><td>2050 et 2051</td><td>Bilan actif et passif</td><td>Base du pont de valeur</td></tr>
<tr><td>2052 et 2053</td><td>Compte de résultat</td><td>Chiffre d'affaires, EBE, résultat</td></tr>
<tr><td>2054 et 2055</td><td>Immobilisations et amortissements</td><td>Âge de l'outil, capex historique</td></tr>
<tr><td>2056</td><td>Provisions</td><td>Litiges, risques, dépréciations clients</td></tr>
<tr><td>2057</td><td>État des échéances des créances et dettes</td><td>Dette à moins et plus d'un an, structure du BFR</td></tr>
<tr><td>2058-A</td><td>Détermination du résultat fiscal</td><td>Réintégrations, déficits reportables</td></tr>
<tr><td>2058-B</td><td>Déficits et provisions non déductibles</td><td>Actif d'impôt différé potentiel</td></tr>
<tr><td>2059-A à E</td><td>Plus-values, réserve spéciale, affectation</td><td>Cessions d'actifs, distribution</td></tr>
</table>

<h2 id="methode">Méthode de lecture en vingt minutes</h2>
<ol>
<li>2052 : chiffre d'affaires, achats, charges externes, personnel. Calculer l'EBE.</li>
<li>2050 et 2051 : bâtir le BFR et la dette nette provisoire.</li>
<li>2057 : ventiler la dette par échéance et vérifier l'absence de mur de remboursement.</li>
<li>2055 : comparer les acquisitions de l'exercice aux dotations pour juger le capex.</li>
<li>2056 : lire les provisions, en particulier pour litiges et pour créances douteuses.</li>
<li>2058-A : repérer les réintégrations récurrentes, indice de charges personnelles.</li>
<li>Recouper trois exercices en une seule feuille avant toute analyse.</li>
</ol>
<div class="callout"><div class="ct">Contrôle de cohérence</div>Le résultat de 2052 doit se retrouver au passif de 2051, et les dotations de 2055 doivent égaler celles de 2052. Un écart signale une saisie approximative, souvent le premier signe d'une comptabilité peu fiable.</div>

<h2 id="limites">Limites</h2>
<p>La liasse est un document fiscal, pas un outil de gestion. Elle ne dit rien de la répartition du chiffre d'affaires par client, de la marge par activité ou de la saisonnalité. Ces informations viennent du grand livre, du FEC ou d'un reporting interne, qui se demandent dès la qualification.</p>
`,
key:["Huit tableaux suffisent, dans un ordre de lecture fixe","2057 révèle la structure d'échéance de la dette","2055 permet de juger l'effort d'investissement réel","La liasse ne donne aucune information de gestion analytique"],
quiz:[
 {q:"Quel tableau donne l'échéancier des dettes à moins d'un an et à plus d'un an ?",o:["2057","2050","2058-A","2059-A"],a:0,e:"Le 2057 ventile créances et dettes par échéance. Il est indispensable pour apprécier la pression de trésorerie à court terme."},
 {q:"Vous voulez juger si la société a suffisamment investi. Quel tableau ?",o:["2055, comparé aux dotations","2056","2058-B","2052 seul"],a:0,e:"Le tableau des amortissements permet de comparer acquisitions de l'exercice et dotations, donc de mesurer le renouvellement de l'outil."},
 {q:"Des réintégrations fiscales récurrentes en 2058-A suggèrent :",o:["Des charges non déductibles, souvent personnelles","Une erreur de l'administration","Un déficit reportable","Une plus-value latente"],a:0,e:"Amendes, véhicules de tourisme, cadeaux : ces réintégrations récurrentes sont une piste de retraitement d'EBE à explorer."}
],
src:["Formulaires Cerfa 2050 à 2059","Mémento fiscal, liasse des sociétés à l'IS"]};

LESSONS["sig"] = {
why:"Les SIG donnent une grille de lecture universelle de la formation du résultat, et un vocabulaire commun avec l'expert-comptable du cédant.",
obj:["Enchaîner les neuf soldes","Situer EBE, EBITDA et REX les uns par rapport aux autres","Utiliser les SIG comme grille de diagnostic"],
html:`
<h2 id="cascade">La cascade</h2>
<div class="formula"><span class="fl">Des ventes au résultat net</span>Marge commerciale ou Production
= Valeur ajoutée (après consommations externes)
- Impôts et taxes - Charges de personnel
= <strong>Excédent brut d'exploitation (EBE)</strong>
- Dotations + Reprises + Autres produits
= Résultat d'exploitation
+ Résultat financier
= Résultat courant avant impôt
+ Résultat exceptionnel - IS - Participation
= <strong>Résultat net</strong></div>

<h2 id="ebe-ebitda">EBE, EBITDA, REX</h2>
<p>Les trois notions se confondent souvent à tort. L'<strong>EBE</strong> est un solde du plan comptable français. L'<strong>EBITDA</strong> est une notion anglo-saxonne proche mais qui inclut généralement les autres produits et charges d'exploitation. Le <strong>résultat d'exploitation</strong> intègre les dotations. Dans une négociation, préciser lequel des trois sert de base au multiple évite un malentendu qui se chiffre en centaines de milliers d'euros.</p>
<table class="tbl">
<tr><th>Solde</th><th>Inclut les dotations</th><th>Inclut les autres charges d'exploitation</th></tr>
<tr><td>EBE</td><td>Non</td><td>Non</td></tr>
<tr><td>EBITDA</td><td>Non</td><td>Généralement oui</td></tr>
<tr><td>Résultat d'exploitation</td><td>Oui</td><td>Oui</td></tr>
</table>

<h2 id="diagnostic">Lecture en diagnostic</h2>
<ul>
<li><strong>Taux de valeur ajoutée</strong> (VA / CA) : mesure l'intégration de la chaîne. Une chute signale une externalisation ou une érosion de marge.</li>
<li><strong>Taux de marge d'EBE</strong> (EBE / CA) : premier point de comparaison sectorielle.</li>
<li><strong>Partage de la valeur ajoutée</strong> (charges de personnel / VA) : au-delà de 75 %, la société laisse peu de place à la rémunération du capital.</li>
</ul>
`,
key:["La cascade des SIG se récite dans l'ordre, sans hésitation","EBE, EBITDA et résultat d'exploitation ne sont pas synonymes","Le partage de la valeur ajoutée révèle la structure de coûts","Toujours préciser la base du multiple dans une discussion de prix"],
quiz:[
 {q:"Charges de personnel sur valeur ajoutée à 82 %. Quelle lecture ?",o:["Très peu de valeur reste pour rémunérer le capital","La société est très rentable","Le BFR est faible","Les stocks sont élevés"],a:0,e:"Au-delà de 75 à 80 %, la structure laisse une marge d'EBE mince et rend le résultat très sensible à toute variation d'activité."},
 {q:"Quelle différence principale entre EBE et EBITDA ?",o:["L'EBITDA intègre généralement les autres produits et charges d'exploitation","L'EBITDA déduit les amortissements","L'EBE inclut le résultat financier","Aucune, ce sont des synonymes exacts"],a:0,e:"L'EBE est un solde normé du PCG. L'EBITDA, notion de marché, est plus large et sa définition varie selon les praticiens, d'où la nécessité de la préciser."}
],
src:["Plan comptable général, soldes intermédiaires de gestion","Banque de France, ratios sectoriels"]};

/* Couche de stockage tolérante : bascule en mémoire si localStorage est
   indisponible (navigation privée, iframe cloisonnée, quota atteint).
   L'application reste utilisable, seule la persistance entre sessions est perdue. */
const MEM = {};
let storageOK = true, storageWarned = false;
const STORE = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ storageOK=false; return MEM[k]||null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ storageOK=false; MEM[k]=v; warnStorage(); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} delete MEM[k]; }
};
function warnStorage(){
  if(storageWarned) return; storageWarned=true;
  setTimeout(()=>toast("Stockage local indisponible : la progression ne sera pas conservée après fermeture.","err"),900);
}

let S = load();

function load(){
  try{
    const raw = STORE.get(KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const p = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_STATE), p, {
      prefs:Object.assign({}, DEFAULT_STATE.prefs, p.prefs||{}),
      streak:Object.assign({}, DEFAULT_STATE.streak, p.streak||{})
    });
  }catch(e){ return structuredClone(DEFAULT_STATE); }
}
let saveTimer=null, savePending=null;
/* La sauvegarde est différée pour ne pas écrire à chaque frappe.
   La clé est capturée au moment de la demande, et toute écriture en attente
   est forcée avant un changement de profil : sans cela, l'état d'un profil
   pourrait être écrit dans l'espace de stockage d'un autre. */
function save(){
  savePending=KEY;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ flushSave(); },120);
  if(typeof cloudTouch==="function") cloudTouch();   /* réplication distante, différée */
}
function flushSave(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  if(savePending){ STORE.set(savePending, JSON.stringify(S)); savePending=null; }
}
function meta(id){
  if(!S.tasks[id]) S.tasks[id]={st:"todo",fav:false,mastery:0,notes:"",time:0,seen:null,xpDone:false};
  return S.tasks[id];
}
function today(){
  const d=todayISO();
  if(!S.days[d]) S.days[d]={min:0,done:0,cards:0};
  return S.days[d];
}

/* ── 3. Gamification ──────────────────────────────────────── */
const XP = { done:25, quizPass:15, quizPerfect:40, card:3, minute:1, streak:10 };
const levelOf = xp => Math.floor(Math.sqrt(xp/60))+1;
const xpForLevel = l => Math.pow(l-1,2)*60;
const levelProgress = xp => {
  const l=levelOf(xp), a=xpForLevel(l), b=xpForLevel(l+1);
  return { level:l, cur:xp-a, need:b-a, pct: pct(xp-a, b-a) };
};
function addXP(n,label){
  S.xp+=n; save();
  if(label) toast("+"+n+" XP · "+label,"ok");
  paintHeader();
}
function checkIn(){
  const d=todayISO(), st=S.streak;
  if(st.last===d) return;
  if(st.last && dayDiff(st.last,d)===1) st.n+=1;
  else st.n=1;
  st.last=d; st.best=Math.max(st.best,st.n);
  S.xp+=XP.streak; save(); paintHeader();
}

/* ── 4. Répétition espacée (SM-2 simplifié) ───────────────── */
function srs(id){
  if(!S.srs[id]) S.srs[id]={ef:2.5,iv:0,reps:0,due:todayISO(),lapses:0};
  return S.srs[id];
}
/** grade : 0 à revoir, 1 difficile, 2 correct, 3 facile */
function review(id,grade){
  const c=srs(id);
  if(grade===0){ c.reps=0; c.iv=0; c.lapses++; c.ef=Math.max(1.3,c.ef-0.2); c.due=todayISO(); }
  else{
    const q=grade+2; // 3,4,5
    c.ef = clamp(c.ef + (0.1-(5-q)*(0.08+(5-q)*0.02)), 1.3, 2.8);
    c.reps++;
    if(c.reps===1) c.iv=1;
    else if(c.reps===2) c.iv=grade===1?3:6;
    else c.iv=Math.round(c.iv*c.ef*(grade===1?0.7:grade===3?1.25:1));
    c.iv=clamp(c.iv,1,365);
    c.due=addDays(todayISO(),c.iv);
  }
  today().cards++; S.xp+=XP.card; save(); paintHeader();
}
const isDue = id => srs(id).due <= todayISO();

/* ── 7. Statistiques ──────────────────────────────────────── */
function stats(){
  const done = TASKS.filter(t=>meta(t.id).st==="done").length;
  const doing= TASKS.filter(t=>meta(t.id).st==="doing").length;
  const fav  = TASKS.filter(t=>meta(t.id).fav).length;
  const min  = Math.round(Object.values(S.tasks).reduce((a,m)=>a+(m.time||0),0)/60);
  const due  = (typeof dueCount==="function") ? dueCount() : CARDS.filter(c=>isDue(c.id)).length;
  const seen = CARDS.filter(c=>S.srs[c.id]).length;
  const mast = TASKS.reduce((a,t)=>a+meta(t.id).mastery,0);
  return { done, doing, fav, min, due, seen, total:TASKS.length, pctDone:pct(done,TASKS.length), mastery:pct(mast,TASKS.length*3) };
}
const phaseStat = pid => {
  const ts=byPhase(pid), d=ts.filter(t=>meta(t.id).st==="done").length;
  return { total:ts.length, done:d, pct:pct(d,ts.length) };
};

/* ── 8. Composants : toasts et modales ────────────────────── */
function toast(msg,type){
  const box=$("#toasts"); if(!box) return;
  const el=document.createElement("div");
  el.className="toast "+(type||"");
  el.innerHTML=(type==="ok"?"<span class=\"c-green\">✓</span>":type==="err"?"<span class=\"c-red\">!</span>":"<span class=\"dim\">›</span>")+"<span>"+T(msg)+"</span>";
  box.appendChild(el);
  setTimeout(()=>{ el.classList.add("out"); setTimeout(()=>el.remove(),260); },2600);
}
let scrollLocked=0;
function lockScroll(on){
  scrollLocked=Math.max(0,scrollLocked+(on?1:-1));
  document.body.style.overflow = scrollLocked>0 ? "hidden" : "";
}
function modal(title, bodyHTML, footHTML){
  const box=$("#modalBox"); if(!box) return;
  box.innerHTML =
    (title!==""
      ? "<div class=\"modal-hd\"><div class=\"h4\">"+H(title)+"</div>"+
        "<button class=\"iconbtn\" data-close aria-label=\"Fermer\">✕</button></div>"
      : "")+
    "<div class=\"modal-bd\">"+bodyHTML+"</div>"+
    (footHTML?"<div class=\"modal-ft\">"+footHTML+"</div>":"");
  const ovl=$("#modalOvl"); if(!ovl) return;
  if(!ovl.classList.contains("on")) lockScroll(true);
  ovl.classList.add("on");
  const first=box.querySelector("button:not([data-close]),input,select,textarea,a[href]");
  if(first && first.focus) setTimeout(()=>{ try{ first.focus(); }catch(e){} },40);
}
function closeModal(){
  const ovl=$("#modalOvl"); if(!ovl) return;
  if(ovl.classList.contains("on")) lockScroll(false);

}

    "<svg width=\""+size+"\" height=\""+size+"\" viewBox=\"0 0 "+size+" "+size+"\" aria-hidden=\"true\">"+

    "<circle class=\"val\" cx=\""+size/2+"\" cy=\""+size/2+"\" r=\""+r+"\" stroke-width=\""+stroke+"\" "+
    "stroke-dasharray=\""+c.toFixed(1)+"\" stroke-dashoffset=\""+(c*(1-p/100)).toFixed(1)+"\"/></svg>"+
    "<div class=\"ring-lbl\"><div><b>"+label+"</b><span>"+H(sub)+"</span></div></div></div>";
}

/* ── 10. Confettis ────────────────────────────────────────── */
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cols=["#0ae448","#ff8709","#fec5fb","#9d95ff","#00bae2","#fffce1"];
  const box=document.createElement("div"); box.className="confetti";
  for(let i=0;i<44;i++){
    const s=document.createElement("i");
    s.style.left=(Math.random()*100)+"%";
    s.style.background=cols[i%cols.length];
    s.style.animationDuration=(1.6+Math.random()*1.6)+"s";
    s.style.animationDelay=(Math.random()*.45)+"s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(()=>box.remove(),3400);
}

/* ── 11. Mutations de progression ─────────────────────────── */
function setStatus(id,st){
  const m=meta(id), was=m.st;
  m.st=st; m.seen=todayISO();
  if(st==="done"){
    m.mastery=Math.max(m.mastery,1);
    if(was!=="done"){
      today().done++; checkIn();
      if(!m.xpDone){                       // l'expérience ne s'accorde qu'une fois
        m.xpDone=true; S.xp+=XP.done;
        const d=stats().done;
        if(d>0 && d%10===0){ confetti(); toast("Palier atteint : "+d+" modules terminés.","ok"); }
        else toast("Module terminé. +"+XP.done+" XP","ok");
      }else toast("Module de nouveau marqué terminé.","ok");
    }
  }else if(was==="done" && st!=="done"){
    toast("Module décoché. L'expérience et la maîtrise acquises sont conservées.");
  }
  save(); checkBadges(); paintHeader(); paintNav();
}
function cycleStatus(id){
  const m=meta(id);
  setStatus(id, m.st==="todo" ? "doing" : m.st==="doing" ? "done" : "todo");
}
function toggleFav(id){ const m=meta(id); m.fav=!m.fav; save(); }

/* ── Migration depuis la version 2 ────────────────────────── */
function migrate(){
  if(!S.tasks) S.tasks={};
  if(!S.quiz) S.quiz={};
  if(!S.prefs) S.prefs=structuredClone(DEFAULT_STATE.prefs);
  if(!S.prefs.tips) S.prefs.tips=[];
  if(S.v===3) return;
  S.games=S.games||{}; S.glFav=S.glFav||[]; S.read=S.read||[]; S.badges=S.badges||[];
  Object.keys(S.tasks).forEach(k=>{ const m=S.tasks[k]; if(m.xpDone===undefined) m.xpDone=(m.st==="done"); });
  Object.keys(S.quiz).forEach(k=>{ const q=S.quiz[k]; if(q.xpPass===undefined){ q.xpPass=q.best>0; q.xpPerfect=false; } });
  if(S.prefs.vertical===undefined) S.prefs.vertical=null;
  /* un import ou un état ancien ne doit pas faire perdre la verticale du profil */
  if(!S.prefs.vertical && typeof ME!=="undefined" && ME && ME.vertical) S.prefs.vertical=ME.vertical;
  if(!S.prefs.glView) S.prefs.glView="detail";
  if(!S.prefs.resView) S.prefs.resView="grid";
  S.v=3; save();
}

}

function pushToReview(term){
  const c=CARDS.filter(x=>x.q===term)[0];
  if(!c){ toast("Aucune fiche ne correspond à ce terme.","err"); return; }

/* ── Comparaison de chaîne pour le mode Écrire ────────────── */
function similar(a,b){
  const x=norm(a).replace(/[^a-z0-9 ]/g,"").trim(), y=norm(b).replace(/[^a-z0-9 ]/g,"").trim();
  if(!x||!y) return 0;
  if(x===y) return 1;
  const m=x.length, n=y.length;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(x[i-1]===y[j-1]?0:1));
    const t=prev; prev=cur; cur=t;
  }
  return 1 - prev[n]/Math.max(m,n);
}
/** Le mot clé attendu figure-t-il dans la réponse saisie ? */
function keyHit(answer,expected){
  const words=norm(expected).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>4);
  if(!words.length) return 0;
  const a=norm(answer);
  return words.filter(w=>a.indexOf(w)>=0).length / words.length;
}

/* ═══════════════════════════════════════════════════════════
   PROFILS, SESSION ET RÔLES
   Chaque profil dispose de son propre espace de progression.

   AVERTISSEMENT DE CONCEPTION, ASSUMÉ ET AFFICHÉ DANS L'INTERFACE
   Une application d'un seul fichier, sans serveur, ne peut pas offrir
   d'authentification au sens de la sécurité. Le code confidentiel
   empêche l'ouverture accidentelle d'un profil par un tiers sur le
   même poste : c'est une séparation d'usage, pas une protection.
   Les données restent lisibles par quiconque accède au navigateur.
   Une authentification réelle suppose un serveur et une base.
   ═══════════════════════════════════════════════════════════ */

const PKEY="hubma:profiles", SKEY="hubma:session", AKEY="hubma:admincode", LEGACY="hub-ma-triactis-v2";

/* ── Empreinte du code confidentiel ───────────────────────── */
function fnv1a(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h.toString(16); }
async function hashPin(pin,salt){
  const data=(salt||"")+"::"+String(pin);
  try{
    if(window.crypto && crypto.subtle && crypto.subtle.digest){
      const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
      return "s256:"+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
    }
  }catch(e){}
  return "fnv:"+fnv1a(data)+fnv1a(data.split("").reverse().join(""));
}
const newId = () => "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const initials = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase()||"?";

function loadProfiles(){

  catch(e){ PROFILES=[]; }

}
const saveProfiles = () => STORE.set(PKEY, JSON.stringify(PROFILES));
const profileOf = id => PROFILES.filter(p=>p.id===id)[0]||null;

/* ── Session ──────────────────────────────────────────────── */
function openSession(id){
  const target=profileOf(id); if(!target) return false;
  flushSave();                      // fige l'état du profil courant avant de basculer
  ME=target;
  ME.lastSeen=todayISO(); saveProfiles();
  STORE.set(SKEY, JSON.stringify({id,at:Date.now()}));
  KEY="hubma:state:"+id;          // bascule l'espace de stockage
  S=load(); migrate(); save();
  return true;
}
function closeSession(){
  flushSave();                      // n'abandonne aucune donnée en attente
  STORE.del(SKEY); ME=null;
  KEY=LEGACY; S=load();
  gate={mode:"list",sel:null,err:""};
  stopTimer(); closeModal(); closeCmd();
  renderGate();
}
function currentSession(){
  try{ const s=JSON.parse(STORE.get(SKEY)||"null"); return s&&s.id?s.id:null; }catch(e){ return null; }
}

/* ── Création et suppression ──────────────────────────────── */
async function createProfile(nom,vertical,pin,asAdmin){
  nom=String(nom||"").trim().slice(0,40);
  if(nom.length<2) return {ok:false,err:"Indiquez un nom d'au moins deux caractères."};
  if(PROFILES.some(p=>norm(p.nom)===norm(nom))) return {ok:false,err:"Ce nom de profil existe déjà."};
  if(pin && !/^\d{4,8}$/.test(pin)) return {ok:false,err:"Le code doit comporter de 4 à 8 chiffres."};
  const first=PROFILES.length===0;
  const salt=Math.random().toString(36).slice(2,12);
  const p={ id:newId(), nom, vertical:vertical||"tous", role:(asAdmin||first)?"admin":"membre",
            salt, pin: pin?await hashPin(pin,salt):null, created:todayISO(), lastSeen:todayISO() };
  PROFILES.push(p); saveProfiles();

  /* reprise de la progression anonyme existante, une seule fois */
  if(first){
    const old=STORE.get(LEGACY);
    if(old){ STORE.set("hubma:state:"+p.id, old); }
  }
  openSession(p.id);
  S.prefs.vertical=p.vertical; save();
  return {ok:true,id:p.id};
}
async function checkPin(id,pin){
  const p=profileOf(id); if(!p) return false;
  if(!p.pin) return true;
  return (await hashPin(pin,p.salt))===p.pin;
}
function deleteProfile(id){
  const p=profileOf(id); if(!p) return;
  PROFILES=PROFILES.filter(x=>x.id!==id); saveProfiles();
  STORE.del("hubma:state:"+id);
  if(ME&&ME.id===id) closeSession(); else renderGate();
}
async function setPin(pin){
  if(!ME) return {ok:false,err:"Aucun profil actif."};
  if(pin && !/^\d{4,8}$/.test(pin)) return {ok:false,err:"Le code doit comporter de 4 à 8 chiffres."};
  ME.pin = pin ? await hashPin(pin,ME.salt) : null;
  saveProfiles();
  return {ok:true};
}

/* ── Code administrateur ──────────────────────────────────── */
async function adminHash(){ const h=STORE.get(AKEY); return h || await hashPin(ADMIN_DEFAULT,"hubma"); }
async function checkAdminCode(code){ return (await hashPin(code,"hubma"))===(await adminHash()); }
async function setAdminCode(code){
  if(!/^.{4,}$/.test(code||"")) return {ok:false,err:"Le code doit comporter au moins quatre caractères."};
  STORE.set(AKEY, await hashPin(code,"hubma")); return {ok:true};
}
async function elevate(code){
  if(!await checkAdminCode(code)) return false;
  if(ME){ ME.role="admin"; saveProfiles(); }
  return true;
}

/* résumé lisible sans ouvrir la session */
function profileSummary(id){
  try{
    const raw=STORE.get("hubma:state:"+id); if(!raw) return {level:1,done:0};
    const st=JSON.parse(raw);
    const done=Object.keys(st.tasks||{}).filter(k=>st.tasks[k].st==="done").length;
    return { level:Math.floor(Math.sqrt((st.xp||0)/60))+1, done };
  }catch(e){ return {level:1,done:0}; }
}

   PLANIFICATION ET CONSOLE D'ADMINISTRATION
   Le plan est commun au poste (tous les profils du navigateur).
   La progression, elle, reste propre à chaque profil.
   ═══════════════════════════════════════════════════════════ */

const PLKEY="hubma:plan";
const PLAN_DEFAULT={ quota:{cards:10,min:15,modules:1}, modules:{}, cards:{}, updated:null };
let PLAN=loadPlan();

function loadPlan(){
  try{
    const p=JSON.parse(STORE.get(PLKEY)||"null");
    if(!p) return structuredClone(PLAN_DEFAULT);
    return Object.assign(structuredClone(PLAN_DEFAULT),p,{quota:Object.assign({},PLAN_DEFAULT.quota,p.quota||{})});
  }catch(e){ return structuredClone(PLAN_DEFAULT); }
}
function savePlan(){
  PLAN.updated=todayISO();
  STORE.set(PLKEY, JSON.stringify(PLAN));
  /* le plan est commun : on le réplique pour que chaque membre le reçoive */
  if(typeof sbPushPlan==="function" && typeof cloudReady==="function" && cloudReady() && SB.user && isAdmin()){
    sbPushPlan().catch(e=>toast("Plan non répliqué : "+e.message,"err"));
  }
}

/* combien de fiches par session : le quota fait loi, borné pour rester tenable */
const sessionSize = () => clamp(PLAN.quota.cards||10,3,50);

/* modules programmés pour aujourd'hui ou en retard, non terminés */
function plannedModules(){
  const t=todayISO();
  return Object.keys(PLAN.modules)
    .filter(id=>anyMod(id) && PLAN.modules[id]<=t && meta(id).st!=="done")
    .sort((a,b)=>PLAN.modules[a].localeCompare(PLAN.modules[b]))
    .map(id=>({mod:anyMod(id), date:PLAN.modules[id], late:PLAN.modules[id]<t}));
}
/* fiches forcées par le plan, échéance atteinte */
const plannedCards = () => Object.keys(PLAN.cards).filter(id=>PLAN.cards[id]<=todayISO() && CARDS.some(c=>c.id===id));

/* file de révision : plan + échéances naturelles, mélangée, plafonnée */
function reviewPool(){
  const forced=plannedCards();
  const due=CARDS.filter(c=>isDue(c.id)).map(c=>c.id);
  const seen={}, out=[];
  forced.concat(due).forEach(id=>{ if(!seen[id]){ seen[id]=1; out.push(id); } });
  return out;
}
const dueCount = () => reviewPool().length;

/* ── Actions ──────────────────────────────────────────────── */
function planSet(groupId,startISO,perWeek){
  const list = groupId.indexOf("v:")===0 ? vmodsFor(groupId.slice(2)) : byPhase(groupId);
  if(!list.length) return 0;
  const step=Math.max(1,Math.round(5/clamp(perWeek,1,20)));   // jours ouvrés entre deux modules
  let d=startISO, placed=0;
  list.forEach((m,i)=>{
    if(i>0){ for(let k=0;k<step;k++){ d=addDays(d,1); const wd=new Date(d+"T12:00:00").getDay();
      if(wd===0) d=addDays(d,1); if(new Date(d+"T12:00:00").getDay()===6) d=addDays(d,2); } }
    PLAN.modules[m.id]=d; placed++;
  });
  savePlan(); return placed;
}
function cardsDueAt(cat,dateISO){
  const list = cat==="all" ? CARDS : CARDS.filter(c=>c.c===cat);
  list.forEach(c=>{ PLAN.cards[c.id]=dateISO; });
  savePlan(); return list.length;
}

/* ═══════════════════════════════════════════════════════════
   COUCHE SUPABASE
   Authentification réelle et stockage distant, via l'API REST
   appelée directement en fetch : aucune dépendance externe,
   donc aucun script tiers à charger et un comportement testable.

   La clé « anon » est publique par conception : c'est la
   sécurité au niveau des lignes (RLS) qui protège les données,
   jamais le secret de cette clé. Voir le tutoriel joint.
   ═══════════════════════════════════════════════════════════ */

/* ── 1. Configuration, à renseigner ───────────────────────── */
const SUPABASE = {
  url:     "",   /* ex. https://abcdefghijklm.supabase.co */
  anonKey: ""    /* clé publique anon, onglet Settings puis API */
};
const T_PROFILES="hub_profiles", T_PROGRESS="hub_progress", T_PLAN="hub_plan";
const SBSESS="hubma:sb-session", SBCACHE="hubma:sb-cache";

const cloudReady = () => !!(SUPABASE.url && SUPABASE.anonKey);
let SB = { session:null, user:null, profile:null, status:"local", lastSync:null, err:null };

/* ── 2. Session locale ────────────────────────────────────── */
function sbLoadSession(){
  try{ SB.session=JSON.parse(STORE.get(SBSESS)||"null"); }catch(e){ SB.session=null; }
  return SB.session;
}
function sbStoreSession(s){
  SB.session=s;
  if(s) STORE.set(SBSESS, JSON.stringify(s)); else STORE.del(SBSESS);
}
const sbExpired = () => !SB.session || !SB.session.expires_at || (Date.now()/1000) > (SB.session.expires_at-60);

/* ── 3. Appels bas niveau ─────────────────────────────────── */
function sbHeaders(auth){
  const h={ "apikey":SUPABASE.anonKey, "Content-Type":"application/json" };
  if(auth && SB.session && SB.session.access_token) h["Authorization"]="Bearer "+SB.session.access_token;
  return h;
}
async function sbRaw(path,opts){
  const res=await fetch(SUPABASE.url.replace(/\/+$/,"")+path, opts);
  let body=null;
  const txt=await res.text();
  if(txt){ try{ body=JSON.parse(txt); }catch(e){ body={raw:txt}; } }
  if(!res.ok){
    const msg=(body&&(body.msg||body.message||body.error_description||body.error||body.hint))||("Erreur "+res.status);
    const err=new Error(msg); err.status=res.status; err.body=body; throw err;
  }
  return body;
}
/** Appel authentifié, avec rafraîchissement automatique du jeton. */
async function sbCall(path,opts,retry){
  if(sbExpired() && SB.session && SB.session.refresh_token && !retry){
    try{ await sbRefresh(); }catch(e){ /* on tente quand même, le 401 sera traité */ }
  }
  try{
    return await sbRaw(path, Object.assign({}, opts, {headers:Object.assign(sbHeaders(true), (opts&&opts.headers)||{})}));
  }catch(e){
    if(e.status===401 && !retry && SB.session && SB.session.refresh_token){
      await sbRefresh();
      return sbCall(path,opts,true);
    }
    throw e;
  }
}

/* ── 4. Authentification ──────────────────────────────────── */
function sbSetSession(d){
  if(!d || !d.access_token) return null;
  const s={ access_token:d.access_token, refresh_token:d.refresh_token,
            expires_at: d.expires_at || Math.floor(Date.now()/1000)+(d.expires_in||3600),
            user:d.user||null };
  sbStoreSession(s); SB.user=s.user; return s;
}
async function sbSignUp(email,password,meta){
  const d=await sbRaw("/auth/v1/signup",{ method:"POST", headers:sbHeaders(false),
    body:JSON.stringify({ email:String(email).trim(), password, data:meta||{} }) });
  /* si la confirmation par courriel est active, aucune session n'est renvoyée */
  if(d && d.access_token){ sbSetSession(d); return {ok:true, confirmed:true}; }
  return {ok:true, confirmed:false, email:String(email).trim()};
}
async function sbSignIn(email,password){
  const d=await sbRaw("/auth/v1/token?grant_type=password",{ method:"POST", headers:sbHeaders(false),
    body:JSON.stringify({ email:String(email).trim(), password }) });
  sbSetSession(d); return SB.session;
}
async function sbRefresh(){
  if(!SB.session||!SB.session.refresh_token) throw new Error("Aucune session à rafraîchir.");
  const d=await sbRaw("/auth/v1/token?grant_type=refresh_token",{ method:"POST", headers:sbHeaders(false),
    body:JSON.stringify({ refresh_token:SB.session.refresh_token }) });
  return sbSetSession(d);
}
async function sbSignOut(){
  try{ if(SB.session) await sbCall("/auth/v1/logout",{method:"POST"}); }catch(e){}
  sbStoreSession(null); SB.user=null; SB.profile=null; SB.status="deconnecte";
}
async function sbRecover(email){
  await sbRaw("/auth/v1/recover",{ method:"POST", headers:sbHeaders(false),
    body:JSON.stringify({ email:String(email).trim() }) });
  return true;
}
async function sbGetUser(){
  const u=await sbCall("/auth/v1/user",{method:"GET"});
  SB.user=u; if(SB.session){ SB.session.user=u; sbStoreSession(SB.session); }
  return u;
}

/* ── 6. Synchronisation de l'état ─────────────────────────── */
/** Fusion sans perte : on ne régresse jamais sur un acquis. */
function mergeState(a,b){
  if(!a) return b; if(!b) return a;
  const out=structuredClone(a);
  out.xp=Math.max(a.xp||0,b.xp||0);
  out.v=Math.max(a.v||0,b.v||0);
  out.streak={ n:Math.max((a.streak||{}).n||0,(b.streak||{}).n||0),
               best:Math.max((a.streak||{}).best||0,(b.streak||{}).best||0),
               last:[(a.streak||{}).last,(b.streak||{}).last].filter(Boolean).sort().pop()||null };
  const RANK={todo:0,doing:1,done:2};
  out.tasks={};
  Object.keys(Object.assign({},a.tasks,b.tasks)).forEach(k=>{
    const x=(a.tasks||{})[k]||{}, y=(b.tasks||{})[k]||{};
    out.tasks[k]={
      st: (RANK[y.st]||0)>(RANK[x.st]||0) ? y.st : (x.st||"todo"),
      mastery: Math.max(x.mastery||0,y.mastery||0),
      xpDone: !!(x.xpDone||y.xpDone),
      fav: (y.seen||"")>(x.seen||"") ? !!y.fav : !!x.fav,
      time: Math.max(x.time||0,y.time||0),
      notes: (y.seen||"")>(x.seen||"") ? (y.notes||x.notes||"") : (x.notes||y.notes||""),
      seen: [x.seen,y.seen].filter(Boolean).sort().pop()||null
    };
  });
  out.quiz={};
  Object.keys(Object.assign({},a.quiz,b.quiz)).forEach(k=>{
    const x=(a.quiz||{})[k]||{}, y=(b.quiz||{})[k]||{};
    out.quiz[k]={ best:Math.max(x.best||0,y.best||0), tries:Math.max(x.tries||0,y.tries||0),
                  xpPass:!!(x.xpPass||y.xpPass), xpPerfect:!!(x.xpPerfect||y.xpPerfect) };
  });
  out.srs={};
  Object.keys(Object.assign({},a.srs,b.srs)).forEach(k=>{
    const x=(a.srs||{})[k], y=(b.srs||{})[k];
    if(!x) return void(out.srs[k]=y); if(!y) return void(out.srs[k]=x);
    out.srs[k]=(y.reps||0)>=(x.reps||0)?y:x;      /* la révision la plus avancée gagne */
  });
  out.days={};
  Object.keys(Object.assign({},a.days,b.days)).forEach(k=>{
    const x=(a.days||{})[k]||{}, y=(b.days||{})[k]||{};
    out.days[k]={ min:Math.max(x.min||0,y.min||0), done:Math.max(x.done||0,y.done||0), cards:Math.max(x.cards||0,y.cards||0) };
  });
  out.badges=Array.from(new Set([].concat(a.badges||[],b.badges||[])));
  out.glFav=Array.from(new Set([].concat(a.glFav||[],b.glFav||[])));
  out.read=Array.from(new Set([].concat(a.read||[],b.read||[])));
  out.games={};
  Object.keys(Object.assign({},a.games,b.games)).forEach(k=>{
    const x=(a.games||{})[k], y=(b.games||{})[k];
    out.games[k]=(typeof x==="number"&&typeof y==="number")?Math.max(x,y):(y!==undefined?y:x);
  });
  out.prefs=Object.assign({},a.prefs,b.prefs);
  out.prefs.tips=Array.from(new Set([].concat((a.prefs||{}).tips||[],(b.prefs||{}).tips||[])));
  return out;
}

/* file d'attente : on n'écrase pas le distant si le réseau tombe */
let syncTimer=null, syncDirty=false, syncing=false, inflight=null;
function cloudTouch(){
  if(!cloudReady()||!SB.user) return;
  syncDirty=true;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(cloudFlush,2500);
  if(!syncing) setStatus_("attente");
}
/** Un seul envoi à la fois. Les appels concurrents attendent celui en cours,
    et toute modification survenue pendant l'envoi déclenche un second tour :
    sans cette boucle, la dernière action de l'utilisateur serait perdue. */
async function cloudFlush(){
  if(!cloudReady()||!SB.user) return;
  if(syncing) return inflight;
  if(!syncDirty) return;
  syncing=true; setStatus_("envoi");
  inflight=(async()=>{
    try{
      let tours=0;
      while(syncDirty && tours<5){ syncDirty=false; tours++; await sbPushState(); }
      SB.err=null; setStatus_("ok");
    }catch(e){
      syncDirty=true;                 /* on ne perd jamais la modification */
      SB.err=e.message; setStatus_("hors-ligne");
    }finally{ syncing=false; inflight=null; }
  })();
  return inflight;
}
function setStatus_(s){ SB.status=s; paintSync(); }

/* ── 9. Ouverture de session complète ─────────────────────── */
async function cloudBoot(){
  if(!cloudReady()){ SB.status="local"; return false; }
  sbLoadSession();
  if(!SB.session) { SB.status="deconnecte"; return false; }
  try{
    if(sbExpired()) await sbRefresh();
    await sbGetUser();
    await cloudAdopt();
    return true;
  }catch(e){
    SB.err=e.message;
    /* jeton mort : on repart de l'écran de connexion sans perdre le cache local */
    sbStoreSession(null); SB.status="deconnecte";
    return false;
  }
}
/** Charge le profil, fusionne l'état distant et le cache local, publie le résultat. */
async function cloudAdopt(){
  let prof=await sbFetchProfile();
  if(!prof){
    const md=(SB.user&&SB.user.user_metadata)||{};
    prof=await sbUpsertProfile({ display_name:md.display_name||String(SB.user.email).split("@")[0],
                                 vertical:md.vertical||"tous", role:"membre" });
  }
  KEY="hubma:state:"+SB.user.id;
  S=load(); migrate();
  let remote=null;
  try{ remote=await sbPullState(); }catch(e){ SB.err=e.message; }
  if(remote && remote.state){
    S=mergeState(S,remote.state); migrate();
  }
  if(prof){
    ME={ id:SB.user.id, nom:prof.display_name||SB.user.email, email:SB.user.email,
         vertical:prof.vertical||"tous", role:prof.role||"membre", cloud:true, pin:null, lastSeen:todayISO() };
    if(!S.prefs.vertical) S.prefs.vertical=ME.vertical;
  }
  flushSave();
  try{ await sbPushState(); SB.status="ok"; SB.err=null; }
  catch(e){ SB.err=e.message; SB.status="hors-ligne"; }
  try{
    const pl=await sbPullPlan();
    if(pl){ PLAN.quota=Object.assign({},PLAN_DEFAULT.quota,pl.quota||{});
            PLAN.modules=pl.modules||{}; PLAN.cards=pl.cards||{}; savePlan(); }
  }catch(e){}
  return true;
}

let CMD_INDEX=null, cmdSel=0, cmdItems=[];
function buildIndex(){
  if(CMD_INDEX) return CMD_INDEX;
  CMD_INDEX = [].concat(
    MAIN_NAV.concat(TOOL_NAV).map(i=>({g:"Aller à",t:i.n,s:"",h:i.h,ic:i.i})),
    PHASES.map(p=>({g:"Phases",t:"Phase "+p.n+" · "+p.nom,s:p.dom,h:"#/phase/"+p.id,ic:p.ico})),
    TASKS.map(t=>({g:"Modules",t:t.nom,s:phaseOf(t.phase).nom,h:"#/module/"+t.id,ic:"◎"})),
    VMODULES.map(m=>({g:"Modules métier",t:m.nom,s:vertOf(m.v).court,h:"#/module/"+m.id,ic:vertOf(m.v).ico})),
    VERTICALES.map(v=>({g:"Verticales",t:v.nom,s:"fiche métier",h:"#/verticale?v="+v.id,ic:v.ico})),
    PROCESS.map(p=>({g:"Étapes du process",t:"Étape "+p.n+" · "+p.t,s:p.d,h:"#/process?e="+p.n,ic:p.ico})),
    METRICS.map(m=>({g:"Métriques",t:m.n,s:m.c,h:"#/process",ic:"∑"})),
    MODES.map(m=>({g:"Modes de jeu",t:"Mode "+m.n,s:m.d,h:"#/cartes?m="+m.id,ic:m.ico})),
    GLOSSARY.map(g=>({g:"Référentiel",t:g.t,s:g.c,h:"#/referentiel?t="+encodeURIComponent(g.t),ic:"§"})),
    RESOURCES.map(r=>({g:"Ressources",t:r.n,s:r.t,h:"#/ressources?q="+encodeURIComponent(r.n),ic:"↗"})),
    [
      {g:"Actions",t:"Basculer le thème clair ou sombre",s:"",act:toggleTheme,ic:"◐"},
      {g:"Actions",t:"Exporter ma progression",s:"fichier JSON",act:exportData,ic:"↧"},
      {g:"Actions",t:"Lancer la révision du jour",s:"",h:"#/revision",ic:"⟳"},
      {g:"Actions",t:"Afficher les raccourcis clavier",s:"",act:helpModal,ic:"?"},
      {g:"Actions",t:"Changer de verticale",s:"",h:"#/verticale?pick=1",ic:"⇄"},
      {g:"Actions",t:"Voir mes succès",s:"",h:"#/stats",ic:"✦"}
    ]
  );
  return CMD_INDEX;
}
function score(q,t){
  const a=norm(t), b=norm(q);
  if(a===b) return 1000;
  if(a.indexOf(b)===0) return 500-a.length;
  const i=a.indexOf(b);
  if(i>0) return 300-i;
  let p=0,j=0;                       // correspondance approximative
  for(const ch of b){ const k=a.indexOf(ch,j); if(k<0) return -1; p+=(k===j?2:1); j=k+1; }
  return p;
}
function renderCmd(q){
  const idx=buildIndex();
  let list;
  if(!q.trim()){
    list = idx.filter(i=>i.g==="Aller à" || i.g==="Actions").slice(0,10);
  }else{
    list = idx.map(i=>({i, s:score(q,i.t)})).filter(x=>x.s>0)
              .sort((a,b)=>b.s-a.s).slice(0,28).map(x=>x.i);
  }
  cmdItems=list; cmdSel=0;
  const box=$("#cmdList");
  if(!list.length){ box.innerHTML="<div class=\"empty\" style=\"border:none\">Aucun résultat pour cette recherche.</div>"; return; }
  let out="",g=null;
  list.forEach((it,n)=>{
    if(it.g!==g){ g=it.g; out+="<div class=\"cmd-grp\">"+H(g)+"</div>"; }
    out+="<div class=\"cmd-it"+(n===0?" sel":"")+"\" data-n=\""+n+"\">"+
      "<span class=\"ci\">"+it.ic+"</span><span class=\"ct\">"+T(it.t)+"</span>"+
      (it.s?"<span class=\"cs\">"+T(it.s)+"</span>":"")+"</div>";
  });
  box.innerHTML=out;
}
function openCmd(){
  $("#cmdOvl").classList.add("on");
  const i=$("#cmdInput"); i.value=""; renderCmd(""); setTimeout(()=>i.focus(),30);
}
function closeCmd(){ $("#cmdOvl").classList.remove("on"); }
function runCmd(n){
  const it=cmdItems[n]; if(!it) return;
  closeCmd();
  if(it.act) it.act(); else location.hash=it.h;
}
function moveCmd(d){
  if(!cmdItems.length) return;
  cmdSel=(cmdSel+d+cmdItems.length)%cmdItems.length;
  $$(".cmd-it").forEach(e=>e.classList.toggle("sel", +e.dataset.n===cmdSel));
  const el=$(".cmd-it.sel"); if(el) el.scrollIntoView({block:"nearest"});
}

/* ── Ligne de module ──────────────────────────────────────── */
function taskRow(t){
  const m=meta(t.id), p=phaseOf(t.phase);
  const mark = m.st==="done"?"✓":m.st==="doing"?"·":"";
  return "<div class=\"taskrow"+(m.st==="done"?" is-done":"")+"\" data-phase=\""+t.phase+"\">"+
    "<button class=\"chk "+(m.st==="done"?"done":m.st==="doing"?"doing":"")+"\" data-cycle=\""+t.id+"\" "+
      "title=\"Changer le statut\" aria-label=\"Changer le statut de "+esc(t.nom)+"\">"+mark+"</button>"+
    "<a class=\"tname\" href=\"#/module/"+t.id+"\">"+T(t.nom)+"</a>"+
    "<div class=\"tmeta\">"+
      "<span class=\"dim\" style=\"font-size:11px\" title=\""+esc(p.nom)+"\">"+p.ico+"</span>"+
      "<span class=\"dim\" style=\"font-size:11px\">"+t.min+"′</span>"+
      masteryDots(m.mastery)+
      "<button class=\"starbtn"+(m.fav?" on":"")+"\" data-fav=\""+t.id+"\" aria-label=\"Favori\">"+(m.fav?"★":"☆")+"</button>"+
    "</div></div>";
}
const masteryDots = n => "<span class=\"mastery\" title=\"Maîtrise "+n+" sur 3\">"+
  [1,2,3].map(i=>"<i class=\""+(i<=n?"f":"")+"\"></i>").join("")+"</span>";

/* ── Parcours : tous les modules ──────────────────────────── */
let pcFilter={f:"all",p:"all",c:"all",q:""};
function viewParcours(params){
  crumbs([{n:"Tous les modules"}]);

  const head =

    "<h1 class=\"h2 mt8\">108 modules, 7 phases</h1>"+
    "<div class=\"row wrap mt16\" style=\"gap:10px\">"+
      "<div class=\"searchwrap\" style=\"flex:1;min-width:220px\"><span class=\"si\">⌕</span>"+
        "<input class=\"field\" id=\"pcq\" placeholder=\"Filtrer par mot clé (touche /)\" value=\""+esc(pcFilter.q)+"\"></div>"+
      "<select class=\"field\" id=\"pcp\" style=\"width:auto;min-width:170px\">"+
        "<option value=\"all\">Toutes les phases</option>"+
        PHASES.map(p=>"<option value=\""+p.id+"\""+(pcFilter.p===p.id?" selected":"")+">Phase "+p.n+" · "+esc(p.nom)+"</option>").join("")+
      "</select>"+
      "<select class=\"field\" id=\"pcc\" style=\"width:auto;min-width:150px\">"+
        "<option value=\"all\">Toutes catégories</option>"+

      "</select>"+
    "</div>"+
    "<div class=\"pillrow scroll mt12\">"+
      [["all","Tous"],["todo","À faire"],["doing","En cours"],["done","Terminés"],["fav","Favoris"]]
        .map(f=>"<button class=\"pill"+(pcFilter.f===f[0]?" on":"")+"\" data-pcf=\""+f[0]+"\">"+f[1]+"</button>").join("")+
    "</div><div id=\"pclist\" class=\"mt24\"></div>";
  setView(head);
  paintParcours();
}
function paintParcours(){
  const q=norm(pcFilter.q);
  const list=TASKS.filter(t=>{
    const m=meta(t.id);
    if(pcFilter.p!=="all" && t.phase!==pcFilter.p) return false;
    if(pcFilter.c!=="all" && t.cat!==pcFilter.c) return false;
    if(pcFilter.f==="fav" && !m.fav) return false;
    if(["todo","doing","done"].indexOf(pcFilter.f)>=0 && m.st!==pcFilter.f) return false;
    if(q && norm(t.nom).indexOf(q)<0 && norm(phaseOf(t.phase).nom).indexOf(q)<0) return false;
    return true;
  });
  const box=$("#pclist");
  if(!list.length){ box.innerHTML="<div class=\"empty\"><div class=\"ei\">⌕</div>Aucun module ne correspond à ces critères.</div>"; return; }
  let out="<div class=\"dim mt8\" style=\"font-size:12px;margin-bottom:12px\">"+list.length+" module"+(list.length>1?"s":"")+"</div>";
  let cur=null;
  list.forEach((t,i)=>{
    if(t.phase!==cur){
      cur=t.phase; const p=phaseOf(cur);
      out+="<div class=\"sec-hd\" style=\"margin-top:26px\"><h2 class=\"h4\">"+p.ico+" "+T(p.nom)+"</h2>"+
           "<a class=\"btn sm ghost\" href=\"#/phase/"+p.id+"\">Vue d'ensemble →</a></div><div class=\"tasklist\">";
    }
    out+=taskRow(t);
    const nx=list[i+1];
    if(!nx || nx.phase!==cur) out+="</div>";
  });
  box.innerHTML=out;
}

/* ── Vue d'une phase ──────────────────────────────────────── */
function viewPhase(id){
  const p=phaseOf(id);
  if(!p) return view404();
  crumbs([{n:"Parcours",h:"#/parcours"},{n:"Phase "+p.n+" · "+p.nom}]);
  const st=phaseStat(id), ts=byPhase(id);
  const cats={}; ts.forEach(t=>{ cats[t.cat]=(cats[t.cat]||0)+1; });
  const minTot=ts.reduce((a,t)=>a+t.min,0);
  const prev=PHASES[p.n-2], next=PHASES[p.n];

  let h="<div data-phase=\""+id+"\">"+
    "<div class=\"row wrap\" style=\"gap:22px\">"+
      ring(st.pct,84,6,st.pct+"%","complété")+
      "<div style=\"flex:1;min-width:260px\">"+
        "<div class=\"eyebrow c-ph\">"+p.ico+" Phase "+p.n+" · "+T(p.dom)+"</div>"+
        "<h1 class=\"h2 mt8\">"+T(p.nom)+"</h1>"+
        "<p class=\"lead mt8\">"+T(p.desc)+"</p>"+
      "</div></div>"+
    "<div class=\"callout mt24\"><div class=\"ct\">Objectif de la phase</div>"+T(p.obj)+"</div>"+
    "<div class=\"statgrid mt16\">"+
      "<div class=\"stat\"><b>"+st.total+"</b><span>modules</span></div>"+
      "<div class=\"stat\"><b class=\"c-green\">"+st.done+"</b><span>terminés</span></div>"+
      "<div class=\"stat\"><b>"+dur(minTot)+"</b><span>durée estimée</span></div>"+
      "<div class=\"stat\"><b>"+p.prio+"</b><span>priorité</span></div>"+
    "</div>";

  h+="<div class=\"sec\"><div class=\"sec-hd\"><h2 class=\"h3\">Modules</h2>"+
     "<span class=\"dim\" style=\"font-size:12px\">"+Object.keys(cats).map(c=>cats[c]+" "+c.toLowerCase()).join(" · ")+"</span></div>";
  let cur=null;
  ts.forEach((t,i)=>{
    if(t.cat!==cur){ if(cur)h+="</div>"; cur=t.cat;
      h+="<div class=\"eyebrow mt24\" style=\"margin-bottom:10px\">"+T(cur)+"</div><div class=\"tasklist\">"; }
    h+=taskRow(t);
    if(i===ts.length-1) h+="</div>";
  });
  h+="</div>";

  h+="<div class=\"sec\"><div class=\"sec-hd\"><h2 class=\"h4\">Ressources conseillées</h2></div><ul class=\"prose\">"+
     p.res.map(r=>"<li>"+T(r)+"</li>").join("")+"</ul></div>";

  h+="<div class=\"row spread sec\" style=\"border-top:1px solid var(--line);padding-top:20px\">"+
     (prev?"<a class=\"btn ghost\" href=\"#/phase/"+prev.id+"\">← Phase "+prev.n+" · "+T(prev.nom)+"</a>":"<span></span>")+
     (next?"<a class=\"btn\" href=\"#/phase/"+next.id+"\">Phase "+next.n+" · "+T(next.nom)+" →</a>":"<span></span>")+
     "</div></div>";
  setView(h);
}

/* ── Module (leçon) ───────────────────────────────────────── */
let modTab="cours", timerInt=null, timerSec=0, timerOn=false;

  let h="<div "+(ctx.vert?"style=\"--ph:"+ctx.col+"\"":"data-phase=\""+t.phase+"\"")+">"+
   "<div class=\"spread wrap\">"+
    "<div style=\"flex:1;min-width:240px\">"+
      "<div class=\"eyebrow c-ph\">"+ctx.ico+" "+(ctx.vert?T(ctx.nom):"Phase "+ctx.n)+" · "+T(t.cat)+" · "+dur(t.min)+"</div>"+

    "<div class=\"row\" style=\"gap:8px\">"+
      "<button class=\"iconbtn starbtn"+(m.fav?" on":"")+"\" data-fav=\""+id+"\" title=\"Ajouter aux favoris\">"+(m.fav?"★":"☆")+"</button>"+

  h+="<div class=\"tabs mt24\">"+
     "<button class=\"tab"+(modTab==="cours"?" on":"")+"\" data-tab=\"cours\">Cours</button>"+

     (prev?"<a class=\"btn ghost\" href=\"#/module/"+prev.id+"\" title=\"Touche J\">← "+T(short(prev.nom,40))+"</a>"

function paintTab(id){
  const c=content(id), m=meta(id), box=$("#tabBody");
  if(modTab==="cours"){
    const objs = c.obj&&c.obj.length ? "<div class=\"callout\"><div class=\"ct\">Objectifs</div><ul style=\"margin:0\">"+
      c.obj.map(o=>"<li style=\"padding-left:16px;position:relative;margin:4px 0\">"+H(o)+"</li>").join("")+"</ul></div>" : "";
    const keys = c.key&&c.key.length ? "<div class=\"callout key mt24\"><div class=\"ct\">À retenir</div><ul style=\"margin:0\">"+
      c.key.map(k=>"<li style=\"padding-left:16px;position:relative;margin:4px 0\">"+H(k)+"</li>").join("")+"</ul></div>" : "";
    const srcs = c.src&&c.src.length ? "<div class=\"mt24\"><div class=\"eyebrow\">Sources</div><ul class=\"prose\" style=\"font-size:13px\">"+
      c.src.map(s=>"<li>"+T(s)+"</li>").join("")+"</ul></div>" : "";
    box.innerHTML = "<div class=\"lesson\"><div><div class=\"prose\">"+objs+H(c.html)+keys+srcs+"</div></div>"+
      "<nav class=\"toc\" id=\"toc\" aria-label=\"Sommaire\"></nav></div>";
    buildToc();
  }else if(modTab==="quiz"){
    box.innerHTML="<div class=\"qz\" id=\"qzBox\"></div>";
    startQuiz(id);
  }else{
    box.innerHTML="<div style=\"max-width:740px\">"+
      "<p class=\"dim\" style=\"font-size:13px;margin-bottom:10px\">Vos notes sont enregistrées localement dans ce navigateur. Pensez à les exporter depuis les réglages.</p>"+
      "<textarea class=\"field\" id=\"noteBox\" placeholder=\"Synthèse personnelle, questions à poser, cas rencontrés en dossier…\">"+esc(m.notes)+"</textarea>"+
      "<div class=\"row mt12\"><button class=\"btn sm primary\" id=\"noteSave\">Enregistrer</button>"+
      "<span class=\"dim\" style=\"font-size:12px\" id=\"noteInfo\"></span></div></div>";
    const ta=$("#noteBox");
    let tm=null;
    ta.addEventListener("input",()=>{ clearTimeout(tm); tm=setTimeout(()=>{ meta(id).notes=ta.value; save(); $("#noteInfo").textContent="Enregistré automatiquement."; },700); });
    $("#noteSave").onclick=()=>{ meta(id).notes=ta.value; save(); toast("Notes enregistrées.","ok"); };
  }
}
function buildToc(){
  const hs=$$(".prose h2"); const toc=$("#toc"); if(!toc) return;
  if(hs.length<2){ toc.style.display="none"; return; }
  toc.innerHTML="<div class=\"eyebrow\" style=\"margin-bottom:8px\">Sommaire</div>"+
    hs.map(h=>"<a href=\"#"+h.id+"\" data-toc=\""+h.id+"\">"+H(h.textContent)+"</a>").join("");
  const obs=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){
      $$("[data-toc]").forEach(a=>a.classList.toggle("on", a.dataset.toc===e.target.id)); } });
  },{rootMargin:"-70px 0px -70% 0px"});
  hs.forEach(h=>obs.observe(h));
}

/* ── Quiz ─────────────────────────────────────────────────── */
let qz={list:[],i:0,score:0,lives:3,done:false,id:null};
function startQuiz(id){
  qz={list:quizOf(id),i:0,score:0,lives:3,done:false,id:id};
  paintQuiz();
}
function paintQuiz(){
  const box=$("#qzBox"); if(!box) return;
  const n=qz.list.length;
  if(qz.done){
    const perfect=qz.score===n, passed=qz.score>=Math.ceil(n*0.7);
    box.innerHTML="<div class=\"card\" style=\"text-align:center;padding:36px\">"+
      ring(pct(qz.score,n),110,8,qz.score+"/"+n,"score")+
      "<div class=\"h3 mt24\">"+(perfect?"Sans faute.":passed?"Quiz validé.":"Quiz à reprendre.")+"</div>"+
      "<p class=\"lead mt8\">"+(perfect?"Vous maîtrisez ce module."
        :passed?"L'essentiel est acquis. Relisez les points manqués."
        :"Reprenez le cours avant de recommencer : moins de 70 % de bonnes réponses.")+"</p>"+
      "<div class=\"row mt24\" style=\"justify-content:center\">"+
        "<button class=\"btn\" data-qzretry>Recommencer</button>"+
        "<button class=\"btn ghost\" data-tab=\"cours\">Revoir le cours</button></div></div>";
    return;
  }
  const q=qz.list[qz.i];
  box.innerHTML=
    "<div class=\"spread\"><span class=\"eyebrow\">Question "+(qz.i+1)+" sur "+n+"</span>"+
    "<span class=\"hearts\" aria-label=\"Vies restantes\">"+[1,2,3].map(i=>"<i class=\""+(i<=qz.lives?"on":"")+"\">♥</i>").join("")+"</span></div>"+
    "<div class=\"bar thin mt8\"><i style=\"width:"+pct(qz.i,n)+"%\"></i></div>"+
    "<h2 class=\"h4 mt24\">"+T(q.q)+"</h2>"+
    "<div class=\"mt16\">"+q.o.map((o,k)=>
      "<button class=\"qopt\" data-opt=\""+k+"\"><span class=\"qk\">"+String.fromCharCode(65+k)+"</span><span>"+T(o)+"</span></button>").join("")+"</div>"+
    "<div id=\"qzFb\"></div>";
}
function answerQuiz(k){
  const q=qz.list[qz.i], good=k===q.a;
  $$(".qopt").forEach((b,n)=>{
    b.classList.add("lock");
    if(n===q.a) b.classList.add("good");
    else if(n===k) b.classList.add("bad");
    b.onclick=null;
  });
  if(good) qz.score++; else qz.lives--;
  $("#qzFb").innerHTML="<div class=\"callout "+(good?"key":"warn")+" mt16\">"+
    "<div class=\"ct\">"+(good?"Correct":"Réponse attendue : "+String.fromCharCode(65+q.a))+"</div>"+T(q.e)+"</div>"+
    "<button class=\"btn primary mt16\" data-qznext>"+(qz.i+1>=qz.list.length?"Voir le résultat":"Question suivante")+" →</button>";
  $("#qzFb").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function nextQuiz(){
  if(qz.i+1>=qz.list.length || qz.lives<=0){
    qz.done=true;
    const n=qz.list.length, prev=S.quiz[qz.id]||{best:0,tries:0,xpPass:false,xpPerfect:false};
    const rec={best:Math.max(prev.best,qz.score),tries:prev.tries+1,xpPass:!!prev.xpPass,xpPerfect:!!prev.xpPerfect};
    /* l'expérience de quiz ne s'accorde qu'une fois par module */
    if(qz.score===n){
      meta(qz.id).mastery=3;
      if(!rec.xpPerfect){ rec.xpPerfect=true; rec.xpPass=true; addXP(XP.quizPerfect,"quiz sans faute"); confetti(); }
      else toast("Sans faute de nouveau. Score conservé.","ok");
    }else if(qz.score>=Math.ceil(n*0.7)){
      meta(qz.id).mastery=Math.max(meta(qz.id).mastery,2);
      if(!rec.xpPass){ rec.xpPass=true; addXP(XP.quizPass,"quiz validé"); }
    }
    S.quiz[qz.id]=rec;
    save(); checkBadges();
  }else qz.i++;
  paintQuiz();
}

/* ── Chronomètre ──────────────────────────────────────────── */
function toggleTimer(id){
  if(timerOn){ stopTimer(); return; }
  timerOn=true; $("#timerBtn").classList.add("primary");
  timerInt=setInterval(()=>{
    timerSec++;
    const b=$("#timerBtn"); if(b) b.textContent="■ "+mmss(timerSec);
    if(timerSec%60===0){ meta(id).time+=60; today().min++; S.xp+=XP.minute; save(); paintHeader(); }
  },1000);
}
function stopTimer(){
  if(timerInt) clearInterval(timerInt);
  timerInt=null; timerOn=false; timerSec=0;
  const b=$("#timerBtn"); if(b){ b.textContent="▶ Chrono"; b.classList.remove("primary"); }
}

function glMatch(g,q){
  if(!q) return true;
  return norm(g.t).indexOf(q)>=0 || norm(g.d).indexOf(q)>=0 || norm(synOf(g.t)).indexOf(q)>=0;
}
function paintGlossary(){
  const q=norm(gl.q);
  let list=GLOSSARY.filter(g=>{
    if(gl.fav && !isGlFav(g.t)) return false;
    if(!gl.fav && gl.c!=="all" && g.c!==gl.c) return false;
    return glMatch(g,q);
  });
  if(gl.sort==="az")  list.sort((a,b)=>a.t.localeCompare(b.t,"fr"));
  if(gl.sort==="cat") list.sort((a,b)=> a.c===b.c ? a.t.localeCompare(b.t,"fr") : a.c.localeCompare(b.c,"fr"));
  if(gl.sort==="len") list.sort((a,b)=>a.d.length-b.d.length);

  const letters={}; list.forEach(g=>letters[g.t[0].toUpperCase()]=true);

];

let deck={cat:"all",mode:"cartes",shuf:false,list:[]};
let fc={i:0,flip:false};
let lrn=null, wrt=null, mtc=null, tst=null, mtcTimer=null;

function buildDeck(){
  deck.list = deck.cat==="all" ? CARDS.slice() : CARDS.filter(c=>c.c===deck.cat);
  if(deck.shuf) deck.list.sort(()=>Math.random()-0.5);
  fc={i:0,flip:false};
}
const short = (s,n) => s.length>n ? s.slice(0,n-1).replace(/[\s,;:]+$/,"")+"…" : s;

/* ── Page des fiches ──────────────────────────────────────── */

function startMode(){
  if(!deck.list.length){ $("#gameStage").innerHTML="<div class=\"empty\">Aucune fiche dans cette catégorie.</div>"; return; }
  if(deck.mode==="cartes")    paintCard();
  if(deck.mode==="apprendre") initLearn();
  if(deck.mode==="ecrire")    initWrite();
  if(deck.mode==="associer")  initMatch();
  if(deck.mode==="test")      initTest();
}

/* ── Mode 1 : cartes ──────────────────────────────────────── */
function paintCard(){

        "<div class=\"fc-b\"><span class=\"fc-cat\">Réponse</span><div class=\"fc-a\">"+T(c.a)+"</div>"+

      "</div></div>"+
    "<div class=\"row mt16\" style=\"justify-content:space-between;gap:8px\">"+

  "</div>";
}
function quickGrade(g){
  const c=deck.list[fc.i];
  review(c.id,g);
  toast(g===0?"Fiche reprogrammée aujourd'hui.":"Fiche mémorisée, prochaine révision dans "+srs(c.id).iv+" jour"+(srs(c.id).iv>1?"s":"")+".");
  fc.i=(fc.i+1)%deck.list.length; fc.flip=false; paintCard(); checkBadges();

/* ── Mode 2 : apprendre ───────────────────────────────────── */
function distractors(card,n,field){
  const pool=CARDS.filter(c=>c.id!==card.id && c.c===card.c);
  const wide=CARDS.filter(c=>c.id!==card.id);
  const src=(pool.length>=n?pool:wide).slice().sort(()=>Math.random()-0.5);
  return src.slice(0,n).map(c=>field==="a"?c.a:c.q);
}
function initLearn(){
  const q=deck.list.slice().sort(()=>Math.random()-0.5);
  lrn={queue:q.map(c=>({c,tries:0})), i:0, ok:0, ko:0, total:q.length, done:0, answered:false};
  paintLearn();
}
function paintLearn(){
  const box=$("#gameStage"); if(!box) return;
  if(lrn.i>=lrn.queue.length){
    box.innerHTML=resultCard("Apprentissage terminé", lrn.ok, lrn.ok+lrn.ko,
      "Toutes les fiches ont été répondues correctement au moins une fois. "+lrn.ko+" erreur"+(lrn.ko>1?"s":"")+" au total.",
      "data-mode=\"apprendre\"");
    checkBadges(); return;
  }
  const item=lrn.queue[lrn.i], c=item.c;
  const reverse = (lrn.i%3===2);                 // une question sur trois est inversée
  const prompt = reverse ? c.a : c.q;
  const answer = reverse ? c.q : c.a;
  const opts=[answer].concat(distractors(c,3,reverse?"q":"a")).sort(()=>Math.random()-0.5);
  lrn.correct=opts.indexOf(answer);
  lrn.answered=false;
  box.innerHTML="<div class=\"qz\" style=\"max-width:720px;margin:0 auto\">"+
    "<div class=\"spread\"><span class=\"eyebrow\">"+(reverse?"Quel terme correspond ?":"Quelle est la bonne réponse ?")+"</span>"+
      "<span class=\"dim num\" style=\"font-size:12px\">"+(lrn.i+1)+" / "+lrn.queue.length+" · "+lrn.ok+" justes</span></div>"+
    "<div class=\"bar thin mt8\"><i style=\"width:"+pct(lrn.i,lrn.queue.length)+"%\"></i></div>"+
    "<div class=\"card mt16\"><span class=\"eyebrow\">"+T(c.c)+"</span>"+
      "<div class=\"h4 mt8\" style=\"line-height:1.35\">"+T(prompt)+"</div></div>"+
    "<div class=\"mt16\">"+opts.map((o,k)=>
      "<button class=\"qopt\" data-lrn=\""+k+"\"><span class=\"qk\">"+String.fromCharCode(65+k)+"</span><span>"+T(short(o,190))+"</span></button>").join("")+"</div>"+
    "<div id=\"lrnFb\"></div></div>";
}
function answerLearn(k){
  if(lrn.answered) return; lrn.answered=true;
  const good=k===lrn.correct, item=lrn.queue[lrn.i], c=item.c;
  $$("[data-lrn]").forEach((b,n)=>{ b.classList.add("lock");
    if(n===lrn.correct) b.classList.add("good"); else if(n===k) b.classList.add("bad"); });
  if(good){ lrn.ok++; review(c.id, item.tries===0?2:1); }
  else{ lrn.ko++; item.tries++; review(c.id,0); lrn.queue.push({c,tries:item.tries}); }
  $("#lrnFb").innerHTML="<div class=\"callout "+(good?"key":"warn")+" mt16\">"+
    "<div class=\"ct\">"+(good?"Correct":"À revoir, cette fiche reviendra")+"</div>"+
    "<strong>"+T(c.q)+"</strong> : "+T(c.a)+
    (c.l&&anyMod(c.l)?" <a href=\"#/module/"+c.l+"\" style=\"text-decoration:underline\">Module lié →</a>":"")+"</div>"+
    "<button class=\"btn primary mt16\" data-lrnnext>Suivante →</button>";
}
function nextLearn(){ lrn.i++; paintLearn(); }

/* ── Mode 3 : écrire ──────────────────────────────────────── */
function initWrite(){
  const q=deck.list.slice().sort(()=>Math.random()-0.5);
  wrt={queue:q, i:0, ok:0, almost:0, ko:0, state:"ask"};
  paintWrite();
}
function paintWrite(){
  const box=$("#gameStage"); if(!box) return;
  if(wrt.i>=wrt.queue.length){
    box.innerHTML=resultCard("Session d'écriture terminée", wrt.ok+wrt.almost, wrt.queue.length,
      wrt.ok+" réponse"+(wrt.ok>1?"s":"")+" exacte"+(wrt.ok>1?"s":"")+", "+wrt.almost+" presque juste"+(wrt.almost>1?"s":"")+", "+wrt.ko+" à revoir.",
      "data-mode=\"ecrire\"");
    S.games["write:total"]=(S.games["write:total"]||0)+wrt.ok; save(); checkBadges(); return;
  }
  const c=wrt.queue[wrt.i];
  const askTerm = c.kind==="terme";
  box.innerHTML="<div class=\"qz\" style=\"max-width:700px;margin:0 auto\">"+
    "<div class=\"spread\"><span class=\"eyebrow\">"+(askTerm?"Quel terme est défini ?":"Répondez de mémoire")+"</span>"+
      "<span class=\"dim num\" style=\"font-size:12px\">"+(wrt.i+1)+" / "+wrt.queue.length+"</span></div>"+
    "<div class=\"bar thin mt8\"><i style=\"width:"+pct(wrt.i,wrt.queue.length)+"%\"></i></div>"+
    "<div class=\"card mt16\"><span class=\"eyebrow\">"+T(c.c)+"</span>"+
      "<div class=\"h4 mt8\" style=\"line-height:1.4\">"+T(askTerm?c.a:c.q)+"</div></div>"+
    "<div class=\"mt16\"><input class=\"field\" id=\"wrtIn\" placeholder=\""+(askTerm?"Le terme…":"Votre réponse…")+"\" autocomplete=\"off\" spellcheck=\"false\" style=\"height:46px;font-size:16px\"></div>"+
    "<div class=\"row mt12\"><button class=\"btn primary\" data-wrtok>Valider</button>"+
      "<button class=\"btn ghost\" data-wrtskip>Je ne sais pas</button>"+
      "<span class=\"dim\" style=\"font-size:11px;margin-left:auto\">Entrée pour valider</span></div>"+
    "<div id=\"wrtFb\"></div></div>";
  const inp=$("#wrtIn"); if(inp) inp.focus();
}
function submitWrite(skip){
  if(wrt.state!=="ask") return;
  const c=wrt.queue[wrt.i], askTerm=c.kind==="terme";
  const expected = askTerm ? c.q : c.a;
  const given = skip ? "" : ($("#wrtIn")?$("#wrtIn").value:"");
  let verdict;
  if(skip || !given.trim()) verdict="ko";
  else{
    const sim=similar(given,expected), hit=keyHit(given,expected);
    verdict = (sim>0.85 || (askTerm && sim>0.7) || hit>=0.7) ? "ok"
            : (sim>0.55 || hit>=0.4) ? "almost" : "ko";
  }
  wrt.state="shown";
  if(verdict==="ok"){ wrt.ok++; review(c.id,2); }
  else if(verdict==="almost"){ wrt.almost++; review(c.id,1); }
  else{ wrt.ko++; review(c.id,0); }
  const cls = verdict==="ok"?"key":verdict==="almost"?"":"warn";
  const label = verdict==="ok"?"Correct":verdict==="almost"?"Presque : l'essentiel est là":"Réponse attendue";
  $("#wrtFb").innerHTML="<div class=\"callout "+cls+" mt16\"><div class=\"ct\">"+label+"</div>"+
    "<strong>"+T(askTerm?c.q:"Réponse")+"</strong> : "+T(expected)+"</div>"+
    "<div class=\"row mt16\"><button class=\"btn primary\" data-wrtnext>Suivante →</button>"+
    (verdict!=="ok"?"<button class=\"btn ghost\" data-wrtoverride>Compter comme juste</button>":"")+"</div>";
}
function overrideWrite(){
  const c=wrt.queue[wrt.i];
  if(wrt.ko>0) wrt.ko--; else if(wrt.almost>0) wrt.almost--;
  wrt.ok++; review(c.id,2);
  toast("Réponse comptée comme juste.");
  nextWrite();
}
function nextWrite(){ wrt.i++; wrt.state="ask"; paintWrite(); }

/* ── Mode 4 : associer ────────────────────────────────────── */
function initMatch(){
  const pairs=deck.list.slice().sort(()=>Math.random()-0.5).slice(0,6);
  const tiles=[];
  pairs.forEach((c,i)=>{
    tiles.push({k:i,side:"q",txt:short(c.q,52),id:c.id});
    tiles.push({k:i,side:"a",txt:short(c.a,86),id:c.id});
  });
  tiles.sort(()=>Math.random()-0.5);
  mtc={tiles,pairs,sel:null,matched:[],err:0,t0:Date.now(),sec:0,done:false};
  paintMatch();
  if(mtcTimer) clearInterval(mtcTimer);
  mtcTimer=setInterval(()=>{
    if(!mtc||mtc.done){ clearInterval(mtcTimer); return; }
    mtc.sec=Math.round((Date.now()-mtc.t0)/1000);
    const el=$("#mtcTime"); if(el) el.textContent=mmss(mtc.sec); else { clearInterval(mtcTimer); }
  },500);
}
function paintMatch(){
  const box=$("#gameStage"); if(!box) return;
  const key="match:"+deck.cat, best=S.games[key];
  if(mtc.done){
    const r=record(key,mtc.sec,true);
    box.innerHTML="<div class=\"fcstage\" style=\"text-align:center\">"+
      ring(100,116,9,mmss(mtc.sec),"chrono")+

      "<p class=\"lead mt8\">Six paires associées en "+mtc.sec+" secondes, "+mtc.err+" erreur"+(mtc.err>1?"s":"")+"."+
      (best!==undefined&&!r.better?" Votre record sur cette catégorie reste de "+best+" secondes.":"")+"</p>"+
      "<div class=\"row mt24\" style=\"justify-content:center\"><button class=\"btn primary\" data-mode=\"associer\">Rejouer</button>"+
      "<button class=\"btn ghost\" data-mode=\"cartes\">Revoir les fiches</button></div></div>";
    checkBadges(); return;
  }
  box.innerHTML="<div class=\"spread\" style=\"max-width:900px;margin:0 auto 12px\">"+
      "<span class=\"eyebrow\">Reliez chaque terme à sa définition</span>"+
      "<span class=\"row\" style=\"gap:14px\"><span class=\"dim num\" style=\"font-size:13px\">⏱ <b id=\"mtcTime\">"+mmss(mtc.sec)+"</b></span>"+
      (best!==undefined?"<span class=\"dim num\" style=\"font-size:12px\">record "+mmss(best)+"</span>":"")+
      "<span class=\"dim num\" style=\"font-size:12px\">"+mtc.err+" erreur"+(mtc.err>1?"s":"")+"</span></span></div>"+
    "<div class=\"matchgrid\">"+mtc.tiles.map((t,i)=>{
      const done=mtc.matched.indexOf(t.k)>=0;
      const sel=mtc.sel===i;
      return "<button class=\"tile"+(done?" gone":"")+(sel?" sel":"")+"\" data-tile=\""+i+"\""+(done?" disabled":"")+">"+
        "<span class=\"tside\">"+(t.side==="q"?"terme":"définition")+"</span>"+
        "<span class=\"ttxt\">"+T(t.txt)+"</span></button>";
    }).join("")+"</div>"+
    "<div class=\"dim mt16\" style=\"text-align:center;font-size:11px\">"+(6-mtc.matched.length)+" paire"+(6-mtc.matched.length>1?"s":"")+" restante"+(6-mtc.matched.length>1?"s":"")+"</div>";
}
function pickTile(i){
  if(mtc.done) return;
  const t=mtc.tiles[i];
  if(mtc.matched.indexOf(t.k)>=0) return;
  if(mtc.sel===null){ mtc.sel=i; paintMatch(); return; }
  if(mtc.sel===i){ mtc.sel=null; paintMatch(); return; }
  const s=mtc.tiles[mtc.sel];
  if(s.k===t.k && s.side!==t.side){
    mtc.matched.push(t.k); mtc.sel=null;
    review(t.id,2);
    if(mtc.matched.length===6){ mtc.done=true; mtc.sec=Math.round((Date.now()-mtc.t0)/1000); }
  }else{
    mtc.err++; mtc.sel=null;
    const el=$("[data-tile=\""+i+"\"]"); if(el) el.classList.add("wrong");
  }
  paintMatch();
}

/* ── Mode 5 : test ────────────────────────────────────────── */
function initTest(){
  const pool=deck.list.slice().sort(()=>Math.random()-0.5).slice(0,Math.min(20,deck.list.length));
  tst={q:pool.map((c,i)=>buildTestQ(c,i)), i:0, ans:[], done:false};
  paintTest();
}
function buildTestQ(c,i){
  const kind=["qcm","qcmrev","vf","ecrire"][i%4];
  if(kind==="qcm"){
    const opts=[c.a].concat(distractors(c,3,"a")).sort(()=>Math.random()-0.5);
    return {k:"qcm",c,p:c.q,o:opts,a:opts.indexOf(c.a)};
  }
  if(kind==="qcmrev"){
    const opts=[c.q].concat(distractors(c,3,"q")).sort(()=>Math.random()-0.5);
    return {k:"qcm",c,p:short(c.a,180),o:opts,a:opts.indexOf(c.q)};
  }
  if(kind==="vf"){
    const truth=Math.random()<0.5;
    const other=distractors(c,1,"a")[0]||c.a;
    return {k:"vf",c,p:"« "+c.q+" » : "+short(truth?c.a:other,150),o:["Vrai","Faux"],a:truth?0:1};
  }
  return {k:"ecrire",c,p:short(c.a,180),a:c.q};
}
function paintTest(){
  const box=$("#gameStage"); if(!box) return;
  if(tst.done) return paintTestResult();
  const q=tst.q[tst.i];
  let body;
  if(q.k==="ecrire"){
    body="<div class=\"mt16\"><input class=\"field\" id=\"tstIn\" placeholder=\"Le terme attendu…\" autocomplete=\"off\" style=\"height:46px;font-size:16px\"></div>"+
         "<div class=\"row mt12\"><button class=\"btn primary\" data-tstwrite>Valider</button>"+
         "<span class=\"dim\" style=\"font-size:11px;margin-left:auto\">Entrée pour valider</span></div>";
  }else{
    body="<div class=\"mt16\">"+q.o.map((o,k)=>
      "<button class=\"qopt\" data-tst=\""+k+"\"><span class=\"qk\">"+(q.k==="vf"?(k?"F":"V"):String.fromCharCode(65+k))+"</span><span>"+T(short(o,180))+"</span></button>").join("")+"</div>";
  }
  const label={qcm:"Choix multiple",vf:"Vrai ou faux",ecrire:"Réponse écrite"}[q.k];
  box.innerHTML="<div class=\"qz\" style=\"max-width:720px;margin:0 auto\">"+
    "<div class=\"spread\"><span class=\"eyebrow\">"+label+"</span>"+
      "<span class=\"dim num\" style=\"font-size:12px\">Question "+(tst.i+1)+" / "+tst.q.length+"</span></div>"+
    "<div class=\"bar thin mt8\"><i style=\"width:"+pct(tst.i,tst.q.length)+"%\"></i></div>"+
    "<div class=\"card mt16\"><span class=\"eyebrow\">"+T(q.c.c)+"</span>"+
      "<div class=\"h4 mt8\" style=\"line-height:1.4\">"+T(q.p)+"</div></div>"+body+"</div>";
  const inp=$("#tstIn"); if(inp) inp.focus();
}
function answerTest(v){
  const q=tst.q[tst.i];
  let good;
  if(q.k==="ecrire") good = similar(v,q.a)>0.8 || keyHit(v,q.a)>=0.7;
  else good = v===q.a;
  tst.ans.push({q,given:v,good});
  review(q.c.id, good?2:0);
  if(tst.i+1>=tst.q.length){ tst.done=true; paintTestResult(); }
  else{ tst.i++; paintTest(); }
}
function paintTestResult(){
  const ok=tst.ans.filter(a=>a.good).length, n=tst.ans.length, p=pct(ok,n);
  const key="test:"+deck.cat, r=record(key,p,false);

    "<div class=\"card\" style=\"text-align:center;padding:32px\">"+
      ring(p,120,9,p+"%","score")+

      "<p class=\"lead mt8\">"+ok+" réponse"+(ok>1?"s":"")+" juste"+(ok>1?"s":"")+" sur "+n+
      (r.better&&r.previous!==undefined?". Nouveau record sur cette catégorie.":"")+"</p>"+

      "<button class=\"btn ghost\" data-mode=\"apprendre\">Travailler les erreurs</button></div></div>"+
    "<div class=\"sec-hd\" style=\"margin-top:28px\"><h2 class=\"h4\">Correction</h2></div>"+
    "<div class=\"stack sp8\">"+tst.ans.map(a=>

        "<div class=\"spread\"><span style=\"font-size:13px;font-weight:600\">"+T(a.q.c.q)+"</span>"+
        "<span class=\""+(a.good?"c-green":"c-red")+"\" style=\"font-size:12px\">"+(a.good?"juste":"faux")+"</span></div>"+
        "<div class=\"dim mt8\" style=\"font-size:12.5px;line-height:1.5\">"+T(a.q.c.a)+"</div>"+
        (a.q.c.l&&anyMod(a.q.c.l)?"<a class=\"btn sm ghost mt8\" href=\"#/module/"+a.q.c.l+"\">Module lié →</a>":"")+
      "</div>").join("")+"</div></div>";
  checkBadges();
}

/* Session de révision : tirage aléatoire, plafonné au quota (10 par défaut).
   En mode libre, on pioche dans l'ensemble du corpus. */
function startRev(force){
  const n=sessionSize();
  const ids = force
    ? CARDS.map(c=>c.id)
    : reviewPool();
  const pick = ids.slice().sort(()=>Math.random()-0.5).slice(0,n);
  const pool = pick.map(id=>CARD_BY_ID[id]).filter(Boolean);
  if(!pool.length){ toast("Aucune fiche disponible pour une session.","err"); rv.started=false; return viewRevision(); }
  rv={queue:pool,i:0,flip:false,ok:0,ko:0,started:true,free:!!force,again:{},left:Math.max(0,ids.length-pool.length)};
  paintRev();
}
function paintRev(){
  if(rv.i>=rv.queue.length){
    const tot=rv.ok+rv.ko;
    setView("<div class=\"fcstage\" style=\"text-align:center;padding-top:30px\">"+

        ? "<div class=\"tip\" style=\"max-width:430px;margin:20px auto 0;text-align:left\"><span class=\"ti\">⟳</span>"+

  }
  const c=rv.queue[rv.i], st=srs(c.id);
  setView("<div class=\"fcstage\">"+

      "<span class=\"dim\" style=\"font-size:12px\">Facilité "+st.ef.toFixed(2)+" · "+st.reps+" révision"+(st.reps>1?"s":"")+"</span></div>"+
    "<div class=\"bar thin\" style=\"margin-bottom:14px\"><i style=\"width:"+pct(rv.i,rv.queue.length)+"%\"></i></div>"+
    "<div class=\"fc"+(rv.flip?" flip":"")+"\" id=\"fcCard\" tabindex=\"0\" role=\"button\">"+
      "<div class=\"fc-in\">"+
        "<div class=\"fc-f\"><span class=\"fc-cat\">"+T(c.c)+"</span><div class=\"fc-q\">"+T(c.q)+"</div>"+
          "<span class=\"fc-hint\">Espace pour révéler</span></div>"+
        "<div class=\"fc-b\"><span class=\"fc-cat\">Réponse</span><div class=\"fc-a\">"+T(c.a)+"</div>"+
          (c.l&&anyMod(c.l)?"<a class=\"fc-hint\" href=\"#/module/"+c.l+"\" style=\"text-decoration:underline;pointer-events:auto\">Module lié →</a>":"")+"</div>"+
      "</div></div>"+

          "<button class=\"srsbtn s1\" data-grade=\"0\"><b>À revoir</b><span>aujourd'hui</span></button>"+
          "<button class=\"srsbtn s2\" data-grade=\"1\"><b>Difficile</b><span>"+nextIv(c.id,1)+"</span></button>"+
          "<button class=\"srsbtn s3\" data-grade=\"2\"><b>Correct</b><span>"+nextIv(c.id,2)+"</span></button>"+
          "<button class=\"srsbtn s4\" data-grade=\"3\"><b>Facile</b><span>"+nextIv(c.id,3)+"</span></button>"+
        "</div><div class=\"dim mt12\" style=\"text-align:center;font-size:11px\">Touches 1 à 4</div>"
      : "<div class=\"row mt16\" style=\"justify-content:center\"><button class=\"btn lg\" data-fcflip>Révéler la réponse</button></div>")+
  "</div>");
}
function nextIv(id,grade){
  const c=srs(id);
  if(c.reps===0) return grade===1?"1 j":grade===2?"1 j":"2 j";
  if(c.reps===1) return grade===1?"3 j":"6 j";
  const iv=clamp(Math.round(c.iv*c.ef*(grade===1?0.7:grade===3?1.25:1)),1,365);
  return iv>=30 ? Math.round(iv/30)+" mois" : iv+" j";
}
function gradeRev(g){
  const c=rv.queue[rv.i];
  review(c.id,g);
  if(g===0){
    rv.ko++;
    /* une seule reprise par session : l'état est local à la session, jamais écrit
       sur l'objet du corpus, sinon la fiche ne serait plus jamais reproposée. */
    if(!rv.again[c.id]){ rv.again[c.id]=1; rv.queue.push(c); }
  } else rv.ok++;
  rv.i++; rv.flip=false; paintRev();
}

   "</div>"+

function admAction(a){
  if(a==="elevate"){
    const i=$("#admCode"), code=i?i.value:"";
    elevate(code).then(ok=>{
      if(ok){ toast("Console déverrouillée.","ok"); route(); }
      else{ const e=$("#admErr"); if(e) e.innerHTML="<div class=\"gate-err mt12\">Code incorrect.</div>"; }
    });
    return;
  }
  if(!isAdmin()){ toast("Action réservée aux administrateurs.","err"); return; }

  if(a==="quota"){
    const c=+($("#aqCards")||{}).value, m=+($("#aqMin")||{}).value, k=+($("#aqMod")||{}).value;
    PLAN.quota.cards=clamp(c||10,3,50);
    PLAN.quota.min=clamp(m||15,5,180);
    PLAN.quota.modules=clamp(k||1,1,10);
    savePlan(); toast("Volumes enregistrés : "+PLAN.quota.cards+" fiches par session.","ok"); route(); return;
  }
  if(a==="plan"){
    const g=($("#apPhase")||{}).value, d=($("#apStart")||{}).value||todayISO(), r=+($("#apRate")||{}).value||3;
    const n=planSet(g,d,r);
    toast(n?n+" modules programmés à partir du "+d+".":"Aucun module dans cet ensemble.", n?"ok":"err");
    route(); return;
  }
  if(a==="clearplan"){
    confirmBox("Effacer la programmation",
      "Les "+Object.keys(PLAN.modules).length+" dates de mise à disposition des modules seront supprimées. "+
      "La progression des profils n'est pas touchée.",
      "Effacer", ()=>{ PLAN.modules={}; savePlan(); toast("Programmation effacée.","ok"); route(); });
    return;
  }
  if(a==="cards"){
    const cat=($("#acCat")||{}).value||"all", d=($("#acDate")||{}).value||todayISO();
    const n=cardsDueAt(cat,d);
    toast(n+" fiches rendues dues le "+d+".","ok"); route(); return;
  }
  if(a==="clearcards"){
    confirmBox("Lever les échéances forcées",
      "Les "+Object.keys(PLAN.cards).length+" échéances imposées seront supprimées. Les fiches reviendront "+
      "au calendrier calculé par la répétition espacée.",
      "Lever", ()=>{ PLAN.cards={}; savePlan(); toast("Échéances levées.","ok"); route(); });
    return;
  }
  if(a==="code"){
    const v=($("#acNew")||{}).value||"";
    setAdminCode(v).then(r=>{
      if(!r.ok){ toast(r.err,"err"); return; }
      toast("Code administrateur modifié.","ok"); route();
    });
    return;
  }
}

  setPin(a).then(r=>{
    if(!r.ok) return err(r.err);
    closeModal(); toast(a?"Code confidentiel enregistré.":"Protection retirée.","ok"); route();
  });
}

/* ── Écran de connexion ───────────────────────────────────── */

      "</div>"+err+info+

  }else{
    inner="<h1 class=\"h3\">Connexion</h1>"+
      "<p class=\"lead mt8\" style=\"font-size:14px\">Retrouvez votre progression sur tous vos postes.</p>"+
      "<div class=\"stack sp12 mt24\">"+
        "<div><label class=\"gate-lbl\" for=\"cMail\">Adresse professionnelle</label>"+
          "<input class=\"field\" id=\"cMail\" type=\"email\" autocomplete=\"email\" placeholder=\"leo@triactis.fr\"></div>"+
        "<div><label class=\"gate-lbl\" for=\"cPwd\">Mot de passe</label>"+
          "<input class=\"field\" id=\"cPwd\" type=\"password\" autocomplete=\"current-password\" placeholder=\"••••••••••\"></div>"+
      "</div>"+err+info+

/* ── Actions ──────────────────────────────────────────────── */
function cloudBusy(b){ cg.busy=b; renderCloudGate(); }

function doSignIn(){
  const m=($("#cMail")||{}).value||"", p=($("#cPwd")||{}).value||"";
  if(!/.+@.+\..+/.test(m)) { cg.err="Adresse électronique invalide."; return renderCloudGate(); }
  if(!p){ cg.err="Saisissez votre mot de passe."; return renderCloudGate(); }
  cg.err=""; cg.info=""; cloudBusy(true);
  sbSignIn(m,p)
    .then(()=>cloudAdopt())
    .then(()=>{ cg.busy=false; hideGate(); startApp(); })
    .catch(e=>{
      cg.busy=false;
      cg.err = /invalid login|credentials/i.test(e.message)
        ? "Adresse ou mot de passe incorrect."
        : /not confirmed/i.test(e.message)
          ? "Votre adresse n'est pas encore confirmée : ouvrez le courriel reçu à l'inscription."
          : "Connexion impossible : "+e.message;
      renderCloudGate();
    });
}
function doSignUp(){
  const n=($("#cName")||{}).value||"", m=($("#cMail")||{}).value||"",
        p=($("#cPwd")||{}).value||"", v=($("#cVert")||{}).value||"tous";
  if(n.trim().length<2){ cg.err="Indiquez votre nom."; return renderCloudGate(); }
  if(!/.+@.+\..+/.test(m)){ cg.err="Adresse électronique invalide."; return renderCloudGate(); }
  if(p.length<8){ cg.err="Le mot de passe doit comporter au moins huit caractères."; return renderCloudGate(); }
  cg.err=""; cg.info=""; cloudBusy(true);
  sbSignUp(m,p,{display_name:n.trim(),vertical:v})
    .then(r=>{
      if(!r.confirmed){
        cg.busy=false; cg.mode="signin";
        cg.info="Compte créé. Ouvrez le courriel de confirmation envoyé à "+r.email+", puis connectez-vous.";
        return renderCloudGate();
      }
      return sbUpsertProfile({display_name:n.trim(),vertical:v,role:"membre"})
        .then(()=>cloudAdopt())
        .then(()=>{ cg.busy=false; hideGate(); startApp(); });
    })
    .catch(e=>{
      cg.busy=false;
      cg.err = /already registered|already exists/i.test(e.message)
        ? "Un compte existe déjà pour cette adresse. Utilisez la connexion."
        : "Création impossible : "+e.message;
      renderCloudGate();
    });
}
function doRecover(){
  const m=($("#cMail")||{}).value||"";
  if(!/.+@.+\..+/.test(m)){ cg.err="Adresse électronique invalide."; return renderCloudGate(); }
  cg.err=""; cloudBusy(true);
  sbRecover(m)
    .then(()=>{ cg.busy=false; cg.mode="signin";
      cg.info="Si un compte existe pour "+m+", un lien de réinitialisation vient d'être envoyé.";
      renderCloudGate(); })
    .catch(e=>{ cg.busy=false; cg.err="Envoi impossible : "+e.message; renderCloudGate(); });
}
function doSignOut(){
  closeModal();
  sbSignOut().then(()=>{
    flushSave(); ME=null; KEY=LEGACY; S=load();
    cg={mode:"signin",err:"",info:"",busy:false};
    stopTimer(); renderCloudGate();
  });
}

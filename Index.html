<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Hub M&amp;A Triactis : plateforme d'apprentissage de la finance de transaction. 7 phases, 108 modules, fiches de révision espacée, référentiel de 130 termes.">
<meta name="theme-color" content="#0e100f">
<title>Hub M&amp;A · Triactis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e100f'/><text y='68' x='50' text-anchor='middle' font-size='54' font-family='sans-serif' font-weight='700' fill='%230ae448'>M</text></svg>">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a href="#main" class="skip">Aller au contenu</a>

<div class="app">

  <!-- ══ BARRE LATÉRALE ══════════════════════════════════════ -->
  <aside class="sb" id="sb" aria-label="Navigation principale">
    <div class="sb-brand">
      <a href="#/" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <span class="sb-logo">M</span>
        <span class="sb-name">Hub M&amp;A<small>Triactis</small></span>
      </a>
      <button class="iconbtn sb-close" data-navclose aria-label="Fermer le menu">✕</button>
    </div>

    <div class="sb-scroll">
      <div class="sb-sect">
        <nav id="navMain"></nav>
      </div>

      <div class="sb-sect">
        <div class="sb-label">Parcours</div>
        <div id="navTree"></div>
      </div>

      <div class="sb-sect">
        <div class="sb-label">Ma verticale</div>
        <div id="navVert"></div>
      </div>

      <div class="sb-sect">
        <div class="sb-label">Boîte à outils</div>
        <nav id="navTools"></nav>
      </div>
    </div>

    <div class="sb-foot">
      <div class="spread" style="padding:0 4px 8px">
        <span class="dim" style="font-size:11px">Progression globale</span>
        <span class="num" style="font-size:11px;font-weight:600" id="sbPct">0 %</span>
      </div>
      <div class="bar thin"><i id="sbBar" style="width:0%"></i></div>
      <button class="sb-me mt12" data-profmenu id="sbMe"></button>
      <a href="#/reglages" class="sb-link"><span class="sb-ico">⚙</span> Réglages et sauvegarde</a>
    </div>
  </aside>

  <!-- ══ ZONE PRINCIPALE ═════════════════════════════════════ -->
  <div class="main">
    <header class="hd">
      <button class="hd-burger" id="burger" aria-label="Ouvrir la navigation">☰</button>
      <nav class="crumbs" id="crumbs" aria-label="Fil d'Ariane"></nav>
      <div class="hd-right">
        <button class="searchbtn" id="openCmd" aria-label="Rechercher">
          <span aria-hidden="true">⌕</span><span>Rechercher…</span><kbd id="kbdHint">⌘K</kbd>
        </button>
        <button class="hd-stat hide-sm dim" id="syncBadge" data-syncinfo title="État de la synchronisation" style="display:none"></button>
        <span class="hd-stat hide-sm" title="Série de jours consécutifs">🔥 <b id="hdStreak">0</b></span>
        <span class="hd-stat hide-sm" title="Points d'expérience">✦ <b id="hdXp">0</b></span>
        <button class="iconbtn" id="toggleTheme" aria-label="Changer de thème" title="Thème clair ou sombre">◐</button>
        <button class="iconbtn" id="openHelp" aria-label="Raccourcis clavier" title="Raccourcis clavier">?</button>
      </div>
    </header>

    <main class="view" id="main" tabindex="-1">
      <noscript>
        <div class="empty" style="margin-top:40px">
          <div class="ei">◌</div>
          <div class="h3">JavaScript est désactivé</div>
          <p class="lead mt8">Le Hub M&amp;A est une application entièrement locale : elle a besoin de JavaScript
          pour afficher les modules, les quiz et les fiches de révision. Activez-le puis rechargez la page.</p>
        </div>
      </noscript>
    </main>
  </div>
</div>

<!-- ══ NAVIGATION MOBILE ═════════════════════════════════════ -->
<nav class="botnav" id="botnav" aria-label="Navigation mobile"></nav>

<!-- ══ ÉCRAN D'ENTRÉE ═══════════════════════════════════════ -->
<div id="gate" role="dialog" aria-modal="true" aria-label="Choix du profil"></div>
<div id="bootError" class="boot-error" hidden></div>

<!-- ══ MODALES ═══════════════════════════════════════════════ -->
<div class="ovl" id="cmdOvl" role="dialog" aria-modal="true" aria-label="Recherche globale">
  <div class="ovl-bg" data-close></div>
  <div class="modal cmd">
    <div class="cmd-in">
      <span class="dim" aria-hidden="true">⌕</span>
      <input id="cmdInput" placeholder="Modules, termes, fiches, ressources, actions…" autocomplete="off" spellcheck="false" aria-label="Recherche">
      <kbd>Échap</kbd>
    </div>
    <div class="cmd-list" id="cmdList"></div>
    <div class="cmd-ft">
      <span><kbd>↑</kbd><kbd>↓</kbd> naviguer</span>
      <span><kbd>↵</kbd> ouvrir</span>
      <span><kbd>Échap</kbd> fermer</span>
    </div>
  </div>
</div>

<div class="ovl" id="modalOvl" role="dialog" aria-modal="true">
  <div class="ovl-bg" data-close></div>
  <div class="modal" id="modalBox"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
